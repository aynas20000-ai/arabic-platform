<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>شرح الكلمات الموصولة خطًّا بالفيديو</title>
<style>
  *{
    box-sizing:border-box;
  }

  body{
    margin:0;
    font-family:Tahoma,Arial,sans-serif;
    background:linear-gradient(180deg,#fffaf2,#f8f0fb);
    color:#4b3a57;
    text-align:center;
  }

  header{
    padding:35px 20px;
    color:white;
    background:linear-gradient(135deg,#d4c0e8,#bca0d8);
    border-bottom:2px solid #c9a85c;
  }

  header h1{
    margin:0;
    color:#5d4374;
    font-size:30px;
  }

  section{
    width:85%;
    max-width:700px;
    margin:30px auto;
    padding:25px;
    background:#fffdf8;
    border:2px solid #c9a85c;
    border-radius:18px;
    box-shadow:0 7px 18px rgba(91,63,111,.10);
  }

  .video{
    position:relative;
    width:100%;
    height:0;
    padding-bottom:56.25%;
    overflow:hidden;
    border-radius:14px;
    background:#000;
  }

  .video iframe{
    position:absolute;
    top:0;
    right:0;
    width:100%;
    height:100%;
    border:0;
  }

  .back{
    display:inline-block;
    margin-top:25px;
    padding:12px 22px;
    color:white;
    font-weight:bold;
    text-decoration:none;
    background:#6f5288;
    border-radius:22px;
  }

  footer{
    margin-top:30px;
    padding:20px;
    color:white;
    background:#6f5288;
  }
</style>
  
  
    


      
      
      
      
      


    footer{

<header>

</header>

<section>

      src="https://www.youtube.com/embed/PZ7XRCyidB0"
      title="شرح الكلمات الموصولة خطًّا"
      allowfullscreen>
    </iframe>
  </div>
