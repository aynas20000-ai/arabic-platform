<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>خريطة مفاهيم البدل | منصة آفاق</title>

  <style>
    :root{
      --purple:#5b4677;
      --purple2:#776094;
      --purple-dark:#453457;
      --lavender:#eee5f5;
      --gold:#b69750;
      --gold-light:#ead9a8;
      --cream:#fffaf2;
      --paper:#fffdf9;
      --text:#403448;
      --muted:#766d7c;
      --shadow:0 15px 34px rgba(73,54,92,.14);
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      font-family:Tahoma,Arial,sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 10% 6%,rgba(216,194,138,.18),transparent 23%),
        linear-gradient(180deg,#f5f0fa 0%,#fbf9fd 50%,#f1ebf7 100%);
      min-height:100vh;
      line-height:1.8;
    }

    header{
      position:relative;
      overflow:hidden;
      text-align:center;
      color:#fff;
      padding:34px 18px 30px;
      background:linear-gradient(145deg,var(--purple2),var(--purple),var(--purple-dark));
      border-bottom:5px solid var(--gold);
    }

    header::before,
    header::after{
      content:"";
      position:absolute;
      border-radius:50%;
      background:rgba(255,255,255,.06);
    }

    header::before{
      width:220px;
      height:220px;
      right:-85px;
      top:-125px;
    }

    header::after{
      width:270px;
      height:270px;
      left:-110px;
      bottom:-185px;
    }

    .tag{
      position:relative;
      z-index:1;
      display:inline-block;
      padding:5px 13px;
      border-radius:999px;
      border:1px solid rgba(234,217,168,.8);
      background:rgba(182,151,80,.14);
      color:#fff3cd;
      font-size:13px;
      font-weight:bold;
    }

    header h1{
      position:relative;
      z-index:1;
      margin:7px 0 2px;
      font-size:clamp(29px,7vw,42px);
    }

    header p{
      position:relative;
      z-index:1;
      margin:0;
      color:#f2ebf6;
      font-size:15px;
    }

    main{
      width:min(1000px,94%);
      margin:22px auto 45px;
    }

    .intro{
      text-align:center;
      background:var(--paper);
      border:1px solid var(--gold-light);
      border-radius:22px;
      padding:17px 16px;
      margin-bottom:17px;
      box-shadow:var(--shadow);
    }

    .intro h2{
      margin:0;
      color:var(--purple);
      font-size:22px;
    }

    .intro p{
      margin:4px 0 0;
      color:var(--muted);
      font-size:14px;
    }

    .map-card{
      background:var(--paper);
      border:1px solid var(--gold);
      border-radius:26px;
      padding:14px;
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    .map-card img{
      display:block;
      width:100%;
      height:auto;
      margin:auto;
      border-radius:18px;
      border:1px solid #eadfcb;
      background:#fff;
    }

    .buttons{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin-top:16px;
    }

    .btn{
      display:block;
      text-align:center;
      text-decoration:none;
      padding:12px 14px;
      border-radius:14px;
      font-weight:bold;
      transition:.2s;
    }

    .lesson{
      color:#fff;
      background:linear-gradient(145deg,var(--purple2),var(--purple));
      border:1px solid var(--gold);
    }

    .lessons{
      color:var(--purple-dark);
      background:var(--lavender);
      border:1px solid #d9cbe1;
    }

    .btn:active{
      transform:scale(.98);
    }

    footer{
      text-align:center;
      background:#3e304d;
      color:#eee8f2;
      border-top:2px solid var(--gold);
      padding:18px 12px;
      font-size:13px;
    }

    @media(max-width:600px){
      main{width:94%}
      .map-card{padding:8px;border-radius:20px}
      .map-card img{border-radius:14px}
      .buttons{grid-template-columns:1fr}
      header{padding:30px 15px 27px}
    }
  </style>
</head>

<body>

<header>
  <span class="tag">منصة آفاق التعليمية</span>
  <h1>خريطة مفاهيم البدل</h1>
  <p>ملخص بصري شامل لدرس البدل</p>
</header>

<main>

  <section class="intro">
    <h2>راجعي الدرس في خريطة واحدة ✨</h2>
    <p>التعريف، الأركان، الأنواع، الحكم الإعرابي، وطريقة التمييز بين أنواع البدل.</p>
  </section>

  <section class="map-card">
    <img src="200.png" alt="خريطة مفاهيم درس البدل">
  </section>

  <div class="buttons">
    <a class="btn lesson" href="apposition-file.html">العودة إلى ملف درس البدل</a>
    <a class="btn lessons" href="lessons.html">العودة إلى الدروس</a>
  </div>

</main>

<footer>
  منصة آفاق التعليمية | لغتي الخالدة | الصف الثالث المتوسط
</footer>

</body>
</html>
