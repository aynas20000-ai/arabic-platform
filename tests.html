<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الاختبارات | منصة آفاق</title>

  <style>
    :root{
      --purple:#5b4677;
      --purple-mid:#776094;
      --purple-dark:#453457;
      --gold:#b69750;
      --gold-light:#d8c28a;
      --cream:#fffaf2;
      --cream-light:#fffdf9;
      --lavender:#eee5f5;
      --text:#51445b;
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      font-family:Tahoma,Arial,sans-serif;
      background:linear-gradient(
        180deg,
        #fffaf2 0%,
        #fffdf9 65%,
        #f1ebf7 100%
      );
      color:var(--text);
      text-align:center;
      min-height:100vh;
    }

    header{
      background:linear-gradient(
        145deg,
        var(--purple-mid),
        var(--purple),
        var(--purple-dark)
      );
      color:white;
      padding:34px 20px 30px;
      border-bottom:5px solid var(--gold);
    }

    header h1{
      margin:0 0 8px;
      font-size:34px;
    }

    header p{
      margin:0;
      color:#f4eef7;
      font-size:16px;
    }

    section{
      margin:24px auto;
      padding:20px;
      width:90%;
      max-width:700px;
    }

    .box{
      background:linear-gradient(
        145deg,
        var(--cream-light),
        var(--cream)
      );

      margin:18px 0;
      padding:26px 18px;

      border-radius:20px;
      border:3px solid var(--gold);

      box-shadow:
        0 8px 20px rgba(69,52,87,.10);

      font-size:21px;
      font-weight:bold;

      color:var(--purple-dark);

      transition:
        transform .18s ease,
        box-shadow .18s ease;
    }

    .box:active{
      transform:scale(.98);
    }

    a{
      text-decoration:none;
    }

    .back-wrap{
      margin-top:24px;
    }

    .back{
      display:inline-block;

      padding:10px 18px;

      border-radius:14px;
      border:2px solid var(--gold);

      color:var(--purple-dark);
      background:var(--lavender);

      font-weight:bold;
    }

    footer{
      margin-top:30px;
      padding:18px;

      background:var(--purple-dark);
      color:#fffaf2;

      border-top:4px solid var(--gold);

      font-size:13px;
    }

    @media(max-width:600px){

      header{
        padding:28px 16px 25px;
      }

      header h1{
        font-size:30px;
      }

      section{
        width:92%;
        padding:10px;
      }

      .box{
        padding:23px 14px;
        font-size:18px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>✅ الاختبارات</h1>
  <p>اختاري الفصل الدراسي</p>
</header>

<section>

  <a href="semester1-tests.html">
    <div class="box">
      📘 اختبارات الفصل الدراسي الأول
    </div>
  </a>

  <a href="tests-term2.html">
    <div class="box">
      📗 اختبارات الفصل الدراسي الثاني
    </div>
  </a>

  <div class="back-wrap">
    <a class="back" href="index.html">
      العودة إلى الصفحة الرئيسة
    </a>
  </div>

</section>

<footer>
  جميع الحقوق محفوظة © 2026
</footer>

</body>
</html>
