<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>شرح درس العطف بالفيديو</title>

  <style>
    :root{
      --purple:#755b91;
      --purple-medium:#59436f;
      --purple-dark:#3f304f;
      --title:#5d4374;
      --gold:#c8a85a;
      --cream:#fdf9f4;
      --lavender:#f7f0fb;
      --card-white:#fffdf8;
      --card-pink:#f8eef6;
      --text:#000000;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      min-height:100vh;
      font-family:Tahoma,Arial,sans-serif;
      color:var(--text);
      text-align:center;
      background:linear-gradient(135deg,var(--cream),var(--lavender));
    }

    header{
      color:white;
      padding:35px 20px;
      background:linear-gradient(145deg,var(--purple) 0%,var(--purple-medium) 55%,var(--purple-dark) 100%);
      border-bottom:4px solid var(--gold);
      box-shadow:0 5px 20px rgba(30,20,45,.22);
    }

    header h1{
      margin:0;
      color:#fff7dd;
    }

    section{
      width:85%;
      max-width:700px;
      margin:30px auto;
      padding:25px;
      background:linear-gradient(135deg,var(--card-white),var(--card-pink));
      border:2px solid var(--gold);
      border-radius:18px;
      box-shadow:0 10px 25px rgba(74,54,92,.14);
    }

    .box{
      margin:18px 0;
      padding:24px;
      color:var(--title);
      font-size:21px;
      font-weight:bold;
      background:linear-gradient(135deg,var(--card-white),var(--card-pink));
      border:2px solid var(--gold);
      border-radius:14px;
    }

    .back{
      display:inline-block;
      padding:10px 16px;
      color:var(--title);
      font-weight:bold;
      text-decoration:none;
      background:linear-gradient(135deg,var(--card-white),var(--card-pink));
      border:2px solid var(--gold);
      border-radius:16px;
      box-shadow:0 6px 15px rgba(74,54,92,.12);
    }

    footer{
      margin-top:30px;
      padding:20px;
      color:white;
      background:linear-gradient(145deg,var(--purple-medium),var(--purple-dark));
      border-top:4px solid var(--gold);
    }
  </style>

</head>

<body>

<header>
  <h1>🎥 شرح درس العطف بالفيديو</h1>
</header>

<section>

  <div class="box">
    سيتم إضافة فيديو شرح درس العطف هنا
  </div>

  <p>
    <a class="back" href="conjunction.html">العودة إلى درس العطف</a>
  </p>

</section>

<footer>
  جميع الحقوق محفوظة © 2026
</footer>

</body>
</html>
