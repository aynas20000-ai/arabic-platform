<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>فيديو شرح العطف | منصة آفاق</title>

  <style>
    :root {
      --purple: #74558c;
      --purple-dark: #4d385d;
      --gold: #c9a85c;
      --cream: #fffaf1;
      --paper: #fffdf8;
      --text: #4b3857;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      color: var(--text);
      background: linear-gradient(180deg, var(--cream), #f7eff8);
      line-height: 1.8;
    }

    header {
      padding: 44px 18px;
      text-align: center;
      color: white;
      background: linear-gradient(135deg, var(--purple), var(--purple-dark));
      border-bottom: 6px solid var(--gold);
    }

    header h1 {
      margin: 0 0 10px;
      font-size: 36px;
    }

    header p {
      margin: 0;
      font-size: 18px;
    }

    main {
      width: min(94%, 880px);
      margin: 40px auto;
    }

    .main-box {
      padding: 28px 20px;
      background: rgba(255, 255, 255, 0.86);
      border: 4px solid var(--gold);
      border-radius: 34px;
      box-shadow: 0 12px 30px rgba(75, 56, 87, 0.12);
    }

    .intro {
      margin: 0 0 28px;
      text-align: center;
      font-size: 18px;
    }

    .video-card {
      margin: 25px 0;
      padding: 20px;
      background: var(--paper);
      border: 3px solid var(--gold);
      border-radius: 26px;
      box-shadow: 0 8px 20px rgba(75, 56, 87, 0.10);
    }

    .video-card h2 {
      margin: 0 0 14px;
      text-align: center;
      color: var(--purple-dark);
      font-size: 25px;
    }

    .video-wrap {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      overflow: hidden;
      background: #000;
      border-radius: 20px;
    }

    .video-wrap iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .note {
      margin-top: 26px;
      padding: 18px;
      text-align: center;
      font-size: 17px;
      background: #f5edf9;
      border: 2px dashed var(--gold);
      border-radius: 22px;
    }

    .back {
      display: block;
      width: fit-content;
      margin: 30px auto 0;
      padding: 14px 30px;
      color: white;
      text-decoration: none;
      font-size: 19px;
      font-weight: bold;
      background: var(--purple);
      border: 3px solid var(--gold);
      border-radius: 28px;
    }

    footer {
      margin-top: 42px;
      padding: 22px 15px;
      text-align: center;
      color: white;
      background: var(--purple-dark);
      border-top: 5px solid var(--gold);
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 30px;
      }

      header p,
      .intro {
        font-size: 16px;
      }

      main {
        width: 96%;
      }

      .main-box {
        padding: 22px 12px;
      }

      .video-card {
        padding: 13px;
      }

      .video-card h2 {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>🎥 فيديو شرح درس العطف</h1>
    <p>شاهدي الشرح، ثم عودي إلى صفحة الدرس لإكمال المراجعة.</p>
  </header>

  <main>

    <section class="main-box">

      <p class="intro">
        يساعدكِ الشرح على فهم معنى العطف، وحروفه، والعلاقة بين المعطوف والمعطوف عليه.
      </p>

      <article class="video-card">
        <h2>شرح درس العطف</h2>

        <div class="video-wrap">
          <iframe
            src="https://www.youtube.com/embed/XwfWHPi2NYk"
            title="شرح درس العطف"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen>
          </iframe>
        </div>
      </article>

      <div class="note">
        ✨ بعد مشاهدة الفيديو، راجعي حروف العطف وطبّقي على أمثلة متنوعة.
      </div>

      <a class="back" href="conjunction.html">
        العودة إلى درس العطف
      </a>

    </section>

  </main>

  <footer>
    منصة آفاق التعليمية © 2026
  </footer>

</body>

</html>
