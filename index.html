<script type="module">

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

  import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    signInWithRedirect,
    getRedirectResult,
    signOut,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


  const firebaseConfig = {

    apiKey:
      "AIzaSyB48av9gx4jzFyYoUQtcLwaR52qETevKGs",

    authDomain:
      "afaq-language-platform.firebaseapp.com",

    projectId:
      "afaq-language-platform",

    storageBucket:
      "afaq-language-platform.firebasestorage.app",

    messagingSenderId:
      "362601061474",

    appId:
      "1:362601061474:web:bc405291332b9e4ef9453b"

  };


  const app =
    initializeApp(firebaseConfig);

  const auth =
    getAuth(app);

  const provider =
    new GoogleAuthProvider();


  provider.setCustomParameters({
    prompt: "select_account"
  });


  const loginBtn =
    document.getElementById(
      "googleLoginBtn"
    );


  const studentStatus =
    document.getElementById(
      "studentStatus"
    );


  const teacherDashboardBtn =
    document.getElementById(
      "teacherDashboardBtn"
    );


  const TEACHER_UID =
    "oIqOvhIaC3TQyr6WcXCW9FZhZio2";


  function showLoginError(error){

    console.error(
      "Firebase login error:",
      error
    );


    studentStatus.className =
      "student-status show error";


    const code =
      error?.code ||
      "خطأ غير معروف";


    if(
      code ===
      "auth/popup-blocked"
    ){

      studentStatus.textContent =
        "تعذر فتح نافذة تسجيل الدخول.";

    }

    else if(
      code ===
      "auth/popup-closed-by-user"
    ){

      studentStatus.textContent =
        "أُغلقت نافذة تسجيل الدخول قبل اكتمال العملية.";

    }

    else if(
      code ===
      "auth/unauthorized-domain"
    ){

      studentStatus.textContent =
        "هذا النطاق غير مضاف إلى النطاقات المصرح بها في Firebase.";

    }

    else if(
      code ===
      "auth/network-request-failed"
    ){

      studentStatus.textContent =
        "تعذر الاتصال بخدمة تسجيل الدخول. تحققي من الإنترنت ثم حاولي مرة أخرى.";

    }

    else if(
      code ===
      "auth/cancelled-popup-request"
    ){

      studentStatus.textContent =
        "تم إلغاء محاولة تسجيل الدخول السابقة. حاولي مرة أخرى.";

    }

    else{

      studentStatus.textContent =
        "لم يكتمل تسجيل الدخول. رمز الخطأ: " +
        code;

    }

  }


  async function loginWithGoogle(){

    if(
      auth.currentUser
    ){

      try{

        await signOut(auth);

      }

      catch(error){

        console.error(
          "Logout error:",
          error
        );

      }

      return;

    }


    loginBtn.disabled =
      true;


    loginBtn.textContent =
      "جارٍ فتح تسجيل الدخول...";


    studentStatus.textContent =
      "";


    studentStatus.className =
      "student-status";


    try{

      await signInWithPopup(
        auth,
        provider
      );

    }

    catch(error){

      console.error(
        "Popup login error:",
        error
      );


      if(
        error?.code ===
          "auth/popup-blocked" ||

        error?.code ===
          "auth/operation-not-supported-in-this-environment"
      ){

        try{

          studentStatus.className =
            "student-status show";


          studentStatus.textContent =
            "جارٍ تحويلكِ إلى تسجيل الدخول بحساب Google...";


          await signInWithRedirect(
            auth,
            provider
          );


          return;

        }

        catch(redirectError){

          showLoginError(
            redirectError
          );

        }

      }

      else{

        showLoginError(
          error
        );

      }


      loginBtn.disabled =
        false;


      loginBtn.textContent =
        "🔐 تسجيل الدخول بحساب Google";

    }

  }


  loginBtn.addEventListener(
    "click",
    loginWithGoogle
  );


  getRedirectResult(auth)

    .then((result) => {

      if(result?.user){

        console.log(
          "تم تسجيل الدخول بعد التحويل:",
          result.user
        );

      }

    })

    .catch((error) => {

      showLoginError(error);

    });


  onAuthStateChanged(
    auth,
    user => {

      loginBtn.disabled =
        false;


      if(user){

        const studentName =
          user.displayName ||
          "طالبتنا";


        studentStatus.className =
          "student-status show";


        studentStatus.textContent =
          "🌷 أهلًا " +
          studentName +
          "، تم تسجيل الدخول بنجاح.";


        loginBtn.textContent =
          "تسجيل الخروج";


        if(
          user.uid ===
          TEACHER_UID
        ){

          teacherDashboardBtn
            .classList
            .add("show");

        }

        else{

          teacherDashboardBtn
            .classList
            .remove("show");

        }

      }

      else{

        studentStatus.textContent =
          "";


        studentStatus.className =
          "student-status";


        loginBtn.textContent =
          "🔐 تسجيل الدخول بحساب Google";


        teacherDashboardBtn
          .classList
          .remove("show");

      }

    }
  );

</script>
</body>
</html>
