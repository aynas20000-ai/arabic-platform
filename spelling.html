<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>الرسم الإملائي</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      max-width: 100%;
      margin: 0;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      font-family: Tahoma, Arial, sans-serif;
      color: #4b3a57;
      text-align: center;
      background: linear-gradient(180deg, #fffaf2, #f8f0fb);
    }

    header {
      padding: 42px 20px;
      color: #fffdf8;
      background: linear-gradient(135deg, #776094, #5b4677);
      border-bottom: 4px solid #c9a85c;
    }

    header h1 {
      margin: 0 0 12px;
      font-size: 38px;
    }

    header p {
      margin: 0;
      color: #f7effb;
      font-size: 20px;
      line-height: 1.8;
    }

    section {
      width: 85%;
      max-width: 700px;
      margin: 35px auto;
      padding: 28px;
      background: #fffdf8;
      border: 2px solid #c9a85c;
      border-radius: 24px;
      box-shadow: 0 7px 18px rgba(91, 63, 111, 0.12);
    }

    section h2 {
      margin-top: 0;
      margin-bottom: 25px;
      color: #5d4374;
      font-size: 31px;
    }

    .box {
      margin: 20px 0;
      padding: 26px 18px;
      color: #5d4374;
      font-size: 23px;
      font-weight: bold;
      background: linear-gradient(135deg, #f5ecfb, #fffaf2);
      border: 2px solid #c9a85c;
      border-radius: 18px;
      box-shadow: 0 4px 12px rgba(91, 63, 111, 0.08);
      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .box:hover,
    .box:active {
      transform: translateY(-3px);
      box-shadow: 0 8px 17px rgba(91, 63, 111, 0.14);
    }

    a {
      color: #5d4374;
      text-decoration: none;
    }

    .back {
      display: inline-block;
      margin-top: 18px;
      padding: 12px 22px;
      color: white;
      font-size: 18px;
      font-weight: bold;
      background: #6f5288;
      border: 2px solid #c9a85c;
      border-radius: 22px;
    }

    footer {
      margin-top: 35px;
      padding: 20px;
      color: #fffdf8;
      background: #49385c;
      border-top: 3px solid #c9a85c;
    }

    @media (max-width: 600px) {
      header {
        padding: 35px 15px;
      }

      header h1 {
        font-size: 31px;
      }

      header p {
        font-size: 17px;
      }

      section {
        width: 92%;
        padding: 22px 14px;
      }

      section h2 {
        font-size: 26px;
      }

      .box {
        padding: 22px 14px;
        font-size: 19px;
      }
    }
  </style>
</head>
