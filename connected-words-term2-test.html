<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>اختبار الكلمات المفصولة خطًّا | منصة آفاق</title>

<style>
:root{
  --p:#5b4677;
  --p2:#776094;
  --pd:#453457;
  --g:#b69750;
  --g2:#d8c28a;
  --lav:#eee5f5;
  --paper:#fffdf9;
  --text:#403448;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:Tahoma,Arial,sans-serif;
  color:var(--text);
  background:linear-gradient(180deg,#f5f0fa,#fbf9fd,#f1ebf7);
  overflow:hidden;
}
.app{
  height:100dvh;
  display:grid;
  grid-template-rows:auto 1fr auto;
}
header{
  text-align:center;
  color:#fff;
  padding:10px 12px 8px;
  background:linear-gradient(145deg,var(--p2),var(--p),var(--pd));
  border-bottom:4px solid var(--g);
}
.tag{
  display:inline-block;
  padding:3px 10px;
  border-radius:999px;
  border:1px solid var(--g2);
  color:#fff2c6;
  background:rgba(182,151,80,.13);
  font-size:11px;
  font-weight:bold;
}
header h1{
  margin:4px 0 0;
  font-size:clamp(20px,5vw,29px);
}
header p{
  margin:0;
  color:#f2ebf6;
  font-size:11px;
}
main{
  min-height:0;
  width:min(760px,94%);
  margin:0 auto;
  padding:7px 0;
  display:flex;
  flex-direction:column;
}
.top{
  display:flex;
  justify-content:space-between;
  gap:8px;
  font-weight:bold;
  color:var(--p);
  font-size:13px;
  margin-bottom:5px;
}
.progress{
  height:8px;
  background:#e9e0ef;
  border-radius:999px;
  overflow:hidden;
  margin-bottom:7px;
}
.progress>div{
  height:100%;
  width:0;
  background:linear-gradient(90deg,var(--g),#dfca8f);
  transition:.3s;
}
.card,.result{
  flex:1;
  min-height:0;
  background:var(--paper);
  border:1px solid var(--g2);
  border-radius:22px;
  box-shadow:0 14px 30px rgba(73,54,92,.12);
  padding:12px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}
.qnum{
  color:var(--g);
  font-weight:bold;
  font-size:12px;
  margin-bottom:2px;
}
h2{
  font-size:clamp(16px,4.4vw,21px);
  margin:2px 0 8px;
  color:var(--pd);
  line-height:1.5;
}
.options{
  display:grid;
  gap:6px;
}
.opt{
  width:100%;
  padding:8px 10px;
  border-radius:13px;
  border:2px solid #e4dbe9;
  background:#fff;
  color:var(--text);
  font:inherit;
  font-size:clamp(13px,3.5vw,16px);
  text-align:right;
  cursor:pointer;
  line-height:1.35;
}
.opt.correct{
  background:#f0ecf6;
  border-color:var(--p2);
  color:var(--pd);
}
.opt.wrong{
  background:#fff8ec;
  border-color:var(--g2);
  color:#66522e;
}
.opt:disabled{cursor:default}
.feedback{
  display:none;
  margin-top:7px;
  padding:8px 10px;
  border-radius:13px;
  font-size:clamp(12px,3.2vw,14px);
  line-height:1.45;
}
.feedback.show{display:block}
.feedback.good{
  background:#f3edf8;
  border:1px solid #c9b8d4;
  color:var(--pd);
}
.feedback.bad{
  background:#fff9ec;
  border:1px solid var(--g2);
  color:#66522e;
}
.next{
  display:none;
  width:100%;
  margin-top:7px;
  padding:8px;
  border:0;
  border-radius:13px;
  background:linear-gradient(145deg,var(--p2),var(--p));
  color:#fff;
  font:inherit;
  font-weight:bold;
  cursor:pointer;
  font-size:14px;
}
.result{
  display:none;
  text-align:center;
}
.result.show{display:flex}
.score{
  font-size:40px;
  color:var(--g);
  font-weight:bold;
}
.restart,.lesson{
  display:block;
  text-decoration:none;
  width:100%;
  padding:10px;
  margin-top:8px;
  border-radius:13px;
  font-weight:bold;
}
.restart{
  border:0;
  background:linear-gradient(145deg,var(--p2),var(--p));
  color:#fff;
  font:inherit;
  cursor:pointer;
}
.lesson{
  background:var(--lav);
  color:var(--pd);
  border:1px solid #d6c7df;
}
footer{
  text-align:center;
  padding:5px;
  color:#73697a;
  font-size:9px;
}
.burst{
  position:fixed;
  inset:0;
  pointer-events:none;
  overflow:hidden;
  z-index:20;
}
.confetti{
  position:absolute;
  width:8px;
  height:8px;
  border-radius:2px;
  animation:fall 900ms ease-out forwards;
}
@keyframes fall{
  0%{transform:translateY(-20px) rotate(0);opacity:1}
  100%{transform:translateY(105vh) rotate(540deg);opacity:0}
}
.pop{animation:pop .25s ease}
@keyframes pop{50%{transform:scale(1.018)}}

@media(max-height:650px){
  header{padding:5px 10px 4px}
  header h1{font-size:18px}
  header p{font-size:9px}
  main{padding:3px 0}
  .top{font-size:11px;margin-bottom:3px}
  .progress{height:6px;margin-bottom:4px}
  .card{padding:7px}
  h2{font-size:15px;margin-bottom:5px}
  .options{gap:4px}
  .opt{padding:5px 7px;font-size:12px}
  .feedback{padding:5px 7px;margin-top:4px;font-size:11px}
  .next{padding:6px;margin-top:4px}
}
</style>
</head>

<body>
<div class="app">

<header>
  <span class="tag">منصة آفاق التعليمية</span>
  <h1>تحدي الكلمات المفصولة خطًّا</h1>
  <p>١٠ أسئلة • سؤال واحد في كل شاشة • تعقيب فوري ✨</p>
</header>

<main>
  <div class="top">
    <span id="counter">السؤال ١ من ١٠</span>
    <span id="correctCount">الصحيح: ٠</span>
  </div>

  <div class="progress"><div id="bar"></div></div>

  <section class="card" id="card">
    <div class="qnum" id="qnum"></div>
    <h2 id="question"></h2>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback"></div>
    <button class="next" id="next">السؤال التالي</button>
  </section>

  <section class="result" id="result">
    <h2>انتهى التحدي ✨</h2>
    <div class="score" id="score"></div>
    <p id="message"></p>

    <button class="restart" onclick="restartQuiz()">أعيدي التحدي</button>
    <a class="lesson" href="connected-words-term2-file.html">راجعي ملف الدرس</a>
    <a class="lesson" href="connected-words-term2.html">العودة إلى الدرس</a>
  </section>
</main>

<footer>منصة آفاق التعليمية | لغتي الخالدة | الصف الثالث المتوسط</footer>
</div>

<div class="burst" id="burst"></div>

<script>
const questions = [{"q": "أيُّ كتابةٍ صحيحة للكلمتين في الجملة: «___ تجتهدي فلن تحققي هدفك»؟", "o": ["إنلم", "إنْ لم", "إلّم", "إن لمْ"], "a": 1, "ok": "أحسنتِ 🌟 الصواب: «إنْ لم»؛ لأن «إنْ» أداة شرط و«لم» حرف نفي وجزم، فتكتبان مفصولتين.", "bad": "تذكري القاعدة: «إنْ» + «لم» = «إنْ لم» مفصولتين."}, {"q": "أيُّ كتابةٍ صحيحة في السؤال: «___ تعلمتِ هذا الخُلُق الجميل؟»", "o": ["مِمَّن", "مِنْمَن", "مِنْ مَن", "منمن"], "a": 2, "ok": "ممتازة ✨ الصواب في هذا الدرس: «مِنْ مَن» مفصولتين.", "bad": "ركزي على الفصل: «مِنْ» حرف جر، و«مَن» اسم مستقل؛ لذلك نكتب «مِنْ مَن»."}, {"q": "أيُّ كتابةٍ صحيحة في الجملة: «___ تتحدثين؟»", "o": ["عَمَّن", "عَنْ مَن", "عنمن", "عَن مَن"], "a": 1, "ok": "رائعة 👏 الصواب: «عَنْ مَن» مفصولتين.", "bad": "القاعدة: «عَنْ» حرف جر + «مَن» اسم مستقل = «عَنْ مَن»."}, {"q": "في الجملة «أشهد ___ إلهَ إلا الله» ما الرسم الصحيح؟", "o": ["ألّا", "أنلا", "أنْ لا", "ألا"], "a": 2, "ok": "صحيح جدًا 💜 «أنْ لا»؛ لأن بعد «لا» جاء اسم وهو «إله».", "bad": "مفتاح التذكر: بعد «لا» اسم ← نفصل: «أنْ لا»."}, {"q": "ما السبب الأدق في كتابة «إنْ لم» مفصولتين؟", "o": ["لأنهما كلمة واحدة في النطق", "لأن «إنْ» أداة شرط و«لم» حرف نفي وجزم", "لأن بعد «لم» اسم", "لأن «إنْ» حرف جر"], "a": 1, "ok": "إتقان رائع 🏆 هذا هو السبب الصحيح.", "bad": "«إنْ» أداة شرط، و«لم» حرف نفي وجزم؛ لذلك تبقى كل كلمة مستقلة."}, {"q": "أيُّ عبارة تمثل القاعدة السريعة لكتابة «أنْ لا»؟", "o": ["بعد «لا» اسم ← نفصل", "بعد «لا» فعل ← نفصل دائمًا", "كل «أن» مع «لا» تُوصل", "كل «أن» مع «لا» تُحذف"], "a": 0, "ok": "أحسنتِ 🎯 المفتاح السريع: بعد «لا» اسم ← «أنْ لا» مفصولة.", "bad": "القاعدة التي نعتمدها في الدرس: إذا جاء بعد «لا» اسم، نكتب «أنْ لا» مفصولة."}, {"q": "أيُّ مجموعة كُتبت كلماتها مفصولة خطًّا على النحو الصحيح؟", "o": ["إنْ لم – مِنْ مَن – عَنْ مَن – أنْ لا", "إنلم – مِمَّن – عَمَّن – ألّا", "إنْلم – منمن – عنمن – أنلا", "إن لم – مِمَن – عَنمن – ألا"], "a": 0, "ok": "ممتازة جدًا 🌟 هذه هي صور الفصل الأربع التي يركز عليها الدرس.", "bad": "احفظي صور الفصل الأربع: «إنْ لم – مِنْ مَن – عَنْ مَن – أنْ لا»."}, {"q": "اختاري التصويب الصحيح للجملة: «ممن سمعتِ هذه المعلومة؟» وفق قاعدة الدرس.", "o": ["مِنْ مَن سمعتِ هذه المعلومة؟", "منمن سمعتِ هذه المعلومة؟", "مِمَّا سمعتِ هذه المعلومة؟", "عن من سمعتِ هذه المعلومة؟"], "a": 0, "ok": "بطلة 👏 التصويب: «مِنْ مَن سمعتِ هذه المعلومة؟».", "bad": "نريد حرف الجر «مِنْ» وبعده «مَن»؛ لذلك نكتبها «مِنْ مَن»."}, {"q": "اختاري التصويب الصحيح للجملة: «عمن سألتِ المعلمة؟» وفق قاعدة الدرس.", "o": ["عَنْ مَن سألتِ المعلمة؟", "عنمن سألتِ المعلمة؟", "مِنْ مَن سألتِ المعلمة؟", "عَمَّا سألتِ المعلمة؟"], "a": 0, "ok": "أحسنتِ ✨ «عَنْ مَن» هي الصورة المطلوبة في الدرس.", "bad": "التصويب هو: «عَنْ مَن سألتِ المعلمة؟»."}, {"q": "ما الخطوة الأذكى قبل الحكم على الكلمتين: أفصل أم أصل؟", "o": ["أنظر إلى طول الكلمة", "أحدد نوع كل كلمة وما يأتي بعدها", "أحذف الحروف الزائدة", "أكتبها كما تُنطق فقط"], "a": 1, "ok": "ممتازة 🧠 هذا هو مفتاح الإتقان: حددي نوع الكلمة وما يأتي بعدها أولًا.", "bad": "لا نعتمد على الشكل وحده؛ نحدد نوع كل كلمة وما يأتي بعدها ثم نختار الرسم الصحيح."}];
let index=0,score=0,answered=false;

const arabicDigits=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);

function tone(ok){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    const c=new AC(),o=c.createOscillator(),g=c.createGain();
    o.connect(g);g.connect(c.destination);

    o.type=ok?'sine':'triangle';
    o.frequency.setValueAtTime(ok?660:220,c.currentTime);

    if(ok){
      o.frequency.exponentialRampToValueAtTime(920,c.currentTime+.16);
    } else {
      o.frequency.exponentialRampToValueAtTime(170,c.currentTime+.16);
    }

    g.gain.setValueAtTime(.07,c.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.23);

    o.start();
    o.stop(c.currentTime+.24);
  }catch(e){}
}

function confetti(){
  const burst=document.getElementById('burst');
  burst.innerHTML='';
  const colors=['#5b4677','#776094','#b69750','#d8c28a','#eee5f5'];

  for(let i=0;i<26;i++){
    const s=document.createElement('i');
    s.className='confetti';
    s.style.left=(Math.random()*100)+'vw';
    s.style.top='-10px';
    s.style.background=colors[i%colors.length];
    s.style.animationDelay=(Math.random()*170)+'ms';
    burst.appendChild(s);
  }

  setTimeout(()=>burst.innerHTML='',1200);
}

function render(){
  answered=false;
  const x=questions[index];

  document.getElementById('qnum').textContent=
    'السؤال '+arabicDigits(index+1);

  document.getElementById('counter').textContent=
    'السؤال '+arabicDigits(index+1)+' من '+arabicDigits(questions.length);

  document.getElementById('correctCount').textContent=
    'الصحيح: '+arabicDigits(score);

  document.getElementById('bar').style.width=
    (index/questions.length*100)+'%';

  document.getElementById('question').textContent=x.q;

  const options=document.getElementById('options');
  const feedback=document.getElementById('feedback');
  const next=document.getElementById('next');
  const card=document.getElementById('card');

  options.innerHTML='';
  feedback.className='feedback';
  feedback.innerHTML='';
  next.style.display='none';
  card.classList.remove('pop');

  x.o.forEach((t,j)=>{
    const b=document.createElement('button');
    b.className='opt';
    b.textContent=t;
    b.onclick=()=>choose(j,b);
    options.appendChild(b);
  });
}

function choose(choice,button){
  if(answered)return;
  answered=true;

  const x=questions[index];
  const btns=[...document.querySelectorAll('.opt')];

  btns.forEach(b=>b.disabled=true);
  btns[x.a].classList.add('correct');

  const feedback=document.getElementById('feedback');

  if(choice===x.a){
    score++;
    button.classList.add('correct');
    feedback.className='feedback show good';
    feedback.textContent=x.ok;
    tone(true);
    confetti();
    if(navigator.vibrate)navigator.vibrate(45);
  }else{
    button.classList.add('wrong');
    feedback.className='feedback show bad';
    feedback.innerHTML='<b>راجعي القاعدة 👀</b><br>'+x.bad;
    tone(false);
    if(navigator.vibrate)navigator.vibrate([70,40,70]);
  }

  document.getElementById('correctCount').textContent=
    'الصحيح: '+arabicDigits(score);

  document.getElementById('card').classList.add('pop');

  const next=document.getElementById('next');
  next.textContent=
    index===questions.length-1
    ?'شوفي نتيجتك ✨'
    :'كمّلي التحدي ←';

  next.style.display='block';
}

document.getElementById('next').onclick=()=>{
  index++;

  if(index<questions.length){
    render();
  }else{
    finish();
  }
};

function finish(){
  document.getElementById('bar').style.width='100%';
  document.getElementById('card').style.display='none';
  document.querySelector('.top').style.display='none';
  document.querySelector('.progress').style.display='none';

  const result=document.getElementById('result');
  result.classList.add('show');

  document.getElementById('score').textContent=
    arabicDigits(score)+' / '+arabicDigits(questions.length);

  const pct=score/questions.length;

  document.getElementById('message').textContent=
    pct===1
    ?'إتقان كامل! بطلة الرسم الإملائي 🏆'
    :pct>=.8
    ?'ممتازة جدًا 🌟 أتقنتِ مواضع الفصل.'
    :pct>=.6
    ?'أداء جميل 👏 راجعي صور الفصل الأربع ثم أعيدي التحدي.'
    :'راجعي ملف الدرس، خاصة «إنْ لم – مِنْ مَن – عَنْ مَن – أنْ لا»، ثم عودي للتحدي.';

  if(pct>=.8)confetti();
}

function restartQuiz(){
  index=0;
  score=0;
  answered=false;

  document.getElementById('card').style.display='flex';
  document.querySelector('.top').style.display='flex';
  document.querySelector('.progress').style.display='block';
  document.getElementById('result').classList.remove('show');

  render();
}

render();
</script>

</body>
</html>
