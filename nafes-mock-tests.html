<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>اختبارات نافس الشاملة | منصة آفاق</title>

  <style>
    :root{
      --purple:#75558d;
      --dark:#4b385b;
      --gold:#c9a85c;
      --cream:#fffaf1;
      --paper:#fffdf8;
      --text:#403347;
      --green:#168a52;
      --red:#b83a4b;
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      font-family:Tahoma,Arial,sans-serif;
      color:var(--text);
      background:linear-gradient(180deg,var(--cream),#f7eff8);
      line-height:1.8;
    }

    header{
      padding:34px 18px;
      text-align:center;
      color:#fff;
      background:linear-gradient(135deg,#786094,#594474);
      border-bottom:5px solid var(--gold);
    }

    header h1{
      margin:0;
      font-size:34px;
    }

    header p{
      max-width:760px;
      margin:10px auto 0;
      font-size:17px;
    }

    main{
      width:min(94%,980px);
      margin:28px auto 40px;
    }

    .top-link{
      display:inline-block;
      margin-bottom:18px;
      padding:10px 16px;
      color:#35263d;
      font-weight:bold;
      text-decoration:none;
      background:var(--gold);
      border-radius:13px;
    }

    .panel,
    .name-box,
    .quiz-box,
    .result-box{
      padding:22px;
      background:var(--paper);
      border:2px solid #dfd3e5;
      border-radius:24px;
      box-shadow:0 8px 22px rgba(73,56,92,.10);
    }

    .panel h2{
      margin:0 0 20px;
      text-align:center;
      color:var(--dark);
      font-size:28px;
    }

    .progress-summary{
      margin:0 auto 20px;
      padding:14px;
      text-align:center;
      font-weight:bold;
      background:#fff;
      border:2px solid var(--gold);
      border-radius:16px;
    }

    .tests-grid{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:18px;
    }

    .test-card{
      min-height:190px;
      padding:20px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      cursor:pointer;
      background:linear-gradient(145deg,#fffdf8,#f6eef9);
      border:2px solid var(--gold);
      border-radius:22px;
      box-shadow:0 6px 16px rgba(73,56,92,.08);
      transition:.2s;
    }

    .test-card:active{
      transform:scale(.98);
    }

    .icon{
      margin-bottom:8px;
      font-size:44px;
    }

    .title{
      color:var(--dark);
      font-size:21px;
      font-weight:bold;
    }

    .subtitle{
      margin-top:6px;
      color:#6d6172;
      font-size:14px;
    }

    .badge{
      margin-top:9px;
      color:#168a52;
      font-size:13px;
      font-weight:bold;
    }

    .hidden{
      display:none!important;
    }

    input[type="text"]{
      width:100%;
      padding:14px;
      text-align:center;
      font-size:18px;
      border:2px solid #d9c9df;
      border-radius:14px;
    }

    .btn{
      margin:6px;
      padding:12px 18px;
      border:0;
      border-radius:16px;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
      box-shadow:0 5px 12px rgba(73,56,92,.12);
    }

    .btn:active{
      transform:scale(.97);
    }

    .btn-primary{
      color:#fff;
      background:linear-gradient(135deg,#786094,#594474);
    }

    .btn-gold{
      color:#35263d;
      background:linear-gradient(135deg,#d6b764,#c9a85c);
    }

    .result-actions{
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      gap:10px;
      margin:16px 0 6px;
    }

    .result-actions .btn{
      min-width:150px;
      margin:0;
    }

    .question-head{
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:center;
    }

    .bar{
      height:12px;
      margin:14px 0;
      overflow:hidden;
      background:#eee;
      border-radius:20px;
    }

    .bar span{
      display:block;
      width:0;
      height:100%;
      background:linear-gradient(90deg,var(--gold),#786094);
      transition:.3s;
    }

    .passage{
      max-height:330px;
      margin:14px 0;
      padding:18px;
      overflow:auto;
      text-align:right;
      white-space:pre-line;
      background:#fffaf1;
      border-right:5px solid var(--gold);
      border-radius:14px;
    }

    .question{
      margin:18px 0;
      font-size:21px;
      font-weight:bold;
    }

    .answers{
      display:grid;
      gap:12px;
    }

    .answer{
      width:100%;
      padding:14px;
      text-align:right;
      font-size:17px;
      cursor:pointer;
      background:#fff;
      border:2px solid #d8c8df;
      border-radius:14px;
    }

    .answer.correct{
      color:#0b653a;
      background:#ecfff4;
      border-color:var(--green);
    }

    .answer.wrong{
      color:#8f2433;
      background:#fff0f2;
      border-color:var(--red);
    }

    .feedback{
      margin-top:16px;
      padding:14px;
      font-weight:bold;
      border-radius:14px;
    }

    .feedback.ok{
      color:#0b653a;
      background:#ecfff4;
    }

    .feedback.bad{
      color:#8f2433;
      background:#fff0f2;
    }

    .answer-mark{
      position:fixed;
      inset:0;
      z-index:120;
      display:flex;
      align-items:center;
      justify-content:center;
      pointer-events:none;
      font-size:min(32vw,180px);
      font-weight:bold;
      text-shadow:0 8px 24px rgba(0,0,0,.18);
      animation:markPop .7s ease both;
    }

    .correct-mark{
      color:var(--green);
    }

    .wrong-mark{
      color:var(--red);
    }

    @keyframes markPop{
      0%{
        opacity:0;
        transform:scale(.25);
      }

      55%{
        opacity:1;
        transform:scale(1.12);
      }

      100%{
        opacity:0;
        transform:scale(.92);
      }
    }

    .shake{
      animation:shake .38s;
    }

    @keyframes shake{
      0%,100%{transform:translateX(0)}
      25%{transform:translateX(8px)}
      50%{transform:translateX(-8px)}
      75%{transform:translateX(5px)}
    }

    .confetti{
      position:fixed;
      inset:0;
      z-index:99;
      overflow:hidden;
      pointer-events:none;
    }

    .piece{
      position:absolute;
      top:-20px;
      font-size:26px;
      animation:fall 2.7s linear forwards;
    }

    @keyframes fall{
      to{
        transform:translateY(110vh) rotate(720deg);
      }
    }

    /* الشهادة */

    .certificate-shell{
      width:100%;
      margin:22px auto 0;
      padding:10px 0 14px;
      overflow:hidden;
    }

    .certificate{
      position:relative;
      width:min(100%,760px);
      aspect-ratio:1536/1148;
      margin:0 auto;
      overflow:hidden;
      background:#fff;
      box-shadow:0 10px 28px rgba(45,34,70,.16);
    }

    .certificate-bg{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:fill;
      display:block;
    }

    /*
      هذه الطبقة البيضاء تغطي المستطيل الذهبي
      الموجود أصلًا داخل صورة الشهادة.
    */

    .cert-white-cover{
      position:absolute;
      z-index:1;
      top:39%;
      right:12%;
      left:12%;
      height:23%;
      background:#fff;
    }

    .cert-line{
      position:absolute;
      right:10%;
      left:10%;
      z-index:2;
      text-align:center;
      line-height:1.2;
    }

    .cert-name{
      top:41%;
      color:#4f8d8d;
      font-size:clamp(17px,2.4vw,30px);
      font-weight:bold;
    }

    .cert-challenge{
      top:48%;
      color:#403347;
      font-size:clamp(9px,1.1vw,14px);
      font-weight:bold;
    }

    .cert-score{
      top:53%;
      color:#75558d;
      font-size:clamp(10px,1.25vw,16px);
      font-weight:bold;
    }

    .cert-phrase{
      top:58%;
      color:#403347;
      font-size:clamp(8px,1vw,12px);
      font-weight:bold;
    }

    .certificate-reveal{
      animation:certificateReveal .7s ease both;
    }

    @keyframes certificateReveal{
      from{
        opacity:0;
        transform:scale(.92) translateY(18px);
      }

      to{
        opacity:1;
        transform:scale(1) translateY(0);
      }
    }

    footer{
      padding:18px;
      text-align:center;
      color:#fff;
      background:var(--dark);
      border-top:4px solid var(--gold);
    }

    @media(max-width:700px){
      .tests-grid{
        grid-template-columns:1fr;
      }

      header h1{
        font-size:28px;
      }

      main{
        width:96%;
      }

      .result-box{
        padding:18px 12px;
      }

      .result-actions{
        display:grid;
        grid-template-columns:1fr 1fr;
        gap:9px;
      }

      .result-actions .btn{
        width:100%;
        min-width:0;
        margin:0;
        padding:11px 7px;
        font-size:14px;
      }

      .result-actions .wide{
        grid-column:1/-1;
      }

      .cert-name{
        font-size:clamp(16px,4.6vw,25px);
      }

      .cert-challenge{
        font-size:clamp(8px,2.8vw,12px);
      }

      .cert-score{
        font-size:clamp(9px,3vw,13px);
      }

      .cert-phrase{
        font-size:clamp(8px,2.6vw,11px);
      }
    }

    @page{
      size:A4 landscape;
      margin:0;
    }

    @media print{
      body *{
        visibility:hidden!important;
      }

      #certificateShell,
      #certificateShell *,
      #certificate,
      #certificate *{
        visibility:visible!important;
      }

      #certificateShell{
        position:absolute;
        inset:0;
        width:297mm;
        height:210mm;
        margin:0;
        padding:0;
      }

      #certificate{
        position:absolute;
        left:8mm;
        top:4mm;
        width:281mm;
        height:202mm;
        max-width:none;
        margin:0;
        box-shadow:none;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🏆 اختبارات نافس الشاملة</h1>

  <p>
    اكتبي اسمكِ الرباعي، ثم اختاري التحدي.
    جميع التحديات تفاعلية، وبعد الاجتياز تظهر شهادة باسم الطالبة.
  </p>
</header>

<main>

  <a class="top-link" href="nafes.html">
    العودة إلى مكتبة نافس
  </a>

  <section id="home" class="panel">
    <h2>تحديات نافس</h2>

    <div class="progress-summary" id="summary">
      أنجزتِ 0 من 20 تحديًا
    </div>

    <div class="tests-grid" id="cards"></div>
  </section>

  <section id="nameScreen" class="name-box hidden">
    <h2 id="challengeTitle"></h2>

    <p>اكتبي اسمكِ الرباعي كما سيظهر في الشهادة:</p>

    <input
      id="studentName"
      type="text"
      placeholder="مثال: سارة محمد أحمد علي"
    >

    <div>
      <button class="btn btn-primary" onclick="startQuiz()">
        ابدئي التحدي
      </button>

      <button class="btn btn-gold" onclick="goHome()">
        رجوع
      </button>
    </div>
  </section>

  <section id="quizScreen" class="quiz-box hidden">
    <div class="question-head">
      <strong id="qCounter"></strong>
      <strong id="scoreLive">الدرجة: 0</strong>
    </div>

    <div class="bar">
      <span id="barFill"></span>
    </div>

    <div id="passage" class="passage"></div>
    <div id="question" class="question"></div>
    <div id="answers" class="answers"></div>
    <div id="feedback" class="feedback hidden"></div>

    <button
      id="nextBtn"
      class="btn btn-primary hidden"
      onclick="nextQuestion()"
    >
      السؤال التالي
    </button>
  </section>

  <section id="resultScreen" class="result-box hidden">
    <h2 id="resultTitle"></h2>
    <p id="resultText"></p>

    <div class="result-actions">
      <button class="btn btn-primary" onclick="showCertificate()">
        عرض الشهادة
      </button>

      <button class="btn btn-gold" onclick="restartQuiz()">
        إعادة الاختبار
      </button>

      <button class="btn btn-gold wide" onclick="goHome()">
        العودة للتحديات
      </button>
    </div>

    <div id="certificateShell" class="certificate-shell hidden">

      <div id="certificate" class="certificate">

        <img
          class="certificate-bg"
          src="./99.jpg"
          alt="شهادة اجتياز تحدي نافس"
        >

        <div class="cert-white-cover"></div>

        <div id="certName" class="cert-line cert-name"></div>

        <div
          id="certChallenge"
          class="cert-line cert-challenge"
        ></div>

        <div
          id="certScore"
          class="cert-line cert-score"
        ></div>

        <div
          id="certPhrase"
          class="cert-line cert-phrase"
        ></div>

      </div>

    </div>

    <div class="result-actions">
      <button
        id="printBtn"
        class="btn btn-primary wide hidden"
        onclick="window.print()"
      >
        🖨️ طباعة الشهادة أو حفظها PDF
      </button>
    </div>
  </section>

</main>

<div id="confetti" class="confetti"></div>

<footer>
  جميع الحقوق محفوظة © 2026
</footer>

<script>

const challenges=[
  {id:1,icon:"🌸",title:"تحدي بوابة الجمال",subtitle:"الجمال والحياة"},
  {id:2,icon:"📖",title:"تحدي ربيع القلوب",subtitle:"ربيع القلوب"},
  {id:3,icon:"🌿",title:"تحدي سفيرة الأرض",subtitle:"حماية البيئة"},
  {id:4,icon:"⏳",title:"تحدي حارسة الدقائق",subtitle:"كنز الوقت"},
  {id:5,icon:"🔍",title:"تحدي عين القارئة",subtitle:"ما وراء السطور"},
  {id:6,icon:"⚖️",title:"تحدي الناقدة الواعية",subtitle:"القراءة الناقدة"},
  {id:7,icon:"🎯",title:"تحدي الإجابة الأدق",subtitle:"اختيار الأصوب"},
  {id:8,icon:"💡",title:"تحدي التطبيق الذكي",subtitle:"مواقف جديدة"},
  {id:9,icon:"📝",title:"تحدي صانعة الملخص",subtitle:"تلخيص النص"},
  {id:10,icon:"🏆",title:"تحدي الفهم الشامل",subtitle:"مهارات متنوعة"},
  {id:11,icon:"🌟",title:"تحدي النجمة القارئة",subtitle:"فهم واستنتاج"},
  {id:12,icon:"🧭",title:"تحدي بوصلة المعنى",subtitle:"السياق والدلالة"},
  {id:13,icon:"🧠",title:"تحدي العقل المتأمل",subtitle:"الفكرة الضمنية"},
  {id:14,icon:"🔗",title:"تحدي روابط النص",subtitle:"العلاقات بين الأفكار"},
  {id:15,icon:"📚",title:"تحدي قارئة النصوص",subtitle:"أنواع النصوص"},
  {id:16,icon:"🪄",title:"تحدي سحر المفردات",subtitle:"المفردات في السياق"},
  {id:17,icon:"🕊️",title:"تحدي القيم الجميلة",subtitle:"القيم والمواقف"},
  {id:18,icon:"🔮",title:"تحدي التوقع الذكي",subtitle:"التوقع والاستنتاج"},
  {id:19,icon:"👑",title:"تحدي القارئة المتميزة",subtitle:"مستوى متقدم"},
  {id:20,icon:"🥇",title:"التحدي الذهبي",subtitle:"الاختبار الختامي"}
];

const tests={

  1:{
    passage:`
الجمال عنصر أصيل في بنية الكون، وقد خلق الله الإنسان مزودًا بالقدرة على تذوقه.

والحياة الحقة هي التي تتكامل فيها عناصر الإنسان: جسمه بتغذيته، وعقله بتطويره، وعاطفته بتزويدها بالجمال.

ومن يتأمل الطبيعة يرى جمال السماء والأرض والطيور والأزهار وشروق الشمس وغروبها.

وكلما دق بصر الإنسان وصفت روحه، رأى من جمال العالم ما يبعث في نفسه السعادة والطمأنينة، ويقوده إلى التفكر في عظمة الخالق.
    `,

    questions:[
      {
        q:"مرادف كلمة «قِوام» في سياق النص:",
        a:["أداء","عماد","استواء","شروع"],
        c:1,
        e:"القِوام هو ما يقوم عليه الشيء ويعتمد عليه؛ أي العماد."
      },
      {
        q:"القيمة التي حث عليها النص:",
        a:["التأمل","الإهمال","العزلة","التردد"],
        c:0,
        e:"النص يدعو إلى التأمل في جمال الكون."
      },
      {
        q:"الإحساس بالجمال ينشأ عن التكامل بين:",
        a:[
          "العقل والجسم والعاطفة",
          "الرغبة والجسم والمال",
          "التمييز والعاطفة والزمان",
          "العقل والمال والمكان"
        ],
        c:0,
        e:"ذكر النص الجسم والعقل والعاطفة."
      },
      {
        q:"العلاقة بين «شروق» و«غروب» هي:",
        a:["الترادف","السببية","التضاد","التعليل"],
        c:2,
        e:"الشروق والغروب لفظان متضادان."
      },
      {
        q:"الفكرة الرئيسة للنص:",
        a:[
          "أنواع الطيور",
          "أهمية الجمال في حياة الإنسان",
          "صعوبة الحياة",
          "أحوال الطقس"
        ],
        c:1,
        e:"يدور النص حول أثر الجمال في حياة الإنسان."
      },
      {
        q:"معنى «دق بصره» في السياق:",
        a:["طرق الباب","ضعف نظره","أحسن الملاحظة","أسرع"],
        c:2,
        e:"المقصود دقة الملاحظة وحسن التأمل."
      },
      {
        q:"أي المشاعر لا يبعثها التأمل في جمال الكون؟",
        a:["السعادة","الطمأنينة","التفكر","الفتور"],
        c:3,
        e:"التأمل لا يبعث الفتور."
      },
      {
        q:"ضد كلمة «أصيل» هو:",
        a:["راسخ","أساسي","ثانوي","عريق"],
        c:2,
        e:"ضد أصيل: ثانوي."
      },
      {
        q:"ما نتيجة صفاء الروح ودقة البصر؟",
        a:[
          "عدم رؤية الجمال",
          "إدراك مظاهر الجمال",
          "تجنب الطبيعة",
          "الشعور بالخوف"
        ],
        c:1,
        e:"كلما صفَت الروح ودق البصر أدرك الإنسان الجمال."
      },
      {
        q:"أدق تلخيص للنص:",
        a:[
          "الجمال يقتصر على الأزهار",
          "تأمل الجمال يقود إلى السعادة والتفكر",
          "العقل أهم من العاطفة",
          "الإنسان لا يحتاج إلى الجمال"
        ],
        c:1,
        e:"هذا الخيار يلخص الفكرة وأثرها."
      }
    ]
  },

  2:{
    passage:`
كان سليمان بن أيوب شديد الرغبة في حفظ القرآن الكريم، لكنه وجد مشقة كبيرة في بدايته، حتى عجز مدة طويلة عن إتقان قراءة الفاتحة، فحزن وبكى وشكا حاله إلى رجل صالح.

نصحه الرجل أن يطلب من أمه أن تدعو له، فعاد إليها وأخبرها بما يعاني، فدعت له بصدق وإخلاص.

وما هي إلا مدة حتى انقشعت الغمة، وانفتح ذهنه، وقوي حفظه، وأصبح من أهل العلم والتميز.

وقد شبه سليمان حال عقله قبل الدعاء بالشمس التي حجبتها سحابة، ثم هبت عليها ريح فانقشعت السحابة وظهر نور الشمس.
    `,

    questions:[
      {
        q:"ما سبب بكاء سليمان؟",
        a:[
          "خوفه من معلمه",
          "صعوبة حفظ القرآن",
          "ابتعاده عن أسرته",
          "ضياع كتبه"

let currentId=1;
let currentQ=0;
let score=0;
let student="";
let answered=false;

function renderCards(){
  const cards=document.getElementById("cards");
  cards.innerHTML="";

  challenges.forEach(challenge=>{
    const card=document.createElement("div");

    card.className="test-card";

    card.innerHTML=`
      <span class="icon">${challenge.icon}</span>
      <span class="title">${challenge.title}</span>
      <span class="subtitle">${challenge.subtitle}</span>
      <span class="badge">ابدئي الآن</span>
    `;

    card.onclick=()=>{
      openChallenge(challenge.id);
    };

    cards.appendChild(card);
  });

  updateSummary();
}

function openChallenge(id){
  currentId=id;

  document.getElementById("home").classList.add("hidden");
  document.getElementById("nameScreen").classList.remove("hidden");

  document.getElementById("challengeTitle").textContent=
    challenges[id-1].title;
}

function startQuiz(){
  const name=
    document.getElementById("studentName").value.trim();

  const parts=name.split(/\s+/).filter(Boolean);

  if(parts.length<4){
    alert("اكتبي اسمكِ الرباعي كاملًا.");
    return;
  }

  student=name;
  currentQ=0;
  score=0;

  document.getElementById("nameScreen").classList.add("hidden");
  document.getElementById("quizScreen").classList.remove("hidden");

  showQuestion();
}

function showQuestion(){
  answered=false;

  const test=tests[currentId];
  const item=test.questions[currentQ];

  document.getElementById("passage").textContent=test.passage;

  document.getElementById("qCounter").textContent=
    `السؤال ${currentQ+1} من ${test.questions.length}`;

  document.getElementById("scoreLive").textContent=
    `الدرجة: ${score}`;

  document.getElementById("barFill").style.width=
    `${currentQ/test.questions.length*100}%`;

  document.getElementById("question").textContent=item.q;

  const answers=document.getElementById("answers");
  answers.innerHTML="";

  item.a.forEach((answer,index)=>{
    const button=document.createElement("button");

    button.className="answer";
    button.textContent=answer;

    button.onclick=()=>{
      choose(index,button);
    };

    answers.appendChild(button);
  });

  document.getElementById("feedback").className="feedback hidden";
  document.getElementById("nextBtn").classList.add("hidden");
}

function showAnswerMark(isCorrect){
  const mark=document.createElement("div");

  mark.className=
    "answer-mark "+
    (isCorrect?"correct-mark":"wrong-mark");

  mark.textContent=isCorrect?"✓":"✕";

  document.body.appendChild(mark);

  setTimeout(()=>{
    mark.remove();
  },700);
}

function choose(index,button){
  if(answered)return;

  answered=true;

  const item=tests[currentId].questions[currentQ];
  const buttons=[...document.querySelectorAll(".answer")];

  buttons.forEach(answerButton=>{
    answerButton.disabled=true;
  });

  const feedback=document.getElementById("feedback");

  if(index===item.c){
    score++;

    button.classList.add("correct");

    feedback.className="feedback ok";

    feedback.innerHTML=`
      <strong>✅ إجابة صحيحة</strong>
      <br>
      أحسنتِ يا نجمة نافس!
    `;

    showAnswerMark(true);
    playTone(true);
    celebrate();

  }else{
    button.classList.add("wrong");
    buttons[item.c].classList.add("correct");

    const quizScreen=document.getElementById("quizScreen");

    quizScreen.classList.add("shake");

    setTimeout(()=>{
      quizScreen.classList.remove("shake");
    },450);

    feedback.className="feedback bad";

    feedback.innerHTML=`
      <strong>❌ إجابتك غير صحيحة</strong>
      <br>
      <b>الإجابة الصحيحة:</b>
      ${item.a[item.c]}
      <br>
      <b>التوضيح:</b>
      ${item.e}
    `;

    showAnswerMark(false);
    playTone(false);
  }

  document.getElementById("scoreLive").textContent=
    `الدرجة: ${score}`;

  const nextButton=document.getElementById("nextBtn");

  nextButton.textContent=
    currentQ===tests[currentId].questions.length-1
    ?"عرض النتيجة"
    :"السؤال التالي";

  nextButton.classList.remove("hidden");
}

function nextQuestion(){
  const lastQuestion=
    tests[currentId].questions.length-1;

  if(currentQ<lastQuestion){
    currentQ++;
    showQuestion();
  }else{
    finishQuiz();
  }
}

function finishQuiz(){
  document.getElementById("quizScreen").classList.add("hidden");
  document.getElementById("resultScreen").classList.remove("hidden");

  const total=tests[currentId].questions.length;
  const percentage=Math.round(score/total*100);

  document.getElementById("resultTitle").textContent=
    score>=7
    ?"🎉 اجتزتِ التحدي بنجاح"
    :"🌷 محاولة جميلة";

  document.getElementById("resultText").textContent=
    `${student}، حصلتِ على ${score} من ${total} بنسبة ${percentage}٪.`;

  if(score>=7){
    localStorage.setItem(
      `nafes_${currentId}`,
      String(score)
    );

    updateSummary();
  }
}

function showCertificate(){
  if(score<7){
    alert("الشهادة تظهر عند الحصول على 7 من 10 فأعلى.");
    return;
  }

  const percentage=Math.round(
    score/tests[currentId].questions.length*100
  );

  document.getElementById("certName").textContent=student;

  document.getElementById("certChallenge").textContent=
    `لاجتيازها بنجاح: ${challenges[currentId-1].title}`;

  document.getElementById("certScore").textContent=
    `الدرجة: ${score} من 10 — النسبة: ${percentage}٪`;

  let title="";

  if(score===10){
    title="استحققتِ لقب: بطلة نافس الذهبية";
  }else if(score===9){
    title="استحققتِ لقب: نجمة الفهم العميق";
  }else if(score===8){
    title="استحققتِ لقب: القارئة الماهرة";
  }else{
    title="استحققتِ لقب: المتقدمة بثقة";
  }

  document.getElementById("certPhrase").textContent=title;

  const shell=document.getElementById("certificateShell");
  const certificate=document.getElementById("certificate");

  shell.classList.remove("hidden");
  certificate.classList.remove("certificate-reveal");

  void certificate.offsetWidth;

  certificate.classList.add("certificate-reveal");

  document.getElementById("printBtn").classList.remove("hidden");

  setTimeout(()=>{
    shell.scrollIntoView({
      behavior:"smooth",
      block:"center"
    });
  },120);

  celebrate();
}

function restartQuiz(){
  currentQ=0;
  score=0;

  document.getElementById("resultScreen").classList.add("hidden");
  document.getElementById("certificateShell").classList.add("hidden");
  document.getElementById("certificate").classList.remove("certificate-reveal");
  document.getElementById("printBtn").classList.add("hidden");
  document.getElementById("quizScreen").classList.remove("hidden");

  showQuestion();
}

function goHome(){
  document.querySelectorAll("main > section").forEach(section=>{
    section.classList.add("hidden");
  });

  document.getElementById("home").classList.remove("hidden");
  document.getElementById("studentName").value="";
}

function updateSummary(){
  let completed=0;
  let totalScore=0;

  for(let i=1;i<=20;i++){
    const value=
      Number(localStorage.getItem(`nafes_${i}`)||0);

    if(value>=7){
      completed++;
      totalScore+=value;
    }
  }

  let text=`أنجزتِ ${completed} من 20 تحديًا`;

  if(completed===20 && totalScore>=180){
    text+=" — 👑 استحققتِ وسا
        }

  document
    .getElementById("summary")
    .textContent=text;
}

function playTone(isCorrect){
  try{
    const AudioContextClass=
      window.AudioContext||
      window.webkitAudioContext;

    const context=new AudioContextClass();
    const oscillator=context.createOscillator();
    const gain=context.createGain();

    oscillator.connect(gain);
    gain.connect(context.destination);

    oscillator.frequency.value=
      isCorrect ? 700 : 180;

    gain.gain.value=.08;

    oscillator.start();

    oscillator.stop(
      context.currentTime+
      (isCorrect ? .18 : .28)
    );

  }catch(error){}
}

function celebrate(){
  const container=
    document.getElementById("confetti");

  const icons=[
    "🎈",
    "✨",
    "🌸",
    "⭐",
    "🎉"
  ];

  for(let i=0;i<28;i++){
    const piece=
      document.createElement("span");

    piece.className="piece";

    piece.textContent=
      icons[
        Math.floor(
          Math.random()*icons.length
        )
      ];

    piece.style.left=
      Math.random()*100+"vw";

    piece.style.animationDelay=
      Math.random()*.5+"s";

    container.appendChild(piece);

    setTimeout(()=>{
      piece.remove();
    },3300);
  }
}

renderCards();

</script>
