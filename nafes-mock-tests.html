<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الاختبارات الشاملة | مكتبة نافس</title>
  <style>
    :root{--p:#75558d;--pd:#4b385b;--g:#c9a85c;--bg:#fffaf1;--paper:#fffdf8;--text:#403347}
    *{box-sizing:border-box}
    body{margin:0;font-family:Tahoma,Arial,sans-serif;color:var(--text);background:linear-gradient(180deg,var(--bg),#f7eff8);line-height:1.8}
    header{padding:34px 18px;text-align:center;color:#fff;background:linear-gradient(135deg,#786094,#594474);border-bottom:5px solid var(--g)}
    header h1{margin:0;font-size:34px}
    header p{max-width:760px;margin:10px auto 0;font-size:17px}
    main{width:min(94%,900px);margin:28px auto 40px}
    .top-link{display:inline-block;margin-bottom:18px;padding:10px 14px;color:#35263d;font-weight:bold;text-decoration:none;background:var(--g);border-radius:12px}
    .tests-box{padding:22px;background:var(--paper);border:2px solid #dfd3e5;border-radius:24px;box-shadow:0 8px 22px rgba(73,56,92,.10)}
    .tests-box h2{margin:0 0 20px;text-align:center;color:var(--pd);font-size:28px}
    .tests-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
    .test-card{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:190px;padding:20px;text-align:center;text-decoration:none;color:var(--text);background:linear-gradient(145deg,#fffdf8,#f6eef9);border:2px solid var(--g);border-radius:20px;box-shadow:0 6px 16px rgba(73,56,92,.08)}
    .test-card:active{transform:scale(.98)}
    .icon{margin-bottom:7px;font-size:44px}
    .title{color:var(--pd);font-size:21px;font-weight:bold}
    .subtitle{margin-top:6px;color:#6d6172;font-size:14px}
    footer{padding:18px;text-align:center;color:#fff;background:var(--pd);border-top:4px solid var(--g)}
    @media(max-width:700px){.tests-grid{grid-template-columns:1fr}header h1{font-size:29px}}
  </style>
</head>
<body>
  <header>
    <h1>الاختبارات الشاملة</h1>
    <p>اختاري النموذج وابدئي الاختبار، ثم اطلعي على نتيجتك وشهادتك بعد الانتهاء.</p>
  </header>

  <main>
    <a class="top-link" href="nafes.html">العودة إلى مكتبة نافس</a>

    <section class="tests-box">
      <h2>نماذج الاختبارات</h2>

      <div class="tests-grid">
        <a class="test-card" href="nafes-test-01.html">
          <span class="icon">🌸</span>
          <span class="title">النموذج الأول</span>
          <span class="subtitle">بوابة الجمال والحياة</span>
        </a>

        <a class="test-card" href="nafes-test-02.html">
          <span class="icon">📖</span>
          <span class="title">النموذج الثاني</span>
          <span class="subtitle">ربيع القلوب</span>
        </a>

        <a class="test-card" href="nafes-test-03.html">
          <span class="icon">🌿</span>
          <span class="title">النموذج الثالث</span>
          <span class="subtitle">حُماة البيئة</span>
        </a>

        <a class="test-card" href="nafes-test-04.html">
          <span class="icon">⏳</span>
          <span class="title">النموذج الرابع</span>
          <span class="subtitle">كنز الوقت</span>
        </a>
      </div>
    </section>
  </main>

  <footer>جميع الحقوق محفوظة © 2026</footer>
</body>
</html>
