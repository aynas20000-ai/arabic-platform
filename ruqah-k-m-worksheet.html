<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ورقة عمل حرفي الكاف والميم بخط الرقعة</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Tahoma, Arial, sans-serif;
            background: #f4f7fb;
            color: #263238;
            text-align: center;
        }

        header {
            background: linear-gradient(135deg, #1565c0, #42a5f5);
            color: white;
            padding: 35px 15px;
            border-radius: 0 0 30px 30px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.18);
        }

        header h1 {
            margin: 0;
            font-size: 30px;
            line-height: 1.6;
        }

        header p {
            margin: 10px 0 0;
            font-size: 18px;
        }

        .worksheets {
            width: 94%;
            max-width: 850px;
            margin: 30px auto;
        }

        .sheet {
            background: white;
            padding: 12px;
            margin-bottom: 25px;
            border-radius: 20px;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.12);
        }

        .sheet h2 {
            color: #1565c0;
            font-size: 24px;
            margin: 8px 0 14px;
        }

        .sheet img {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 12px;
        }

        .hint {
            width: 92%;
            max-width: 700px;
            margin: 15px auto 25px;
            padding: 15px;
            background: #fff8d5;
            border: 2px dashed #fbc02d;
            border-radius: 18px;
            font-size: 17px;
            line-height: 1.8;
        }

        .back {
            display: block;
            width: 90%;
            max-width: 500px;
            margin: 25px auto 40px;
            padding: 16px;
            border-radius: 18px;
            background: #1565c0;
            color: white;
            text-decoration: none;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 5px 12px rgba(0, 0, 0, 0.18);
        }

        .back:active {
            transform: scale(0.97);
        }

        footer {
            padding: 20px;
            color: #607d8b;
        }
    </style>
</head>

<body>

    <header>
        <h1>📝 ورقة عمل حرفي الكاف والميم</h1>
        <p>تدرّب على كتابة الحرفين بخط الرقعة</p>
    </header>

    <main class="worksheets">

        <section class="sheet">
            <h2>ورقة عمل حرف الكاف</h2>
            <img src="3.jpg"
                 alt="ورقة عمل حرف الكاف بخط الرقعة">
        </section>

        <section class="sheet">
            <h2>ورقة عمل حرف الميم</h2>
            <img src="4.jpg"
                 alt="ورقة عمل حرف الميم بخط الرقعة">
        </section>

    </main>

    <div class="hint">
        ✨ اضغط على الصورة لتكبيرها باستخدام إصبعيك،
        ثم تدرب على الكتابة بهدوء.
    </div>

    <a class="back" href="ruqah-km.html">
        ⬅️ العودة إلى الدرس
    </a>

    <footer>
        جميع الحقوق محفوظة © 2026
    </footer>

</body>

</html>
