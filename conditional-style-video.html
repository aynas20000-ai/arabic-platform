<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>شرح درس أسلوب الشرط بالفيديو</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      max-width: 100%;
      margin: 0;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      font-family: Tahoma, Arial, sans-serif;
      color: #4b3a57;
      text-align: center;
      background:
        linear-gradient(
          180deg,
          #fffaf2,
          #f8f0fb
        );
    }

    header {
      padding: 38px 20px 32px;
      color: white;
      background:
        linear-gradient(
          135deg,
          #776094,
          #5b4677
        );
      border-bottom: 4px solid #c9a85c;
    }

    header h1 {
      margin: 0 0 10px;
      color: #fffdf8;
      font-size: 34px;
      line-height: 1.6;
    }

    header p {
      max-width: 720px;
      margin: auto;
      color: #f7effb;
      font-size: 17px;
      line-height: 1.9;
    }

    main {
      width: 92%;
      max-width: 800px;
      margin: 30px auto;
    }

    .card {
      padding: 25px;
      background: #fffdf8;
      border: 2px solid #c9a85c;
      border-radius: 20px;
      box-shadow:
        0 7px 18px
        rgba(91, 63, 111, 0.12);
    }

    .card-title {
      margin: 0 0 18px;
      color: #5d4374;
      font-size: 23px;
      line-height: 1.8;
    }

    .video {
      position: relative;
      width: 100%;
      height: 0;
      padding-bottom: 56.25%;
      overflow: hidden;
      background: #f5ecfb;
      border: 3px solid #c9a85c;
      border-radius: 18px;
      box-shadow:
        0 5px 14px
        rgba(91, 63, 111, 0.12);
    }

    .video iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .note {
      margin-top: 20px;
      padding: 15px;
      color: #5d4374;
      font-weight: bold;
      line-height: 1.9;
      background: #f5ecfb;
      border: 1px solid #c9a85c;
      border-radius: 15px;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 24px;
    }

    .btn {
      display: inline-block;
      padding: 13px 25px;
      color: white;
      font-family: inherit;
      font-size: 17px;
      font-weight: bold;
      text-decoration: none;
      background: #6f5288;
      border: 2px solid #c9a85c;
      border-radius: 22px;
    }

    .btn:hover,
    .btn:active {
      background: #5b4677;
    }

    footer {
      margin-top: 35px;
      padding: 20px;
      color: #fffdf8;
      background: #49385c;
      border-top: 3px solid #c9a85c;
    }

    @media (max-width: 600px) {
      header {
        padding: 30px 14px 25px;
      }

      header h1 {
        font-size: 28px;
      }

      header p {
        font-size: 16px;
      }

      main {
        width: 94%;
        margin-top: 20px;
      }

      .card {
        padding: 18px 14px;
      }

      .card-title {
        font-size: 20px;
      }

      .btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <header>

    <h1>🎥 شرح درس أسلوب الشرط</h1>

    <p>
      شاهدي الشرح المرئي،
      ثم عودي إلى الدرس لتطبيق ما تعلّمتِه.
    </p>

  </header>

  <main>

    <section class="card">

      <h2 class="card-title">
        فيديو شرح أسلوب الشرط
      </h2>

      <div class="video">

        <iframe
          src="https://www.youtube.com/embed/j33RmNWIeWg"
          title="شرح درس أسلوب الشرط"
          loading="lazy"
          allow="
            accelerometer;
            autoplay;
            clipboard-write;
            encrypted-media;
            gyroscope;
            picture-in-picture;
            web-share
          "
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen
        >
        </iframe>

      </div>

      <div class="note">
        💡 ركّزي أثناء المشاهدة على:
        أداة الشرط، وفعل الشرط، وجواب الشرط.
      </div>

      <div class="actions">

        <a
          class="btn"
          href="conditional-style.html"
        >
          العودة إلى درس أسلوب الشرط
        </a>

      </div>

    </section>

  </main>

  <footer>
    جميع الحقوق محفوظة © 2026
  </footer>

</body>

</html>
