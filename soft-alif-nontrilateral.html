<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الألف اللينة في الأفعال غير الثلاثية</title>

  <style>
    body{
      margin:0;
      font-family:Tahoma,Arial,sans-serif;
      background:#f7f2eb;
      text-align:center;
      color:#4b3f55;
    }

    header{
      background:#d8c3e8;
      padding:35px 20px;
      border-bottom:4px solid #c3a75d;
    }

    section{
      background:#fffaf4;
      margin:30px auto;
      padding:25px;
      width:85%;
      max-width:700px;
      border-radius:18px;
    }

    .box{
      background:linear-gradient(135deg,#f9e3ec,#eee5f7,#f7f0e6);
      margin:18px 0;
      padding:24px;
      border:2px solid #c3a75d;
      border-radius:14px;
      font-size:21px;
      line-height:1.9;
    }

    a{
      color:#9a7b2f;
      font-weight:bold;
      text-decoration:none;
    }
  </style>
</head>

<body>

<header>
  <h1>الألف اللينة في الأفعال غير الثلاثية</h1>
</header>

<section>

  <div class="box">
    تُكتب الألف اللينة في آخر الفعل غير الثلاثي على صورة ياء غير منقوطة.
    <br>
    مثال: اهتدى، استدعى، أعطى.
  </div>

  <div class="box">
    إذا سبقت الألف بياء، تُكتب ألفًا قائمة.
    <br>
    مثال: أحيا، استحيا.
  </div>

  <p><a href="spelling.html">العودة إلى الرسم الإملائي</a></p>

</section>

</body>
</html>
