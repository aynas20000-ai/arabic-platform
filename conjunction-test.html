<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>اختبار العطف | منصة آفاق</title>
<style>
:root{
 --p:#5b4677;--p2:#776094;--pd:#453457;--g:#b69750;--gl:#ead9a8;
 --cream:#fffaf2;--bg:#f5f0fa;--text:#3f3348;--green:#367554;--red:#a54444;
}
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial,sans-serif;color:var(--text);background:linear-gradient(180deg,#f5f0fa,#fbf9fd,#f1ebf7);min-height:100vh;line-height:1.8}
header{text-align:center;color:white;padding:35px 18px;background:linear-gradient(145deg,var(--p2),var(--p),var(--pd));border-bottom:5px solid var(--g)}
header .tag{display:inline-block;padding:4px 12px;border-radius:999px;border:1px solid #dbc681;color:#fff4ce;background:rgba(182,151,80,.15);font-weight:bold;font-size:13px}
header h1{margin:7px 0 2px;font-size:34px}header p{margin:0;color:#f3edf7}
main{width:min(760px,92%);margin:22px auto 45px}
.top{display:flex;justify-content:space-between;gap:10px;margin-bottom:10px;font-weight:bold;color:var(--p)}
.progress{height:10px;background:#e9e0ef;border-radius:999px;overflow:hidden;margin-bottom:16px}
.progress>div{height:100%;width:0;background:linear-gradient(90deg,var(--g),#dfca8f);transition:.3s}
.card,.result{background:#fffdfb;border:1px solid #d8c28a;border-radius:24px;box-shadow:0 15px 32px rgba(73,54,92,.12);padding:22px 19px}
.qnum{font-weight:bold;color:var(--g);margin-bottom:5px}
h2{font-size:21px;margin:4px 0 16px;color:var(--pd)}
.options{display:grid;gap:10px}
.opt{width:100%;padding:13px 14px;border-radius:14px;border:2px solid #e4dbe9;background:#fff;color:var(--text);font:inherit;font-size:16px;text-align:right;cursor:pointer}
.opt:hover{border-color:#bfa8cc;background:#fbf8fd}
.opt.correct{background:#e9f6ef;border-color:#60a27c;color:#285f42}
.opt.wrong{background:#fff0f0;border-color:#c87777;color:#873535}
.opt:disabled{cursor:default}
.feedback{display:none;margin-top:14px;padding:13px 14px;border-radius:14px;font-size:15px}
.feedback.show{display:block}.feedback.good{background:#e9f6ef;border:1px solid #8cbea1;color:#285f42}.feedback.bad{background:#fff1f1;border:1px solid #dca0a0;color:#843838}
.next{display:none;width:100%;margin-top:15px;padding:13px;border:0;border-radius:14px;background:linear-gradient(145deg,var(--p2),var(--p));color:white;font:inherit;font-weight:bold;font-size:16px;cursor:pointer}
.result{display:none;text-align:center}.result.show{display:block}.score{font-size:44px;font-weight:bold;color:var(--g)}
.restart,.lesson{display:block;text-decoration:none;width:100%;padding:12px;margin-top:10px;border-radius:14px;font-weight:bold}
.restart{border:0;background:linear-gradient(145deg,var(--p2),var(--p));color:white;font:inherit;cursor:pointer}.lesson{background:#f0e8f5;color:var(--pd);border:1px solid #d7c8e0}
footer{text-align:center;color:#756c7a;padding:16px;font-size:12px}
</style>
</head>
<body>
<header>
 <span class="tag">منصة آفاق التعليمية</span>
 <h1>اختبار العطف</h1>
 <p>١٠ أسئلة تفاعلية مع تعقيب فوري على كل إجابة</p>
</header>
<main>
 <div class="top"><span id="counter">السؤال ١ من ١٠</span><span id="correctCount">الصحيح: ٠</span></div>
 <div class="progress"><div id="bar"></div></div>
 <section class="card" id="card">
   <div class="qnum" id="qnum"></div>
   <h2 id="question"></h2>
   <div class="options" id="options"></div>
   <div class="feedback" id="feedback"></div>
   <button class="next" id="next">السؤال التالي</button>
 </section>
 <section class="result" id="result">
   <h2>اكتمل الاختبار 🌟</h2>
   <div class="score" id="score"></div>
   <p id="message"></p>
   <button class="restart" onclick="restartQuiz()">إعادة الاختبار</button>
   <a class="lesson" href="conjunction-file.html">مراجعة ملف درس العطف</a>
 </section>
</main>
<footer>منصة آفاق التعليمية | لغتي الخالدة | الصف الثالث المتوسط</footer>
<script>
const questions = [{"q": "في الجملة: «حضر خالدٌ ومحمدٌ» ما إعراب كلمة «محمدٌ»؟", "o": ["معطوف مرفوع", "معطوف منصوب", "معطوف مجرور", "معطوف عليه مرفوع"], "a": 0, "ok": "أحسنتِ 🌟 «محمدٌ» معطوف على «خالدٌ»، والمعطوف يتبع المعطوف عليه في الإعراب، لذلك هو مرفوع.", "bad": "راجعي قاعدة الإعراب: المعطوف يتبع المعطوف عليه. «خالدٌ» مرفوع، إذن «محمدٌ» معطوف مرفوع."}, {"q": "أي حرف عطف يفيد الترتيب مع التعقيب؟", "o": ["الواو", "الفاء", "ثم", "أو"], "a": 1, "ok": "صحيح 👏 الفاء تفيد الترتيب والتعقيب؛ أي إن الثاني يأتي بعد الأول مباشرة أو قريبًا منه.", "bad": "الإجابة الصحيحة: «الفاء». لا تخلطي بينها وبين «ثم»؛ فـ«ثم» تفيد الترتيب مع التراخي."}, {"q": "في الجملة: «دخل المعلمُ ثم المديرُ» ما معنى «ثم»؟", "o": ["المشاركة دون ترتيب", "الترتيب مع التعقيب", "الترتيب مع التراخي", "التخيير"], "a": 2, "ok": "ممتاز ✨ «ثم» تفيد الترتيب مع التراخي؛ أي وجود مهلة بين الحدثين.", "bad": "انتبهي: «ثم» = ترتيب + تراخٍ، أما «الفاء» = ترتيب + تعقيب."}, {"q": "«قرأ وكتب محمدٌ» نوع العطف في المثال هو:", "o": ["عطف اسم على اسم", "عطف فعل على فعل", "عطف جملة فعلية على جملة فعلية", "عطف جملة اسمية على جملة اسمية"], "a": 1, "ok": "رائعة 👌 الفاعل «محمد» واحد ومشترك بين الفعلين «قرأ» و«كتب»، لذلك هو عطف فعل على فعل.", "bad": "اسألي نفسك: هل الفاعل واحد للفعلين؟ نعم، «محمد» فاعل لهما؛ إذن عطف فعل على فعل."}, {"q": "«قرأ زيدٌ وكتب خالدٌ» نوع العطف هو:", "o": ["عطف فعل على فعل", "عطف اسم على اسم", "عطف جملة فعلية على جملة فعلية", "عطف جملة اسمية على جملة اسمية"], "a": 2, "ok": "صحيح جدًا 🌿 لكل فعل فاعل مستقل: «زيد» للأول و«خالد» للثاني؛ إذن جملة فعلية عطفت على جملة فعلية.", "bad": "هنا لكل فعل فاعل مختلف، لذلك لدينا جملتان فعليتان مستقلتان، والثانية معطوفة على الأولى."}, {"q": "«العلمُ نورٌ والجهلُ ظلامٌ» نوع العطف هو:", "o": ["عطف اسم على اسم", "عطف جملة اسمية على جملة اسمية", "عطف فعل على فعل", "عطف جملة فعلية على جملة فعلية"], "a": 1, "ok": "أحسنتِ 💜 «العلم نور» جملة اسمية، و«الجهل ظلام» جملة اسمية أخرى؛ إذن عطف جملة اسمية على جملة اسمية.", "bad": "قسّمي المثال: «العلم نور» = مبتدأ وخبر، و«الجهل ظلام» = مبتدأ وخبر؛ إذن عطف جملتين اسميتين."}, {"q": "في «رأيت خالدًا ومحمدًا» ما إعراب «محمدًا»؟", "o": ["معطوف مرفوع", "معطوف منصوب", "معطوف مجرور", "فاعل"], "a": 1, "ok": "إجابة صحيحة 🌟 «خالدًا» منصوب، ولذلك جاء المعطوف «محمدًا» منصوبًا مثله.", "bad": "أعربي المعطوف عليه أولًا: «خالدًا» مفعول به منصوب، إذن «محمدًا» معطوف منصوب."}, {"q": "في «أحب الصدقَ لا الكذبَ» ماذا تفيد «لا»؟", "o": ["الترتيب والتعقيب", "إثبات الحكم لما قبلها ونفيه عما بعدها", "الغاية", "التراخي"], "a": 1, "ok": "ممتاز 👏 «لا» تثبت الحكم لما قبلها وتنفيه عما بعدها: أحب الصدق ولا أحب الكذب.", "bad": "الإجابة الصحيحة: إثبات الحكم لما قبل «لا» ونفيه عما بعدها."}, {"q": "في «ما قرأتُ قصةً بل روايةً» ماذا تفيد «بل»؟", "o": ["التخيير", "الغاية", "الإضراب والانتقال من حكم إلى آخر", "المشاركة دون ترتيب"], "a": 2, "ok": "صحيح ✨ «بل» تفيد الإضراب والانتقال من الحكم الأول إلى الحكم الثاني.", "bad": "«بل» ليست للتخيير ولا للترتيب؛ معناها هنا الإضراب والانتقال من حكم إلى آخر."}, {"q": "أي عبارة تساعدكِ على التمييز بين عطف الفعل وعطف الجملة الفعلية في الأمثلة المدرسية؟", "o": ["نفس الفاعل = عطف فعل، وفعل لكل فاعل مختلف = عطف جملة", "كل واو تعني عطف جملة", "إذا كان الفعل ماضيًا فهو عطف فعل", "إذا كان الفاعل مستترًا فهو عطف جملة"], "a": 0, "ok": "ممتاز جدًا 🎯 هذه قاعدة حسم مبسطة: فاعل واحد مشترك = عطف فعل، وفاعل مستقل لكل فعل = عطف جملة فعلية.", "bad": "القاعدة المبسطة التي نستخدمها هنا: إذا اشترك الفعلان في فاعل واحد فهو عطف فعل، وإذا كان لكل فعل فاعل مستقل فهو عطف جملة."}];
let index=0, score=0, answered=false;
const arabicDigits=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const question=document.getElementById('question'), options=document.getElementById('options'),
feedback=document.getElementById('feedback'), next=document.getElementById('next');

function render(){
 answered=false;
 const x=questions[index];
 document.getElementById('qnum').textContent='السؤال '+arabicDigits(index+1);
 document.getElementById('counter').textContent='السؤال '+arabicDigits(index+1)+' من '+arabicDigits(questions.length);
 document.getElementById('correctCount').textContent='الصحيح: '+arabicDigits(score);
 document.getElementById('bar').style.width=(index/questions.length*100)+'%';
 question.textContent=x.q;
 options.innerHTML='';
 feedback.className='feedback';
 feedback.innerHTML='';
 next.style.display='none';
 x.o.forEach((t,i)=>{
   const b=document.createElement('button');
   b.className='opt'; b.textContent=t;
   b.onclick=()=>choose(i,b);
   options.appendChild(b);
 });
}

function choose(choice,button){
 if(answered)return;
 answered=true;
 const x=questions[index];
 const btns=[...document.querySelectorAll('.opt')];
 btns.forEach(b=>b.disabled=true);
 btns[x.a].classList.add('correct');

 if(choice===x.a){
   score++;
   button.classList.add('correct');
   feedback.className='feedback show good';
   feedback.textContent=x.ok;
   if(navigator.vibrate) navigator.vibrate(50);
 }else{
   button.classList.add('wrong');
   feedback.className='feedback show bad';
   feedback.innerHTML='<b>ليست الإجابة الصحيحة.</b><br>'+x.bad;
   if(navigator.vibrate) navigator.vibrate([80,50,80]);
 }
 document.getElementById('correctCount').textContent='الصحيح: '+arabicDigits(score);
 next.textContent=index===questions.length-1?'عرض النتيجة':'السؤال التالي';
 next.style.display='block';
}

next.onclick=()=>{
 index++;
 if(index<questions.length) render();
 else finish();
};

function finish(){
 document.getElementById('bar').style.width='100%';
 document.getElementById('card').style.display='none';
 document.querySelector('.top').style.display='none';
 document.querySelector('.progress').style.display='none';
 const r=document.getElementById('result');
 r.classList.add('show');
 document.getElementById('score').textContent=arabicDigits(score)+' / '+arabicDigits(questions.length);
 const pct=score/questions.length;
 document.getElementById('message').textContent=
 pct===1?'إتقان رائع جدًا! جميع إجاباتك صحيحة 👏':
 pct>=.8?'ممتازة جدًا، لديكِ فهم قوي لدرس العطف.':
 pct>=.6?'جيد جدًا، راجعي الأسئلة التي أخطأتِ فيها ثم أعيدي المحاولة.':
 'راجعي ملف الدرس، خاصة معاني الحروف والرياضيات النحوية، ثم أعيدي الاختبار.';
}

function restartQuiz(){
 index=0;score=0;answered=false;
 document.getElementById('card').style.display='block';
 document.querySelector('.top').style.display='flex';
 document.querySelector('.progress').style.display='block';
 document.getElementById('result').classList.remove('show');
 render();
}
render();
</script>
</body>
</html>
