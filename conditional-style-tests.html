<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>اختبار أسلوب الشرط | منصة آفاق</title>

  <style>
    :root {
      --purple: #5b4677;
      --purple-light: #776094;
      --purple-dark: #453457;
      --gold: #c9a85c;
      --gold-light: #ead69e;
      --cream: #fffaf2;
      --paper: #fffdf8;
      --text: #403448;
      --green: #2f7b4f;
      --green-light: #e8f7ef;
      --red: #a44d5d;
      --red-light: #fff0f3;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      font-family: Tahoma, Arial, sans-serif;
      color: var(--text);
      background:
        linear-gradient(
          180deg,
          #f6f0fa,
          #fffaf2
        );
      overflow: hidden;
    }

    button,
    a {
      font-family: inherit;
    }

    .app {
      height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    header {
      padding: 10px 12px 8px;
      text-align: center;
      color: white;
      background:
        linear-gradient(
          135deg,
          var(--purple-light),
          var(--purple),
          var(--purple-dark)
        );
      border-bottom: 4px solid var(--gold);
    }

    .badge {
      display: inline-block;
      padding: 3px 11px;
      color: #fff2c6;
      font-size: 11px;
      font-weight: bold;
      background: rgba(255, 255, 255, 0.09);
      border: 1px solid var(--gold-light);
      border-radius: 999px;
    }

    header h1 {
      margin: 4px 0 1px;
      color: white;
      font-size: clamp(19px, 5vw, 28px);
      line-height: 1.4;
    }

    header p {
      margin: 0;
      color: #f3ecf7;
      font-size: 11px;
    }

    main {
      width: min(760px, 94%);
      min-height: 0;
      margin: auto;
      padding: 7px 0;
      display: flex;
      flex-direction: column;
    }

    .top-info {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 5px;
      color: var(--purple);
      font-size: 13px;
      font-weight: bold;
    }

    .progress {
      height: 8px;
      margin-bottom: 7px;
      overflow: hidden;
      background: #e9e0ef;
      border-radius: 20px;
    }

    .progress-bar {
      width: 0;
      height: 100%;
      background:
        linear-gradient(
          90deg,
          var(--gold),
          var(--purple-light)
        );
      border-radius: 20px;
      transition: width 0.35s ease;
    }

    .quiz-card,
    .result-card {
      flex: 1;
      min-height: 0;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: var(--paper);
      border: 2px solid var(--gold);
      border-radius: 22px;
      box-shadow:
        0 12px 28px
        rgba(73, 56, 92, 0.13);
    }

    .question-number {
      margin-bottom: 2px;
      color: var(--gold);
      font-size: 12px;
      font-weight: bold;
    }

    .question {
      margin: 3px 0 9px;
      color: var(--purple-dark);
      font-size: clamp(16px, 4.3vw, 21px);
      line-height: 1.6;
      text-align: center;
    }

    .answers {
      display: grid;
      gap: 6px;
    }

    .answer-button {
      width: 100%;
      padding: 9px 11px;
      color: var(--text);
      font-size: clamp(13px, 3.4vw, 16px);
      line-height: 1.45;
      text-align: right;
      cursor: pointer;
      background:
        linear-gradient(
          135deg,
          #ffffff,
          #faf6fc
        );
      border: 2px solid #e3d8e9;
      border-radius: 13px;
    }

    .answer-button:active {
      transform: scale(0.99);
    }

    .answer-button.correct {
      color: #205d3a;
      background: var(--green-light);
      border-color: #62a978;
    }

    .answer-button.wrong {
      color: #813949;
      background: var(--red-light);
      border-color: #cf7484;
    }

    .answer-button:disabled {
      cursor: default;
    }

    .feedback {
      display: none;
      margin-top: 7px;
      padding: 8px 10px;
      font-size: clamp(12px, 3.2vw, 14px);
      line-height: 1.5;
      text-align: center;
      border-radius: 13px;
    }

    .feedback.good {
      display: block;
      color: #205d3a;
      background: var(--green-light);
      border: 1px solid #78b88b;
    }

    .feedback.bad {
      display: block;
      color: #813949;
      background: var(--red-light);
      border: 1px solid #d68a97;
    }

    .next-button {
      display: none;
      width: 100%;
      margin-top: 7px;
      padding: 9px;
      color: white;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      background:
        linear-gradient(
          135deg,
          var(--purple-light),
          var(--purple)
        );
      border: 2px solid var(--gold);
      border-radius: 13px;
    }

    .result-card {
      display: none;
      text-align: center;
    }

    .result-card.show {
      display: flex;
    }

    .result-icon {
      font-size: 52px;
    }

    .result-card h2 {
      margin: 4px 0;
      color: var(--purple-dark);
    }

    .score {
      margin: 8px 0;
      color: var(--gold);
      font-size: 42px;
      font-weight: bold;
    }

    .result-message {
      margin: 5px 0 8px;
      padding: 10px;
      color: var(--purple);
      font-weight: bold;
      line-height: 1.7;
      background: #f5ecfb;
      border-radius: 14px;
    }

    .save-status {
      min-height: 26px;
      margin: 4px 0 2px;
      padding: 6px 9px;
      font-size: 12px;
      font-weight: bold;
      line-height: 1.5;
      border-radius: 11px;
    }

    .save-status.saved {
      color: #2e6f42;
      background: #edf8f0;
    }

    .save-status.waiting {
      color: #66522e;
      background: #fff8e8;
    }

    .save-status.error {
      color: #8a3d3d;
      background: #fff0f0;
    }

    .result-button,
    .back-button {
      display: block;
      width: 100%;
      margin-top: 8px;
      padding: 10px;
      font-size: 15px;
      font-weight: bold;
      text-decoration: none;
      border-radius: 13px;
    }

    .result-button {
      color: white;
      cursor: pointer;
      background: var(--purple);
      border: 2px solid var(--gold);
    }

    .back-button {
      color: var(--purple-dark);
      background: #eee5f5;
      border: 1px solid #d5c5df;
    }

    footer {
      padding: 5px;
      color: #73697a;
      font-size: 9px;
      text-align: center;
    }

    .confetti {
      position: fixed;
      top: -20px;
      z-index: 9999;
      width: 9px;
      height: 14px;
      pointer-events: none;
      border-radius: 3px;
      animation: fall linear forwards;
    }

    @keyframes fall {
      from {
        opacity: 1;
        transform:
          translateY(-30px)
          rotate(0deg);
      }

      to {
        opacity: 0;
        transform:
          translateY(110vh)
          rotate(700deg);
      }
    }

    @media (max-height: 650px) {

      header {
        padding: 5px 10px 4px;
      }

      header h1 {
        font-size: 17px;
      }

      header p {
        font-size: 9px;
      }

      main {
        padding: 3px 0;
      }

      .top-info {
        margin-bottom: 3px;
        font-size: 11px;
      }

      .progress {
        height: 6px;
        margin-bottom: 4px;
      }

      .quiz-card {
        padding: 7px;
      }

      .question {
        margin-bottom: 5px;
        font-size: 15px;
      }

      .answers {
        gap: 4px;
      }

      .answer-button {
        padding: 6px 8px;
        font-size: 12px;
      }

      .feedback {
        margin-top: 4px;
        padding: 5px 7px;
        font-size: 11px;
      }

      .next-button {
        margin-top: 4px;
        padding: 6px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <header>

      <span class="badge">
        الأسلوب اللغوي
      </span>

      <h1>
        ✨ اختبري مهارتك | أسلوب الشرط
      </h1>

      <p>
        ١٠ أسئلة • أربعة خيارات • تغذية راجعة فورية 🌟
      </p>

    </header>


    <main>

      <div class="top-info">

        <span id="questionCounter">
          السؤال ١ من ١٠
        </span>

        <span id="scoreText">
          الإجابات الصحيحة: ٠
        </span>

      </div>


      <div class="progress">

        <div
          id="progressBar"
          class="progress-bar"
        ></div>

      </div>


      <section
        id="quizCard"
        class="quiz-card"
      >

        <div
          id="questionNumber"
          class="question-number"
        ></div>

        <h2
          id="questionText"
          class="question"
        ></h2>

        <div
          id="answersBox"
          class="answers"
        ></div>

        <div
          id="feedback"
          class="feedback"
        ></div>

        <button
          id="nextButton"
          class="next-button"
        >
          السؤال التالي ←
        </button>

      </section>


      <section
        id="resultCard"
        class="result-card"
      >

        <div
          id="resultIcon"
          class="result-icon"
        >
          🏆
        </div>

        <h2>
          🎉 اكتمل اختبار أسلوب الشرط
        </h2>

        <div
          id="finalScore"
          class="score"
        >
          ٠ / ١٠
        </div>

        <div
          id="resultMessage"
          class="result-message"
        ></div>

        <div
          id="saveStatus"
          class="save-status"
        ></div>

        <button
          class="result-button"
          onclick="restartQuiz()"
        >
          🔄 أعيدي الاختبار
        </button>

        <a
          class="back-button"
          href="conditional-style-file.html"
        >
          📘 راجعي ملف الدرس
        </a>

        <a
          class="back-button"
          href="conditional-style-wonders.html"
        >
          ✨ روائع أسلوب الشرط
        </a>

        <a
          class="back-button"
          href="conditional-style.html"
        >
          ↩ العودة إلى أسلوب الشرط
        </a>

      </section>

    </main>


    <footer>
      منصة آفاق اللغة | لغتي الخالدة | الصف الثالث المتوسط
    </footer>

  </div>
  <script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc,
  updateDoc,
  serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


const firebaseConfig = {
  apiKey: "AIzaSyB48av9gx4jzFyYoUQtcLwaR52qETevKGs",
  authDomain: "afaq-language-platform.firebaseapp.com",
  projectId: "afaq-language-platform",
  storageBucket: "afaq-language-platform.firebasestorage.app",
  messagingSenderId: "362601061474",
  appId: "1:362601061474:web:bc405291332b9e4ef9453b"
};


const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);

let currentUser = null;

onAuthStateChanged(
  auth,
  (user) => {
    currentUser = user;
  }
);


const questions = [

  {
    question:
      "أيُّ الجمل الآتية اشتملت على أسلوب شرط؟",

    answers: [
      "ما أجملَ الصدقَ!",
      "إنْ تجتهدي تنجحي.",
      "هل أنجزتِ واجبكِ؟",
      "العلمُ طريقُ النجاح."
    ],

    correct: 1,

    explanation:
      "الجملة «إنْ تجتهدي تنجحي» ربطت الاجتهاد بالنجاح باستخدام أداة الشرط «إنْ»."
  },


  {
    question:
      "ما أداة الشرط في الجملة: «مَن يحفظْ وقتَه يحققْ أهدافَه»؟",

    answers: [
      "يحفظْ",
      "وقتَه",
      "مَن",
      "يحققْ"
    ],

    correct: 2,

    explanation:
      "«مَن» أداة شرط جازمة تدل على العاقل."
  },


  {
    question:
      "ما فعل الشرط في الجملة: «إنْ تحسني إلى الناس يحبّوكِ»؟",

    answers: [
      "إنْ",
      "تحسني",
      "الناس",
      "يحبّوكِ"
    ],

    correct: 1,

    explanation:
      "الفعل «تحسني» هو فعل الشرط؛ لأنه وقع بعد أداة الشرط «إنْ»."
  },


  {
    question:
      "ما جواب الشرط في الجملة: «متى تنظّمي وقتكِ تنجزي أعمالكِ»؟",

    answers: [
      "متى",
      "تنظّمي",
      "وقتكِ",
      "تنجزي أعمالكِ"
    ],

    correct: 3,

    explanation:
      "«تنجزي أعمالكِ» هي النتيجة المترتبة على تنظيم الوقت؛ لذلك فهي جواب الشرط."
  },


  {
    question:
      "ما نوع «ما» في الجملة: «ما تزرعْ تحصدْ»؟",

    answers: [
      "استفهامية",
      "نافية",
      "شرطية",
      "تعجبية"
    ],

    correct: 2,

    explanation:
      "«ما» شرطية؛ لأنها ربطت فعل الشرط «تزرعْ» بجوابه «تحصدْ»."
  },


  {
    question:
      "ما نوع «ما» في الجملة: «ما هدفُكِ في المستقبل؟»",

    answers: [
      "موصولة",
      "استفهامية",
      "شرطية",
      "نافية"
    ],

    correct: 1,

    explanation:
      "«ما» استفهامية؛ لأنها استُخدمت للسؤال وتحتاج إلى إجابة."
  },


  {
    question:
      "قال تعالى: ﴿إِنْ تَنْصُرُوا اللَّهَ يَنْصُرْكُمْ﴾، ما جواب الشرط؟",

    answers: [
      "إنْ",
      "تنصروا",
      "الله",
      "ينصركم"
    ],

    correct: 3,

    explanation:
      "«ينصركم» جواب الشرط؛ لأنه النتيجة المترتبة على الشرط."
  },


  {
    question:
      "قال تعالى: ﴿مَنْ يَتَّقِ اللَّهَ يَجْعَلْ لَهُ مَخْرَجًا﴾، ما فعل الشرط؟",

    answers: [
      "مَن",
      "يتقِ",
      "يجعلْ",
      "مخرجًا"
    ],

    correct: 1,

    explanation:
      "«يتقِ» فعل الشرط، وعلامة جزمه حذف حرف العلة."
  },


  {
    question:
      "ما علامة جزم الفعل «يسعَ» في: «مَن يسعَ للخير يلقَ أثره»؟",

    answers: [
      "السكون",
      "حذف حرف العلة",
      "حذف النون",
      "الضمة"
    ],

    correct: 1,

    explanation:
      "أصل الفعل «يسعى»، وهو معتل الآخر، وعند جزمه يُحذف حرف العلة فيصبح «يسعَ»."
  },


  {
    question:
      "أيُّ الجمل الآتية ضُبط فيها فعلا الشرط والجواب ضبطًا صحيحًا؟",

    answers: [
      "مَن يجتهدُ ينجحُ.",
      "مَن يجتهدْ ينجحْ.",
      "مَن يجتهدَ ينجحَ.",
      "مَن يجتهدْ ينجحُ."
    ],

    correct: 1,

    explanation:
      "«مَن» أداة شرط جازمة، والفعلان صحيحا الآخر؛ لذلك جُزما بالسكون."
  }

];


let currentQuestion = 0;
let score = 0;
let answered = false;


const arabicDigits = number =>
  String(number).replace(
    /\d/g,
    digit => "٠١٢٣٤٥٦٧٨٩"[digit]
  );


function showQuestion() {

  answered = false;

  const item =
    questions[currentQuestion];


  document
    .getElementById("questionCounter")
    .textContent =
    "السؤال " +
    arabicDigits(currentQuestion + 1) +
    " من " +
    arabicDigits(questions.length);


  document
    .getElementById("questionNumber")
    .textContent =
    "السؤال " +
    arabicDigits(currentQuestion + 1);


  document
    .getElementById("scoreText")
    .textContent =
    "الإجابات الصحيحة: " +
    arabicDigits(score);


  document
    .getElementById("questionText")
    .textContent =
    item.question;


  document
    .getElementById("progressBar")
    .style.width =
    (
      (currentQuestion + 1) /
      questions.length *
      100
    ) + "%";


  const answersBox =
    document.getElementById(
      "answersBox"
    );

  answersBox.innerHTML = "";


  const feedback =
    document.getElementById(
      "feedback"
    );

  feedback.className =
    "feedback";

  feedback.textContent = "";


  const nextButton =
    document.getElementById(
      "nextButton"
    );

  nextButton.style.display =
    "none";


  item.answers.forEach(
    (answer, index) => {

      const button =
        document.createElement(
          "button"
        );

      button.type =
        "button";

      button.className =
        "answer-button";

      button.textContent =
        answer;

      button.onclick =
        () =>
          selectAnswer(
            index,
            button
          );

      answersBox.appendChild(
        button
      );

    }
  );

}


function selectAnswer(
  selectedIndex,
  selectedButton
) {

  if (answered) {
    return;
  }

  answered = true;


  const item =
    questions[currentQuestion];


  const buttons =
    [
      ...document.querySelectorAll(
        ".answer-button"
      )
    ];


  buttons.forEach(
    button =>
      button.disabled = true
  );


  buttons[item.correct]
    .classList
    .add("correct");


  const feedback =
    document.getElementById(
      "feedback"
    );


  if (
    selectedIndex ===
    item.correct
  ) {

    score++;

    selectedButton
      .classList
      .add("correct");

    feedback.className =
      "feedback good";

    feedback.innerHTML =
      "🌟 أحسنتِ، إجابة صحيحة.<br>" +
      item.explanation;

    playCorrectSound();

    celebrate(30);

    if (
      navigator.vibrate
    ) {
      navigator.vibrate(45);
    }

  } else {

    selectedButton
      .classList
      .add("wrong");

    feedback.className =
      "feedback bad";

    feedback.innerHTML =
      "🌷 راجعي الفكرة.<br>" +
      item.explanation;

    playWrongSound();

    if (
      navigator.vibrate
    ) {
      navigator.vibrate(
        [70, 40, 70]
      );
    }

  }


  document
    .getElementById("scoreText")
    .textContent =
    "الإجابات الصحيحة: " +
    arabicDigits(score);


  const nextButton =
    document.getElementById(
      "nextButton"
    );

  nextButton.style.display =
    "block";


  if (
    currentQuestion ===
    questions.length - 1
  ) {

    nextButton.textContent =
      "شاهدي نتيجتكِ ✨";

  } else {

    nextButton.textContent =
      "تابعي الاختبار ←";

  }

}


document
  .getElementById("nextButton")
  .onclick =
  function () {

    currentQuestion++;

    if (
      currentQuestion <
      questions.length
    ) {

      showQuestion();

    } else {

      showResult();

    }

  };
    async function saveResult(){

  const saveStatus =
    document.getElementById(
      "saveStatus"
    );


  if(!currentUser){

    saveStatus.className =
      "save-status waiting";

    saveStatus.textContent =
      "ℹ️ لم تُحفظ النتيجة؛ يلزم تسجيل الدخول لإضافتها إلى سجلّكِ.";

    return;
  }


  saveStatus.className =
    "save-status waiting";

  saveStatus.textContent =
    "جارٍ حفظ نتيجتكِ في سجلّكِ...";


  try{

    const studentRef =
      doc(
        db,
        "students",
        currentUser.uid
      );


    const studentSnap =
      await getDoc(
        studentRef
      );


    if(!studentSnap.exists()){

      throw new Error(
        "student-document-not-found"
      );

    }


    const data =
      studentSnap.data();


    const oldTest =
      data?.["اختبارات_الفصل_الأول"]?.["أسلوب_الشرط"] || {};


    const oldAttempts =
      Number(
        oldTest["عدد_المحاولات"] || 0
      );


    const oldBest =
      Number(
        oldTest["أعلى_درجة"] || 0
      );


    const percentage =
      Math.round(
        (score / questions.length) *
        100
      );


    const bestScore =
      Math.max(
        oldBest,
        score
      );


    await updateDoc(
      studentRef,
      {

        "اختبارات_الفصل_الأول.أسلوب_الشرط.اسم_الاختبار":
          "اختبار أسلوب الشرط",

        "اختبارات_الفصل_الأول.أسلوب_الشرط.الدرجة":
          score,

        "اختبارات_الفصل_الأول.أسلوب_الشرط.الدرجة_من":
          questions.length,

        "اختبارات_الفصل_الأول.أسلوب_الشرط.النسبة":
          percentage,

        "اختبارات_الفصل_الأول.أسلوب_الشرط.عدد_المحاولات":
          oldAttempts + 1,

        "اختبارات_الفصل_الأول.أسلوب_الشرط.أعلى_درجة":
          bestScore,

        "اختبارات_الفصل_الأول.أسلوب_الشرط.آخر_محاولة":
          serverTimestamp()

      }
    );


    saveStatus.className =
      "save-status saved";

    saveStatus.textContent =
      "✅ حُفظت نتيجتكِ في سجل الفصل الدراسي الأول.";


  }catch(error){

    console.error(error);

    saveStatus.className =
      "save-status error";

    saveStatus.textContent =
      "تعذّر حفظ النتيجة، ولكن نتيجتكِ في الاختبار لم تتأثر.";

  }

}


function showResult() {

  document
    .getElementById("quizCard")
    .style.display =
    "none";


  document
    .querySelector(".top-info")
    .style.display =
    "none";


  document
    .querySelector(".progress")
    .style.display =
    "none";


  const resultCard =
    document.getElementById(
      "resultCard"
    );


  resultCard.classList.add(
    "show"
  );


  document
    .getElementById("finalScore")
    .textContent =
    arabicDigits(score) +
    " / " +
    arabicDigits(
      questions.length
    );


  const percentage =
    score /
    questions.length;


  const resultIcon =
    document.getElementById(
      "resultIcon"
    );


  const resultMessage =
    document.getElementById(
      "resultMessage"
    );


  if (
    score ===
    questions.length
  ) {

    resultIcon.textContent =
      "👑";

    resultMessage.textContent =
      "أحسنتِ! أتقنتِ أسلوب الشرط إتقانًا كاملًا 🏆";

    celebrate(100);

    playVictorySound();


  } else if (
    percentage >= 0.8
  ) {

    resultIcon.textContent =
      "🏆";

    resultMessage.textContent =
      "ممتاز جدًا 🌟 أتقنتِ أركان أسلوب الشرط وأدواته وعلامات الجزم.";

    celebrate(75);

    playVictorySound();


  } else if (
    percentage >= 0.6
  ) {

    resultIcon.textContent =
      "🌷";

    resultMessage.textContent =
      "أداء جيد 👏 راجعي أداة الشرط، وفعل الشرط، وجواب الشرط، وعلامات الجزم، ثم أعيدي الاختبار.";

    celebrate(45);


  } else {

    resultIcon.textContent =
      "📘";

    resultMessage.textContent =
      "راجعي ملف درس أسلوب الشرط، ثم أعيدي الاختبار بثقة.";

  }


  saveResult();

}


window.restartQuiz =
function () {

  currentQuestion = 0;
  score = 0;
  answered = false;


  document
    .getElementById("resultCard")
    .classList
    .remove("show");


  document
    .getElementById("quizCard")
    .style.display =
    "flex";


  document
    .querySelector(".top-info")
    .style.display =
    "flex";


  document
    .querySelector(".progress")
    .style.display =
    "block";


  document
    .getElementById("saveStatus")
    .textContent =
    "";


  showQuestion();

};


function celebrate(amount) {

  const colors = [
    "#776094",
    "#5b4677",
    "#c9a85c",
    "#ead69e",
    "#6f5288"
  ];


  for (
    let i = 0;
    i < amount;
    i++
  ) {

    const piece =
      document.createElement(
        "span"
      );


    piece.className =
      "confetti";


    piece.style.left =
      Math.random() *
      100 +
      "vw";


    piece.style.background =
      colors[
        Math.floor(
          Math.random() *
          colors.length
        )
      ];


    piece.style.animationDuration =
      (
        2.1 +
        Math.random() *
        2.3
      ) +
      "s";


    piece.style.animationDelay =
      (
        Math.random() *
        0.4
      ) +
      "s";


    document.body.appendChild(
      piece
    );


    setTimeout(
      () => piece.remove(),
      5000
    );

  }

}
    function playTone(
  frequency,
  duration
) {

  try {

    const AudioContextClass =
      window.AudioContext ||
      window.webkitAudioContext;


    if (
      !AudioContextClass
    ) {
      return;
    }


    const context =
      new AudioContextClass();


    const oscillator =
      context.createOscillator();


    const gain =
      context.createGain();


    oscillator.connect(
      gain
    );


    gain.connect(
      context.destination
    );


    oscillator.type =
      "sine";


    oscillator.frequency.value =
      frequency;


    gain.gain.setValueAtTime(
      0.07,
      context.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
      0.001,
      context.currentTime +
      duration
    );


    oscillator.start();


    oscillator.stop(
      context.currentTime +
      duration
    );


  } catch (error) {}

}


function playCorrectSound() {

  playTone(
    620,
    0.12
  );


  setTimeout(
    () =>
      playTone(
        820,
        0.16

    130

}

  );

  );

      ),

  );

        0.26
      ),
    300
  );

}
