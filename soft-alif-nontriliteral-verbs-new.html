<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>الألف اللينة في الأفعال غير الثلاثية</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      min-height:100vh;
      padding:20px;
      font-family:Tahoma,Arial,sans-serif;
      color:#3e324b;

      background:
        linear-gradient(
          135deg,
          #fdf9f4,
          #f7f0fb
        );
    }

    .container{
      width:min(850px,100%);
      margin:auto;
    }

    .header{
      margin-bottom:25px;
      padding:32px 20px;
      border:2px solid #c8a85a;
      border-radius:22px;
      text-align:center;

      background:
        linear-gradient(
          135deg,
          #cbb4e3,
          #b69ad6
        );
    }

    .header h1{
      margin-bottom:12px;
      color:#5d4374;
      font-size:31px;
      line-height:1.6;
    }

    .header p{
      color:#fffdf8;
      font-size:19px;
      line-height:1.8;
    }

    .cards{
      display:grid;
      gap:18px;
    }

    .card{
      display:block;
      padding:28px 20px;
      border:2px solid #c8a85a;
      border-radius:20px;
      color:#3e324b;
      text-align:center;
      text-decoration:none;

      background:
        linear-gradient(
          135deg,
          #fffdf8,
          #f8eef6
        );

      box-shadow:
        0 8px 22px rgba(93,67,116,.10);

      transition:.2s;
    }

    .card:active{
      transform:scale(.98);
      background:#f1e7f8;
    }

    .icon{
      display:block;
      margin-bottom:12px;
      font-size:45px;
    }

    .title{
      margin-bottom:8px;
      color:#5d4374;
      font-size:25px;
      font-weight:bold;
    }

    .desc{
      font-size:17px;
      line-height:1.8;
    }

    .back{
      display:block;
      width:fit-content;
      margin:25px auto 0;
      padding:12px 20px;
      border-radius:22px;
      color:white;
      font-weight:bold;
      text-decoration:none;
      background:#6e5188;
    }

    @media(max-width:600px){
      .header h1{
        font-size:27px;
      }

      .title{
        font-size:23px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <header class="header">

      <h1>
        ✏️ الألف اللينة في الأفعال غير الثلاثية
      </h1>

      <p>
        اختاري ما تريدين دراسته
      </p>

    </header>

    <section class="cards">

      <a class="card" href="#">
        <span class="icon">🎥</span>

        <div class="title">
          شرح فيديو
        </div>

        <div class="desc">
          شاهدي شرح الدرس بطريقة مبسطة.
        </div>
      </a>

      <a
        class="card"
        href="soft-alif-nontriliteral-verbs-file.html"
      >
        <span class="icon">📄</span>

        <div class="title">
          ملف الدرس
        </div>

        <div class="desc">
          اطلعي على شرح الدرس وأمثلته.
        </div>
      </a>

      <a
        class="card"
        href="soft-alif-nontriliteral-verbs-rule.html"
      >
        <span class="icon">✍️</span>

        <div class="title">
          تذكّري القاعدة الإملائية
        </div>

        <div class="desc">
          كتابة بلا أخطاء
        </div>
      </a>

      <a
        class="card"
        href="soft-alif-nontriliteral-verbs-test.html"
      >
        <span class="icon">✅</span>

        <div class="title">
          الاختبار التجريبي
        </div>

        <div class="desc">
          اختبري فهمك للقاعدة الإملائية.
        </div>
      </a>

    </section>

    <a class="back" href="spelling.html">
      العودة إلى الرسم الإملائي
    </a>

  </main>

</body>

</html>
