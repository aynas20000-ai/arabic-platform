<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>اختبار درس الاستثناء</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      max-width: 100%;
      margin: 0;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      font-family: Tahoma, Arial, sans-serif;
      color: #4b3a57;
      text-align: center;
      background: linear-gradient(180deg, #fffaf2, #f8f0fb);
    }

    header {
      padding: 38px 20px;
      color: white;
      background: linear-gradient(135deg, #776094, #5b4677);
      border-bottom: 4px solid #c9a85c;
    }

    header h1 {
      margin: 0;
      color: #fffdf8;
      font-size: 32px;
      line-height: 1.6;
    }

    main {
      width: 90%;
      max-width: 800px;
      margin: 25px auto;
    }

    .quiz-info,
    .quiz-card,
    .result-card {
      padding: 22px;
      background: #fffdf8;
      border: 2px solid #c9a85c;
      border-radius: 22px;
      box-shadow: 0 7px 18px rgba(91, 63, 111, 0.12);
    }

    .quiz-info {
      margin-bottom: 18px;
    }

    .quiz-stats {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
      color: #5d4374;
      font-weight: bold;
    }

    .progress-track {
      height: 14px;
      overflow: hidden;
      background: #eadff0;
      border-radius: 20px;
    }

    .progress-fill {
      width: 0;
      height: 100%;
      background: linear-gradient(90deg, #776094, #c9a85c);
      transition: width 0.4s ease;
    }

    .question-number {
      margin-bottom: 10px;
      color: #8b6b25;
      font-weight: bold;
    }

    .question-text {
      margin-bottom: 20px;
      color: #5d4374;
      font-size: 23px;
      font-weight: bold;
      line-height: 1.8;
    }

    .answers {
      display: grid;
      gap: 13px;
    }

    .answer-btn {
      width: 100%;
      padding: 15px;
      color: #4b3a57;
      font-family: Tahoma, Arial, sans-serif;
      font-size: 18px;
      line-height: 1.7;
      text-align: right;
      cursor: pointer;
      background: linear-gradient(135deg, #f5ecfb, #fffaf2);
      border: 2px solid #c9a85c;
      border-radius: 16px;
      transition:
        transform 0.2s ease,
        background 0.2s ease;
    }

    .answer-btn:hover,
    .answer-btn:active {
      background: #f1e5f8;
      transform: translateY(-2px);
    }

    .answer-btn:disabled {
      cursor: default;
    }

    .answer-btn.correct {
      color: #25663c;
      background: #e5f6e9;
      border-color: #4d9b64;
    }

    .answer-btn.wrong {
      color: #9c3547;
      background: #fde8ec;
      border-color: #c95c70;
    }

    .feedback {
      min-height: 55px;
      margin-top: 18px;
      padding: 13px;
      font-size: 18px;
      font-weight: bold;
      line-height: 1.7;
      text-align: center;
      border-radius: 16px;
    }

    .feedback.good {
      color: #25663c;
      background: #e5f6e9;
      border: 1px solid #4d9b64;
    }

    .feedback.bad {
      color: #9c3547;
      background: #fde8ec;
      border: 1px solid #c95c70;
    }

    .next-btn,
    .restart-btn,
    .return-btn {
      display: block;
      width: 100%;
      margin-top: 15px;
      padding: 15px;
      color: white;
      font-family: Tahoma, Arial, sans-serif;
      font-size: 19px;
      font-weight: bold;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      background: #6f5288;
      border: 2px solid #c9a85c;
      border-radius: 16px;
    }

    .next-btn {
      display: none;
    }

    .next-btn:hover,
    .next-btn:active,
    .restart-btn:hover,
    .restart-btn:active,
    .return-btn:hover,
    .return-btn:active {
      background: #5b4677;
    }

    .result-card {
      display: none;
      text-align: center;
    }

    .result-icon {
      font-size: 70px;
    }

    .result-title {
      margin: 10px 0;
      color: #5d4374;
      font-size: 30px;
    }

    .final-score {
      margin: 18px 0;
      color: #8b6b25;
      font-size: 24px;
      font-weight: bold;
    }

    .result-card p {
      color: #4b3a57;
      font-size: 18px;
      line-height: 1.8;
    }

    footer {
      margin-top: 30px;
      padding: 20px;
      color: #fffdf8;
      background: #49385c;
      border-top: 3px solid #c9a85c;
    }

    .shake {
      animation: shake 0.35s;
    }

    @keyframes shake {
      0% {
        transform: translateX(0);
      }

      25% {
        transform: translateX(8px);
      }

      50% {
        transform: translateX(-8px);
      }

      75% {
        transform: translateX(6px);
      }

      100% {
        transform: translateX(0);
      }
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 27px;
      }

      main {
        width: 94%;
      }

      .quiz-info,
      .quiz-card,
      .result-card {
        padding: 18px 14px;
      }

      .quiz-stats {
        font-size: 14px;
      }

      .question-text {
        font-size: 19px;
      }

      .answer-btn {
        padding: 14px 12px;
        font-size: 16px;
      }

      .feedback {
        font-size: 16px;
      }

      .next-btn,
      .restart-btn,
      .return-btn {
        font-size: 17px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>✅ اختبار تجريبي لدرس الاستثناء</h1>
  </header>

  <main>

    <div id="quizArea">

      <div class="quiz-info">

        <div class="quiz-stats">
          <span id="progressText">السؤال 1 من 15</span>
          <span id="scoreText">الدرجة: 0</span>
        </div>

        <div class="progress-track">
          <div class="progress-fill" id="progressFill"></div>
        </div>

      </div>

      <div class="quiz-card" id="quizCard">

        <div class="question-number" id="questionNumber"></div>

        <div class="question-text" id="questionText"></div>

        <div class="answers" id="answers"></div>

        <div class="feedback" id="feedback"></div>

        <button
          type="button"
          class="next-btn"
          id="nextBtn"
          onclick="nextQuestion()">
          السؤال التالي ←
        </button>

      </div>

    </div>

    <div class="result-card" id="resultCard">

      <div class="result-icon" id="resultIcon">🏆</div>

      <h2 class="result-title" id="resultTitle">
        أحسنتِ
      </h2>

      <div class="final-score" id="finalScore"></div>

      <p id="resultMessage"></p>

      <button
        type="button"
        class="restart-btn"
        onclick="restartQuiz()">
        🔄 إعادة الاختبار
      </button>

      <a class="return-btn" href="mustathna.html">
        العودة إلى درس المستثنى
      </a>

    </div>

  </main>

  <footer>
    جميع الحقوق محفوظة © 2026
  </footer>

  <script>
    const questions = [
      {
        question: "ما تعريف أسلوب الاستثناء؟",
        answers: [
          "إخراج اسم من حكم ما قبله بواسطة أداة استثناء",
          "وصف اسم بصفة",
          "تأكيد معنى الجملة",
          "ربط جملتين بحرف عطف"
        ],
        correct: 0
      },
      {
        question: "ما المستثنى منه في جملة: حضر الطلابُ إلا طالبًا؟",
        answers: [
          "حضر",
          "الطلابُ",
          "إلا",
          "طالبًا"
        ],
        correct: 1
      },
      {
        question: "ما المستثنى في جملة: حضر الطلابُ إلا طالبًا؟",
        answers: [
          "حضر",
          "الطلابُ",
          "إلا",
          "طالبًا"
        ],
        correct: 3
      },
      {
        question: "أي الكلمات الآتية أداة استثناء؟",
        answers: [
          "لكن",
          "إلا",
          "ثم",
          "لعل"
        ],
        correct: 1
      },
      {
        question: "ما نوع الاستثناء في: حضر الطلابُ إلا طالبًا؟",
        answers: [
          "تام مثبت",
          "تام منفي",
          "ناقص منفي",
          "أسلوب شرط"
        ],
        correct: 0
      },
      {
        question: "ما حكم المستثنى في الاستثناء التام المثبت؟",
        answers: [
          "يجب رفعه",
          "يجب جره",
          "يجب نصبه",
          "يجوز جزمه"
        ],
        correct: 2
      },
      {
        question: "ما نوع الاستثناء في: ما حضر الطلابُ إلا طالبٌ؟",
        answers: [
          "تام مثبت",
          "تام منفي",
          "ناقص منفي",
          "مفرغ مثبت"
        ],
        correct: 1
      },
      {
        question: "في الاستثناء التام المنفي يجوز في المستثنى:",
        answers: [
          "النصب فقط",
          "الرفع فقط",
          "النصب على الاستثناء أو الإتباع على البدلية",
          "الجر فقط"
        ],
        correct: 2
      },
      {
        question: "ما نوع الاستثناء في: ما حضر إلا طالبٌ؟",
        answers: [
          "تام مثبت",
          "تام منفي",
          "ناقص منفي مفرغ",
          "منقطع"
        ],
        correct: 2
      },
      {
        question: "ما إعراب كلمة طالبٌ في: ما حضر إلا طالبٌ؟",
        answers: [
          "مستثنى منصوب",
          "فاعل مرفوع",
          "مفعول به منصوب",
          "مضاف إليه مجرور"
        ],
        correct: 1
      },
      {
        question: "في جملة: حضر الطلابُ غيرَ طالبٍ، تعرب غيرَ:",
        answers: [
          "فاعلًا مرفوعًا",
          "مستثنى منصوبًا وهو مضاف",
          "مفعولًا به",
          "مضافًا إليه"
        ],
        correct: 1
      },
      {
        question: "في جملة: حضر الطلابُ غيرَ طالبٍ، تعرب طالبٍ:",
        answers: [
          "فاعلًا",
          "تمييزًا",
          "مضافًا إليه مجرورًا",
          "حالًا"
        ],
        correct: 2
      },
      {
        question: "أي الأدوات الآتية تعامل معاملة غير؟",
        answers: [
          "سوى",
          "إلا",
          "عدا",
          "حاشا"
        ],
        correct: 0
      },
      {
        question: "في جملة: حضر الطلابُ ما عدا طالبًا، تعرب طالبًا:",
        answers: [
          "فاعلًا مرفوعًا",
          "مفعولًا به منصوبًا",
          "مضافًا إليه",
          "بدلًا مرفوعًا"
        ],
        correct: 1
      },
      {
        question: "أي جملة تمثل استثناءً ناقصًا منفيًا؟",
        answers: [
          "نجح الطلابُ إلا طالبًا",
          "ما نجح الطلابُ إلا طالبٌ",
          "ما نجح إلا طالبٌ",
          "نجح غيرُ طالبٍ"
        ],
        correct: 2
      }
    ];

    const goodMessages = [
      "صوت النجاح لكِ! إجابة رائعة 🎵🌟",
      "أبدعتِ، خطوة أقرب إلى الإتقان 🏆",
      "إجابة صحيحة يا خبيرة الاستثناء 👏",
      "رائعة! حافظي على هذا التركيز 🚀",
      "ممتازة، تم فتح مستوى جديد 🔓",
      "يا سلام! إجابة دقيقة جدًا ✨"
    ];

    const badMessages = [
      "محاولة طيبة، راجعي نوع الاستثناء ثم واصلي 🌱",
      "لا بأس، الخطأ تدريب للعقل 💪",
      "قريبة جدًا، انتبهي لوجود النفي والمستثنى منه 🔍",
      "السؤال القادم فرصتك للتعويض 🌷",
      "استمري، البطلات لا يتوقفن عند خطأ واحد ⭐"
    ];

    let currentQuestion = 0;
    let score = 0;
    let answered = false;

    const questionText =
      document.getElementById("questionText");

    const answersBox =
      document.getElementById("answers");

    const feedback =
      document.getElementById("feedback");

    const nextBtn =
      document.getElementById("nextBtn");

    const quizCard =
      document.getElementById("quizCard");

    function loadQuestion() {
      answered = false;

      const item = questions[currentQuestion];

      document.getElementById("questionNumber").textContent =
        "السؤال رقم " + (currentQuestion + 1);

      document.getElementById("progressText").textContent =
        "السؤال " +
        (currentQuestion + 1) +
        " من " +
        questions.length;

      document.getElementById("scoreText").textContent =
        "الدرجة: " + score;

      document.getElementById("progressFill").style.width =
        ((currentQuestion / questions.length) * 100) + "%";

      questionText.textContent = item.question;

      answersBox.innerHTML = "";
      feedback.textContent = "";
      feedback.className = "feedback";
      nextBtn.style.display = "none";

      item.answers.forEach((answer, index) => {
        const button = document.createElement("button");

        button.type = "button";
        button.className = "answer-btn";
        button.textContent = answer;

        button.onclick = () =>
          selectAnswer(index, button);

        answersBox.appendChild(button);
      });
    }

    function selectAnswer(index, selectedButton) {
      if (answered) {
        return;
      }

      answered = true;

      const correctIndex =
        questions[currentQuestion].correct;

      const buttons =
        document.querySelectorAll(".answer-btn");

      buttons.forEach(button => {
        button.disabled = true;
      });

      if (index === correctIndex) {
        score++;

        selectedButton.classList.add("correct");

        feedback.textContent =
          goodMessages[
            Math.floor(
              Math.random() * goodMessages.length
            )
          ];

        feedback.className = "feedback good";

        playTone(true);
      } else {
        selectedButton.classList.add("wrong");
        buttons[correctIndex].classList.add("correct");

        feedback.textContent =
          badMessages[
            Math.floor(
              Math.random() * badMessages.length
            )
          ];

        feedback.className = "feedback bad";

        quizCard.classList.add("shake");

        setTimeout(() => {
          quizCard.classList.remove("shake");
        }, 400);

        if ("vibrate" in navigator) {
          navigator.vibrate([100, 60, 100]);
        }

        playTone(false);
      }

      document.getElementById("scoreText").textContent =
        "الدرجة: " + score;

      nextBtn.style.display = "block";

      if (currentQuestion === questions.length - 1) {
        nextBtn.textContent = "عرض النتيجة 🏆";
      } else {
        nextBtn.textContent = "السؤال التالي ←";
      }
    }

    function playTone(correct) {
      try {
        const audioContext =
          new (
            window.AudioContext ||
            window.webkitAudioContext
          )();

        const oscillator =
          audioContext.createOscillator();

        const gain =
          audioContext.createGain();

        oscillator.connect(gain);
        gain.connect(audioContext.destination);

        oscillator.type =
          correct ? "sine" : "triangle";

        if (correct) {
          oscillator.frequency.setValueAtTime(
            620,
            audioContext.currentTime
          );

          oscillator.frequency.setValueAtTime(
            820,
            audioContext.currentTime + 0.1
          );

          oscillator.frequency.setValueAtTime(
            1040,
            audioContext.currentTime + 0.2
          );
        } else {
          oscillator.frequency.setValueAtTime(
            260,
            audioContext.currentTime
          );

          oscillator.frequency.setValueAtTime(
            190,
            audioContext.currentTime + 0.15
          );
        }

        gain.gain.setValueAtTime(
          0.12,
          audioContext.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
          0.01,
          audioContext.currentTime + 0.35
        );

        oscillator.start();

        oscillator.stop(
          audioContext.currentTime + 0.35
        );
      } catch (error) {
        console.log(
          "الصوت غير مدعوم في هذا الجهاز"
        );
      }
    }

    function nextQuestion() {
      currentQuestion++;

      if (currentQuestion < questions.length) {
        loadQuestion();

        window.scrollTo({
          top: 0,
          behavior: "smooth"
        });
      } else {
        showResult();
      }
    }

    function showResult() {
      document.getElementById("quizArea").style.display =
        "none";

      document.getElementById("resultCard").style.display =
        "block";

      const percentage =
        Math.round(
          (score / questions.length) * 100
        );

      document.getElementById("finalScore").textContent =
        "درجتك: " +
        score +
        " من " +
        questions.length +
        " — " +
        percentage +
        "%";

      const icon =
        document.getElementById("resultIcon");

      const title =
        document.getElementById("resultTitle");

      const message =
        document.getElementById("resultMessage");

      if (percentage >= 90) {
        icon.textContent = "🏆";
        title.textContent = "خبيرة الاستثناء!";

        message.textContent =
          "إتقان مذهل، تستحقين وسام النجمة الذهبية.";
      } else if (percentage >= 70) {
        icon.textContent = "🌟";
        title.textContent = "أداء رائع!";

        message.textContent =
          "فهمك قوي، راجعي الأخطاء البسيطة فقط.";
      } else if (percentage >= 50) {
        icon.textContent = "🌱";
        title.textContent = "تقدم جميل";

        message.textContent =
          "راجعي أنواع الاستثناء وأحكامه ثم أعيدي المحاولة.";
      } else {
        icon.textContent = "💪";
        title.textContent = "المحاولة تصنع الإتقان";

        message.textContent =
          "اقرئي ملف الدرس وشاهدي الفيديو ثم عودي بثقة.";
      }

      if (
        "vibrate" in navigator &&
        percentage >= 70
      ) {
        navigator.vibrate([
          100,
          70,
          100,
          70,
          180
        ]);
      }

      playTone(percentage >= 70);

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }

    function restartQuiz() {
      currentQuestion = 0;
      score = 0;
      answered = false;

      document.getElementById("quizArea").style.display =
        "block";

      document.getElementById("resultCard").style.display =
        "none";

      loadQuestion();
    }

    loadQuestion();
  </script>

</body>

</html>
