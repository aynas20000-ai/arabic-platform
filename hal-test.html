<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>اختبار درس الحال</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      max-width: 100%;
      margin: 0;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      font-family: Tahoma, Arial, sans-serif;
      color: #4b3a57;
      line-height: 1.8;
      background: linear-gradient(180deg, #fffaf2, #f8f0fb);
    }

    header {
      padding: 34px 18px;
      color: white;
      text-align: center;
      background: linear-gradient(135deg, #776094, #5b4677);
      border-bottom: 4px solid #c9a85c;
    }

    header h1 {
      margin: 0 0 8px;
      color: #fffdf8;
      font-size: 31px;
    }

    header p {
      margin: 0;
      color: #f7effb;
      font-size: 16px;
    }

    .container {
      width: 92%;
      max-width: 760px;
      margin: 25px auto;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
      color: #5d4374;
      font-weight: bold;
    }

    .progress-wrap {
      width: 100%;
      height: 14px;
      margin-bottom: 22px;
      overflow: hidden;
      background: #eee3f2;
      border: 1px solid #c9a85c;
      border-radius: 20px;
    }

    .progress-bar {
      width: 0;
      height: 100%;
      background: linear-gradient(90deg, #c9a85c, #8668a0);
      border-radius: 20px;
      transition: width 0.35s ease;
    }

    .question-card,
    .result-card {
      padding: 24px;
      background: #fffdf8;
      border: 2px solid #c9a85c;
      border-radius: 20px;
      box-shadow: 0 7px 18px rgba(91, 63, 111, 0.12);
    }

    .question-card h2 {
      margin: 0 0 20px;
      color: #5d4374;
      font-size: 22px;
      line-height: 1.8;
    }

    .choices {
      display: grid;
      gap: 12px;
    }

    .choice {
      width: 100%;
      padding: 15px 16px;
      color: #4b3a57;
      font-family: Tahoma, Arial, sans-serif;
      font-size: 17px;
      text-align: right;
      cursor: pointer;
      background: linear-gradient(135deg, #f7effb, #fffaf2);
      border: 2px solid #d8c48a;
      border-radius: 14px;
      transition: 0.2s ease;
    }

    .choice:hover,
    .choice:active {
      transform: translateY(-2px);
      border-color: #8e72a4;
    }

    .choice.correct {
      color: #21683a;
      background: #eaf7ee;
      border-color: #54a66f;
    }

    .choice.wrong {
      color: #9c3344;
      background: #fff0f2;
      border-color: #cf6f7d;
    }

    .choice:disabled {
      cursor: default;
    }

    .feedback {
      min-height: 52px;
      margin-top: 18px;
      padding: 12px 14px;
      font-weight: bold;
      text-align: center;
      border-radius: 12px;
    }

    .feedback.correct-feedback {
      color: #21683a;
      background: #eef8f1;
    }

    .feedback.wrong-feedback {
      color: #9c3344;
      background: #fff0f2;
    }

    .next-btn,
    .restart-btn {
      display: none;
      width: 100%;
      margin-top: 15px;
      padding: 15px;
      color: white;
      font-family: Tahoma, Arial, sans-serif;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      background: #6f5288;
      border: 2px solid #c9a85c;
      border-radius: 14px;
    }

    .next-btn:hover,
    .restart-btn:hover {
      background: #5b4677;
    }

    .result-card {
      display: none;
      text-align: center;
    }

    .result-card h2 {
      color: #5d4374;
      font-size: 28px;
    }

    .score {
      margin: 18px 0;
      color: #8b6b25;
      font-size: 36px;
      font-weight: bold;
    }

    .message {
      font-size: 19px;
      line-height: 2;
    }

    .back {
      display: block;
      width: fit-content;
      margin: 25px auto;
      padding: 12px 22px;
      color: white;
      font-weight: bold;
      text-decoration: none;
      background: #6f5288;
      border: 2px solid #c9a85c;
      border-radius: 22px;
    }

    footer {
      margin-top: 30px;
      padding: 20px;
      color: #fffdf8;
      text-align: center;
      background: #49385c;
      border-top: 3px solid #c9a85c;
    }

    .confetti {
      position: fixed;
      top: -20px;
      z-index: 9999;
      pointer-events: none;
      animation: fall linear forwards;
    }

    @keyframes fall {
      to {
        transform: translateY(110vh) rotate(720deg);
        opacity: 0.9;
      }
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 26px;
      }

      .question-card,
      .result-card {
        padding: 19px 14px;
      }

      .question-card h2 {
        font-size: 19px;
      }

      .choice {
        font-size: 16px;
      }

      .score {
        font-size: 30px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>✅ اختبار درس الحال</h1>
    <p>اختاري الإجابة الأدق، وتابعي تقدمك حتى النهاية 🌟</p>
  </header>

  <main class="container">

    <div id="quizArea">

      <div class="progress-info">
        <span id="questionNumber"></span>
        <span id="liveScore">الدرجة: 0</span>
      </div>

      <div class="progress-wrap">
        <div class="progress-bar" id="progressBar"></div>
      </div>

      <div class="question-card">
        <h2 id="questionText"></h2>

        <div class="choices" id="choices"></div>

        <div class="feedback" id="feedback"></div>

        <button class="next-btn" id="nextBtn" type="button">
          السؤال التالي ←
        </button>
      </div>

    </div>

    <div class="result-card" id="resultCard">
      <h2>🎉 انتهى الاختبار</h2>

      <div class="score" id="finalScore"></div>

      <div class="message" id="resultMessage"></div>

      <button class="restart-btn" id="restartBtn" type="button">
        إعادة الاختبار
      </button>
    </div>

    <a class="back" href="hal.html">
      العودة إلى درس الحال
    </a>

  </main>

  <footer>
    جميع الحقوق محفوظة © 2026
  </footer>

  <script>
    const questions = [
      {
        question: "1- الحال هو:",
        choices: [
          "وصف يبيّن هيئة صاحبه وقت حدوث الفعل، ويأتي مفردًا أو جملة أو شبه جملة",
          "اسم معرفة مرفوع يصف اسمًا قبله",
          "فعل مضارع يدل على الحاضر"
        ],
        answer: 0,
        explanation: "الحال يبيّن هيئة صاحبه وقت حدوث الفعل."
      },
      {
        question: "2- صاحب الحال هو:",
        choices: [
          "الفعل الذي وقع في الجملة",
          "الحرف الذي يسبق الحال",
          "الاسم الذي تبيّن الحال هيئته"
        ],
        answer: 2,
        explanation: "صاحب الحال هو الاسم الذي توضّح الحال هيئته."
      },
      {
        question: "3- في الجملة «عاد الطالب مسرورًا»، الحال هي:",
        choices: [
          "مسرورًا",
          "الطالب",
          "عاد"
        ],
        answer: 0,
        explanation: "مسرورًا بيّنت هيئة الطالب عند عودته."
      },
      {
        question: "4- للتعرّف على الحال نسأل عن هيئة صاحبها بـ:",
        choices: [
          "متى؟",
          "كيف؟",
          "أين؟"
        ],
        answer: 1,
        explanation: "السؤال «كيف؟» يساعد على تحديد هيئة صاحب الحال."
      },
      {
        question: "5- نوع الحال في «عاد المسافر سعيدًا» هو:",
        choices: [
          "جملة اسمية",
          "جملة فعلية",
          "حال مفردة"
        ],
        answer: 2,
        explanation: "سعيدًا ليست جملة ولا شبه جملة؛ فهي حال مفردة."
      },
      {
        question: "6- نوع الحال في «عاد المسافر وهو سعيد» هو:",
        choices: [
          "جملة اسمية",
          "حال مفردة",
          "شبه جملة"
        ],
        answer: 0,
        explanation: "«هو سعيد» جملة اسمية في محل نصب حال."
      },
      {
        question: "7- نوع الحال في «دخل الطالب يبتسم» هو:",
        choices: [
          "جملة اسمية",
          "جملة فعلية",
          "حال مفردة"
        ],
        answer: 1,
        explanation: "«يبتسم» جملة فعلية في محل نصب حال."
      },
      {
        question: "8- نوع الحال في «رأيت الطائر على الغصن» هو:",
        choices: [
          "حال مفردة",
          "جملة فعلية",
          "شبه جملة"
        ],
        answer: 2,
        explanation: "«على الغصن» جار ومجرور، فهو شبه جملة في محل نصب حال."
      },
      {
        question: "9- الحال المفردة تكون غالبًا:",
        choices: [
          "نكرة منصوبة مشتقة",
          "معرفة مرفوعة",
          "فعلًا ماضيًا"
        ],
        answer: 0,
        explanation: "الأصل في الحال المفردة أن تكون نكرة منصوبة ومشتقة غالبًا."
      },
      {
        question: "10- صاحب الحال يكون غالبًا:",
        choices: [
          "نكرة",
          "معرفة",
          "حرفًا"
        ],
        answer: 1,
        explanation: "الأصل أن يكون صاحب الحال معرفة."
      },
      {
        question: "11- الرابط في جملة الحال قد يكون:",
        choices: [
          "حرف جر فقط",
          "أداة استفهام",
          "ضميرًا أو واو الحال أو كليهما"
        ],
        answer: 2,
        explanation: "يربط جملة الحال بصاحبها ضمير أو واو الحال أو كلاهما."
      },
      {
        question: "12- في «عاد المسافر وهو سعيد»، الرابط هو:",
        choices: [
          "واو الحال والضمير «هو»",
          "حرف الجر",
          "اسم الإشارة"
        ],
        answer: 0,
        explanation: "اجتمع في الجملة واو الحال والضمير العائد على صاحب الحال."
      },
      {
        question: "13- الجملة التي تحتوي حالًا هي:",
        choices: [
          "حضر الطالب المجتهد",
          "حضر الطالب مسرعًا",
          "قرأت الكتاب المفيد"
        ],
        answer: 1,
        explanation: "مسرعًا حال؛ لأنها تصف هيئة الطالب وقت الحضور."
      },
      {
        question: "14- أي العبارات الآتية صحيحة؟",
        choices: [
          "الحال معرفة دائمًا",
          "النعت لا يتبع ما قبله",
          "الحال يبيّن الهيئة، والنعت الحقيقي يصف ما قبله ويتبعه"
        ],
        answer: 2,
        explanation: "الحال يبيّن الهيئة، أما النعت الحقيقي فيصف منعوته ويتبعه."
      },
      {
        question: "15- إعراب «مسرورًا» في «عاد الطالب مسرورًا» هو:",
        choices: [
          "حال منصوبة وعلامة نصبها الفتحة",
          "فاعل مرفوع",
          "مفعول به منصوب"
        ],
        answer: 0,
        explanation: "مسرورًا حال منصوبة وعلامة نصبها الفتحة الظاهرة."
      }
    ];

    let currentQuestion = 0;
    let score = 0;
    let answered = false;

    const questionNumber = document.getElementById("questionNumber");
    const liveScore = document.getElementById("liveScore");
    const progressBar = document.getElementById("progressBar");
    const questionText = document.getElementById("questionText");
    const choicesBox = document.getElementById("choices");
    const feedback = document.getElementById("feedback");
    const nextBtn = document.getElementById("nextBtn");

    function playTone(correct = true) {
      try {
        const AudioContext =
          window.AudioContext || window.webkitAudioContext;

        const ctx = new AudioContext();
        const oscillator = ctx.createOscillator();
        const gain = ctx.createGain();

        oscillator.connect(gain);
        gain.connect(ctx.destination);

        oscillator.type = "sine";
        oscillator.frequency.value = correct ? 700 : 220;

        gain.gain.setValueAtTime(0.12, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(
          0.001,
          ctx.currentTime + 0.22
        );

        oscillator.start();
        oscillator.stop(ctx.currentTime + 0.22);
      } catch (e) {
        // يعمل الاختبار حتى لو لم يدعم الجهاز الصوت
      }
    }

    function renderQuestion() {
      answered = false;

      const q = questions[currentQuestion];

      questionNumber.textContent =
        "السؤال " +
        (currentQuestion + 1) +
        " من " +
        questions.length;

      liveScore.textContent = "الدرجة: " + score;

      progressBar.style.width =
        ((currentQuestion) / questions.length) * 100 + "%";

      questionText.textContent = q.question;

      choicesBox.innerHTML = "";
      feedback.textContent = "";
      feedback.className = "feedback";

      nextBtn.style.display = "none";

      q.choices.forEach((choice, index) => {
        const button = document.createElement("button");

        button.type = "button";
        button.className = "choice";
        button.textContent = choice;

        button.addEventListener("click", () => {
          checkAnswer(index, button);
        });

        choicesBox.appendChild(button);
      });
    }

    function checkAnswer(selectedIndex, selectedButton) {
      if (answered) return;

      answered = true;

      const q = questions[currentQuestion];
      const buttons = document.querySelectorAll(".choice");

      buttons.forEach(button => {
        button.disabled = true;
      });

      if (selectedIndex === q.answer) {
        score++;

        selectedButton.classList.add("correct");

        feedback.textContent =
          "أحسنتِ 🌟 " + q.explanation;

        feedback.className =
          "feedback correct-feedback";

        playTone(true);
      } else {
        selectedButton.classList.add("wrong");
        buttons[q.answer].classList.add("correct");

        feedback.textContent =
          "ليست هذه الإجابة الأدق. الإجابة الصحيحة موضحة بالأخضر. " +
          q.explanation;

        feedback.className =
          "feedback wrong-feedback";

        playTone(false);

        if (navigator.vibrate) {
          navigator.vibrate(120);
        }
      }

      liveScore.textContent = "الدرجة: " + score;

      nextBtn.style.display = "block";

      if (currentQuestion === questions.length - 1) {
        nextBtn.textContent = "عرض النتيجة 🎉";
      } else {
        nextBtn.textContent = "السؤال التالي ←";
      }
    }

    nextBtn.addEventListener("click", () => {
      if (!answered) return;

      if (currentQuestion < questions.length - 1) {
        currentQuestion++;
        renderQuestion();

        window.scrollTo({
          top: 0,
          behavior: "smooth"
        });
      } else {
        showResult();
      }
    });

    function showResult() {
      document.getElementById("quizArea").style.display = "none";

      const resultCard =
        document.getElementById("resultCard");

      resultCard.style.display = "block";

      const percentage =
        Math.round((score / questions.length) * 100);

      document.getElementById("finalScore").textContent =
        score +
        " من " +
        questions.length +
        " — " +
        percentage +
        "%";

      let message = "";

      if (percentage === 100) {
        message =
          "مبهرة! أتقنتِ درس الحال كاملًا 🌟👏";
        launchConfetti();
      } else if (percentage >= 80) {
        message =
          "رائعة جدًا! فهمك للحال قوي، وبقيت لك لمسات بسيطة للوصول إلى الإتقان 🌷";
        launchConfetti();
      } else if (percentage >= 60) {
        message =
          "أداء جيد 🌸 راجعي الأسئلة التي أخطأتِ فيها ثم أعيدي المحاولة.";
      } else {
        message =
          "المحاولة بداية التعلّم 💜 عودي إلى ملف الدرس وخريطة المفاهيم ثم جربي مرة أخرى.";
      }

      document.getElementById("resultMessage").textContent =
        message;

      progressBar.style.width = "100%";

      document.getElementById("restartBtn").style.display =
        "block";

      resultCard.scrollIntoView({
        behavior: "smooth"
      });
    }

    document
      .getElementById("restartBtn")
      .addEventListener("click", () => {
        currentQuestion = 0;
        score = 0;

        document.getElementById("resultCard").style.display =
          "none";

        document.getElementById("quizArea").style.display =
          "block";

        renderQuestion();

        window.scrollTo({
          top: 0,
          behavior: "smooth"
        });
      });

    function launchConfetti() {
      const symbols = ["✨", "⭐", "🌟", "🎉", "💜", "💛"];

      for (let i = 0; i < 35; i++) {
        const piece = document.createElement("div");

        piece.className = "confetti";
        piece.textContent =
          symbols[Math.floor(Math.random() * symbols.length)];

        piece.style.left =
          Math.random() * 100 + "vw";

        piece.style.fontSize =
          16 + Math.random() * 18 + "px";

        piece.style.animationDuration =
          2.5 + Math.random() * 2 + "s";

        document.body.appendChild(piece);

        setTimeout(() => {
          piece.remove();
        }, 5000);
      }
    }

    renderQuestion();
  </script>

</body>

</html>
