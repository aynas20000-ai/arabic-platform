<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>تحدي الحال | منصة آفاق</title>

<style>
:root{
 --p:#5b4677;
 --p2:#776094;
 --pd:#453457;
 --g:#b69750;
 --g2:#d8c28a;
 --lav:#eee5f5;
 --paper:#fffdf9;
 --text:#403448;
}

*{
 box-sizing:border-box;
}

html,
body{
 height:100%;
 margin:0;
}

body{
 font-family:Tahoma,Arial,sans-serif;
 color:var(--text);
 background:linear-gradient(180deg,#f5f0fa,#fbf9fd,#f1ebf7);
 overflow:hidden;
}

.app{
 height:100dvh;
 display:grid;
 grid-template-rows:auto 1fr auto;
}

header{
 text-align:center;
 color:#fff;
 padding:10px 12px 8px;
 background:linear-gradient(145deg,var(--p2),var(--p),var(--pd));
 border-bottom:4px solid var(--g);
}

.tag{
 display:inline-block;
 padding:3px 10px;
 border-radius:999px;
 border:1px solid var(--g2);
 color:#fff2c6;
 background:rgba(182,151,80,.13);
 font-size:11px;
 font-weight:bold;
}

header h1{
 margin:4px 0 0;
 font-size:clamp(19px,4.8vw,28px);
}

header p{
 margin:0;
 color:#f2ebf6;
 font-size:11px;
}

main{
 min-height:0;
 width:min(760px,94%);
 margin:0 auto;
 padding:7px 0;
 display:flex;
 flex-direction:column;
}

.top{
 display:flex;
 justify-content:space-between;
 gap:8px;
 font-weight:bold;
 color:var(--p);
 font-size:13px;
 margin-bottom:5px;
}

.progress{
 height:8px;
 background:#e9e0ef;
 border-radius:999px;
 overflow:hidden;
 margin-bottom:7px;
}

.progress>div{
 height:100%;
 width:0;
 background:linear-gradient(90deg,var(--g),#dfca8f);
 transition:.3s;
}

.card,
.result{
 flex:1;
 min-height:0;
 background:var(--paper);
 border:1px solid var(--g2);
 border-radius:22px;
 box-shadow:0 14px 30px rgba(73,54,92,.12);
 padding:12px;
 display:flex;
 flex-direction:column;
 justify-content:center;
}

.qnum{
 color:var(--g);
 font-weight:bold;
 font-size:12px;
 margin-bottom:2px;
}

h2{
 font-size:clamp(16px,4.3vw,21px);
 margin:2px 0 8px;
 color:var(--pd);
 line-height:1.5;
}

.options{
 display:grid;
 gap:6px;
}

.opt{
 width:100%;
 padding:8px 10px;
 border-radius:13px;
 border:2px solid #e4dbe9;
 background:#fff;
 color:var(--text);
 font:inherit;
 font-size:clamp(13px,3.4vw,16px);
 text-align:right;
 cursor:pointer;
 line-height:1.35;
}

.opt.correct{
 background:#f0ecf6;
 border-color:var(--p2);
 color:var(--pd);
}

.opt.wrong{
 background:#fff8ec;
 border-color:var(--g2);
 color:#66522e;
}

.opt:disabled{
 cursor:default;
}

.feedback{
 display:none;
 margin-top:7px;
 padding:8px 10px;
 border-radius:13px;
 font-size:clamp(12px,3.2vw,14px);
 line-height:1.45;
}

.feedback.show{
 display:block;
}

.feedback.good{
 background:#f3edf8;
 border:1px solid #c9b8d4;
 color:var(--pd);
}

.feedback.bad{
 background:#fff9ec;
 border:1px solid var(--g2);
 color:#66522e;
}

.next{
 display:none;
 width:100%;
 margin-top:7px;
 padding:8px;
 border:0;
 border-radius:13px;
 background:linear-gradient(145deg,var(--p2),var(--p));
 color:#fff;
 font:inherit;
 font-weight:bold;
 cursor:pointer;
 font-size:14px;
}

.result{
 display:none;
 text-align:center;
}

.result.show{
 display:flex;
}

.score{
 font-size:40px;
 color:var(--g);
 font-weight:bold;
}

.restart,
.lesson{
 display:block;
 text-decoration:none;
 width:100%;
 padding:10px;
 margin-top:8px;
 border-radius:13px;
 font-weight:bold;
}

.restart{
 border:0;
 background:linear-gradient(145deg,var(--p2),var(--p));
 color:#fff;
 font:inherit;
 cursor:pointer;
}

.lesson{
 background:var(--lav);
 color:var(--pd);
 border:1px solid #d6c7df;
}

footer{
 text-align:center;
 padding:5px;
 color:#73697a;
 font-size:9px;
}

.burst{
 position:fixed;
 inset:0;
 pointer-events:none;
 overflow:hidden;
 z-index:20;
}

.confetti{
 position:absolute;
 width:8px;
 height:8px;
 border-radius:2px;
 animation:fall 900ms ease-out forwards;
}

@keyframes fall{
 0%{
  transform:translateY(-20px) rotate(0);
  opacity:1;
 }

 100%{
  transform:translateY(105vh) rotate(540deg);
  opacity:0;
 }
}

.pop{
 animation:pop .25s ease;
}

@keyframes pop{
 50%{
  transform:scale(1.018);
 }
}

@media(max-height:650px){

 header{
  padding:5px 10px 4px;
 }

 header h1{
  font-size:17px;
 }

 header p{
  font-size:9px;
 }

 main{
  padding:3px 0;
 }

 .top{
  font-size:11px;
  margin-bottom:3px;
 }

 .progress{
  height:6px;
  margin-bottom:4px;
 }

 .card{
  padding:7px;
 }

 h2{
  font-size:15px;
  margin-bottom:5px;
 }

 .options{
  gap:4px;
 }

 .opt{
  padding:5px 7px;
  font-size:12px;
 }

 .feedback{
  padding:5px 7px;
  margin-top:4px;
  font-size:11px;
 }

 .next{
  padding:6px;
  margin-top:4px;
 }

}
</style>
</head>

<body>

<div class="app">

<header>

 <span class="tag">
  الوظيفة النحوية
 </span>

 <h1>
  🎯 تحدي الحال
 </h1>

 <p>
  ١٠ أسئلة • سؤال واحد في كل شاشة • تعقيب فوري ✨
 </p>

</header>

<main>

 <div class="top">

  <span id="counter">
   السؤال ١ من ١٠
  </span>

  <span id="correctCount">
   الصحيح: ٠
  </span>

 </div>

 <div class="progress">
  <div id="bar"></div>
 </div>

 <section class="card" id="card">

  <div class="qnum" id="qnum"></div>

  <h2 id="question"></h2>

  <div class="options" id="options"></div>

  <div class="feedback" id="feedback"></div>

  <button class="next" id="next">
   السؤال التالي
  </button>

 </section>

 <section class="result" id="result">

  <h2>
   🎉 انتهى تحدي الحال
  </h2>

  <div class="score" id="score"></div>

  <p id="message"></p>

  <button class="restart" onclick="restartQuiz()">
   🔄 أعيدي التحدي
  </button>

  <a class="lesson" href="hal-file.html">
   📘 راجعي ملف الدرس
  </a>

  <a class="lesson" href="hal-language-window.html">
   🔬 النافذة اللغوية
  </a>

  <a class="lesson" href="hal.html">
   ↩ العودة إلى درس الحال
  </a>

 </section>

</main>

<footer>
 منصة آفاق اللغة | لغتي الخالدة | الصف الثالث المتوسط
</footer>

</div>

<div class="burst" id="burst"></div>

<script>

const questions = [

{
 q:"١- في الجملة «عاد المسافرُ متعبًا بعد رحلة طويلة»، ما الوظيفة النحوية لكلمة «متعبًا»؟",

 o:[
  "نعت منصوب للمسافر",
  "حال منصوب يبيّن هيئة المسافر وقت العودة",
  "مفعول به منصوب",
  "تمييز منصوب"
 ],

 a:1,

 ok:
 "أحسنتِ 🌟 «متعبًا» تبيّن هيئة المسافر وقت عودته؛ لذلك فهي حال منصوبة.",

 bad:
 "اسألي: كيف عاد المسافر؟ الإجابة: متعبًا، إذن هي حال."
},

{
 q:"٢- أي الجمل الآتية اشتملت على حال مفردة؟",

 o:[
  "عاد الطالب وهو مسرور",
  "دخل الطالب يبتسم",
  "عاد الطالب مسرورًا",
  "وقف الطالب عند الباب"
 ],

 a:2,

 ok:
 "ممتازة ✨ «مسرورًا» كلمة واحدة تبيّن هيئة الطالب؛ فهي حال مفردة.",

 bad:
 "الحال المفردة تكون كلمة واحدة، وليست جملة ولا شبه جملة."
},

{
 q:"٣- في الجملة «دخل الطالبُ وهو مبتسمٌ»، ما نوع الحال؟",

 o:[
  "حال مفردة",
  "جملة اسمية",
  "جملة فعلية",
  "شبه جملة"
 ],

 a:1,

 ok:
 "رائعة 👏 «وهو مبتسم» جملة اسمية في محل نصب حال.",

 bad:
 "الجملة تبدأ بالضمير «هو»، فهي جملة اسمية، وقد جاءت لتبين هيئة الطالب."
},

{
 q:"٤- في الجملة «خرج الطفلُ يركض»، ما نوع الحال؟",

 o:[
  "جملة فعلية",
  "جملة اسمية",
  "حال مفردة",
  "نعت"
 ],

 a:0,

 ok:
 "صحيح جدًا 💜 «يركض» جملة فعلية تبيّن هيئة الطفل وقت الخروج.",

 bad:
 "وجود الفعل المضارع «يركض» يدل على أن الحال جاءت جملة فعلية."
},

{
 q:"٥- أي الجمل الآتية تحتوي كلمة منصوبة ليست حالًا؟",

 o:[
  "عاد المسافرُ مسرورًا",
  "شاهدتُ الطائرَ محلّقًا",
  "ازداد الطالبُ علمًا",
  "دخل الطفلُ ضاحكًا"
 ],

 a:2,

 ok:
 "أحسنتِ 🎯 «علمًا» تمييز؛ لأنه يوضح جهة الزيادة، وليس هيئة الطالب.",

 bad:
 "فرّقي بين بيان الهيئة وإزالة الإبهام: «علمًا» يوضح جهة الزيادة، فهو تمييز."
},

{
 q:"٦- ما الفرق الأدق بين الحال والنعت؟",

 o:[
  "كلاهما يبيّن هيئة مؤقتة",
  "الحال يبيّن الهيئة وقت الفعل، والنعت يصف الاسم ويتبعه",
  "الحال معرفة دائمًا والنعت نكرة دائمًا",
  "النعت منصوب دائمًا والحال مرفوع دائمًا"
 ],

 a:1,

 ok:
 "ممتازة 🌟 الحال يبيّن هيئة صاحبه وقت الفعل، أما النعت فيصف الاسم ويتبعه.",

 bad:
 "الحال مرتبط بالهيئة وقت وقوع الفعل، أما النعت فيصف الاسم ويتبعه في الإعراب."
},

{
 q:"٧- في الجملة «عاد المسافرُ وهو سعيدٌ»، ما الرابط في جملة الحال؟",

 o:[
  "واو العطف فقط",
  "الضمير فقط",
  "واو الحال والضمير «هو»",
  "حرف الجر"
 ],

 a:2,

 ok:
 "إجابة دقيقة 👏 الرابط هو واو الحال والضمير «هو» العائد على المسافر.",

 bad:
 "اجتمع في الجملة رابطان: واو الحال والضمير «هو»."
},

{
 q:"٨- أي الجمل الآتية اشتملت على حال جامدة مؤولة بمشتق؟",

 o:[
  "عاد الطالبُ فرحًا",
  "انطلق العداءُ سهمًا",
  "حضر الطالبُ المجتهدُ",
  "ازداد الطالبُ علمًا"
 ],

 a:1,

 ok:
 "بطلة ✨ «سهمًا» اسم جامد جاء حالًا بمعنى «مسرعًا كالسهم».",

 bad:
 "ابحثي عن اسم جامد استُعمل لتشبيه هيئة صاحبه؛ وهو «سهمًا»."
},

{
 q:"٩- في قوله تعالى ﴿فَخَرَجَ مِنْهَا خَائِفًا يَتَرَقَّبُ﴾، أي العبارات أدق؟",

 o:[
  "«خائفًا» نعت و«يترقب» خبر",
  "«خائفًا» حال مفردة، و«يترقب» جملة فعلية في محل نصب حال",
  "«خائفًا» مفعول به و«يترقب» حال",
  "«خائفًا» تمييز و«يترقب» نعت"
 ],

 a:1,

 ok:
 "رائعة جدًا 🌟 «خائفًا» حال مفردة، و«يترقب» جملة فعلية في محل نصب حال.",

 bad:
 "في الآية حالان: «خائفًا» حال مفردة، و«يترقب» جملة فعلية في محل نصب حال."
},

{
 q:"١٠- في الجملة «رأيتُ الطائرَ محلّقًا»، من صاحب الحال؟",

 o:[
  "التاء في رأيت",
  "محلّقًا",
  "الطائر",
  "الفعل رأى"
 ],

 a:2,

 ok:
 "إتقان رائع 🏆 «محلّقًا» تبيّن هيئة الطائر وقت الرؤية؛ لذلك الطائر هو صاحب الحال.",

 bad:
 "صاحب الحال هو الاسم الذي تبيّن الحال هيئته، وهنا هو «الطائر»."
}

];

let index = 0;
let score = 0;
let answered = false;

const arabicDigits = n =>
 String(n).replace(
  /\d/g,
  d => '٠١٢٣٤٥٦٧٨٩'[d]
 );

function tone(ok){

 try{

  const AC =
   window.AudioContext ||
   window.webkitAudioContext;

  const c =
   new AC();

  const o =
   c.createOscillator();

  const g =
   c.createGain();

  o.connect(g);
  g.connect(c.destination);

  o.type =
   ok ? 'sine' : 'triangle';

  o.frequency.setValueAtTime(
   ok ? 660 : 220,
   c.currentTime
  );

  if(ok){

   o.frequency.exponentialRampToValueAtTime(
    920,
    c.currentTime + .16
   );

  }else{

   o.frequency.exponentialRampToValueAtTime(
    170,
    c.currentTime + .16
   );

  }

  g.gain.setValueAtTime(
   .07,
   c.currentTime
  );

  g.gain.exponentialRampToValueAtTime(
   .001,
   c.currentTime + .23
  );

  o.start();

  o.stop(
   c.currentTime + .24
  );

 }catch(e){}

}

function confetti(){

 const burst =
  document.getElementById('burst');

 burst.innerHTML = '';

 const colors = [
  '#5b4677',
  '#776094',
  '#b69750',
  '#d8c28a',
  '#eee5f5'
 ];

 for(let i=0;i<26;i++){

  const s =
   document.createElement('i');

  s.className =
   'confetti';

  s.style.left =
   (Math.random()*100) + 'vw';

  s.style.top =
   '-10px';

  s.style.background =
   colors[i % colors.length];

  s.style.animationDelay =
   (Math.random()*170) + 'ms';

  burst.appendChild(s);

 }

 setTimeout(
  () => burst.innerHTML = '',
  1200
 );

}

function render(){

 answered = false;

 const x =
  questions[index];

 document
  .getElementById('qnum')
  .textContent =
  'السؤال ' +
  arabicDigits(index+1);

 document
  .getElementById('counter')
  .textContent =
  'السؤال ' +
  arabicDigits(index+1) +
  ' من ' +
  arabicDigits(questions.length);

 document
  .getElementById('correctCount')
  .textContent =
  'الصحيح: ' +
  arabicDigits(score);

 document
  .getElementById('bar')
  .style.width =
  ((index + 1) /
  questions.length *
  100) + '%';

 document
  .getElementById('question')
  .textContent =
  x.q;

 const options =
  document.getElementById('options');

 const feedback =
  document.getElementById('feedback');

 const next =
  document.getElementById('next');

 const card =
  document.getElementById('card');

 options.innerHTML = '';

 feedback.className =
  'feedback';

 feedback.innerHTML =
  '';

 next.style.display =
  'none';

 card.classList.remove(
  'pop'
 );

 x.o.forEach((t,j)=>{

  const b =
   document.createElement('button');

  b.className =
   'opt';

  b.textContent =
   t;

  b.onclick =
   () => choose(j,b);

  options.appendChild(b);

 });

}

function choose(choice,button){

 if(answered) return;

 answered = true;

 const x =
  questions[index];

 const btns =
  [...document.querySelectorAll('.opt')];

 btns.forEach(
  b => b.disabled = true
 );

 btns[x.a]
  .classList
  .add('correct');

 const feedback =
  document.getElementById('feedback');

 if(choice === x.a){

  score++;

  button
   .classList
   .add('correct');

  feedback.className =
   'feedback show good';

  feedback.textContent =
   x.ok;

  tone(true);

  confetti();

  if(navigator.vibrate){
   navigator.vibrate(45);
  }

 }else{

  button
   .classList
   .add('wrong');

  feedback.className =
   'feedback show bad';

  feedback.innerHTML =
   '<b>راجعي الفكرة 👀</b><br>' +
   x.bad;

  tone(false);

  if(navigator.vibrate){
   navigator.vibrate(
    [70,40,70]
   );
  }

 }

 document
  .getElementById('correctCount')
  .textContent =
  'الصحيح: ' +
  arabicDigits(score);

 document
  .getElementById('card')
  .classList
  .add('pop');

 const next =
  document.getElementById('next');

 next.textContent =
  index === questions.length-1
  ? 'شوفي نتيجتك ✨'
  : 'كمّلي التحدي ←';

 next.style.display =
  'block';

}

document
 .getElementById('next')
 .onclick = () => {

  index++;

  if(index < questions.length){

   render();

  }else{

   finish();

  }

 };

function finish(){

 document
  .getElementById('bar')
  .style.width =
  '100%';

 document
  .getElementById('card')
  .style.display =
  'none';

 document
  .querySelector('.top')
  .style.display =
  'none';

 document
  .querySelector('.progress')
  .style.display =
  'none';

 const result =
  document.getElementById('result');

 result.classList.add(
  'show'
 );

 document
  .getElementById('score')
  .textContent =
  arabicDigits(score) +
  ' / ' +
  arabicDigits(questions.length);

 const pct =
  score /
  questions.length;

 document
  .getElementById('message')
  .textContent =

  pct === 1
  ? 'إتقان كامل! بطلة الحال 🏆'

  : pct >= .8
  ? 'ممتازة جدًا 🌟 أتقنتِ أنواع الحال والتمييز بينها وبين التراكيب المشابهة.'

  : pct >= .6
  ? 'أداء جميل 👏 راجعي أنواع الحال والرابط وصاحب الحال ثم أعيدي التحدي.'

  : 'راجعي ملف درس الحال والنافذة اللغوية، ثم عودي للتحدي بثقة.';

 if(pct >= .8){
  confetti();
 }

}

function restartQuiz(){

 index = 0;
 score = 0;
 answered = false;

 document
  .getElementById('card')
  .style.display =
  'flex';

 document
  .querySelector('.top')
  .style.display =
  'flex';

 document
  .querySelector('.progress')
  .style.display =
  'block';

 document
  .getElementById('result')
  .classList
  .remove('show');

 render();

}

render();

</script>

</body>
</html>
