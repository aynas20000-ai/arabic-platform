<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    استطلاعات الرأي | منصة آفاق اللغة
  </title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      max-width: 100%;
      margin: 0;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      font-family: Tahoma, Arial, sans-serif;
      color: #4b3a57;
      text-align: center;
      background: linear-gradient(
        145deg,
        #fffaf2,
        #f8f0fb
      );
    }

    header {
      padding: 36px 16px 42px;
      color: white;
      border-radius: 0 0 34px 34px;
      background: linear-gradient(
        135deg,
        #776094,
        #5b4677
      );
      box-shadow: 0 12px 28px rgba(73, 56, 92, 0.22);
    }

    .header-icon {
      width: 82px;
      height: 82px;
      margin: 0 auto 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 24px;
      font-size: 44px;
      background: rgba(255, 255, 255, 0.15);
      border: 2px solid rgba(255, 255, 255, 0.42);
    }

    header h1 {
      margin: 0;
      color: #fff8df;
      font-size: 33px;
      line-height: 1.7;
    }

    header p {
      max-width: 680px;
      margin: 10px auto 0;
      color: #f7effb;
      font-size: 17px;
      line-height: 1.9;
    }

    main {
      width: 94%;
      max-width: 800px;
      margin: 28px auto 45px;
    }

    .card {
      padding: 25px;
      border-radius: 28px;
      background: #fffdf8;
      border: 1px solid rgba(93, 67, 116, 0.15);
      box-shadow: 0 13px 34px rgba(73, 56, 92, 0.13);
    }

    .intro {
      margin-bottom: 22px;
      padding: 17px;
      border-radius: 18px;
      color: #5d4374;
      background: #f5ecfb;
      border-right: 7px solid #c9a85c;
      font-size: 17px;
      line-height: 1.9;
    }

    .survey-list {
      display: grid;
      gap: 16px;
    }

    .survey-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      width: 100%;
      padding: 20px;
      color: #5d4374;
      text-decoration: none;
      border-radius: 19px;
      background: #fffdf8;
      border: 2px solid #dccbe8;
      box-shadow: 0 7px 18px rgba(73, 56, 92, 0.08);
      transition:
        transform 0.2s ease,
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }

    .survey-link:hover {
      transform: translateY(-3px);
      border-color: #c9a85c;
      box-shadow: 0 11px 24px rgba(73, 56, 92, 0.13);
    }

    .survey-content {
      display: flex;
      align-items: center;
      gap: 13px;
      text-align: right;
    }

    .survey-icon {
      width: 58px;
      height: 58px;
      flex: 0 0 58px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 17px;
      background: #f5ecfb;
      font-size: 30px;
    }

    .survey-title {
      font-size: 20px;
      font-weight: bold;
      line-height: 1.7;
    }

    .arrow {
      color: #c9a85c;
      font-size: 25px;
      font-weight: bold;
    }

    .back {
      display: block;
      width: 100%;
      margin-top: 23px;
      padding: 15px;
      border-radius: 17px;
      color: white;
      background: #6f5288;
      text-decoration: none;
      font-size: 17px;
      font-weight: bold;
      transition:
        opacity 0.2s,
        transform 0.2s;
    }

    .back:hover {
      opacity: 0.94;
    }

    .back:active {
      transform: scale(0.98);
    }

    footer {
      padding: 22px 12px;
      color: white;
      background: #49385c;
      line-height: 1.8;
    }

    @media (max-width: 600px) {
      header {
        padding: 29px 14px 36px;
      }

      header h1 {
        font-size: 27px;
      }

      header p {
        font-size: 15px;
      }

      main {
        width: 93%;
      }

      .card {
        padding: 18px;
      }

      .intro {
        font-size: 16px;
      }

      .survey-link {
        padding: 16px;
      }

      .survey-icon {
        width: 52px;
        height: 52px;
        flex-basis: 52px;
        font-size: 27px;
      }

      .survey-title {
        font-size: 17px;
      }
    }
  </style>
</head>

<body>

  <header>

    <div class="header-icon">
      🗳️
    </div>

    <h1>
      استطلاعات الرأي
    </h1>

    <p>
      نسعد بآرائكم ومقترحاتكم،
      فهي تساعدنا على تطوير منصة آفاق اللغة وتحسينها.
    </p>

  </header>

  <main>

    <section class="card">

      <div class="intro">
        اختاري الاستطلاع المناسب،
        ثم شاركينا رأيك بكل وضوح واهتمام.
      </div>

      <div class="survey-list">

        <a
          class="survey-link"
          href="student-survey.html"
        >

          <div class="survey-content">

            <div class="survey-icon">
              👩‍🎓
            </div>

            <div class="survey-title">
              استطلاع رأي الطالبة
            </div>

          </div>

          <div class="arrow">
            ‹
          </div>

        </a>


        <a
          class="survey-link"
          href="parent-survey.html"
        >

          <div class="survey-content">

            <div class="survey-icon">
              👨‍👩‍👧
            </div>

            <div class="survey-title">
              استطلاع رأي ولي الأمر
            </div>

          </div>

          <div class="arrow">
            ‹
          </div>

        </a>


        <a
          class="survey-link"
          href="principal-survey.html"
        >

          <div class="survey-content">

            <div class="survey-icon">
              🏫
            </div>

            <div class="survey-title">
              استطلاع رأي مديرة المدرسة
            </div>

          </div>

          <div class="arrow">
            ‹
          </div>

        </a>

      </div>

      <a
        class="back"
        href="index.html"
      >
        العودة إلى الصفحة الرئيسية
      </a>

    </section>

  </main>

  <footer>
    جميع الحقوق محفوظة © 2026
  </footer>

</body>

</html>
