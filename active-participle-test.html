<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

  <title>اختبار اسم الفاعل | منصة آفاق</title>

  <style>
    :root{
      --p:#5b4677;
      --p2:#776094;
      --pd:#453457;
      --g:#b69750;
      --g2:#d8c28a;
      --lav:#eee5f5;
      --paper:#fffdf9;
      --text:#403448;
    }

    *{
      box-sizing:border-box;
    }

    html,
    body{
      height:100%;
      margin:0;
    }

    body{
      font-family:Tahoma,Arial,sans-serif;
      color:var(--text);
      background:linear-gradient(180deg,#f5f0fa,#fbf9fd,#f1ebf7);
      overflow:hidden;
    }

    .app{
      height:100dvh;
      display:grid;
      grid-template-rows:auto 1fr auto;
    }

    header{
      text-align:center;
      color:#fff;
      padding:10px 12px 8px;
      background:linear-gradient(145deg,var(--p2),var(--p),var(--pd));
      border-bottom:4px solid var(--g);
    }

    .tag{
      display:inline-block;
      padding:3px 10px;
      border-radius:999px;
      border:1px solid var(--g2);
      color:#fff2c6;
      background:rgba(182,151,80,.13);
      font-size:11px;
      font-weight:bold;
    }

    header h1{
      margin:4px 0 0;
      font-size:clamp(19px,4.8vw,28px);
    }

    header p{
      margin:0;
      color:#f2ebf6;
      font-size:11px;
    }

    main{
      min-height:0;
      width:min(760px,94%);
      margin:0 auto;
      padding:7px 0;
      display:flex;
      flex-direction:column;
    }

    .top{
      display:flex;
      justify-content:space-between;
      gap:8px;
      margin-bottom:5px;
      color:var(--p);
      font-size:13px;
      font-weight:bold;
    }

    .progress{
      height:8px;
      margin-bottom:7px;
      overflow:hidden;
      background:#e9e0ef;
      border-radius:999px;
    }

    .progress>div{
      width:0;
      height:100%;
      background:linear-gradient(90deg,var(--g),#dfca8f);
      transition:.3s;
    }

    .card,
    .result{
      flex:1;
      min-height:0;
      padding:12px;
      display:flex;
      flex-direction:column;
      justify-content:center;
      background:var(--paper);
      border:1px solid var(--g2);
      border-radius:22px;
      box-shadow:0 14px 30px rgba(73,54,92,.12);
    }

    .qnum{
      margin-bottom:2px;
      color:var(--g);
      font-size:12px;
      font-weight:bold;
    }

    h2{
      margin:2px 0 8px;
      color:var(--pd);
      font-size:clamp(16px,4.3vw,21px);
      line-height:1.5;
    }

    .options{
      display:grid;
      gap:6px;
    }

    .opt{
      width:100%;
      padding:8px 10px;
      color:var(--text);
      font:inherit;
      font-size:clamp(13px,3.4vw,16px);
      line-height:1.35;
      text-align:right;
      cursor:pointer;
      background:#fff;
      border:2px solid #e4dbe9;
      border-radius:13px;
    }

    .opt.correct{
      color:#25663c;
      background:#eaf6ee;
      border-color:#4d9b64;
    }

    .opt.wrong{
      color:#9c3547;
      background:#fff0f2;
      border-color:#c95c70;
    }

    .opt:disabled{
      cursor:default;
    }

    .feedback{
      display:none;
      margin-top:7px;
      padding:8px 10px;
      font-size:clamp(12px,3.2vw,14px);
      line-height:1.5;
      border-radius:13px;
    }

    .feedback.show{
      display:block;
    }

    .feedback.good{
      color:#25663c;
      background:#eaf6ee;
      border:1px solid #4d9b64;
    }

    .feedback.bad{
      color:#9c3547;
      background:#fff0f2;
      border:1px solid #c95c70;
    }

    .next{
      display:none;
      width:100%;
      margin-top:7px;
      padding:9px;
      color:#fff;
      font:inherit;
      font-size:14px;
      font-weight:bold;
      cursor:pointer;
      background:linear-gradient(145deg,var(--p2),var(--p));
      border:0;
      border-radius:13px;
    }

    .result{
      display:none;
      text-align:center;
    }

    .result.show{
      display:flex;
    }

    .score{
      margin:10px 0;
      color:var(--g);
      font-size:40px;
      font-weight:bold;
    }

    .save-status{
      min-height:26px;
      margin:4px 0 2px;
      padding:5px 8px;
      border-radius:11px;
      font-size:12px;
      font-weight:bold;
    }

    .save-status.saved{
      color:#2e6f42;
      background:#edf8f0;
    }

    .save-status.waiting{
      color:#66522e;
      background:#fff8e8;
    }

    .save-status.error{
      color:#8a3d3d;
      background:#fff0f0;
    }

    .restart,
    .lesson{
      display:block;
      width:100%;
      margin-top:8px;
      padding:10px;
      font-weight:bold;
      text-decoration:none;
      border-radius:13px;
    }

    .restart{
      color:#fff;
      font:inherit;
      font-weight:bold;
      cursor:pointer;
      background:linear-gradient(145deg,var(--p2),var(--p));
      border:0;
    }

    .lesson{
      color:var(--pd);
      background:var(--lav);
      border:1px solid #d6c7df;
    }

    footer{
      padding:5px;
      color:#73697a;
      font-size:9px;
      text-align:center;
    }

    .burst{
      position:fixed;
      inset:0;
      z-index:20;
      overflow:hidden;
      pointer-events:none;
    }

    .confetti{
      position:absolute;
      top:-10px;
      width:8px;
      height:8px;
      border-radius:2px;
      animation:fall 900ms ease-out forwards;
    }

    @keyframes fall{
      0%{
        transform:translateY(-20px) rotate(0);
        opacity:1;
      }

      100%{
        transform:translateY(105vh) rotate(540deg);
        opacity:0;
      }
    }

    .pop{
      animation:pop .25s ease;
    }

    @keyframes pop{
      50%{
        transform:scale(1.018);
      }
    }

    @media(max-height:650px){
      header{
        padding:5px 10px 4px;
      }

      header h1{
        font-size:17px;
      }

      header p{
        font-size:9px;
      }

      main{
        padding:3px 0;
      }

      .top{
        margin-bottom:3px;
        font-size:11px;
      }

      .progress{
        height:6px;
        margin-bottom:4px;
      }

      .card{
        padding:7px;
      }

      h2{
        margin-bottom:5px;
        font-size:15px;
      }

      .options{
        gap:4px;
      }

      .opt{
        padding:5px 7px;
        font-size:12px;
      }

      .feedback{
        margin-top:4px;
        padding:5px 7px;
        font-size:11px;
      }

      .next{
        margin-top:4px;
        padding:6px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <span class="tag">منصة آفاق</span>
    <h1>تحدي اسم الفاعل</h1>
    <p>١٠ أسئلة • سؤال واحد في كل شاشة • تعقيب فوري ✨</p>
  </header>

  <main>

    <div class="top">
      <span id="counter">السؤال ١ من ١٠</span>
      <span id="correctCount">الصحيح: ٠</span>
    </div>

    <div class="progress">
      <div id="bar"></div>
    </div>

    <section class="card" id="card">

      <div class="qnum" id="qnum"></div>

      <h2 id="question"></h2>

      <div class="options" id="options"></div>

      <div class="feedback" id="feedback"></div>

      <button class="next" id="next">
        السؤال التالي
      </button>

    </section>

    <section class="result" id="result">

      <h2>انتهى التحدي ✨</h2>

      <div class="score" id="score"></div>

      <p id="message"></p>

      <div class="save-status" id="saveStatus"></div>

      <button class="restart" onclick="restartQuiz()">
        أعيدي التحدي
      </button>

      <a class="lesson" href="active-participle-file.html">
        راجعي ملف الدرس
      </a>

      <a class="lesson" href="active-participle.html">
        العودة إلى درس اسم الفاعل
      </a>

    </section>

  </main>

  <footer>
    منصة آفاق | لغتي الخالدة | الصف الثالث المتوسط
  </footer>

</div>

<div class="burst" id="burst"></div>

<script type="module">

from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc,
  updateDoc,
  serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


const firebaseConfig = {
  apiKey: "AIzaSyB48av9gx4jzFyYoUQtcLwaR52qETevKGs",
  authDomain: "afaq-language-platform.firebaseapp.com",
  projectId: "afaq-language-platform",
  storageBucket: "afaq-language-platform.firebasestorage.app",
  messagingSenderId: "362601061474",
  appId: "1:362601061474:web:bc405291332b9e4ef9453b"
};


const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;

onAuthStateChanged(auth,(user)=>{
  currentUser = user;
});


const questions = [

{
  q:"اسم الفاعل اسم مشتق يدل على:",
  o:[
    "من وقع عليه الفعل",
    "من قام بالفعل أو اتصف به",

    "زمن وقوع الفعل"
  ],
  a:1,
  ok:"أحسنتِ 🌟 اسم الفاعل يدل على من قام بالفعل أو اتصف به.",
  bad:"تذكري: الكاتب هو من كتب، والحافظ هو من حفظ."
},

{
  q:"اسم الفاعل من الفعل «كتب» هو:",
  o:[
    "كاتب",
    "مكتوب",
    "كتاب",
    "كتابة"
  ],
  a:0,
  ok:"رائعة ✨ «كاتب» على وزن فاعل.",
  bad:"الفعل الثلاثي «كتب» نصوغ اسم الفاعل منه على وزن فاعل: كاتب."
},

{
  q:"يُصاغ اسم الفاعل من الفعل الثلاثي غالبًا على وزن:",
  o:[
    "مفعول",
    "فعّال",
    "فاعل",
    "مِفعال"
  ],
  a:2,
  ok:"صحيح 👏 وزن اسم الفاعل من الثلاثي هو «فاعل».",
  bad:"مثل: كتب ← كاتب، وحفظ ← حافظ."
},

{
  q:"اسم الفاعل من الفعل «حفظ» هو:",
  o:[

    "حافظ",
    "حفيظ",
    "حفظ"
  ],
  a:1,
  ok:"ممتازة 🌷 حفظ ← حافظ.",
  bad:"نضع الفعل الثلاثي «حفظ» على وزن فاعل: حافظ."
},

{
  q:"اسم الفاعل من الفعل «أكرم» هو:",
  o:[
    "مُكرِم",
    "مُكرَم",
    "كريم",

  ],
  a:0,
  ok:"إجابة دقيقة 💜 «مُكرِم» اسم فاعل، أما «مُكرَم» فاسم مفعول.",
  bad:"من المضارع «يُكرِم» نستبدل حرف المضارعة ميمًا مضمومة ونكسر ما قبل الآخر: مُكرِم."
},

{
  q:"اسم الفاعل من الفعل «استخرج» هو:",
  o:[
    "مُستخرَج",
    "استخراج",
    "مُستخرِج",

  ],
  a:2,
  ok:"أحسنتِ 🎯 استخرج ← يستخرِج ← مُستخرِج.",
  bad:"في غير الثلاثي نكسر ما قبل الآخر: مُستخرِج، وليس مُستخرَج."

{
  q:"عند صياغة اسم الفاعل من غير الثلاثي فإننا:",
  o:[

    "نضع الفعل على وزن فاعل دائمًا"
  ],
  a:1,
  ok:"ممتازة 🧠 هذه هي قاعدة صياغة اسم الفاعل من غير الثلاثي.",
  bad:"ابدئي بالمضارع، ثم ميم مضمومة بدل حرف المضارعة، مع كسر ما قبل الآخر."
},

{
  q:"ما اسم الفاعل في الجملة «الطالبُ مجتهدٌ في دروسه»؟",
  o:[
    "مجتهد",
    "الطالب",
    "دروسه",
    "في"
  ],
  a:0,
  ok:"رائعة 🌟 «مجتهد» اسم فاعل مشتق من الفعل «اجتهد».",
  bad:"ابحثي عن الكلمة التي تدل على من قام بالفعل أو اتصف به: مجتهد."
},

{
  q:"اسم الفاعل من الفعل «قال» هو:",
  o:[
    "مقول",
    "قول",
    "قائل",
    "مقال"
  ],
  a:2,
  ok:"أحسنتِ 👏 قال ← قائل.",
  bad:"اسم الفاعل من «قال» هو «قائل»."
},

{
  q:"في الجملة «المعلمُ شارحٌ الدرسَ الآن»، ما إعراب «الدرسَ»؟",
  o:[
    "فاعل مرفوع",
    "مفعول به منصوب لاسم الفاعل",
    "مبتدأ مرفوع",
    "مضاف إليه مجرور"
  ],
  a:1,
  ok:"ممتازة جدًا 🏆 «شارح» اسم فاعل عامل، و«الدرسَ» مفعول به منصوب له.",
  bad:"اسم الفاعل «شارح» اعتمد على مبتدأ ودل على الحال، فعمل عمل فعله ونصب «الدرسَ» مفعولًا به."
}

];

let index=0;
let score=0;
let answered=false;

const arabicDigits=n =>
  String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);

function tone(ok){
  try{
    const AC=
      window.AudioContext ||
      window.webkitAudioContext;

    const c=new AC();
    const o=c.createOscillator();
    const g=c.createGain();

    o.connect(g);
    g.connect(c.destination);

    o.type=ok?'sine':'triangle';

    o.frequency.setValueAtTime(
      ok?660:220,
      c.currentTime
    );

    if(ok){
      o.frequency.exponentialRampToValueAtTime(
        920,
        c.currentTime+.16
      );
    }else{
      o.frequency.exponentialRampToValueAtTime(
        170,
        c.currentTime+.16
      );
    }

    g.gain.setValueAtTime(
      .07,
      c.currentTime
    );

    g.gain.exponentialRampToValueAtTime(
      .001,
      c.currentTime+.23
    );

    o.start();
    o.stop(c.currentTime+.24);

  }catch(e){}
}

function confetti(){

  const burst=
    document.getElementById('burst');

  burst.innerHTML='';

  const colors=[
    '#5b4677',
    '#776094',
    '#b69750',
    '#d8c28a',
    '#eee5f5'
  ];

  for(let i=0;i<28;i++){

    const s=
      document.createElement('i');

    s.className='confetti';

    s.style.left=
      (Math.random()*100)+'vw';

    s.style.background=
      colors[i%colors.length];

    s.style.animationDelay=
      (Math.random()*170)+'ms';

    burst.appendChild(s);
  }

  setTimeout(
    ()=>burst.innerHTML='',
    1200
  );
}

function render(){

  answered=false;

  const x=questions[index];

  document.getElementById('qnum').textContent=
    'السؤال '+arabicDigits(index+1);

  document.getElementById('counter').textContent=
    'السؤال '+
    arabicDigits(index+1)+
    ' من '+
    arabicDigits(questions.length);

  document.getElementById('correctCount').textContent=
    'الصحيح: '+arabicDigits(score);

  document.getElementById('bar').style.width=
    (index/questions.length*100)+'%';

  document.getElementById('question').textContent=
    x.q;

  const options=
    document.getElementById('options');

  const feedback=
    document.getElementById('feedback');

  const next=
    document.getElementById('next');

  const card=
    document.getElementById('card');

  options.innerHTML='';

  feedback.className='feedback';
  feedback.textContent='';

  next.style.display='none';

  card.classList.remove('pop');

  x.o.forEach((text,j)=>{

    const b=
      document.createElement('button');

    b.className='opt';
    b.textContent=text;

    b.onclick=()=>choose(j,b);

    options.appendChild(b);
  });
}

function choose(choice,button){

  if(answered)return;

  answered=true;

  const x=questions[index];

  const btns=[
    ...document.querySelectorAll('.opt')
  ];

  btns.forEach(
    b=>b.disabled=true
  );

  btns[x.a].classList.add('correct');

  const feedback=
    document.getElementById('feedback');

  if(choice===x.a){

    score++;

    button.classList.add('correct');

    feedback.className=
      'feedback show good';

    feedback.textContent=
      x.ok;

    tone(true);
    confetti();

    if(navigator.vibrate){
      navigator.vibrate(45);
    }

  }else{

    button.classList.add('wrong');

    feedback.className=
      'feedback show bad';

    feedback.textContent=
      'راجعي القاعدة 👀 '+x.bad;

    tone(false);

    if(navigator.vibrate){
      navigator.vibrate([70,40,70]);
    }
  }

  document.getElementById('correctCount').textContent=
    'الصحيح: '+arabicDigits(score);

  document.getElementById('card').classList.add('pop');

  const next=
    document.getElementById('next');

  next.textContent=
    index===questions.length-1
      ?'شوفي نتيجتك ✨'
      :'كمّلي التحدي ←';

  next.style.display='block';
}

document.getElementById('next').onclick=()=>{

  index++;

  if(index<questions.length){
    render();
  }else{
    finish();
  }
};


async function saveResult(){

  const saveStatus=
    document.getElementById('saveStatus');


  if(!currentUser){

    saveStatus.className=
      'save-status waiting';

    saveStatus.textContent=
      'ℹ️ النتيجة لم تُحفظ؛ يلزم تسجيل الدخول للرصد.';

    return;
  }


  saveStatus.className=
    'save-status waiting';

  saveStatus.textContent=
    'جاري حفظ نتيجتك في سجلّك...';


  try{

    const studentRef=
      doc(
        db,
        "students",
        currentUser.uid
      );


    const studentSnap=
      await getDoc(studentRef);


    if(!studentSnap.exists()){

      throw new Error(
        "student-document-not-found"
      );
    }


    const data=
      studentSnap.data();


    const oldTest=
      data?.["اختبارات_الفصل_الأول"]?.["اسم_الفاعل"] || {};


    const oldAttempts=
      Number(
        oldTest["عدد_المحاولات"] || 0
      );


    const oldBest=
      Number(
        oldTest["أعلى_درجة"] || 0
      );


    const percentage=
      Math.round(
        (score/questions.length)*100
      );


    const bestScore=
      Math.max(
        oldBest,
        score
      );


    await updateDoc(
      studentRef,
      {

        "اختبارات_الفصل_الأول.اسم_الفاعل.اسم_الاختبار":
          "تحدي اسم الفاعل",

        "اختبارات_الفصل_الأول.اسم_الفاعل.الدرجة":
          score,

        "اختبارات_الفصل_الأول.اسم_الفاعل.الدرجة_من":
          questions.length,

        "اختبارات_الفصل_الأول.اسم_الفاعل.النسبة":
          percentage,

        "اختبارات_الفصل_الأول.اسم_الفاعل.عدد_المحاولات":
          oldAttempts+1,

        "اختبارات_الفصل_الأول.اسم_الفاعل.أعلى_درجة":
          bestScore,

        "اختبارات_الفصل_الأول.اسم_الفاعل.آخر_محاولة":
          serverTimestamp()

      }
    );


    saveStatus.className=
      'save-status saved';

    saveStatus.textContent=
      '✅ تم حفظ نتيجتك في سجل الفصل الدراسي الأول.';


  }catch(error){

    console.error(error);

    saveStatus.className=
      'save-status error';

    saveStatus.textContent=
      'تعذر حفظ النتيجة، لكن نتيجتك في الاختبار لم تتأثر.';

  }

}


function finish(){

  document.getElementById('bar').style.width='100%';

  document.getElementById('card').style.display='none';

  document.querySelector('.top').style.display='none';

  document.querySelector('.progress').style.display='none';

  const result=
    document.getElementById('result');

  result.classList.add('show');

  document.getElementById('score').textContent=
    arabicDigits(score)+
    ' / '+
    arabicDigits(questions.length);

  const pct=
    score/questions.length;

  document.getElementById('message').textContent=
    pct===1
      ?'إتقان كامل! بطلة اسم الفاعل 🏆'
      :pct>=.8
      ?'ممتازة جدًا 🌟 أتقنتِ صياغة اسم الفاعل واستعماله.'
      :pct>=.6
      ?'أداء جميل 👏 راجعي صياغة اسم الفاعل من غير الثلاثي ثم أعيدي التحدي.'
      :'راجعي ملف الدرس، وركزي على الفرق بين الثلاثي وغير الثلاثي، ثم عودي للتحدي.';

  if(pct>=.8){
    confetti();
  }

  saveResult();
}


window.restartQuiz=function(){

  index=0;
  score=0;
  answered=false;

  document.getElementById('card').style.display='flex';

  document.querySelector('.top').style.display='flex';

  document.querySelector('.progress').style.display='block';

  document.getElementById('result').classList.remove('show');

  document.getElementById('saveStatus').textContent='';

  render();
};


render();

</script>
