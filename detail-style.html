<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>أسلوب التفضيل</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      max-width: 100%;
      margin: 0;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      font-family: Tahoma, Arial, sans-serif;
      color: #4b3a57;
      text-align: center;
      background: linear-gradient(180deg, #fffaf2, #f8f0fb);
    }

    header {
      padding: 38px 20px;
      color: white;
      background: linear-gradient(135deg, #776094, #5b4677);
      border-bottom: 4px solid #c9a85c;
    }

    header h1 {
      margin: 0 0 10px;
      color: #fffdf8;
      font-size: 34px;
    }

    header p {
      margin: 0;
      color: #f7effb;
      font-size: 17px;
      line-height: 1.8;
    }

    section {
      width: 85%;
      max-width: 700px;
      margin: 30px auto;
      padding: 25px;
      background: #fffdf8;
      border: 2px solid #c9a85c;
      border-radius: 20px;
      box-shadow: 0 7px 18px rgba(91, 63, 111, 0.12);
    }

    .box {
      margin: 18px 0;
      padding: 24px;
      color: #5d4374;
      font-size: 22px;
      font-weight: bold;
      line-height: 1.8;
      background: linear-gradient(135deg, #f5ecfb, #fffaf2);
      border: 2px solid #c9a85c;
      border-radius: 16px;
      box-shadow: 0 4px 12px rgba(91, 63, 111, 0.08);
      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .box:hover,
    .box:active {
      transform: translateY(-3px);
      box-shadow: 0 8px 17px rgba(91, 63, 111, 0.14);
    }

    a {
      color: #5d4374;
      text-decoration: none;
    }

    .back {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 22px;
      color: white;
      font-weight: bold;
      background: #6f5288;
      border: 2px solid #c9a85c;
      border-radius: 22px;
    }

    footer {
      margin-top: 30px;
      padding: 20px;
      color: #fffdf8;
      background: #49385c;
      border-top: 3px solid #c9a85c;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 29px;
      }

      section {
        width: 92%;
        padding: 20px 14px;
      }

      .box {
        padding: 20px 14px;
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>✍️ أسلوب التفضيل</h1>
    <p>محتويات درس أسلوب التفضيل</p>
  </header>

  <section>

    <a href="detail-style-video.html">
      <div class="box">🎥 شرح بالفيديو</div>
    </a>

    <a href="detail-style-file.html">
      <div class="box">📄 ملف الدرس</div>
    </a>

    <a href="detail-style-wonders.html">
      <div class="box">✨ روائع الأسلوب اللغوي</div>
    </a>

    <a href="detail-style-tests.html">
      <div class="box">✅ اختبارات تجريبية</div>
    </a>

    <a class="back" href="language-style.html">
      العودة إلى الأسلوب اللغوي
    </a>

  </section>

  <footer>
    جميع الحقوق محفوظة © 2026
  </footer>

</body>

</html>
