<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>اختبار الصنف اللغوي</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: linear-gradient(135deg, #dff6ff, #f7fbff);
      color: #16324f;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #1261a0, #1f8ac0);
      color: white;
      text-align: center;
      padding: 28px 15px;
      border-radius: 0 0 28px 28px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    header p {
      margin: 0;
      font-size: 17px;
    }

    .container {
      max-width: 760px;
      margin: 25px auto;
      padding: 15px;
    }

    .card {
      background: white;
      border-radius: 22px;
      padding: 24px;
      box-shadow: 0 7px 22px rgba(0, 0, 0, 0.12);
      border: 2px solid #d8effc;
    }

    .name-box {
      text-align: center;
    }

    .name-box h2 {
      color: #1261a0;
      margin-top: 0;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px;
      font-size: 18px;
      border: 2px solid #9ed9f5;
      border-radius: 14px;
      text-align: center;
      outline: none;
      margin: 15px 0;
    }

    input[type="text"]:focus {
      border-color: #1261a0;
    }

    .btn {
      display: inline-block;
      border: none;
      background: linear-gradient(135deg, #1261a0, #1f8ac0);
      color: white;
      padding: 13px 26px;
      border-radius: 14px;
      font-size: 18px;
      cursor: pointer;
      text-decoration: none;
      margin-top: 15px;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .btn:disabled {
      background: #a9b9c6;
      cursor: not-allowed;
    }

    .progress-text {
      text-align: center;
      font-weight: bold;
      color: #1261a0;
      margin-bottom: 10px;
    }

    .progress {
      height: 13px;
      background: #e5f4fc;
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 22px;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #20a4d8, #1261a0);
      transition: width 0.3s;
    }

    .question {
      font-size: 21px;
      font-weight: bold;
      line-height: 1.8;
      margin-bottom: 20px;
      color: #16324f;
    }

    .choices {
      display: grid;
      gap: 12px;
    }

    .choice {
      background: #f3fbff;
      border: 2px solid #bce5f8;
      border-radius: 15px;
      padding: 15px;
      font-size: 18px;
      cursor: pointer;
      transition: 0.2s;
    }

    .choice:hover {
      background: #e5f6ff;
      transform: translateY(-1px);
    }

    .choice.selected {
      background: #d9f2ff;
      border-color: #1261a0;
      font-weight: bold;
    }

    .actions {
      text-align: center;
      margin-top: 20px;
    }

    .result {
      text-align: center;
    }

    .result h2 {
      color: #1261a0;
      font-size: 28px;
    }

    .score {
      font-size: 38px;
      font-weight: bold;
      color: #16804b;
      margin: 18px 0;
    }

    .message {
      font-size: 19px;
      line-height: 1.8;
      margin-bottom: 15px;
    }

    .hidden {
      display: none;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #1261a0;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <header>
    <h1>اختبار الصنف اللغوي</h1>
    <p>اسم الفاعل – اسم المفعول – صيغ المبالغة</p>
  </header>

  <main class="container">

    <section id="startScreen" class="card name-box">
      <h2>بيانات الطالبة</h2>
      <p>اكتبي اسمكِ ثم ابدئي الاختبار.</p>

      <input
        type="text"
        id="studentName"
        placeholder="اكتبي اسم الطالبة"
      >

      <button class="btn" onclick="startTest()">
        ابدئي الاختبار
      </button>

      <a class="back-link" href="semester1-tests.html">
        العودة إلى اختبارات الفصل الأول
      </a>
    </section>

    <section id="testScreen" class="card hidden">

      <div class="progress-text" id="progressText"></div>

      <div class="progress">
        <div class="progress-bar" id="progressBar"></div>
      </div>

      <div class="question" id="questionText"></div>

      <div class="choices" id="choicesBox"></div>

      <div class="actions">
        <button
          class="btn"
          id="nextButton"
          onclick="nextQuestion()"
          disabled
        >
          السؤال التالي
        </button>
      </div>

    </section>

    <section id="resultScreen" class="card result hidden">

      <h2>أحسنتِ يا <span id="resultName"></span></h2>

      <div class="score">
        <span id="finalScore"></span> من 20
      </div>

      <p class="message" id="resultMessage"></p>

      <a class="btn" href="semester1-tests.html">
        العودة إلى صفحة الاختبارات
      </a>

    </section>

  </main>

  <script>
    const questions = [
      {
        question: "ما اسم الفاعل من الفعل الثلاثي «كتب»؟",
        choices: ["كاتب", "مكتوب", "كتّاب", "كتاب"],
        answer: 0
      },
      {
        question: "ما اسم المفعول من الفعل الثلاثي «حفظ»؟",
        choices: ["حافظ", "محفوظ", "حفّاظ", "حفيظ"],
        answer: 1
      },
      {
        question: "أي الكلمات الآتية تُعدّ صيغة مبالغة؟",
        choices: ["كاتب", "مكتوب", "غفّار", "مكتب"],
        answer: 2
      },
      {
        question: "اسم الفاعل من الفعل «جلس» هو:",
        choices: ["جالس", "مجلوس", "جلوس", "مجلس"],
        answer: 0
      },
      {
        question: "اسم المفعول من الفعل «شرب» هو:",
        choices: ["شارب", "شرّاب", "مشروب", "شروب"],
        answer: 2
      },
      {
        question: "الكلمة التي تدل على من قام بالفعل هي:",
        choices: ["اسم المفعول", "اسم الفاعل", "صيغة المبالغة", "اسم المكان"],
        answer: 1
      },
      {
        question: "الكلمة التي تدل على من وقع عليه الفعل هي:",
        choices: ["اسم الفاعل", "صيغة المبالغة", "اسم المفعول", "اسم الزمان"],
        answer: 2
      },
      {
        question: "ما اسم الفاعل من الفعل غير الثلاثي «أكرم»؟",
        choices: ["مُكرِم", "مُكرَم", "كريم", "إكرام"],
        answer: 0
      },
      {
        question: "ما اسم المفعول من الفعل غير الثلاثي «أكرم»؟",
        choices: ["مُكرِم", "مُكرَم", "كارم", "إكرام"],
        answer: 1
      },
      {
        question: "أي كلمة جاءت على وزن «فعّال»؟",
        choices: ["صبور", "غفور", "توّاب", "رحيم"],
        answer: 2
      },
      {
        question: "أي كلمة جاءت على وزن «فعول»؟",
        choices: ["شكور", "علّام", "رحيم", "مقدام"],
        answer: 0
      },
      {
        question: "أي كلمة جاءت على وزن «فعيل» وتدل على المبالغة؟",
        choices: ["كاتب", "حفيظ", "مكتوب", "مُكرِم"],
        answer: 1
      },
      {
        question: "في جملة «الطالبُ حافظٌ القصيدةَ»، كلمة «حافظ» هي:",
        choices: ["اسم مفعول", "صيغة مبالغة", "اسم فاعل", "فعل ماضٍ"],
        answer: 2
      },
      {
        question: "في جملة «الدرسُ مكتوبٌ بوضوح»، كلمة «مكتوب» هي:",
        choices: ["اسم فاعل", "اسم مفعول", "صيغة مبالغة", "فعل أمر"],
        answer: 1
      },
      {
        question: "أي الجمل الآتية تحتوي على صيغة مبالغة؟",
        choices: [
          "الطالب كاتبٌ واجبه.",
          "الواجب مكتوبٌ.",
          "الله غفورٌ رحيم.",
          "الطالب يكتب واجبه."
        ],
        answer: 2
      },
      {
        question: "اسم الفاعل من الفعل «استخرج» هو:",
        choices: ["مُستخرَج", "مُستخرِج", "استخراج", "خارِج"],
        answer: 1
      },
      {
        question: "اسم المفعول من الفعل «استخرج» هو:",
        choices: ["مُستخرِج", "مُستخرَج", "مُخرِج", "خارج"],
        answer: 1
      },
      {
        question: "تُصاغ صيغة المبالغة للدلالة على:",
        choices: [
          "مكان حدوث الفعل",
          "زمن حدوث الفعل",
          "كثرة وقوع الفعل",
          "من وقع عليه الفعل"
        ],
        answer: 2
      },
      {
        question: "أي الكلمات الآتية اسم فاعل من فعل غير ثلاثي؟",
        choices: ["كاتب", "مُعلِّم", "مكتوب", "غفّار"],
        answer: 1
      },
      {
        question: "أي الكلمات الآتية اسم مفعول من فعل غير ثلاثي؟",
        choices: ["مُستخدِم", "مُستخدَم", "استخدام", "خادم"],
        answer: 1
      }
    ];

    let currentQuestion = 0;
    let score = 0;
    let selectedAnswer = null;

    const startScreen = document.getElementById("startScreen");
    const testScreen = document.getElementById("testScreen");
    const resultScreen = document.getElementById("resultScreen");

    const questionText = document.getElementById("questionText");
    const choicesBox = document.getElementById("choicesBox");
    const nextButton = document.getElementById("nextButton");
    const progressText = document.getElementById("progressText");
    const progressBar = document.getElementById("progressBar");

    function startTest() {
      const nameInput = document.getElementById("studentName");
      const name = nameInput.value.trim();

      if (name === "") {
        alert("فضلاً اكتبي اسم الطالبة أولًا.");
        return;
      }

      localStorage.setItem("semester1StudentName", name);

      currentQuestion = 0;
      score = 0;
      selectedAnswer = null;

      startScreen.classList.add("hidden");
      resultScreen.classList.add("hidden");
      testScreen.classList.remove("hidden");

      showQuestion();
    }

    function showQuestion() {
      selectedAnswer = null;
      nextButton.disabled = true;

      const current = questions[currentQuestion];

      progressText.textContent =
        "السؤال " + (currentQuestion + 1) + " من " + questions.length;

      progressBar.style.width =
        ((currentQuestion + 1) / questions.length * 100) + "%";

      questionText.textContent = current.question;
      choicesBox.innerHTML = "";

      current.choices.forEach((choice, index) => {
        const button = document.createElement("button");

        button.className = "choice";
        button.type = "button";
        button.textContent = choice;

        button.onclick = function () {
          selectAnswer(index, button);
        };

        choicesBox.appendChild(button);
      });

      if (currentQuestion === questions.length - 1) {
        nextButton.textContent = "إنهاء الاختبار";
      } else {
        nextButton.textContent = "السؤال التالي";
      }
    }

    function selectAnswer(index, button) {
      selectedAnswer = index;

      const allChoices = document.querySelectorAll(".choice");

      allChoices.forEach(choice => {
        choice.classList.remove("selected");
      });

      button.classList.add("selected");
      nextButton.disabled = false;
    }

    function nextQuestion() {
      if (selectedAnswer === null) {
        return;
      }

      if (selectedAnswer === questions[currentQuestion].answer) {
        score++;
      }

      currentQuestion++;

      if (currentQuestion < questions.length) {
        showQuestion();
      } else {
        finishTest();
      }
    }

    function finishTest() {
      const studentName =
        localStorage.getItem("semester1StudentName") || "الطالبة";

      localStorage.setItem("linguisticScore", score);
      localStorage.setItem("linguisticCompleted", "true");

      testScreen.classList.add("hidden");
      resultScreen.classList.remove("hidden");

      document.getElementById("resultName").textContent = studentName;
      document.getElementById("finalScore").textContent = score;

      let message = "";

      if (score >= 18) {
        message = "ممتاز جدًا، لديكِ إتقان رائع لمهارات الصنف اللغوي.";
      } else if (score >= 15) {
        message = "أحسنتِ، نتيجتكِ جيدة جدًا.";
      } else if (score >= 10) {
        message = "نتيجة جيدة، راجعي بعض المهارات لزيادة الإتقان.";
      } else {
        message = "تحتاجين إلى مراجعة اسم الفاعل واسم المفعول وصيغ المبالغة.";
      }

      document.getElementById("resultMessage").textContent = message;
    }
  </script>

</body>
</html>
