<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>اختبار اسم التفضيل | منصة آفاق</title>

  <style>
    :root {
      --purple: #5b4677;
      --purple-light: #776094;
      --purple-dark: #49385c;
      --gold: #c9a85c;
      --cream: #fffaf2;
      --paper: #fffdf8;
      --text: #44384f;
      --green: #2f7650;
      --green-bg: #e4f8ec;
      --red: #96394a;
      --red-bg: #ffe8ec;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      font-family: Tahoma, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(
          circle at top right,
          rgba(255, 222, 122, 0.25),
          transparent 27%
        ),
        linear-gradient(
          180deg,
          #f7f1fb 0%,
          #fffaf1 55%,
          #f1eaf8 100%
        );
    }

    button,
    a {
      font-family: inherit;
    }

    .app {
      height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    header {
      padding: 9px 12px 8px;
      text-align: center;
      color: white;
      background:
        linear-gradient(
          145deg,
          #765991,
          #5b4376,
          #433252
        );
      border-bottom: 3px solid var(--gold);
    }

    .badge {
      display: inline-block;
      padding: 3px 11px;
      color: #fff3d3;
      font-size: 11px;
      font-weight: bold;
      border: 1px solid rgba(228, 202, 125, 0.8);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
    }

    header h1 {
      margin: 4px 0 1px;
      color: #fff3d3;
      font-size: clamp(19px, 5vw, 27px);
      line-height: 1.35;
    }

    header p {
      margin: 0;
      color: #f5eef8;
      font-size: 11px;
    }

    main {
      width: min(760px, 94%);
      min-height: 0;
      margin: auto;
      padding: 6px 0;
      display: flex;
      flex-direction: column;
    }

    .top-panel {
      margin-bottom: 5px;
      padding: 7px 9px;
      border: 1px solid #dfcb91;
      border-radius: 15px;
      background: rgba(255, 255, 255, 0.94);
    }

    .score-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 7px;
      margin-bottom: 5px;
      color: #624681;
      font-size: 12px;
      font-weight: bold;
    }

    .question-counter,
    .score-box,
    .stars-score {
      white-space: nowrap;
    }

    .stars-score {
      color: #c88e13;
    }

    .progress-track {
      width: 100%;
      height: 7px;
      overflow: hidden;
      border-radius: 20px;
      background: #eee8f4;
    }

    .progress-fill {
      width: 0;
      height: 100%;
      border-radius: 20px;
      background:
        linear-gradient(
          90deg,
          #e5b64e,
          #776094
        );
      transition: width 0.35s ease;
    }

    .quiz-card,
    .result-card {
      flex: 1;
      min-height: 0;
      padding: 11px;
      border: 2px solid #dec98d;
      border-radius: 21px;
      background: white;
      box-shadow:
        0 10px 24px rgba(73, 53, 91, 0.12);
    }

    .quiz-card {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .question-number {
      width: fit-content;
      margin: 0 auto 5px;
      padding: 4px 11px;
      color: white;
      font-size: 11px;
      font-weight: bold;
      border-radius: 999px;
      background:
        linear-gradient(
          135deg,
          #ed7c38,
          #f6aa4e
        );
    }

    .question-text {
      margin: 0 0 8px;
      padding: 8px 10px;
      text-align: center;
      border-radius: 14px;
      background: #f5effd;
      color: #583f72;
      font-size: clamp(15px, 4vw, 19px);
      line-height: 1.55;
      font-weight: bold;
    }

    .options {
      display: grid;
      gap: 5px;
    }

    .option {
      width: 100%;
      padding: 8px 10px;
      border: 2px solid transparent;
      border-radius: 13px;
      color: #3d4050;
      font-size: clamp(12px, 3.4vw, 15px);
      line-height: 1.4;
      font-weight: bold;
      cursor: pointer;
      text-align: right;
      background: #eef6ff;
    }

    .option:nth-child(2) {
      background: #fff2df;
    }

    .option:nth-child(3) {
      background: #eef9f1;
    }

    .option:nth-child(4) {
      background: #f3edff;
    }

    .option.correct {
      color: #176642;
      background: #dff7e8;
      border-color: #47ab72;
    }

    .option.wrong {
      color: #983a4a;
      background: #ffe3e8;
      border-color: #dc6377;
    }

    .option:disabled {
      cursor: default;
    }

    .feedback {
      display: none;
      margin-top: 6px;
      padding: 7px 9px;
      text-align: center;
      border-radius: 12px;
      font-size: clamp(11px, 3vw, 13px);
      line-height: 1.45;
      font-weight: bold;
    }

    .feedback.correct-feedback {
      display: block;
      color: var(--green);
      background: var(--green-bg);
      border-right: 5px solid #4caf75;
    }

    .feedback.wrong-feedback {
      display: block;
      color: var(--red);
      background: var(--red-bg);
      border-right: 5px solid #dc6679;
    }

    .next-button {
      display: none;
      width: 100%;
      margin-top: 6px;
      padding: 8px;
      border: 0;
      border-radius: 12px;
      color: white;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      background:
        linear-gradient(
          135deg,
          #6c5089,
          #4d3a60
        );
    }

    .next-button.show {
      display: block;
    }

    .result-card {
      display: none;
      flex-direction: column;
      justify-content: center;
      text-align: center;
    }

    .result-card.show {
      display: flex;
    }

    .result-icon {
      font-size: 48px;
    }

    .result-card h2 {
      margin: 2px 0 5px;
      color: #624681;
      font-size: 22px;
    }

    .final-score {
      margin: 6px 0;
      padding: 8px;
      border-radius: 13px;
      background: #fff5d9;
      color: #755317;
      font-size: 20px;
      font-weight: bold;
    }

    .final-stars {
      min-height: 35px;
      color: #dda51d;
      font-size: 27px;
      letter-spacing: 2px;
    }

    .result-message {
      margin-top: 4px;
      padding: 8px;
      border-radius: 13px;
      background: #f2ecff;
      color: #5b4275;
      font-size: 14px;
      line-height: 1.55;
      font-weight: bold;
    }

    .save-status {
      min-height: 26px;
      margin-top: 5px;
      padding: 6px 9px;
      font-size: 12px;
      font-weight: bold;
      line-height: 1.5;
      border-radius: 11px;
    }

    .save-status.saved {
      color: #2e6f42;
      background: #edf8f0;
    }

    .save-status.waiting {
      color: #66522e;
      background: #fff8e8;
    }

    .save-status.error {
      color: #8a3d3d;
      background: #fff0f0;
    }

    .result-actions {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      margin-top: 7px;
    }

    .restart-button,
    .back-button {
      display: block;
      width: 100%;
      margin: 0;
      padding: 8px 5px;
      border: 0;
      border-radius: 11px;
      color: white;
      font-size: 12px;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
      background:
        linear-gradient(
          135deg,
          #6c5089,
          #4d3a60
        );
    }

    .restart-button {
      background:
        linear-gradient(
          135deg,
          #ed7c38,
          #f5aa4d
        );
    }

    footer {
      padding: 4px 8px;
      color: #756b7b;
      font-size: 9px;
      text-align: center;
    }

    @media (max-height: 650px) {
      header {
        padding: 4px 9px;
      }

      header h1 {
        margin: 1px 0;
        font-size: 17px;
      }

      main {
        padding: 3px 0;
      }

      .quiz-card,
      .result-card {
        padding: 6px;
      }

      .option {
        padding: 5px 7px;
        font-size: 11px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header>

    <span class="badge">
      الأسلوب اللغوي
    </span>

    <h1>
      ✨ اختبري مهارتك | اسم التفضيل
    </h1>

    <p>
      ١٠ أسئلة • اختاري الإجابة الأدق • تغذية راجعة فورية 🌟
    </p>

  </header>

  <main>

    <div
      class="top-panel"
      id="topPanel"
    >

      <div class="score-row">

        <div
          class="question-counter"
          id="questionCounter"
        >
          السؤال ١ من ١٠
        </div>

        <div class="score-box">
          الإجابات الصحيحة:
          <span id="score">٠</span>
          من ١٠
        </div>

        <div class="stars-score">
          ⭐
          <span id="starScore">٠</span>
        </div>

      </div>

      <div class="progress-track">
        <div
          class="progress-fill"
          id="progressFill"
        ></div>
      </div>

    </div>

    <section
      class="quiz-card"
      id="quizCard"
    >

      <div
        class="question-number"
        id="questionNumber"

        السؤال الأول
      </div>

      <div
        class="question-text"
        id="questionText"
      ></div>

      <div
        class="options"
        id="options"
      ></div>

      <div
        class="feedback"
        id="feedback"
      ></div>

      <button
        class="next-button"
        id="nextButton"
        type="button"
      >
        السؤال التالي ⭐
      </button>

    </section>

    <section
      class="result-card"
      id="resultCard"
    >

      <div
        class="result-icon"
        id="resultIcon"
      >
        🌟
      </div>

      <h2>
        اكتمل اختبار اسم التفضيل
      </h2>

      <div
        class="final-score"
        id="finalScore"
      ></div>

      <div
        class="final-stars"
        id="finalStars"
      ></div>

      <div
        class="result-message"
        id="resultMessage"
      ></div>

      <div
        class="save-status"
        id="saveStatus"
      ></div>

      <div class="result-actions">

        <button
          class="restart-button"
          id="restartButton"
          type="button"
        >
          🔄 أعيدي الاختبار
        </button>

        <a
          class="back-button"
          href="detail-style-file.html"
        >
          📘 راجعي ملف الدرس
        </a>

        <a
          class="back-button"
          href="detail-style-wonders.html"
        >
          ✨ روائع اسم التفضيل
        </a>

        <a
          class="back-button"
          href="detail-style.html"
        >
          ↩ العودة إلى الدرس
        </a>

      </div>

    </section>

  </main>

  <footer>
    منصة آفاق اللغة | لغتي الخالدة | الصف الثالث المتوسط
  </footer>

</div>
<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc,
  updateDoc,
  serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


const firebaseConfig = {
  apiKey: "AIzaSyB48av9gx4jzFyYoUQtcLwaR52qETevKGs",
  authDomain: "afaq-language-platform.firebaseapp.com",
  projectId: "afaq-language-platform",
  storageBucket: "afaq-language-platform.firebasestorage.app",
  messagingSenderId: "362601061474",
  appId: "1:362601061474:web:bc405291332b9e4ef9453b"
};


const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);

let currentUser = null;

onAuthStateChanged(
  auth,
  user => {
    currentUser = user;
  }
);


const questions = [

  {
    question:
      "ما اسم التفضيل في الجملة: «العلم أنفع من المال»؟",

    options: [
      "العلم",
      "أنفع",
      "المال",
      "من"
    ],

    answer: 1,

    explanation:
      "«أنفع» اسم تفضيل؛ لأنه يدل على زيادة العلم في صفة النفع."
  },


  {
    question:
      "ما المفضَّل في الجملة: «المسجد الحرام أطهر بقاع الأرض»؟",

    options: [
      "أطهر",
      "بقاع",
      "الأرض",
      "المسجد الحرام"
    ],

    answer: 3,

    explanation:
      "المسجد الحرام هو الذي زاد في صفة الطهارة، ولذلك هو المفضَّل."
  },


  {
    question:
      "ما المفضَّل عليه في الجملة: «الصدق أفضل من الكذب»؟",

    options: [
      "الصدق",
      "أفضل",
      "الكذب",
      "من"
    ],

    answer: 2,

    explanation:
      "الكذب هو الطرف الذي فُضِّل عليه الصدق."
  },


  {
    question:
      "أي الكلمات الآتية اسم تفضيل؟",

    options: [
      "أحمر",
      "أفضل",
      "أعرج",
      "أعور"
    ],

    answer: 1,

    explanation:
      "«أفضل» يدل على المقارنة وزيادة أحد الطرفين في صفة مشتركة."
  },


  {
    question:
      "أي جملة تشتمل على أسلوب تفضيل؟",

    options: [
      "السماء صافية",
      "الحديقة جميلة",
      "الرياض أكبر من القرية",
      "حضر الطالب مبكرًا"
    ],

    answer: 2,

    explanation:
      "في الجملة مقارنة بين الرياض والقرية في صفة الكِبَر."
  },


  {
    question:
      "ما وزن اسم التفضيل غالبًا؟",

    options: [
      "فاعل",
      "مفعول",
      "أفعل",
      "فعيل"
    ],

    answer: 2,

    explanation:
      "يُصاغ اسم التفضيل غالبًا على وزن «أفعل»."
  },


  {
    question:
      "أي الكلمات الآتية تدل على التفضيل مع أنها ليست على وزن «أفعل»؟",

    options: [
      "خير",
      "أكبر",
      "أجمل",
      "أوسع"
    ],

    answer: 0,

    explanation:
      "«خير» اسم تفضيل سماعي، وكذلك كلمة «شر»."
  },


  {
    question:
      "ما الأركان الصحيحة لأسلوب التفضيل؟",

    options: [
      "فعل وفاعل ومفعول به",
      "مبتدأ وخبر فقط",
      "المفضَّل واسم التفضيل والمفضَّل عليه",
      "أداة شرط وفعل شرط وجواب شرط"
    ],

    answer: 2,

    explanation:
      "يتكون أسلوب التفضيل من المفضَّل، واسم التفضيل، والمفضَّل عليه."
  },


  {
    question:
      "ما الصفة المشتركة في الجملة: «الطائرة أسرع من السيارة»؟",

    options: [
      "السرعة",
      "الحجم",
      "الجمال",
      "اللون"
    ],

    answer: 0,

    explanation:
      "اشتركت الطائرة والسيارة في صفة السرعة، وزادت الطائرة فيها."
  },


  {
    question:
      "كيف نتأكد أن الكلمة اسم تفضيل؟",

    options: [
      "من شكل الكلمة فقط",
      "من وجود حرف الألف",
      "من المقارنة والصفة المشتركة وزيادة أحد الطرفين",
      "من طول الجملة"
    ],

    answer: 2,

    explanation:
      "السياق هو الأساس: مقارنة، وصفة مشتركة، وزيادة أحد الطرفين فيها."
  }

];


const arabicNumbers = [
  "الأول",
  "الثاني",
  "الثالث",
  "الرابع",
  "الخامس",
  "السادس",
  "السابع",
  "الثامن",
  "التاسع",
  "العاشر"
];


const toArabicDigits = value =>
  String(value).replace(
    /\d/g,
    digit => "٠١٢٣٤٥٦٧٨٩"[digit]
  );


let currentQuestion = 0;
let score = 0;
let answered = false;


const questionCounter =
  document.getElementById(
    "questionCounter"
  );

const scoreElement =
  document.getElementById(
    "score"
  );

const starScore =
  document.getElementById(
    "starScore"
  );

const progressFill =
  document.getElementById(
    "progressFill"
  );

const questionNumber =
  document.getElementById(
    "questionNumber"
  );

const questionText =
  document.getElementById(
    "questionText"
  );

const optionsContainer =
  document.getElementById(
    "options"
  );

const feedback =
  document.getElementById(
    "feedback"
  );

const nextButton =
  document.getElementById(
    "nextButton"
  );

const quizCard =
  document.getElementById(
    "quizCard"
  );

const resultCard =
  document.getElementById(
    "resultCard"
  );

const topPanel =
  document.getElementById(
    "topPanel"
  );

const finalScore =
  document.getElementById(
    "finalScore"
  );

const finalStars =
  document.getElementById(
    "finalStars"
  );

const resultMessage =
  document.getElementById(
    "resultMessage"
  );

const resultIcon =
  document.getElementById(
    "resultIcon"
  );

const restartButton =
  document.getElementById(
    "restartButton"
  );

const saveStatus =
  document.getElementById(
    "saveStatus"
  );


function loadQuestion() {

  answered = false;

  const current =
    questions[currentQuestion];


  questionCounter.textContent =
    "السؤال " +
    toArabicDigits(
      currentQuestion + 1
    ) +
    " من " +
    toArabicDigits(
      questions.length
    );


  scoreElement.textContent =
    toArabicDigits(score);

  starScore.textContent =
    toArabicDigits(score);


  progressFill.style.width =
    (
      (
        currentQuestion + 1
      ) /
      questions.length *
      100
    ) +
    "%";


  questionNumber.textContent =
    "السؤال " +
    arabicNumbers[
      currentQuestion
    ];


  questionText.textContent =
    current.question;


  optionsContainer.innerHTML =
    "";


  feedback.className =
    "feedback";

  feedback.textContent =
    "";


  nextButton.classList.remove(
    "show"
  );


  current.options.forEach(
    (option, index) => {

      const button =
        document.createElement(
          "button"
        );

      button.type =
        "button";

      button.className =
        "option";

      button.textContent =
        option;


      button.addEventListener(
        "click",
        event => {

          chooseAnswer(
            index,
            button,
            event
          );

        }
      );


      optionsContainer.appendChild(
        button
      );

    }
  );

}


function chooseAnswer(
  selectedIndex,
  selectedButton,
  event
) {

  if (answered) {
    return;
  }

  answered = true;


  const current =
    questions[currentQuestion];


  const buttons =
    document.querySelectorAll(
      ".option"
    );


  buttons.forEach(
    button => {
      button.disabled = true;
    }
  );


  buttons[
    current.answer
  ].classList.add(
    "correct"
  );


  if (
    selectedIndex ===
    current.answer
  ) {

    score++;

    feedback.className =
      "feedback correct-feedback";

    feedback.innerHTML =
      "⭐ أحسنتِ، إجابة صحيحة.<br>" +
      current.explanation;

    playCorrectSound();

    showFlyingStars(
      event.clientX,
      event.clientY
    );

    if (
      navigator.vibrate
    ) {
      navigator.vibrate(45);
    }

  } else {

    selectedButton.classList.add(
      "wrong"
    );

    feedback.className =
      "feedback wrong-feedback";

    feedback.innerHTML =
      "🌷 راجعي الفكرة.<br>" +
      current.explanation;

    playWrongSound();

    if (
      navigator.vibrate
    ) {
      navigator.vibrate(
        [70, 40, 70]
      );
    }

  }


  scoreElement.textContent =
    toArabicDigits(score);

  starScore.textContent =
    toArabicDigits(score);


  nextButton.textContent =
    currentQuestion ===
    questions.length - 1
      ? "شاهدي نتيجتكِ 🌟"
      : "تابعي الاختبار ⭐";


  nextButton.classList.add(
    "show"
  );

}


nextButton.addEventListener(
  "click",
  () => {

    currentQuestion++;

    if (
      currentQuestion <
      questions.length
    ) {

      loadQuestion();

    } else {

      showResult();

    }

  }
);
  async function saveResult() {

  if (!currentUser) {

    saveStatus.className =
      "save-status waiting";

    saveStatus.textContent =
      "ℹ️ لم تُحفظ النتيجة؛ يلزم تسجيل الدخول لإضافتها إلى سجلّكِ.";

    return;
  }


  saveStatus.className =
    "save-status waiting";

  saveStatus.textContent =
    "جارٍ حفظ نتيجتكِ في سجلّكِ...";


  try {

    const studentRef =
      doc(
        db,
        "students",
        currentUser.uid
      );


    const studentSnap =
      await getDoc(
        studentRef
      );


    if (!studentSnap.exists()) {

      throw new Error(
        "student-document-not-found"
      );

    }


    const data =
      studentSnap.data();


    const oldTest =
      data?.["اختبارات_الفصل_الأول"]?.["اسم_التفضيل"] || {};


    const oldAttempts =
      Number(
        oldTest["عدد_المحاولات"] || 0
      );


    const oldBest =
      Number(
        oldTest["أعلى_درجة"] || 0
      );


    const percentage =
      Math.round(
        (score / questions.length) *
        100
      );


    const bestScore =
      Math.max(
        oldBest,
        score
      );


    await updateDoc(
      studentRef,
      {

        "اختبارات_الفصل_الأول.اسم_التفضيل.اسم_الاختبار":
          "اختبار اسم التفضيل",

        "اختبارات_الفصل_الأول.اسم_التفضيل.الدرجة":
          score,

        "اختبارات_الفصل_الأول.اسم_التفضيل.الدرجة_من":
          questions.length,

        "اختبارات_الفصل_الأول.اسم_التفضيل.النسبة":
          percentage,

        "اختبارات_الفصل_الأول.اسم_التفضيل.عدد_المحاولات":
          oldAttempts + 1,

        "اختبارات_الفصل_الأول.اسم_التفضيل.أعلى_درجة":
          bestScore,

        "اختبارات_الفصل_الأول.اسم_التفضيل.آخر_محاولة":
          serverTimestamp()

      }
    );


    saveStatus.className =
      "save-status saved";

    saveStatus.textContent =
      "✅ حُفظت نتيجتكِ في سجل الفصل الدراسي الأول.";


  } catch (error) {

    console.error(error);

    saveStatus.className =
      "save-status error";

    saveStatus.textContent =
      "تعذّر حفظ النتيجة، ولكن نتيجتكِ في الاختبار لم تتأثر.";

  }

}


function showResult() {

  quizCard.style.display =
    "none";

  topPanel.style.display =
    "none";

  resultCard.classList.add(
    "show"
  );


  finalScore.textContent =
    "حصلتِ على " +
    toArabicDigits(score) +
    " من " +
    toArabicDigits(
      questions.length
    ) +
    " نجوم";


  let starsCount = 1;
  let message = "";


  if (
    score ===
    questions.length
  ) {

    starsCount = 5;

    resultIcon.textContent =
      "👑";

    message =
      "أحسنتِ! أتقنتِ اسم التفضيل وأركانه ومعناه إتقانًا كاملًا 🏆";


  } else if (
    score >= 8
  ) {

    starsCount = 4;

    resultIcon.textContent =
      "🏆";

    message =
      "ممتاز جدًا 🌟 أتقنتِ اسم التفضيل وأركانه ومعناه بدرجة عالية.";


  } else if (
    score >= 6
  ) {

    starsCount = 3;

    resultIcon.textContent =
      "🌟";

    message =
      "أداء جيد 👏 راجعي بعض النقاط، ثم أعيدي الاختبار لتعزيز إتقانكِ.";


  } else if (
    score >= 4
  ) {

    starsCount = 2;

    resultIcon.textContent =
      "✨";

    message =
      "راجعي ملف الدرس، ثم أعيدي الاختبار بعد تثبيت أركان اسم التفضيل ومعناه.";


  } else {

    starsCount = 1;

    resultIcon.textContent =
      "📘";

    message =
      "راجعي ملف درس اسم التفضيل وروائعه، ثم أعيدي الاختبار.";

  }


  finalStars.textContent =
    "⭐".repeat(
      starsCount
    );


  resultMessage.textContent =
    message;


  playCelebrationSound();

  celebrationStars();

  saveResult();

}


restartButton.addEventListener(
  "click",
  () => {

    currentQuestion = 0;
    score = 0;
    answered = false;


    resultCard.classList.remove(
      "show"
    );


    quizCard.style.display =
      "flex";


    topPanel.style.display =
      "block";


    saveStatus.textContent =
      "";


    loadQuestion();

  }
);


function playTone(
  frequency,
  duration,
  type = "sine"
) {

  try {

    const AudioContextClass =
      window.AudioContext ||
      window.webkitAudioContext;


    if (!AudioContextClass) {
      return;
    }


    const audio =
      new AudioContextClass();


    const oscillator =
      audio.createOscillator();


    const gain =
      audio.createGain();


    oscillator.type =
      type;


    oscillator.frequency.value =
      frequency;


    oscillator.connect(
      gain
    );


    gain.connect(
      audio.destination
    );


    gain.gain.setValueAtTime(
      0.1,
      audio.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
      0.001,
      audio.currentTime +
      duration
    );


    oscillator.start();


    oscillator.stop(
      audio.currentTime +
      duration
    );


  } catch (error) {}

}


function playCorrectSound() {

  playTone(
    523.25,
    0.15
  );


  setTimeout(
    () =>
      playTone(
        659.25,
        0.18
      ),
    120
  );


  setTimeout(
    () =>
      playTone(
        783.99,
        0.2
      ),
    240
  );

}


function playWrongSound() {

  playTone(
    220,
    0.28,
    "triangle"
  );

}


function playCelebrationSound() {

  const notes = [
    523.25,
    659.25,
    783.99,
    1046.5
  ];


  notes.forEach(
    (frequency, index) => {

      setTimeout(
        () =>
          playTone(
            frequency,
            0.22
          ),
        index * 130
      );

    }
  );

}
  function showFlyingStars(x, y) {

  for (
    let i = 0;
    i < 7;
    i++
  ) {

    const star =
      document.createElement(
        "div"
      );


    star.className =
      "flying-star";


    star.textContent =
      i % 2 === 0
        ? "⭐"
        : "✨";


    star.style.left =
      x +
      (
        Math.random() * 100 -
        50
      ) +
      "px";


    star.style.top =
      y +
      (
        Math.random() * 40 -
        20
      ) +
      "px";


    document.body.appendChild(
      star
    );


    setTimeout(
      () => star.remove(),
      1300
    );

  }

}


function celebrationStars() {

  const shapes = [
    "⭐",
    "✨",
    "🌟",
    "💫"
  ];


  for (
    let i = 0;
    i < 45;
    i++
  ) {

    setTimeout(
      () => {

        const star =
          document.createElement(
            "div"
          );


        star.className =
          "celebration-star";


        star.textContent =
          shapes[
            Math.floor(
              Math.random() *
              shapes.length
            )
          ];


        star.style.left =
          Math.random() *
          100 +
          "vw";


        star.style.fontSize =
          (
            18 +
            Math.random() *
            22
          ) +
          "px";


        star.style.animationDuration =
          (
            2.2 +
            Math.random() *
            1.6
          ) +
          "s";


        document.body.appendChild(
          star
        );


        setTimeout(
          () => star.remove(),
          4200
        );

      },
      i * 45
    );

  }

}


loadQuestion();
