<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>اختبري مهارتك | اسم التفضيل</title>

  <style>
    :root {
      --purple: #5b4677;
      --purple-light: #776094;
      --purple-dark: #49385c;
      --gold: #c9a85c;
      --cream: #fffaf2;
      --paper: #fffdf8;
      --text: #44384f;
      --green: #2f7650;
      --green-bg: #e4f8ec;
      --red: #96394a;
      --red-bg: #ffe8ec;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      font-family: Tahoma, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(
          circle at top right,
          rgba(255, 222, 122, 0.25),
          transparent 27%
        ),
        linear-gradient(
          180deg,
          #f7f1fb 0%,
          #fffaf1 55%,
          #f1eaf8 100%
        );
    }

    button,
    a {
      font-family: inherit;
    }

    .app {
      height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    header {
      padding: 9px 12px 8px;
      text-align: center;
      color: white;
      background:
        linear-gradient(
          145deg,
          #765991,
          #5b4376,
          #433252
        );
      border-bottom: 3px solid var(--gold);
    }

    .badge {
      display: inline-block;
      padding: 3px 11px;
      color: #fff3d3;
      font-size: 11px;
      font-weight: bold;
      border: 1px solid rgba(228, 202, 125, 0.8);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
    }

    header h1 {
      margin: 4px 0 1px;
      color: #fff3d3;
      font-size: clamp(19px, 5vw, 27px);
      line-height: 1.35;
    }

    header p {
      margin: 0;
      color: #f5eef8;
      font-size: 11px;
    }

    main {
      width: min(760px, 94%);
      min-height: 0;
      margin: auto;
      padding: 6px 0;
      display: flex;
      flex-direction: column;
    }

    .top-panel {
      margin-bottom: 5px;
      padding: 7px 9px;
      border: 1px solid #dfcb91;
      border-radius: 15px;
      background: rgba(255, 255, 255, 0.94);
    }

    .score-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 7px;
      margin-bottom: 5px;
      color: #624681;
      font-size: 12px;
      font-weight: bold;
    }

    .question-counter,
    .score-box,
    .stars-score {
      white-space: nowrap;
    }

    .stars-score {
      color: #c88e13;
    }

    .progress-track {
      width: 100%;
      height: 7px;
      overflow: hidden;
      border-radius: 20px;
      background: #eee8f4;
    }

    .progress-fill {
      width: 0;
      height: 100%;
      border-radius: 20px;
      background:
        linear-gradient(
          90deg,
          #e5b64e,
          #776094
        );
      transition: width 0.35s ease;
    }

    .quiz-card,
    .result-card {
      flex: 1;
      min-height: 0;
      padding: 11px;
      border: 2px solid #dec98d;
      border-radius: 21px;
      background: white;
      box-shadow:
        0 10px 24px rgba(73, 53, 91, 0.12);
    }

    .quiz-card {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .question-number {
      width: fit-content;
      margin: 0 auto 5px;
      padding: 4px 11px;
      color: white;
      font-size: 11px;
      font-weight: bold;
      border-radius: 999px;
      background:
        linear-gradient(
          135deg,
          #ed7c38,
          #f6aa4e
        );
    }

    .question-text {
      margin: 0 0 8px;
      padding: 8px 10px;
      text-align: center;
      border-radius: 14px;
      background: #f5effd;
      color: #583f72;
      font-size: clamp(15px, 4vw, 19px);
      line-height: 1.55;
      font-weight: bold;
    }

    .options {
      display: grid;
      gap: 5px;
    }

    .option {
      width: 100%;
      padding: 8px 10px;
      border: 2px solid transparent;
      border-radius: 13px;
      color: #3d4050;
      font-size: clamp(12px, 3.4vw, 15px);
      line-height: 1.4;
      font-weight: bold;
      cursor: pointer;
      text-align: right;
      background: #eef6ff;
      transition:
        transform 0.15s ease,
        border-color 0.15s ease;
    }

    .option:nth-child(2) {
      background: #fff2df;
    }

    .option:nth-child(3) {
      background: #eef9f1;
    }

    .option:nth-child(4) {
      background: #f3edff;
    }

    .option:active {
      transform: scale(0.99);
    }

    .option:disabled {
      cursor: default;
    }

    .option.correct {
      color: #176642;
      background: #dff7e8;
      border-color: #47ab72;
      animation: correctPop 0.35s ease;
    }

    .option.wrong {
      color: #983a4a;
      background: #ffe3e8;
      border-color: #dc6377;
      animation: wrongShake 0.35s ease;
    }

    @keyframes correctPop {
      50% {
        transform: scale(1.025);
      }
    }

    @keyframes wrongShake {
      25% {
        transform: translateX(5px);
      }

      50% {
        transform: translateX(-5px);
      }

      75% {
        transform: translateX(3px);
      }
    }

    .feedback {
      display: none;
      margin-top: 6px;
      padding: 7px 9px;
      text-align: center;
      border-radius: 12px;
      font-size: clamp(11px, 3vw, 13px);
      line-height: 1.45;
      font-weight: bold;
    }

    .feedback.correct-feedback {
      display: block;
      color: var(--green);
      background: var(--green-bg);
      border-right: 5px solid #4caf75;
    }

    .feedback.wrong-feedback {
      display: block;
      color: var(--red);
      background: var(--red-bg);
      border-right: 5px solid #dc6679;
    }

    .next-button {
      display: none;
      width: 100%;
      margin-top: 6px;
      padding: 8px;
      border: 0;
      border-radius: 12px;
      color: white;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      background:
        linear-gradient(
          135deg,
          #6c5089,
          #4d3a60
        );
    }

    .next-button.show {
      display: block;
    }

    .result-card {
      display: none;
      flex-direction: column;
      justify-content: center;
      text-align: center;
    }

    .result-card.show {
      display: flex;
      animation: resultAppear 0.5s ease;
    }

    @keyframes resultAppear {
      from {
        transform: scale(0.9);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .result-icon {
      font-size: 48px;
    }

    .result-card h2 {
      margin: 2px 0 5px;
      color: #624681;
      font-size: 22px;
    }

    .final-score {

      padding: 8px;
      border-radius: 13px;
      background: #fff5d9;
      color: #755317;
      font-size: 20px;
      font-weight: bold;
    }

    .final-stars {
      min-height: 35px;
      color: #dda51d;
      font-size: 27px;
      letter-spacing: 2px;
    }

    .result-message {
      margin-top: 4px;
      padding: 8px;
      border-radius: 13px;
      background: #f2ecff;
      color: #5b4275;
      font-size: 14px;
      line-height: 1.55;
      font-weight: bold;
    }

    .result-actions {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      margin-top: 7px;
    }

    .restart-button,
    .back-button {
      display: block;
      width: 100%;
      margin: 0;
      padding: 8px 5px;
      border: 0;
      border-radius: 11px;
      color: white;
      font-size: 12px;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
      background:

          135deg,
          #6c5089,
          #4d3a60

    }

    .restart-button {
      background:
        linear-gradient(
          135deg,
          #ed7c38,
          #f5aa4d
        );
    }

    .wide-button {
      grid-column: 1 / -1;
    }

    .flying-star {
      position: fixed;
      z-index: 9999;
      pointer-events: none;
      font-size: 27px;
      animation: flyStar 1.1s ease-out forwards;
    }

    @keyframes flyStar {
      from {
        transform: translateY(0) scale(0.4) rotate(0deg);
        opacity: 1;
      }

      to {
        transform: translateY(-150px) scale(1.4) rotate(300deg);
        opacity: 0;
      }
    }

    .celebration-star {
      position: fixed;
      top: -40px;
      z-index: 9998;
      pointer-events: none;
      font-size: 24px;
      animation: starFall 3s linear forwards;
    }

    @keyframes starFall {
      from {
        transform: translateY(-40px) rotate(0deg);
        opacity: 1;
      }

      to {
        transform: translateY(110vh) rotate(720deg);
        opacity: 0;
      }
    }

    footer {

      color: #756b7b;
      font-size: 9px;
      text-align: center;
    }

        font-size: 11px;
      }

      .feedback {
        margin-top: 3px;
        padding: 4px 6px;
        font-size: 10px;
      }

      .next-button {
        margin-top: 3px;
        padding: 5px;
        font-size: 11px;
      }
    }
  </style>
</head>

  function playTone(
    frequency,
    duration,
    type = "sine"
  ) {

    try {

      const AudioContextClass =
        window.AudioContext ||
        window.webkitAudioContext;

      if (!AudioContextClass) {
        return;
      }

      const audio =
        new AudioContextClass();

      const oscillator =
        audio.createOscillator();

      const gain =
        audio.createGain();

      oscillator.type = type;

      oscillator.frequency.value =
        frequency;

      oscillator.connect(gain);

      gain.connect(
        audio.destination
      );

      gain.gain.setValueAtTime(
        0.1,
        audio.currentTime
      );

      gain.gain.exponentialRampToValueAtTime(
        0.001,
        audio.currentTime +
        duration
      );

      oscillator.start();

      oscillator.stop(
        audio.currentTime +
        duration
      );

    } catch (error) {}

  }

      setTimeout(
        () => star.remove(),
        1300
      );

    }

  }


  function celebrationStars() {

    const shapes = [
      "⭐",
      "✨",
      "🌟",
      "💫"
    ];

    for (
      let i = 0;
      i < 45;
      i++
    ) {

      setTimeout(
        () => {

          const star =
            docume
                      .createElement(
              "div"
            );

          star.className =
            "celebration-star";

          star.textContent =
            shapes[
              Math.floor(
                Math.random() *
                shapes.length
              )
            ];

          star.style.left =
            Math.random() *
            100 +
            "vw";

          star.style.fontSize =
            (
              18 +
              Math.random() *
              22
            ) +
            "px";

          star.style.animationDuration =
            (
              2.2 +
              Math.random() *
              1.6
            ) +
            "s";

          document.body.appendChild(
            star
          );

          setTimeout(
            () => star.remove(),
            4200
          );

        },
        i * 45
      );

    }

  }


  function loadQuestion() {

    answered = false;

    const current =
      questions[currentQuestion];


    questionCounter.textContent =
      "السؤال " +
      toArabicDigits(
        currentQuestion + 1
      ) +
      " من " +
      toArabicDigits(
        questions.length
      );


    scoreElement.textContent =
      toArabicDigits(score);

    starScore.textContent =
      toArabicDigits(score);


    progressFill.style.width =
      (
        (
          currentQuestion + 1
        ) /
        questions.length *
        100
      ) +
      "%";


    questionNumber.textContent =
      "السؤال " +
      arabicNumbers[
        currentQuestion
      ];


    questionText.textContent =
      current.question;


    optionsContainer.innerHTML =
      "";

    feedback.className =
      "feedback";

    feedback.textContent =
      "";

    nextButton.classList.remove(
      "show"
    );


    current.options.forEach(
      (option, index) => {

        const button =
          document.createElement(
            "button"
          );

        button.type =
          "button";

        button.className =
          "option";

        button.textContent =
          option;


        button.addEventListener(
          "click",
          event => {

            chooseAnswer(
              index,
              button,
              event
            );

          }
        );


        optionsContainer.appendChild(
          button
        );

      }
    );

  }


  function chooseAnswer(
    selectedIndex,
    selectedButton,
    event
  ) {

    if (answered) {
      return;
    }

    answered = true;

    const current =
      questions[currentQuestion];

    const buttons =
      document.querySelectorAll(
        ".option"
      );


    buttons.forEach(
      button => {
        button.disabled = true;
      }
    );


    buttons[
      current.answer
    ].classList.add(
      "correct"
    );


    if (
      selectedIndex ===
      current.answer
    ) {

      score++;

      feedback.className =
        "feedback correct-feedback";

      feedback.innerHTML =
        "⭐ إجابة صحيحة!<br>" +
        current.explanation;

      playCorrectSound();

      showFlyingStars(
        event.clientX,
        event.clientY
      );

      if (
        navigator.vibrate
      ) {
        navigator.vibrate(45);
      }

    } else {

      selectedButton.classList.add(
        "wrong"
      );

      feedback.className =
        "feedback wrong-feedback";

      feedback.innerHTML =
        "🌷 الإجابة غير صحيحة.<br>" +
        current.explanation;

      playWrongSound();

      if (
        navigator.vibrate
      ) {
        navigator.vibrate(
          [70, 40, 70]
        );
      }

    }


    scoreElement.textContent =
      toArabicDigits(score);

    starScore.textContent =
      toArabicDigits(score);


    nextButton.textContent =
      currentQuestion ===
      questions.length - 1
        ? "شوفي نتيجتك 🌟"
        : "السؤال التالي ⭐";


    nextButton.classList.add(
      "show"
    );

  }


  nextButton.addEventListener(
    "click",
    () => {

      currentQuestion++;

      if (
        currentQuestion <
        questions.length
      ) {

        loadQuestion();

      } else {

        showResult();

      }

    }
  );


  function showResult() {

    quizCard.style.display =
      "none";

    topPanel.style.display =
      "none";

    resultCard.classList.add(
      "show"
    );


    finalScore.textContent =
      "حصلتِ على " +
      toArabicDigits(score) +
      " من " +
      toArabicDigits(
        questions.length
      ) +
      " نجوم";


    let starsCount = 1;
    let message = "";


    if (
      score ===
      questions.length
    ) {

      starsCount = 5;

      resultIcon.textContent =
        "👑";

      message =
        "إتقان كامل! أبدعتِ في اسم التفضيل وأركانه ومعناه.";

    } else if (
      score >= 8
    ) {

      starsCount = 4;

      resultIcon.textContent =
        "🏆";

      message =
        "رائعة جدًا! فهمكِ لاسم التفضيل ممتاز.";

    } else if (
      score >= 6
    ) {

      starsCount = 3;

      resultIcon.textContent =
        "🌟";

      message =
        "أداء جميل! راجعي بعض النقاط وستصلين إلى الإتقان.";

    } else if (
      score >= 4
    ) {

      starsCount = 2;

      resultIcon.textContent =
        "✨";

      message =
        "بداية طيبة، راجعي ملف الدرس ثم حاولي مرة أخرى.";

    } else {

      starsCount = 1;

      resultIcon.textContent =
        "📘";

      message =
        "راجعي ملف الدرس وروائع اسم التفضيل، ثم أعيدي الاختبار.";

    }


    finalStars.textContent =
      "⭐".repeat(
        starsCount
      );

    resultMessage.textContent =
      message;


    playCelebrationSound();

    celebrationStars();

  }


  restartButton.addEventListener(
    "click",
    () => {

      currentQuestion = 0;
      score = 0;
      answered = false;

      resultCard.classList.remove(
        "show"
      );

      quizCard.style.display =
        "flex";

      topPanel.style.display =
        "block";

      loadQuestion();

    }
  );


  loadQuestion();

</script>

</body>

</html>
