<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ورقة عمل رسم ل ولا بخط الرقعة</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #f4f4f4;
      color: #333;
    }

    header {
      padding: 35px 18px;
      text-align: center;
      color: white;
      background: #1f69bd;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    header p {
      margin: 10px 0 0;
      font-size: 17px;
    }

    main {
      width: 94%;
      max-width: 900px;
      margin: 28px auto;
    }

    .worksheet-card {
      margin-bottom: 25px;
      padding: 12px;
      border-radius: 22px;
      background: white;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.1);
    }

    .worksheet-card img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 14px;
    }

    .note {
      margin: 24px 0;
      padding: 18px;
      text-align: center;
      border-radius: 18px;
      background: #e9f2ff;
      color: #1f5f9f;
      font-weight: bold;
    }

    .back-box {
      margin: 35px 0;
      text-align: center;
    }

    .back-button {
      display: inline-block;
      padding: 14px 25px;
      border-radius: 18px;
      color: white;
      text-decoration: none;
      font-weight: bold;
      background: #1f69bd;
    }

    footer {
      padding: 20px 15px;
      text-align: center;
      color: white;
      background: #174f8e;
    }
  </style>
</head>

<body>

  <header>
    <h1>📄 ورقة عمل</h1>

    <p>
      كتابة حرفي ل ولا بخط الرقعة
    </p>
  </header>

  <main>

    <div class="note">
      اضغطي على الصورة لعرضها بحجم أكبر.
    </div>

    <div class="worksheet-card">
      <a href="sora1.jpg">
        <img
          src="sora1.jpg"
          alt="ورقة عمل حرف اللام بخط الرقعة"
        >
      </a>
    </div>

    <div class="worksheet-card">
      <a href="sora2.jpg">
        <img
          src="sora2.jpg"
          alt="ورقة عمل لا بخط الرقعة"
        >
      </a>
    </div>

    <div class="back-box">
      <a
        class="back-button"
        href="ruqah-l-la.html"
      >
        العودة إلى درس رسم ل ولا
      </a>
    </div>

  </main>

  <footer>
    منصة آفاق اللغة — إعداد المعلمة إيناس محمد يحيى مدخلي
  </footer>

</body>

</html>
