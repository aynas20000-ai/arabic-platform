<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    ورقة عمل اللام ولام ألف بخط الرقعة | منصة آفاق اللغة
  </title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      max-width: 100%;
      margin: 0;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      font-family: Tahoma, Arial, sans-serif;
      color: #4b3a57;
      background: linear-gradient(
        145deg,
        #fffaf2,
        #f8f0fb
      );
    }

    header {
      padding: 36px 16px 42px;
      text-align: center;
      color: white;
      border-radius: 0 0 34px 34px;
      background: linear-gradient(
        135deg,
        #776094,
        #5b4677
      );
      box-shadow: 0 12px 28px rgba(73, 56, 92, 0.22);
    }

    .header-icon {
      width: 82px;
      height: 82px;
      margin: 0 auto 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 24px;
      font-size: 45px;
      background: rgba(255, 255, 255, 0.15);
      border: 2px solid rgba(255, 255, 255, 0.42);
    }

    header h1 {
      margin: 0;
      color: #fff8df;
      font-size: 33px;
      line-height: 1.7;
    }

    header p {
      max-width: 680px;
      margin: 10px auto 0;
      color: #f7effb;
      font-size: 17px;
      line-height: 1.9;
    }

    main {
      width: 94%;
      max-width: 900px;
      margin: 28px auto 45px;
    }

    .note {
      margin-bottom: 22px;
      padding: 17px;
      text-align: center;
      border-radius: 18px;
      color: #5d4374;
      background: #f5ecfb;
      border-right: 7px solid #c9a85c;
      font-size: 17px;
      font-weight: bold;
      line-height: 1.9;
    }

    .worksheet-card {
      margin-bottom: 24px;
      padding: 12px;
      border-radius: 24px;
      background: #fffdf8;
      border: 1px solid rgba(93, 67, 116, 0.15);
      box-shadow: 0 11px 27px rgba(73, 56, 92, 0.12);
      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .worksheet-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 32px rgba(73, 56, 92, 0.16);
    }

    .worksheet-card a {
      display: block;
      text-decoration: none;
    }

    .worksheet-card img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 16px;
      border: 2px solid #ead69e;
    }

    .image-caption {
      margin-top: 10px;
      padding: 10px;
      text-align: center;
      color: #5d4374;
      font-weight: bold;
      line-height: 1.8;
    }

    .back-box {
      margin: 30px 0 5px;
      text-align: center;
    }

    .back-button {
      display: block;
      width: 100%;
      padding: 15px;
      border-radius: 17px;
      color: white;
      background: #6f5288;
      text-decoration: none;
      font-size: 17px;
      font-weight: bold;
      transition:
        opacity 0.2s,
        transform 0.2s;
    }

    .back-button:hover {
      opacity: 0.94;
    }

    .back-button:active {
      transform: scale(0.98);
    }

    footer {
      padding: 22px 12px;
      text-align: center;
      color: white;
      background: #49385c;
      line-height: 1.8;
    }

    @media (max-width: 600px) {
      header {
        padding: 29px 14px 36px;
      }

      header h1 {
        font-size: 26px;
      }

      header p {
        font-size: 15px;
      }

      main {
        width: 93%;
      }

      .note {
        font-size: 16px;
      }

      .worksheet-card {
        padding: 9px;
        border-radius: 19px;
      }

      .worksheet-card img {
        border-radius: 13px;
      }
    }
  </style>
</head>

<body>

  <header>

    <div class="header-icon">
      📄
    </div>

    <h1>
      ورقة عمل اللام ولام ألف
    </h1>

    <p>
      تدربي على كتابة حرف اللام ولام ألف
      بخط الرقعة بطريقة صحيحة وجميلة.
    </p>

  </header>

  <main>

    <div class="note">
      اضغطي على كل صورة لعرض ورقة العمل بحجم أكبر.
    </div>

    <div class="worksheet-card">

      <a href="sora1.jpg">

        <img
          src="sora1.jpg"
          alt="ورقة عمل حرف اللام بخط الرقعة"
          loading="lazy"
        >

        <div class="image-caption">
          ورقة عمل حرف اللام بخط الرقعة
        </div>

      </a>

    </div>

    <div class="worksheet-card">

      <a href="sora2.jpg">

        <img
          src="sora2.jpg"
          alt="ورقة عمل لام ألف بخط الرقعة"
          loading="lazy"
        >

        <div class="image-caption">
          ورقة عمل لام ألف بخط الرقعة
        </div>

      </a>

    </div>

    <div class="back-box">

      <a
        class="back-button"
        href="ruqah-l-la.html"
      >
        العودة إلى درس اللام ولام ألف
      </a>

    </div>

  </main>

  <footer>
    جميع الحقوق محفوظة © 2026
  </footer>

</body>

</html>
