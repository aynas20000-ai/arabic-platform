<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>شرح درس التمييز بالفيديو</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      max-width: 100%;
      margin: 0;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      font-family: Tahoma, Arial, sans-serif;
      color: #4b3a57;
      text-align: center;
      background: linear-gradient(180deg, #fffaf2, #f8f0fb);
    }

    header {
      padding: 38px 20px;
      color: white;
      background: linear-gradient(135deg, #776094, #5b4677);
      border-bottom: 4px solid #c9a85c;
    }

    header h1 {
      margin: 0 0 10px;
      color: #fffdf8;
      font-size: 34px;
      line-height: 1.6;
    }

    header p {
      margin: 0;
      color: #f7effb;
      font-size: 17px;
      line-height: 1.8;
    }

    section {
      width: 85%;
      max-width: 700px;
      margin: 30px auto;
      padding: 25px;
      background: #fffdf8;
      border: 2px solid #c9a85c;
      border-radius: 20px;
      box-shadow: 0 7px 18px rgba(91, 63, 111, 0.12);
    }

    section h2 {
      margin-top: 0;
      color: #5d4374;
      font-size: 24px;
    }

    .box {
      margin: 18px 0;
      padding: 18px;
      background: linear-gradient(135deg, #f5ecfb, #fffaf2);
      border: 2px solid #c9a85c;
      border-radius: 16px;
      box-shadow: 0 4px 12px rgba(91, 63, 111, 0.08);
    }

    .video-frame {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 0;
      border-radius: 12px;
    }

    .back {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 22px;
      color: white;
      font-weight: bold;
      text-decoration: none;
      background: #6f5288;
      border: 2px solid #c9a85c;
      border-radius: 22px;
    }

    footer {
      margin-top: 30px;
      padding: 20px;
      color: #fffdf8;
      background: #49385c;
      border-top: 3px solid #c9a85c;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 27px;
      }

      section {
        width: 92%;
        padding: 20px 14px;
      }

      section h2 {
        font-size: 21px;
      }

      .box {
        padding: 12px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>🎥 شرح درس التمييز بالفيديو</h1>
    <p>الوظيفة النحوية – الفصل الدراسي الأول</p>
  </header>

  <section>

    <h2>مقطع الفيديو</h2>

    <div class="box">
      <iframe
        class="video-frame"
        src="https://www.youtube.com/embed/a6Fo2acnz78"
        title="شرح درس التمييز"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen>
      </iframe>
    </div>

    <a class="back" href="tamyiz.html">
      العودة إلى صفحة التمييز
    </a>

  </section>

  <footer>
    جميع الحقوق محفوظة © 2026
  </footer>

</body>

</html>
