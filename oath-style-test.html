<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>الاختبار التجريبي لأسلوب القسم</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      max-width: 100%;
      margin: 0;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      padding: 20px 12px;
      font-family: Tahoma, Arial, sans-serif;
      color: #4b3a57;
      background: linear-gradient(180deg, #fffaf2, #f8f0fb);
    }

    .container {
      width: 94%;
      max-width: 760px;
      margin: auto;
    }

    .hero {
      margin-bottom: 18px;
      padding: 30px 16px;
      color: #fffdf8;
      text-align: center;
      background: linear-gradient(135deg, #776094, #5b4677);
      border: 3px solid #c9a85c;
      border-radius: 24px;
      box-shadow: 0 8px 20px rgba(91, 70, 119, 0.18);
    }

    .hero h1 {
      margin: 0 0 8px;
      font-size: 30px;
      line-height: 1.6;
    }

    .hero p {
      margin: 0;
      color: #f7effb;
      font-size: 18px;
    }

    .progress-card {
      margin-bottom: 18px;
      padding: 15px;
      background: #fffdf8;
      border: 2px solid #c9a85c;
      border-radius: 18px;
      box-shadow: 0 5px 14px rgba(91, 63, 111, 0.09);
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
      color: #5d4374;
      font-weight: bold;
    }

    .track {
      height: 13px;
      overflow: hidden;
      background: #eee7f2;
      border-radius: 20px;
    }

    .bar {
      width: 0;
      height: 100%;
      background: linear-gradient(90deg, #c9a85c, #776094);
      border-radius: 20px;
      transition: width 0.4s ease;
    }

    .quiz-card {
      position: relative;
      padding: 22px 16px;
      overflow: hidden;
      background: #fffdf8;
      border: 2px solid #c9a85c;
      border-radius: 24px;
      box-shadow: 0 8px 22px rgba(91, 63, 111, 0.11);
      transition: background 0.4s ease;
    }

    .theme-1 {
      background: linear-gradient(145deg, #fffdf8, #f5ecfb);
    }

    .theme-2 {
      background: linear-gradient(145deg, #fffdf8, #fff7df);
    }

    .theme-3 {
      background: linear-gradient(145deg, #fffdf8, #f8f0fb);
    }

    .theme-4 {
      background: linear-gradient(145deg, #fffdf8, #edf8ef);
    }

    .theme-5 {
      background: linear-gradient(145deg, #fffdf8, #fff1f3);
    }

    .question-number {
      display: inline-block;
      margin-bottom: 14px;
      padding: 7px 14px;
      color: #5d4374;
      font-weight: bold;
      background: #f1e5f8;
      border: 1px solid #c9a85c;
      border-radius: 20px;
    }

    .question {
      margin: 8px 0 18px;
      color: #4b3a57;
      font-size: 22px;
      font-weight: bold;
      line-height: 1.7;
      text-align: center;
    }

    .sentence {
      margin-bottom: 16px;
      padding: 14px;
      color: #5d4374;
      font-size: 19px;
      font-weight: bold;
      text-align: center;
      background: #fffdf8;
      border: 2px dashed #c9a85c;
      border-radius: 15px;
    }

    .answers {
      display: grid;
      gap: 11px;
    }

    .answer {
      width: 100%;
      padding: 14px 11px;
      color: #4b3a57;
      font-family: inherit;
      font-size: 18px;
      cursor: pointer;
      background: linear-gradient(135deg, #f5ecfb, #fffaf2);
      border: 2px solid #d8c7e4;
      border-radius: 16px;
      transition:
        transform 0.18s ease,
        background 0.18s ease;
    }

    .answer:hover,
    .answer:active {
      background: #f1e5f8;
      transform: scale(0.99);
    }

    .answer.correct {
      color: #25663c;
      background: #e5f6e9;
      border-color: #4d9b64;
      animation: pop 0.45s ease;
    }

    .answer.wrong {
      color: #8e3d4c;
      background: #fff1f3;
      border-color: #c95c70;
      animation: shake 0.4s ease;
    }

    .feedback {
      display: none;
      margin-top: 15px;
      padding: 14px;
      font-weight: bold;
      line-height: 1.7;
      text-align: center;
      border-radius: 15px;
    }

    .feedback.success {
      display: block;
      color: #25663c;
      background: #e5f6e9;
      border: 2px solid #4d9b64;
    }

    .feedback.error {
      display: block;
      color: #8e3d4c;
      background: #fff1f3;
      border: 2px solid #c95c70;
    }

    .next-button {
      display: none;
      width: 100%;
      margin-top: 14px;
      padding: 14px;
      color: white;
      font-family: inherit;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      background: #6f5288;
      border: 2px solid #c9a85c;
      border-radius: 16px;
    }

    .next-button:hover,
    .next-button:active {
      background: #5b4677;
    }

    .result {
      display: none;
      padding: 24px 16px;
      text-align: center;
      background: #fffdf8;
      border: 2px solid #c9a85c;
      border-radius: 24px;
      box-shadow: 0 8px 22px rgba(91, 63, 111, 0.11);
    }

    .result h2 {
      margin-top: 0;
      color: #5d4374;
      font-size: 27px;
    }

    .score-circle {
      display: flex;
      width: 145px;
      height: 145px;
      margin: 18px auto;
      color: white;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #c9a85c, #776094);
      border: 4px solid #fffdf8;
      border-radius: 50%;
      box-shadow: 0 8px 18px rgba(91, 63, 111, 0.2);
    }

    .score-circle strong {
      font-size: 38px;
    }

    .restart,
    .back {
      display: block;
      width: 100%;
      margin-top: 12px;
      padding: 13px;
      font-family: inherit;
      font-size: 17px;
      font-weight: bold;
      text-align: center;
      cursor: pointer;
      border-radius: 15px;
    }

    .restart {
      color: white;
      background: #6f5288;
      border: 2px solid #c9a85c;
    }

    .back {
      color: white;
      text-decoration: none;
      background: #49385c;
      border: 2px solid #c9a85c;
    }

    .restart:hover,
    .restart:active,
    .back:hover,
    .back:active {
      background: #5b4677;
    }

    .confetti {
      position: fixed;
      top: -25px;
      width: 10px;
      height: 18px;
      z-index: 9999;
      pointer-events: none;
      border-radius: 3px;
      animation: fall linear forwards;
    }

    @keyframes pop {
      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.05);
      }
    }

    @keyframes shake {
      0%,
      100% {
        transform: translateX(0);
      }

      25% {
        transform: translateX(-8px);
      }

      50% {
        transform: translateX(8px);
      }

      75% {
        transform: translateX(-5px);
      }
    }

    @keyframes fall {
      from {
        opacity: 1;
        transform: translateY(-30px) rotate(0deg);
      }

      to {
        opacity: 0.8;
        transform: translateY(110vh) rotate(760deg);
      }
    }

    @media (max-width: 600px) {
      body {
        padding: 12px 8px;
      }

      .container {
        width: 96%;
      }

      .hero h1 {
        font-size: 24px;
      }

      .question {
        font-size: 20px;
      }

      .answer {
        font-size: 17px;
      }

      .progress-info {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="hero">
      <h1>✅ الاختبار التجريبي</h1>
      <p>أسلوب القسم</p>
    </div>

    <div class="progress-card">

      <div class="progress-info">
        <span id="progressText">السؤال 1 من 10</span>
        <span id="scoreText">النقاط: 0</span>
      </div>

      <div class="track">
        <div class="bar" id="progressBar"></div>
      </div>

    </div>

    <div class="quiz-card theme-1" id="quizCard">

      <div class="question-number" id="questionNumber">
        السؤال 1
      </div>

      <div class="question" id="question">
        جاري تحميل السؤال...
      </div>

      <div class="sentence" id="sentence"></div>

      <div class="answers" id="answers"></div>

      <div class="feedback" id="feedback"></div>

      <button class="next-button" id="nextButton">
        السؤال التالي ←
      </button>

    </div>

    <div class="result" id="result">

      <h2>🎉 أنهيتِ الاختبار</h2>

      <div class="score-circle">
        <strong id="finalScore">0/10</strong>
        <span>درجتك</span>
      </div>

      <p id="resultMessage"></p>

      <button class="restart" onclick="restartQuiz()">
        إعادة الاختبار
      </button>

      <a class="back" href="oath-style.html">
        العودة إلى درس أسلوب القسم
      </a>

    </div>

  </div>

  <script>
    const questions = [
      {
        question: "ما الغرض الأساسي من أسلوب القسم؟",
        sentence: "",
        answers: [
          "التوكيد وتقوية المعنى",
          "الاستفهام",
          "النداء"
        ],
        correct: "التوكيد وتقوية المعنى",
        explanation:
          "يُستخدم أسلوب القسم لتأكيد الخبر وتقوية معناه."
      },
      {
        question: "ما أداة القسم في الجملة؟",
        sentence: "واللهِ لأحافظنَّ على الأمانة.",
        answers: [
          "الله",
          "الواو",
          "لأحافظنَّ"
        ],
        correct: "الواو",
        explanation:
          "الواو أداة القسم، ولفظ الجلالة هو المقسم به."
      },
      {
        question: "ما المقسم به في الجملة؟",
        sentence: "باللهِ لن أكذب.",
        answers: [
          "الباء",
          "الله",
          "لن أكذب"
        ],
        correct: "الله",
        explanation:
          "المقسم به في الجملة هو لفظ الجلالة «الله»."
      },
      {
        question: "حددي جواب القسم:",
        sentence: "تاللهِ لأساعدنَّ المحتاج.",
        answers: [
          "التاء",
          "الله",
          "لأساعدنَّ المحتاج"
        ],
        correct: "لأساعدنَّ المحتاج",
        explanation:
          "جواب القسم هو الجملة التي توضّح الأمر الذي أقسم عليه المتكلم."
      },
      {
        question: "أي الكلمات الآتية فعل قسم؟",
        sentence: "",
        answers: [
          "أقسم",
          "لعلَّ",
          "ليت"
        ],
        correct: "أقسم",
        explanation:
          "من أفعال القسم: أقسم، وأحلف."
      },
      {
        question: "أي الجمل الآتية أسلوب قسم صحيح؟",
        sentence: "",
        answers: [
          "واللهِ لأقولنَّ الحق.",
          "يا طالبُ قل الحق.",
          "لعلّي أقول الحق."
        ],
        correct: "واللهِ لأقولنَّ الحق.",
        explanation:
          "هذه الجملة تحتوي على أداة قسم ومقسم به وجواب قسم."
      },
      {
        question: "أي الصيغ الآتية من صيغ القسم؟",
        sentence: "",
        answers: [
          "يمينُ الله",
          "هل تفعل؟",
          "ما أجمل الصدق!"
        ],
        correct: "يمينُ الله",
        explanation:
          "«يمينُ الله» من صيغ القسم."
      },
      {
        question: "اختاري الصياغة الأقوى في التوكيد:",
        sentence: "",
        answers: [
          "سأجتهد.",
          "واللهِ لأجتهدنَّ.",
          "ربما أجتهد."
        ],
        correct: "واللهِ لأجتهدنَّ.",
        explanation:
          "لام القسم ونون التوكيد تزيدان الجملة قوة وتوكيدًا."
      },
      {
        question: "ما حكم الحلف بغير الله؟",
        sentence: "وحياتي لأصدقنَّ.",
        answers: [
          "صحيح",
          "غير صحيح",
          "أسلوب تعجب"
        ],
        correct: "غير صحيح",
        explanation:
          "الإنسان لا يحلف إلا بالله، أو باسم من أسمائه، أو صفة من صفاته."
      },
      {
        question: "اختاري الجملة الصحيحة:",
        sentence: "",
        answers: [
          "والأمانة لن أكذب.",
          "واللهِ لن أكذب.",
          "وحياة أمي لن أكذب."
        ],
        correct: "واللهِ لن أكذب.",
        explanation:
          "الصحيح أن يكون الحلف بالله وحده."
      }
    ];

    const encouragements = [
      "رائعة! إجابة صحيحة 🌟",
      "أحسنتِ يا بطلة 👏",
      "ممتازة جدًا 🎉",
      "إجابة موفقة 💫",
      "استمري، أداؤك جميل ✅"
    ];

    const themes = [
      "theme-1",
      "theme-2",
      "theme-3",
      "theme-4",
      "theme-5"
    ];

    let currentQuestion = 0;
    let score = 0;
    let answered = false;

    const questionElement =
      document.getElementById("question");

    const sentenceElement =
      document.getElementById("sentence");

    const answersElement =
      document.getElementById("answers");

    const feedbackElement =
      document.getElementById("feedback");

    const nextButton =
      document.getElementById("nextButton");

    const progressText =
      document.getElementById("progressText");

    const scoreText =
      document.getElementById("scoreText");

    const progressBar =
      document.getElementById("progressBar");

    const questionNumber =
      document.getElementById("questionNumber");

    const quizCard =
      document.getElementById("quizCard");

    const result =
      document.getElementById("result");

    function loadQuestion() {
      answered = false;

      const item = questions[currentQuestion];

      questionElement.textContent = item.question;
      sentenceElement.textContent = item.sentence;
      answersElement.innerHTML = "";

      sentenceElement.style.display =
        item.sentence === "" ? "none" : "block";

      feedbackElement.className = "feedback";
      feedbackElement.textContent = "";
      nextButton.style.display = "none";

      progressText.textContent =
        `السؤال ${currentQuestion + 1} من ${questions.length}`;

      questionNumber.textContent =
        `السؤال ${currentQuestion + 1}`;

      scoreText.textContent =
        `النقاط: ${score}`;

      progressBar.style.width =
        `${(currentQuestion / questions.length) * 100}%`;

      themes.forEach(function (theme) {
        quizCard.classList.remove(theme);
      });

      quizCard.classList.add(
        themes[currentQuestion % themes.length]
      );

      item.answers.forEach(function (answer) {
        const button =
          document.createElement("button");

        button.type = "button";
        button.className = "answer";
        button.textContent = answer;

        button.addEventListener("click", function () {
          checkAnswer(button, answer);
        });

        answersElement.appendChild(button);
      });
    }

    function checkAnswer(button, selectedAnswer) {
      if (answered) {
        return;
      }

      answered = true;

      const item = questions[currentQuestion];
      const buttons =
        document.querySelectorAll(".answer");

      buttons.forEach(function (answerButton) {
        answerButton.disabled = true;

        if (answerButton.textContent === item.correct) {
          answerButton.classList.add("correct");
        }
      });

      if (selectedAnswer === item.correct) {
        score++;
        button.classList.add("correct");

        const message =
          encouragements[
            Math.floor(
              Math.random() * encouragements.length
            )
          ];

        feedbackElement.className =
          "feedback success";

        feedbackElement.innerHTML =
          `${message}<br>${item.explanation}`;

        scoreText.textContent =
          `النقاط: ${score}`;

        celebrate(55);
        playSuccessSound();
      } else {
        button.classList.add("wrong");

        feedbackElement.className =
          "feedback error";

        feedbackElement.innerHTML =
          `محاولة جميلة 🌷<br>${item.explanation}`;

        playWrongSound();
      }

      nextButton.style.display = "block";

      if (currentQuestion === questions.length - 1) {
        nextButton.textContent = "عرض النتيجة 🎯";
      } else {
        nextButton.textContent = "السؤال التالي ←";
      }
    }

    nextButton.addEventListener("click", function () {
      currentQuestion++;

      if (currentQuestion < questions.length) {
        loadQuestion();
      } else {
        showResult();
      }
    });

    function showResult() {
      quizCard.style.display = "none";
      result.style.display = "block";

      progressBar.style.width = "100%";
      progressText.textContent = "اكتمل الاختبار";
      scoreText.textContent = `النقاط: ${score}`;

      document.getElementById(
        "finalScore"
      ).textContent =
        `${score}/${questions.length}`;

      const resultMessage =
        document.getElementById("resultMessage");

      if (score === questions.length) {
        resultMessage.textContent =
          "مذهلة! أتقنتِ أسلوب القسم بالكامل 🏆";

        celebrate(130);
        playSuccessSound();
      } else if (score >= 8) {
        resultMessage.textContent =
          "نتيجة رائعة جدًا، بقيت لمسات بسيطة 🌟";

        celebrate(95);
      } else if (score >= 6) {
        resultMessage.textContent =
          "أداء جميل، راجعي الأسئلة التي أخطأتِ فيها 💛";

        celebrate(65);
      } else {
        resultMessage.textContent =
          "بداية طيبة، أعيدي المحاولة وستتحسن النتيجة 🌷";

        celebrate(40);
      }

      result.scrollIntoView({
        behavior: "smooth",
        block: "center"
      });
    }

    function restartQuiz() {
      currentQuestion = 0;
      score = 0;
      answered = false;

      result.style.display = "none";
      quizCard.style.display = "block";

      loadQuestion();

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }

    function celebrate(amount) {
      const colors = [
        "#776094",
        "#c9a85c",
        "#6f5288",
        "#4d9b64",
        "#c95c70",
        "#49385c"
      ];

      for (let i = 0; i < amount; i++) {
        const piece =
          document.createElement("span");

        piece.className = "confetti";

        piece.style.left =
          `${Math.random() * 100}vw`;

        piece.style.background =
          colors[
            Math.floor(
              Math.random() * colors.length
            )
          ];

        piece.style.animationDuration =
          `${2.2 + Math.random() * 2.2}s`;

        piece.style.animationDelay =
          `${Math.random() * 0.35}s`;

        document.body.appendChild(piece);

        setTimeout(function () {
          piece.remove();
        }, 5000);
      }
    }

    function playSuccessSound() {
      playTone(620, 0.12);

      setTimeout(function () {
        playTone(820, 0.16);
      }, 130);
    }

    function playWrongSound() {
      playTone(220, 0.18);
    }

    function playTone(frequency, duration) {
      try {
        const AudioContextClass =
          window.AudioContext ||
          window.webkitAudioContext;

        if (!AudioContextClass) {
          return;
        }

        const audioContext =
          new AudioContextClass();

        const oscillator =
          audioContext.createOscillator();

        const gain =
          audioContext.createGain();

        oscillator.connect(gain);
        gain.connect(audioContext.destination);

        oscillator.frequency.value = frequency;
        oscillator.type = "sine";

        gain.gain.setValueAtTime(
          0.08,
          audioContext.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
          0.001,
          audioContext.currentTime + duration
        );

        oscillator.start();

        oscillator.stop(
          audioContext.currentTime + duration
        );
      } catch (error) {
        console.log("تعذر تشغيل الصوت.");
      }
    }

    loadQuestion();
  </script>

</body>

</html>
