<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>خريطة مفاهيم درس العطف | منصة آفاق</title>

  <style>
    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      font-family:Tahoma,Arial,sans-serif;
      background:
        radial-gradient(circle at top right, #eee5f5 0, transparent 35%),
        linear-gradient(180deg, #fffdfb 0%, #f5f0fa 100%);
      color:#453457;
      text-align:center;
      min-height:100vh;
    }

    header{
      background:linear-gradient(135deg, #776094, #5b4677, #453457);
      color:#fff;
      padding:42px 20px;
      border-bottom:5px solid #b89a55;
      box-shadow:0 5px 18px rgba(69,52,87,0.25);
    }

    header h1{
      margin:0;
      font-size:30px;
      line-height:1.7;
    }

    header p{
      margin:8px 0 0;
      color:#e4d4a3;
      font-size:16px;
    }

    section{
      background:rgba(255,255,255,0.96);
      margin:35px auto;
      padding:28px;
      width:88%;
      max-width:750px;
      border-radius:22px;
      border:2px solid #e4d4a3;
      box-shadow:0 8px 25px rgba(69,52,87,0.14);
    }

    .box{
      background:linear-gradient(135deg, #f5f0fa, #eee5f5);
      margin:10px 0 24px;
      padding:35px 22px;
      border-radius:18px;
      border:1px solid #d8c3e6;
      color:#5b4677;
      font-size:21px;
      line-height:1.9;
      box-shadow:inset 0 0 0 3px rgba(255,255,255,0.55);
    }

    .icon{
      display:block;
      font-size:45px;
      margin-bottom:12px;
    }

    .back{
      display:inline-block;
      background:linear-gradient(135deg, #776094, #5b4677);
      color:#fff;
      font-weight:bold;
      text-decoration:none;
      padding:13px 25px;
      border-radius:30px;
      border:2px solid #e4d4a3;
      box-shadow:0 5px 13px rgba(69,52,87,0.22);
      transition:0.25s;
    }

    .back:hover{
      transform:translateY(-2px);
      background:linear-gradient(135deg, #5b4677, #453457);
    }

    footer{
      background:linear-gradient(135deg, #453457, #5b4677);
      color:#fff;
      padding:21px 15px;
      margin-top:35px;
      border-top:4px solid #b89a55;
      font-size:14px;
    }

    footer span{
      color:#e4d4a3;
      font-weight:bold;
    }

    @media (max-width:600px){
      header{
        padding:32px 15px;
      }

      header h1{
        font-size:24px;
      }

      section{
        width:92%;
        padding:20px 15px;
      }

      .box{
        padding:28px 15px;
        font-size:18px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>🧠 خريطة مفاهيم درس العطف</h1>
    <p>منصة آفاق للغة العربية</p>
  </header>

  <section>

    <div class="box">
      <span class="icon">🗺️</span>
      سيتم إضافة خريطة مفاهيم درس العطف هنا
    </div>

    <a class="back" href="conjunction.html">
      ↩ العودة إلى درس العطف
    </a>

  </section>

  <footer>
    جميع الحقوق محفوظة © 2026
    <span>منصة آفاق</span>
  </footer>

</body>
</html>
