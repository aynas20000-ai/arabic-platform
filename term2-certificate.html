<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>
شهادة الفصل الدراسي الثاني | منصة آفاق
</title>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
}

body{
  font-family:Tahoma,Arial,sans-serif;
  background:#f6f1e7;
  color:#222;
}

.page{
  min-height:100vh;
  padding:18px 7px 32px;
}

.toolbar{
  display:flex;
  justify-content:center;
  align-items:center;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:16px;
}

.toolbar button,
.toolbar a{
  border:0;
  border-radius:14px;
  padding:12px 18px;
  font-family:inherit;
  font-size:15px;
  font-weight:bold;
  text-decoration:none;
  text-align:center;
}

.print-btn{
  background:#2f7449;
  color:#fff;
  cursor:pointer;
}

.print-btn:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.back-btn{
  background:#f1ead9;
  color:#604a24;
  border:1px solid #d5bd81 !important;
}

.certificate-wrap{
  width:min(1200px,100%);
  margin:auto;
}

.certificate{
  position:relative;

  width:100%;

  aspect-ratio:1440 / 1024;

  background-image:url("500.png");
  background-repeat:no-repeat;
  background-position:center;
  background-size:100% 100%;

  overflow:hidden;

  box-shadow:
    0 15px 40px rgba(0,0,0,.15);
}


/* =========================
   عبارة تُمنح
========================= */

.award-intro{
  position:absolute;

  top:38.8%;
  left:29%;

  width:57%;

  text-align:center;

  font-size:
    clamp(13px,1.55vw,22px);

  font-weight:700;

  line-height:1.3;

  color:#333;
}


/* =========================
   اسم الطالبة
========================= */

.student-name{
  position:absolute;

  top:43.7%;
  left:27%;

  width:61%;

  text-align:center;

  font-size:
    clamp(23px,3vw,42px);

  font-weight:900;

  line-height:1.25;

  color:#34752e;

  white-space:nowrap;
}


/* =========================
   الديباجة
========================= */

.award-text{
  position:absolute;

  top:51.3%;
  left:30%;

  width:55%;

  text-align:center;

  font-size:
    clamp(11px,1.28vw,18px);

  font-weight:600;

  line-height:1.75;

  color:#333;
}


/* =========================
   النتيجة
========================= */

.result-line{
  position:absolute;

  top:65.3%;
  left:30%;

  width:55%;

  display:flex;
  justify-content:center;
  align-items:center;
  flex-wrap:wrap;

  gap:8px 22px;

  text-align:center;

  font-size:
    clamp(11px,1.25vw,18px);

  font-weight:bold;
}

.percent{
  color:#874a1d;
}

.grade{
  color:#326c37;
}


/* =========================
   رسائل الصفحة
========================= */

.status{
  width:min(900px,94%);
  margin:16px auto 0;
  padding:15px 18px;

  text-align:center;

  border-radius:18px;

  font-weight:bold;
}

.status.loading{
  background:#fff;
  color:#67563a;
}

.status.success{
  background:#edf8f1;
  color:#24653d;
  border:1px solid #a9d0b6;
}

.status.error{
  background:#fff1f1;
  color:#8b2f2f;
  border:1px solid #e0b0b0;
}

.hidden{
  display:none !important;
}


/* =========================
   الجوال
========================= */

@media(max-width:700px){

  .page{
    padding:8px 3px 25px;
  }

  .certificate{
    box-shadow:none;
  }

  .award-intro{
    top:38.5%;
  }

  .student-name{
    top:43.5%;
    font-size:clamp(16px,5vw,28px);
  }

  .award-text{
    top:51%;
    line-height:1.6;
  }

  .result-line{
    top:65%;
    gap:3px 9px;
  }

}


/* =========================
   الطباعة
========================= */

@media print{

  @page{
    size:A4 landscape;
    margin:0;
  }

  html,
  body{
    width:100%;
    height:100%;
    background:#fff;
  }

  .page{
    padding:0;
    min-height:auto;
  }

  .toolbar,
  .status{
    display:none !important;
  }

  .certificate-wrap{
    width:100%;
    margin:0;
  }

  .certificate{
    width:100vw;
    height:100vh;

    aspect-ratio:auto;

    box-shadow:none;

    background-size:100% 100%;

    -webkit-print-color-adjust:exact;
    print-color-adjust:exact;
  }

}

</style>

</head>

<body>

<div class="page">

  <div class="toolbar">

    <button
      id="printBtn"
      class="print-btn"
      type="button"
      disabled
    >
      طباعة الشهادة / حفظها PDF
    </button>

    <a
      href="tests-term2.html"
      class="back-btn"
    >
      العودة إلى اختبارات الفصل الثاني
    </a>

  </div>


  <div
    id="certificateWrap"
    class="certificate-wrap hidden"
  >

    <div class="certificate">

      <div class="award-intro">
        تُمنح هذه الشهادة للطالبة
      </div>


      <div
        id="studentName"
        class="student-name"
      ></div>


      <div class="award-text">

        تقديرًا لتميّزها واجتهادها في مادة لغتي الخالدة،<br>

        وإتمامها متطلبات الفصل الدراسي الثاني بنجاح،<br>

        مع أطيب الأمنيات لها بمزيد من التميز والتوفيق.

      </div>


      <div class="result-line">

        <span
          id="studentPercent"
          class="percent"
        ></span>

        <span
          id="studentGrade"
          class="grade"
        ></span>

      </div>

    </div>

  </div>


  <div
    id="status"
    class="status loading"
  >
    جارٍ التحقق من استحقاق الشهادة...
  </div>

</div>
<script type="module">

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";


import {
  initializeAuth,
  browserLocalPersistence,
  browserPopupRedirectResolver,
  onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


import {
  getFirestore,
  doc,
  getDoc
}
from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyB48av9gx4jzFyYoUQtcLwaR52qETevKGs",

  authDomain:
    "afaq-language-platform.firebaseapp.com",

  projectId:
    "afaq-language-platform",

  storageBucket:
    "afaq-language-platform.firebasestorage.app",

  messagingSenderId:
    "362601061474",

  appId:
    "1:362601061474:web:bc405291332b9e4ef9453b"

};


const app =
  initializeApp(
    firebaseConfig
  );


const auth =
  initializeAuth(
    app,
    {

      persistence:
        browserLocalPersistence,

      popupRedirectResolver:
        browserPopupRedirectResolver

    }
  );


const db =
  getFirestore(
    app
  );


const statusBox =
  document.getElementById(
    "status"
  );


const certificateWrap =
  document.getElementById(
    "certificateWrap"
  );


const studentName =
  document.getElementById(
    "studentName"
  );


const studentPercent =
  document.getElementById(
    "studentPercent"
  );


const studentGrade =
  document.getElementById(
    "studentGrade"
  );


const printBtn =
  document.getElementById(
    "printBtn"
  );


function arabicDigits(value){

  return String(value).replace(
    /\d/g,
    d => "٠١٢٣٤٥٦٧٨٩"[d]
  );

}


function getGrade(percent){

  if(percent >= 95){
    return "ممتاز مرتفع";
  }

  if(percent >= 90){
    return "ممتاز";
  }

  if(percent >= 85){
    return "جيد جدًا مرتفع";
  }

  if(percent >= 80){
    return "جيد جدًا";
  }

  return "";

}


function getStudentName(
  data,
  user
){

  let name =

    data["الاسم_الرباعي"] ||

    data["الاسم الرباعي"] ||

    data["اسم_الطالبة_الرباعي"] ||

    data["اسم الطالبة الرباعي"] ||

    data["الاسم_الكامل"] ||

    data["الاسم الكامل"] ||

    data["اسم_الطالبة"] ||

    data["الاسم"] ||

    user.displayName ||

    data["name"] ||

    "الطالبة";


  name =
    String(name).trim();


  if(
    name ===
    "إيناس محمد يحيى"
  ){

    name =
      "إيناس محمد يحيى مدخلي";

  }


  return name;

}
  onAuthStateChanged(
  auth,
  async user => {


    if(!user){

      statusBox.className =
        "status error";


      statusBox.textContent =
        "يلزم تسجيل الدخول أولًا لعرض الشهادة.";


      certificateWrap.classList.add(
        "hidden"
      );


      printBtn.disabled =
        true;


      return;

    }


    try{

      const studentRef =
        doc(
          db,
          "students",
          user.uid
        );


      const snapshot =
        await getDoc(
          studentRef
        );


      if(
        !snapshot.exists()
      ){

        throw new Error(
          "student-not-found"
        );

      }


      const data =
        snapshot.data();


      const result =
        data[
          "نتيجة_الفصل_الثاني"
        ] || {};


      const completed =
        result[
          "مكتمل"
        ] === true;


      const percent =
        Number(
          result[
            "الدرجة"
          ] || 0
        );


      const eligible =
        result[
          "استحقت_الشهادة"
        ] === true;


      if(
        !completed
      ){

        statusBox.className =
          "status error";


        statusBox.textContent =
          "لم تكتمل نتيجة الفصل الدراسي الثاني بعد.";


        certificateWrap.classList.add(
          "hidden"
        );


        printBtn.disabled =
          true;


        return;

      }


      if(
        !eligible ||
        percent < 80
      ){

        statusBox.className =
          "status error";


        statusBox.textContent =
          "لم يتحقق شرط استحقاق الشهادة بعد.";


        certificateWrap.classList.add(
          "hidden"
        );


        printBtn.disabled =
          true;


        return;

      }


      const name =
        getStudentName(
          data,
          user
        );


      studentName.textContent =
        name;


      studentPercent.textContent =
        `النسبة: ${arabicDigits(percent)}٪`;


      studentGrade.textContent =
        `التقدير: ${getGrade(percent)}`;


      certificateWrap.classList.remove(
        "hidden"
      );


      statusBox.className =
        "status success";


      statusBox.textContent =
        "أحسنتِ، لقد استحققتِ شهادة الفصل الدراسي الثاني 🌟";


      printBtn.disabled =
        false;


    }catch(error){


      console.error(
        "خطأ في تحميل الشهادة:",
        error
      );


      certificateWrap.classList.add(
        "hidden"
      );


      printBtn.disabled =
        true;


      statusBox.className =
        "status error";


      statusBox.textContent =
        "تعذّر تحميل بيانات الشهادة.";

    }

  }
);


printBtn.addEventListener(
  "click",
  () => {

    window.print();

  }
);

</script>

</body>

</html>
