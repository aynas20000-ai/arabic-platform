<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>
شهادة الفصل الدراسي الثاني | منصة آفاق
</title>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  min-height:100%;
}

body{
  font-family:Tahoma,Arial,sans-serif;
  background:#f5f1e8;
  color:#2d2d2d;
}

.page{
  min-height:100vh;
  padding:18px 10px 32px;
}

.toolbar{
  width:min(1200px,96%);
  margin:0 auto 16px;
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  justify-content:center;
  align-items:center;
}

.toolbar button,
.toolbar a{
  border:0;
  border-radius:14px;
  padding:12px 18px;
  font-family:inherit;
  font-size:15px;
  font-weight:bold;
  text-decoration:none;
  cursor:pointer;
  text-align:center;
}

.print-btn{
  background:#2d6f43;
  color:#fff;
}

.print-btn:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.back-btn{
  background:#eee6d3;
  color:#5a4722;
  border:1px solid #d4bd82 !important;
}

.certificate-wrap{
  width:min(1200px,100%);
  margin:auto;
}

.certificate{
  position:relative;
  width:100%;
  aspect-ratio:1440 / 1024;
  background-image:url("500.png");
  background-size:100% 100%;
  background-position:center;
  background-repeat:no-repeat;
  overflow:hidden;
  box-shadow:0 18px 44px rgba(0,0,0,.17);
}

.student-name{
  position:absolute;
  top:48%;
  left:29%;
  width:58%;
  text-align:center;
  font-size:clamp(22px,3vw,42px);
  line-height:1.4;
  font-weight:bold;
  color:#2f6f2a;
  text-shadow:0 1px 0 rgba(255,255,255,.8);
}

.student-percent{
  position:absolute;
  top:56.5%;
  left:31%;
  width:54%;
  text-align:center;
  font-size:clamp(18px,2.2vw,30px);
  font-weight:bold;
  color:#8a4f1f;
}

.student-grade{
  position:absolute;
  top:61.5%;
  left:31%;
  width:54%;
  text-align:center;
  font-size:clamp(17px,2vw,27px);
  font-weight:bold;
  color:#2f5f31;
}

.student-date{
  position:absolute;
  top:67%;
  left:31%;
  width:54%;
  text-align:center;
  font-size:clamp(15px,1.7vw,23px);
  font-weight:bold;
  color:#3f3f3f;
}

.status{
  width:min(900px,94%);
  margin:16px auto 0;
  padding:15px 18px;
  border-radius:18px;
  text-align:center;
  font-weight:bold;
  background:#fff;
  box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.status.loading{
  color:#67563a;
}

.status.success{
  color:#24653d;
  background:#edf8f1;
  border:1px solid #a9d0b6;
}

.status.error{
  color:#8b2f2f;
  background:#fff1f1;
  border:1px solid #e0b0b0;
}

.hidden{
  display:none !important;
}

@media(max-width:700px){

  .page{
    padding:10px 4px 25px;
  }

  .certificate-wrap{
    width:100%;
  }

  .certificate{
    box-shadow:none;
  }

  .student-name{
    top:48%;
    left:28%;
    width:60%;
  }

  .student-percent{
    top:56.5%;
  }

  .student-grade{
    top:61.5%;
  }

  .student-date{
    top:67%;
  }

}

@media print{

  @page{
    size:A4 landscape;
    margin:0;
  }

  html,
  body{
    width:100%;
    height:100%;
    background:#fff;
  }

  body{
    margin:0;
  }

  .page{
    padding:0;
    min-height:auto;
  }

  .toolbar,
  .status{
    display:none !important;
  }

  .certificate-wrap{
    width:100%;
    margin:0;
  }

  .certificate{
    width:100vw;
    height:100vh;
    aspect-ratio:auto;
    box-shadow:none;
    background-size:100% 100%;
    -webkit-print-color-adjust:exact;
    print-color-adjust:exact;
  }

}

</style>

</head>

<body>

<div class="page">

  <div class="toolbar">

    <button
      class="print-btn"
      id="printBtn"
      type="button"
      disabled
    >
      طباعة الشهادة / حفظها PDF
    </button>

    <a
      class="back-btn"
      href="tests-term2.html"
    >
      العودة إلى اختبارات الفصل الثاني
    </a>

  </div>


  <div
    class="certificate-wrap hidden"
    id="certificateWrap"
  >

    <div
      class="certificate"
      id="certificate"
    >

      <div
        class="student-name"
        id="studentName"
      ></div>

      <div
        class="student-percent"
        id="studentPercent"
      ></div>

      <div
        class="student-grade"
        id="studentGrade"
      ></div>

      <div
        class="student-date"
        id="studentDate"
      ></div>

    </div>

  </div>


  <div
    class="status loading"
    id="status"
  >
    جارٍ التحقق من استحقاق الشهادة...
  </div>

</div>
<script type="module">

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";


import {
  initializeAuth,
  browserLocalPersistence,
  browserPopupRedirectResolver,
  onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


import {
  getFirestore,
  doc,
  getDoc
}
from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyB48av9gx4jzFyYoUQtcLwaR52qETevKGs",

  authDomain:
    "afaq-language-platform.firebaseapp.com",

  projectId:
    "afaq-language-platform",

  storageBucket:
    "afaq-language-platform.firebasestorage.app",

  messagingSenderId:
    "362601061474",

  appId:
    "1:362601061474:web:bc405291332b9e4ef9453b"

};


const app =
  initializeApp(
    firebaseConfig
  );


const auth =
  initializeAuth(
    app,
    {
      persistence:
        browserLocalPersistence,

      popupRedirectResolver:
        browserPopupRedirectResolver
    }
  );


const db =
  getFirestore(
    app
  );


const statusBox =
  document.getElementById(
    "status"
  );


const certificateWrap =
  document.getElementById(
    "certificateWrap"
  );


const studentName =
  document.getElementById(
    "studentName"
  );


const studentPercent =
  document.getElementById(
    "studentPercent"
  );


const studentGrade =
  document.getElementById(
    "studentGrade"
  );


const studentDate =
  document.getElementById(
    "studentDate"
  );


const printBtn =
  document.getElementById(
    "printBtn"
  );


function arabicDigits(value){

  return String(value).replace(
    /\d/g,
    digit =>
      "٠١٢٣٤٥٦٧٨٩"[digit]
  );

}


function getGrade(percent){

  if(percent >= 95){
    return "ممتاز مرتفع";
  }

  if(percent >= 90){
    return "ممتاز";
  }

  if(percent >= 85){
    return "جيد جدًا مرتفع";
  }

  if(percent >= 80){
    return "جيد جدًا";
  }

  if(percent >= 70){
    return "جيد";
  }

  if(percent >= 60){
    return "مقبول";
  }

  return "تحتاج إلى مزيد من المراجعة";

}


function formatDate(){

  const now =
    new Date();


  return now.toLocaleDateString(
    "ar-SA",
    {
      year:"numeric",
      month:"long",
      day:"numeric"
    }
  );

}


function getStudentName(data,user){

  return (

    data["الاسم"] ||

    data["اسم_الطالبة"] ||

    data["الاسم_الكامل"] ||

    data["name"] ||

    user.displayName ||

    "الطالبة"

  );

}
  onAuthStateChanged(
  auth,
  async user => {

    if(!user){

      statusBox.className =
        "status error";


      statusBox.textContent =
        "يلزم تسجيل الدخول إلى المنصة أولًا لعرض الشهادة.";


      certificateWrap.classList.add(
        "hidden"
      );


      printBtn.disabled =
        true;


      return;

    }


    try{

      const studentRef =
        doc(
          db,
          "students",
          user.uid
        );


      const snapshot =
        await getDoc(
          studentRef
        );


      if(
        !snapshot.exists()
      ){

        throw new Error(
          "student-not-found"
        );

      }


      const data =
        snapshot.data();


      const result =
        data[
          "نتيجة_الفصل_الثاني"
        ] || {};


      const completed =
        result[
          "مكتمل"
        ] === true;


      const percent =
        Number(
          result[
            "الدرجة"
          ] || 0
        );


      const certificateEligible =
        result[
          "استحقت_الشهادة"
        ] === true;


      if(
        !completed
      ){

        statusBox.className =
          "status error";


        statusBox.textContent =
          "لم تكتمل نتيجة الفصل الدراسي الثاني بعد.";


        certificateWrap.classList.add(
          "hidden"
        );


        printBtn.disabled =
          true;


        return;

      }


      if(
        !certificateEligible ||
        percent < 80
      ){

        statusBox.className =
          "status error";


        statusBox.textContent =
          "لم يتحقق شرط استحقاق الشهادة بعد. يلزم تحقيق نسبة ٨٠٪ فأعلى.";


        certificateWrap.classList.add(
          "hidden"
        );


        printBtn.disabled =
          true;


        return;

      }


      const name =
        getStudentName(
          data,
          user
        );


      studentName.textContent =
        name;


      studentPercent.textContent =
        `النسبة: ${arabicDigits(percent)}٪`;


      studentGrade.textContent =
        `التقدير: ${getGrade(percent)}`;


      studentDate.textContent =
        `التاريخ: ${formatDate()}`;


      certificateWrap.classList.remove(
        "hidden"
      );


      statusBox.className =
        "status success";


      statusBox.textContent =
        "أحسنتِ، لقد استحققتِ شهادة الفصل الدراسي الثاني 🌟";


      printBtn.disabled =
        false;


    }catch(error){


      console.error(
        "خطأ في تحميل الشهادة:",
        error
      );


      certificateWrap.classList.add(
        "hidden"
      );


      printBtn.disabled =
        true;


      statusBox.className =
        "status error";


      statusBox.textContent =
        "تعذّر تحميل بيانات الشهادة الآن.";

    }

  }
);


printBtn.addEventListener(
  "click",
  () => {

    window.print();

  }
);

</script>

</body>

</html>
