<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>
شهادة الفصل الدراسي الثاني | منصة آفاق
</title>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
}

body{
  font-family:Tahoma,Arial,sans-serif;
  background:#f5f1e8;
  color:#2c2c2c;
}

.page{
  min-height:100vh;
  padding:18px 8px 35px;
}

.toolbar{
  width:min(1200px,96%);
  margin:0 auto 16px;
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  justify-content:center;
}

.toolbar button,
.toolbar a{
  border:0;
  border-radius:14px;
  padding:12px 18px;
  font-family:inherit;
  font-size:15px;
  font-weight:bold;
  text-align:center;
  text-decoration:none;
  cursor:pointer;
}

.print-btn{
  background:#2f7449;
  color:#fff;
}

.print-btn:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.back-btn{
  background:#efe7d4;
  color:#5c4822;
  border:1px solid #d4bd82 !important;
}

.certificate-wrap{
  width:min(1200px,100%);
  margin:auto;
}

.certificate{
  position:relative;
  width:100%;
  aspect-ratio:1440 / 1024;

  background-image:url("500.png");
  background-size:100% 100%;
  background-position:center;
  background-repeat:no-repeat;

  overflow:hidden;

  box-shadow:
    0 18px 44px rgba(0,0,0,.16);
}


/* =========================
   محتوى الشهادة
========================= */

.certificate-content{
  position:absolute;

  top:42%;
  left:27%;

  width:61%;
  height:37%;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;

  text-align:center;
}


/* عبارة تمنح */

.award-intro{
  margin:0 0 5px;

  font-size:
    clamp(14px,1.65vw,23px);

  font-weight:bold;

  color:#4a4a4a;
}


/* اسم الطالبة */

.student-name{
  margin:0 0 10px;

  width:100%;

  font-size:
    clamp(23px,3.2vw,44px);

  font-weight:900;

  color:#317629;

  line-height:1.35;

  text-shadow:
    0 1px 0 rgba(255,255,255,.9);
}


/* الديباجة */

.award-text{
  width:88%;

  margin:0 auto 12px;

  font-size:
    clamp(12px,1.48vw,21px);

  line-height:1.85;

  font-weight:600;

  color:#333;
}


/* النتيجة */

.result-line{
  display:flex;

  justify-content:center;
  align-items:center;

  flex-wrap:wrap;

  gap:10px 22px;

  width:100%;

  margin-top:2px;

  font-size:
    clamp(13px,1.5vw,21px);

  font-weight:bold;
}

.percent{
  color:#8a4d1b;
}

.grade{
  color:#2f6b35;
}


/* التاريخ */

.student-date{
  margin-top:8px;

  font-size:
    clamp(12px,1.35vw,19px);

  font-weight:bold;

  color:#444;
}


/* حالة الصفحة */

.status{
  width:min(900px,94%);

  margin:16px auto 0;

  padding:15px 18px;

  border-radius:18px;

  text-align:center;

  font-weight:bold;

  background:#fff;

  box-shadow:
    0 8px 20px rgba(0,0,0,.08);
}

.status.loading{
  color:#67563a;
}

.status.success{
  color:#24653d;
  background:#edf8f1;
  border:1px solid #a9d0b6;
}

.status.error{
  color:#8b2f2f;
  background:#fff1f1;
  border:1px solid #e0b0b0;
}

.hidden{
  display:none !important;
}


/* الجوال */

@media(max-width:700px){

  .page{
    padding:10px 3px 26px;
  }

  .certificate{
    box-shadow:none;
  }

  .certificate-content{
    top:41%;
    left:27%;
    width:61%;
    height:39%;
  }

  .award-intro{
    margin-bottom:2px;
  }

  .student-name{
    margin-bottom:4px;
  }

  .award-text{
    line-height:1.65;
    margin-bottom:5px;
  }

  .result-line{
    gap:4px 10px;
  }

  .student-date{
    margin-top:3px;
  }

}


/* الطباعة */

@media print{

  @page{
    size:A4 landscape;
    margin:0;
  }

  html,
  body{
    width:100%;
    height:100%;
    margin:0;
    background:#fff;
  }

  .page{
    padding:0;
    min-height:auto;
  }

  .toolbar,
  .status{
    display:none !important;
  }

  .certificate-wrap{
    width:100%;
    margin:0;
  }

  .certificate{
    width:100vw;
    height:100vh;

    aspect-ratio:auto;

    box-shadow:none;

    background-size:100% 100%;

    -webkit-print-color-adjust:exact;
    print-color-adjust:exact;
  }

}

</style>

</head>

<body>

<div class="page">

  <div class="toolbar">

    <button
      class="print-btn"
      id="printBtn"
      type="button"
      disabled
    >
      طباعة الشهادة / حفظها PDF
    </button>

    <a
      class="back-btn"
      href="tests-term2.html"
    >
      العودة إلى اختبارات الفصل الثاني
    </a>

  </div>


  <div
    class="certificate-wrap hidden"
    id="certificateWrap"
  >

    <div
      class="certificate"
      id="certificate"
    >

      <div class="certificate-content">

        <div class="award-intro">
          تُمنح هذه الشهادة للطالبة
        </div>

        <div
          class="student-name"
          id="studentName"
        ></div>

        <div class="award-text">
          تقديرًا لتميّزها واجتهادها في مادة لغتي الخالدة،
          وإتمامها متطلبات الفصل الدراسي الثاني بنجاح،
          وتحقيقها مستوى متميزًا من الإتقان،
          سائلين الله لها دوام التوفيق والنجاح،
          ومزيدًا من التميز والإبداع.
        </div>

        <div class="result-line">

          <span
            class="percent"
            id="studentPercent"
          ></span>

          <span
            class="grade"
            id="studentGrade"
          ></span>

        </div>

        <div
          class="student-date"
          id="studentDate"
        ></div>

      </div>

    </div>

  </div>


  <div
    class="status loading"
    id="status"
  >
    جارٍ التحقق من استحقاق الشهادة...
  </div>

</div>
<script type="module">

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";


import {
  initializeAuth,
  browserLocalPersistence,
  browserPopupRedirectResolver,
  onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


import {
  getFirestore,
  doc,
  getDoc
}
from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyB48av9gx4jzFyYoUQtcLwaR52qETevKGs",

  authDomain:
    "afaq-language-platform.firebaseapp.com",

  projectId:
    "afaq-language-platform",

  storageBucket:
    "afaq-language-platform.firebasestorage.app",

  messagingSenderId:
    "362601061474",

  appId:
    "1:362601061474:web:bc405291332b9e4ef9453b"

};


const app =
  initializeApp(
    firebaseConfig
  );


const auth =
  initializeAuth(
    app,
    {

      persistence:
        browserLocalPersistence,

      popupRedirectResolver:
        browserPopupRedirectResolver

    }
  );


const db =
  getFirestore(
    app
  );


const statusBox =
  document.getElementById(
    "status"
  );


const certificateWrap =
  document.getElementById(
    "certificateWrap"
  );


const studentName =
  document.getElementById(
    "studentName"
  );


const studentPercent =
  document.getElementById(
    "studentPercent"
  );


const studentGrade =
  document.getElementById(
    "studentGrade"
  );


const studentDate =
  document.getElementById(
    "studentDate"
  );


const printBtn =
  document.getElementById(
    "printBtn"
  );


function arabicDigits(value){

  return String(value).replace(
    /\d/g,
    digit =>
      "٠١٢٣٤٥٦٧٨٩"[digit]
  );

}


function getGrade(percent){

  if(percent >= 95){
    return "ممتاز مرتفع";
  }

  if(percent >= 90){
    return "ممتاز";
  }

  if(percent >= 85){
    return "جيد جدًا مرتفع";
  }

  if(percent >= 80){
    return "جيد جدًا";
  }

  if(percent >= 70){
    return "جيد";
  }

  if(percent >= 60){
    return "مقبول";
  }

  return "تحتاج إلى مزيد من المراجعة";

}


function formatDate(){

  const now =
    new Date();


  return now.toLocaleDateString(
    "ar-SA",
    {
      year:"numeric",
      month:"long",
      day:"numeric"
    }
  );

}


/*
  نبحث أولًا عن الاسم الرباعي أو الكامل،
  ثم ننتقل للحقول الأخرى إذا لم يكن موجودًا.
*/

function getStudentName(
  data,
  user
){

  const fullName =

    data["الاسم_الرباعي"] ||

    data["الاسم الرباعي"] ||

    data["الاسم_الكامل"] ||

    data["الاسم الكامل"] ||

    data["اسم_الطالبة_الرباعي"] ||

    data["اسم الطالبة الرباعي"] ||

    user.displayName ||

    data["اسم_الطالبة"] ||

    data["الاسم"] ||

    data["name"] ||

    "الطالبة";


  return String(
    fullName
  ).trim();

}
  onAuthStateChanged(
  auth,
  async user => {


    if(!user){

      statusBox.className =
        "status error";


      statusBox.textContent =
        "يلزم تسجيل الدخول إلى المنصة أولًا لعرض الشهادة.";


      certificateWrap.classList.add(
        "hidden"
      );


      printBtn.disabled =
        true;


      return;

    }


    try{

      const studentRef =
        doc(
          db,
          "students",
          user.uid
        );


      const snapshot =
        await getDoc(
          studentRef
        );


      if(
        !snapshot.exists()
      ){

        throw new Error(
          "student-not-found"
        );

      }


      const data =
        snapshot.data();


      const result =
        data[
          "نتيجة_الفصل_الثاني"
        ] || {};


      const completed =
        result[
          "مكتمل"
        ] === true;


      const percent =
        Number(
          result[
            "الدرجة"
          ] || 0
        );


      const certificateEligible =
        result[
          "استحقت_الشهادة"
        ] === true;


      if(
        !completed
      ){

        statusBox.className =
          "status error";


        statusBox.textContent =
          "لم تكتمل نتيجة الفصل الدراسي الثاني بعد.";


        certificateWrap.classList.add(
          "hidden"
        );


        printBtn.disabled =
          true;


        return;

      }


      if(
        !certificateEligible ||
        percent < 80
      ){

        statusBox.className =
          "status error";


        statusBox.textContent =
          "لم يتحقق شرط استحقاق الشهادة بعد. يلزم تحقيق نسبة ٨٠٪ فأعلى.";


        certificateWrap.classList.add(
          "hidden"
        );


        printBtn.disabled =
          true;


        return;

      }


      const name =
        getStudentName(
          data,
          user
        );


      studentName.textContent =
        name;


      studentPercent.textContent =
        `النسبة: ${arabicDigits(percent)}٪`;


      studentGrade.textContent =
        `التقدير: ${getGrade(percent)}`;


      studentDate.textContent =
        `التاريخ: ${formatDate()}`;


      certificateWrap.classList.remove(
        "hidden"
      );


      statusBox.className =
        "status success";


      statusBox.textContent =
        "أحسنتِ، لقد استحققتِ شهادة الفصل الدراسي الثاني 🌟";


      printBtn.disabled =
        false;


    }catch(error){


      console.error(
        "خطأ في تحميل الشهادة:",
        error
      );


      certificateWrap.classList.add(
        "hidden"
      );


      printBtn.disabled =
        true;


      statusBox.className =
        "status error";


      statusBox.textContent =
        "تعذّر تحميل بيانات الشهادة الآن.";

    }

  }
);


printBtn.addEventListener(
  "click",
  () => {

    window.print();

  }
);

</script>

</body>

</html>
