<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>خريطة مفاهيم النعت | منصة آفاق</title>
<style>
:root{--p:#5b4677;--p2:#776094;--pd:#453457;--lav:#eee5f5;--g:#b69750;--gl:#ead9a8;--paper:#fffdf9;--text:#403448;--muted:#766d7c;--shadow:0 15px 34px rgba(73,54,92,.14)}
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;color:var(--text);background:linear-gradient(180deg,#f5f0fa,#fbf9fd,#f1ebf7);min-height:100vh;line-height:1.8}
header{text-align:center;color:#fff;padding:34px 18px 30px;background:linear-gradient(145deg,var(--p2),var(--p),var(--pd));border-bottom:5px solid var(--g)}
.tag{display:inline-block;padding:5px 13px;border-radius:999px;border:1px solid rgba(234,217,168,.8);background:rgba(182,151,80,.14);color:#fff3cd;font-size:13px;font-weight:bold}
header h1{margin:7px 0 2px;font-size:clamp(29px,7vw,42px)}header p{margin:0;color:#f2ebf6;font-size:15px}
main{width:min(1000px,94%);margin:22px auto 45px}
.intro,.map-card{background:var(--paper);border:1px solid var(--gl);border-radius:22px;box-shadow:var(--shadow)}
.intro{text-align:center;padding:17px 16px;margin-bottom:17px}.intro h2{margin:0;color:var(--p);font-size:22px}.intro p{margin:4px 0 0;color:var(--muted);font-size:14px}
.map-card{border-color:var(--g);padding:14px;overflow:hidden}.map-card img{display:block;width:100%;height:auto;margin:auto;border-radius:18px;border:1px solid #eadfcb;background:#fff}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.btn{display:block;text-align:center;text-decoration:none;padding:12px 14px;border-radius:14px;font-weight:bold}
.lesson{color:#fff;background:linear-gradient(145deg,var(--p2),var(--p));border:1px solid var(--g)}
.lessons{color:var(--pd);background:var(--lav);border:1px solid #d9cbe1}
footer{text-align:center;background:#3e304d;color:#eee8f2;border-top:2px solid var(--g);padding:18px 12px;font-size:13px}
@media(max-width:600px){main{width:94%}.map-card{padding:8px}.buttons{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><span class="tag">منصة آفاق التعليمية</span><h1>خريطة مفاهيم النعت</h1><p>ملخص بصري شامل لدرس النعت</p></header>
<main>
<section class="intro"><h2>راجعي درس النعت في خريطة واحدة ✨</h2><p>التعريف، الأركان، الأنواع، صور النعت، المطابقة، وأهم القواعد.</p></section>
<section class="map-card"><img src="203.png" alt="خريطة مفاهيم درس النعت"></section>
<div class="buttons">
<a class="btn lesson" href="adjective-file.html">العودة إلى ملف درس النعت</a>
<a class="btn lessons" href="lessons.html">العودة إلى الدروس</a>
</div>
</main>
<footer>منصة آفاق التعليمية | لغتي الخالدة | الصف الثالث المتوسط</footer>
</body>
</html>
