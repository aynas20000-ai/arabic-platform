<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>اختبار التعجب | منصة آفاق</title>

<style>
:root{
  --p:#5b4677;
  --p2:#776094;
  --pd:#453457;
  --g:#b69750;
  --g2:#d8c28a;
  --lav:#eee5f5;
  --paper:#fffdf9;
  --text:#403448;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:Tahoma,Arial,sans-serif;
  color:var(--text);
  background:linear-gradient(180deg,#f5f0fa,#fbf9fd,#f1ebf7);
  overflow:hidden;
}
.app{
  height:100dvh;
  display:grid;
  grid-template-rows:auto 1fr auto;
}
header{
  text-align:center;
  color:#fff;
  padding:11px 12px 9px;
  background:linear-gradient(145deg,var(--p2),var(--p),var(--pd));
  border-bottom:4px solid var(--g);
}
.tag{
  display:inline-block;
  padding:3px 10px;
  border-radius:999px;
  border:1px solid var(--g2);
  color:#fff2c6;
  background:rgba(182,151,80,.13);
  font-size:11px;
  font-weight:bold;
}
header h1{
  margin:4px 0 0;
  font-size:clamp(21px,5vw,30px);
}
header p{
  margin:0;
  color:#f2ebf6;
  font-size:12px;
}
main{
  min-height:0;
  width:min(760px,94%);
  margin:0 auto;
  padding:8px 0;
  display:flex;
  flex-direction:column;
}
.top{
  display:flex;
  justify-content:space-between;
  gap:8px;
  font-weight:bold;
  color:var(--p);
  font-size:13px;
  margin-bottom:5px;
}
.progress{
  height:8px;
  background:#e9e0ef;
  border-radius:999px;
  overflow:hidden;
  margin-bottom:7px;
}
.progress>div{
  height:100%;
  width:0;
  background:linear-gradient(90deg,var(--g),#dfca8f);
  transition:.3s;
}
.card,.result{
  flex:1;
  min-height:0;
  background:var(--paper);
  border:1px solid var(--g2);
  border-radius:22px;
  box-shadow:0 14px 30px rgba(73,54,92,.12);
  padding:13px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}
.qnum{
  color:var(--g);
  font-weight:bold;
  font-size:13px;
  margin-bottom:2px;
}
h2{
  font-size:clamp(17px,4.5vw,22px);
  margin:2px 0 9px;
  color:var(--pd);
  line-height:1.5;
}
.options{
  display:grid;
  gap:6px;
}
.opt{
  width:100%;
  padding:8px 10px;
  border-radius:13px;
  border:2px solid #e4dbe9;
  background:#fff;
  color:var(--text);
  font:inherit;
  font-size:clamp(13px,3.6vw,16px);
  text-align:right;
  cursor:pointer;
  line-height:1.4;
}
.opt.correct{
  background:#f0ecf6;
  border-color:var(--p2);
  color:var(--pd);
}
.opt.wrong{
  background:#f8f3fb;
  border-color:#b79cc7;
  color:#604c70;
}
.opt:disabled{cursor:default}
.feedback{
  display:none;
  margin-top:7px;
  padding:8px 10px;
  border-radius:13px;
  font-size:clamp(12px,3.3vw,14px);
  line-height:1.5;
}
.feedback.show{display:block}
.feedback.good{
  background:#f3edf8;
  border:1px solid #c9b8d4;
  color:var(--pd);
}
.feedback.bad{
  background:#fff9ec;
  border:1px solid #d8c28a;
  color:#66522e;
}
.next{
  display:none;
  width:100%;
  margin-top:7px;
  padding:8px;
  border:0;
  border-radius:13px;
  background:linear-gradient(145deg,var(--p2),var(--p));
  color:#fff;
  font:inherit;
  font-weight:bold;
  cursor:pointer;
  font-size:14px;
}
.result{
  display:none;
  text-align:center;
}
.result.show{display:flex}
.score{
  font-size:40px;
  color:var(--g);
  font-weight:bold;
}
.restart,.lesson{
  display:block;
  text-decoration:none;
  width:100%;
  padding:10px;
  margin-top:8px;
  border-radius:13px;
  font-weight:bold;
}
.restart{
  border:0;
  background:linear-gradient(145deg,var(--p2),var(--p));
  color:#fff;
  font:inherit;
  cursor:pointer;
}
.lesson{
  background:var(--lav);
  color:var(--pd);
  border:1px solid #d6c7df;
}
footer{
  text-align:center;
  padding:6px;
  color:#73697a;
  font-size:10px;
}
.burst{
  position:fixed;
  inset:0;
  pointer-events:none;
  overflow:hidden;
  z-index:20;
}
.confetti{
  position:absolute;
  width:8px;
  height:8px;
  border-radius:2px;
  animation:fall 900ms ease-out forwards;
}
@keyframes fall{
  0%{transform:translateY(-20px) rotate(0);opacity:1}
  100%{transform:translateY(105vh) rotate(540deg);opacity:0}
}
.pop{animation:pop .25s ease}
@keyframes pop{50%{transform:scale(1.018)}}
@media(max-height:650px){
  header{padding:6px 10px 5px}
  header h1{font-size:19px}
  header p{font-size:10px}
  main{padding:4px 0}
  .card{padding:8px}
  .opt{padding:5px 8px}
  .feedback{padding:5px 8px;margin-top:4px}
  .next{padding:6px;margin-top:4px}
}
</style>
</head>

<body>
<div class="app">

<header>
  <span class="tag">منصة آفاق التعليمية</span>
  <h1>تحدي التعجب</h1>
  <p>١٠ أسئلة • تعقيب فوري • صوت وحماس ✨</p>
</header>

<main>
  <div class="top">
    <span id="counter">السؤال ١ من ١٠</span>
    <span id="correctCount">الصحيح: ٠</span>
  </div>

  <div class="progress"><div id="bar"></div></div>

  <section class="card" id="card">
    <div class="qnum" id="qnum"></div>
    <h2 id="question"></h2>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback"></div>
    <button class="next" id="next">السؤال التالي</button>
  </section>

  <section class="result" id="result">
    <h2>انتهى التحدي ✨</h2>
    <div class="score" id="score"></div>
    <p id="message"></p>
    <button class="restart" onclick="restartQuiz()">أعيدي التحدي</button>
    <a class="lesson" href="exclamation-style-file.html">راجعي ملف الدرس</a>
    <a class="lesson" href="exclamation-style.html">العودة إلى درس التعجب</a>
  </section>
</main>

<footer>منصة آفاق التعليمية | لغتي الخالدة | الصف الثالث المتوسط</footer>
</div>

<div class="burst" id="burst"></div>

<script>
const questions = [{"q": "ما التعريف الأدق لأسلوب التعجب؟", "o": ["أسلوب يدل على طلب حدوث الفعل", "أسلوب يدل على الدهشة والاستعظام لصفة في شيء ما", "أسلوب يدل على النفي", "أسلوب يدل على الشرط"], "a": 1, "ok": "أحسنتِ 🌟 التعجب يدل على الدهشة والاستعظام لصفة في شيء ما.", "bad": "تذكري معنى التعجب أولًا: دهشة واستعظام لصفة في شيء ما."}, {"q": "في الجملة «ما أجملَ السماءَ!» ما المتعجب منه؟", "o": ["ما", "أجمل", "السماء", "الجملة كلها"], "a": 2, "ok": "رائعة ✨ «السماء» هي المتعجب منه.", "bad": "الأركان هنا: ما التعجبية + أجمل فعل التعجب + السماء المتعجب منه."}, {"q": "أيُّ زوج يمثل صيغتي التعجب القياسي؟", "o": ["ما أفعله! / أفعل به!", "سبحان الله! / لله دره!", "هل أفعل؟ / لم أفعل", "أفعلُ / سيفعلُ"], "a": 0, "ok": "ممتازة 💜 للتعجب القياسي صيغتان: «ما أفعله!» و«أفعل به!».", "bad": "الصيغتان القياسيتان هما: ما أفعله! وأفعل به!"}, {"q": "أيُّ جملة تعد تعجبًا سماعيًا؟", "o": ["ما أجملَ الصدقَ!", "أجملْ بالصدقِ!", "لله درُّه!", "ما أعظمَ الوفاءَ!"], "a": 2, "ok": "صحيح 👏 «لله درُّه!» من أساليب التعجب السماعية.", "bad": "السماعي لا يلتزم بصيغتي «ما أفعله» و«أفعل به»، ومن أمثلته: لله دره!"}, {"q": "أيُّ مجموعة تمثل شروط صياغة التعجب مباشرة من الفعل؟", "o": ["ثلاثي، تام، متصرف، مثبت، معلوم، قابل للتفاوت، وليس الوصف منه أفعل/فعلاء", "رباعي، منفي، جامد، مبني للمجهول", "ثلاثي فقط دون شروط أخرى", "أي فعل يمكن صياغة التعجب منه مباشرة"], "a": 0, "ok": "إتقان رائع 🏆 هذه هي شروط الصياغة المباشرة كاملة.", "bad": "ثبتيها: ثلاثي، تام، متصرف، مثبت، معلوم، قابل للتفاوت، وليس الوصف منه أفعل/فعلاء."}, {"q": "الفعل «استقام» غير ثلاثي، فكيف نتعجب منه تعجبًا قياسيًا؟", "o": ["ما أستقامَ الطالبَ!", "ما أجملَ استقامةَ الطالبِ!", "استقمْ بالطالبِ!", "لا يمكن التعجب من معناه مطلقًا"], "a": 1, "ok": "أحسنتِ جدًا 🎯 عند اختلال شرط الثلاثية نستخدم فعل تعجب مساعدًا + المصدر: «ما أجملَ استقامةَ الطالبِ!»", "bad": "لأن «استقام» غير ثلاثي، لا نصوغ منه مباشرة؛ نستخدم فعلًا مساعدًا + مصدره «استقامة»."}, {"q": "كيف نتعجب من «احمرَّ الوردُ»؟", "o": ["ما أحمرَ الوردَ!", "أحمرْ بالوردِ!", "ما أشدَّ احمرارَ الوردِ!", "ما أحمرَّ الوردُ!"], "a": 2, "ok": "رائعة 🔥 لأن الوصف منه «أحمر/حمراء» فلا نصوغ منه مباشرة، فنقول: «ما أشدَّ احمرارَ الوردِ!»", "bad": "إذا كان الوصف على «أفعل/فعلاء» نستخدم فعل تعجب مساعدًا + المصدر: ما أشد احمرار الورد!"}, {"q": "أيُّ فعل لا نصوغ منه تعجبًا قياسيًا لأنه لا يقبل التفاوت؟", "o": ["جَمُلَ", "حَسُنَ", "ماتَ", "كَبُرَ"], "a": 2, "ok": "صحيح 🌿 «مات» لا يقبل التفاوت، فلا يصاغ منه تعجب قياسي.", "bad": "الفعل الذي لا تقبل صفته الزيادة والنقصان، مثل «مات»، لا يصاغ منه تعجب قياسي."}, {"q": "ما التحويل الصحيح لـ «ما أجملَ الصدقَ!» إلى الصيغة القياسية الثانية؟", "o": ["أجملَ الصدقُ!", "أجملْ بالصدقِ!", "ما جمالَ الصدقِ!", "بالصدقِ أجملَ!"], "a": 1, "ok": "ممتازة 🌟 «ما أجملَ الصدقَ!» ↔ «أجملْ بالصدقِ!».", "bad": "الصيغة الثانية تكون على وزن «أفعل به»: أجملْ بالصدقِ!"}, {"q": "أيُّ قاعدة تلخص التصرف إذا اختل شرط من شروط الصياغة المباشرة؟", "o": ["نصوغ من الفعل مباشرة مهما كان", "نحذف الفعل ونضع علامة تعجب فقط", "إذا كان المعنى قابلًا للتعجب نستخدم فعل تعجب مساعدًا + المصدر، وإذا لم يقبل التفاوت فلا نصوغ تعجبًا قياسيًا", "نحوّل كل فعل إلى فعل ماضٍ ثلاثي"], "a": 2, "ok": "بطلة التعجب ✨ هذه قاعدة الحسم الصحيحة.", "bad": "قاعدة الحسم: اختل شرط لكن المعنى قابل للتعجب → فعل مساعد + مصدر. لا يقبل التفاوت → لا تعجب قياسي."}];
let index=0,score=0,answered=false;

const arabicDigits=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const q=document.getElementById('question');
const options=document.getElementById('options');
const feedback=document.getElementById('feedback');
const next=document.getElementById('next');
const card=document.getElementById('card');

function tone(ok){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    const c=new AC(),o=c.createOscillator(),g=c.createGain();
    o.connect(g);g.connect(c.destination);
    o.type=ok?'sine':'triangle';
    o.frequency.setValueAtTime(ok?660:220,c.currentTime);
    if(ok)o.frequency.exponentialRampToValueAtTime(920,c.currentTime+.16);
    g.gain.setValueAtTime(.07,c.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.23);
    o.start();o.stop(c.currentTime+.24);
  }catch(e){}
}

function confetti(){
  const burst=document.getElementById('burst');
  burst.innerHTML='';
  const colors=['#5b4677','#776094','#b69750','#d8c28a','#eee5f5'];
  for(let i=0;i<24;i++){
    const s=document.createElement('i');
    s.className='confetti';
    s.style.left=(Math.random()*100)+'vw';
    s.style.top='-10px';
    s.style.background=colors[i%colors.length];
    s.style.animationDelay=(Math.random()*180)+'ms';
    burst.appendChild(s);
  }
  setTimeout(()=>burst.innerHTML='',1200);
}

function render(){
  answered=false;
  const x=questions[index];

  document.getElementById('qnum').textContent='السؤال '+arabicDigits(index+1);
  document.getElementById('counter').textContent='السؤال '+arabicDigits(index+1)+' من '+arabicDigits(questions.length);
  document.getElementById('correctCount').textContent='الصحيح: '+arabicDigits(score);
  document.getElementById('bar').style.width=(index/questions.length*100)+'%';

  q.textContent=x.q;
  options.innerHTML='';
  feedback.className='feedback';
  feedback.innerHTML='';
  next.style.display='none';
  card.classList.remove('pop');

  x.o.forEach((t,j)=>{
    const b=document.createElement('button');
    b.className='opt';
    b.textContent=t;
    b.onclick=()=>choose(j,b);
    options.appendChild(b);
  });
}

function choose(choice,button){
  if(answered)return;
  answered=true;

  const x=questions[index];
  const btns=[...document.querySelectorAll('.opt')];
  btns.forEach(b=>b.disabled=true);
  btns[x.a].classList.add('correct');

  if(choice===x.a){
    score++;
    button.classList.add('correct');
    feedback.className='feedback show good';
    feedback.textContent=x.ok;
    tone(true);
    confetti();
    if(navigator.vibrate)navigator.vibrate(45);
  }else{
    button.classList.add('wrong');
    feedback.className='feedback show bad';
    feedback.innerHTML='<b>ركزي على القاعدة 👀</b><br>'+x.bad;
    tone(false);
    if(navigator.vibrate)navigator.vibrate([70,40,70]);
  }

  document.getElementById('correctCount').textContent='الصحيح: '+arabicDigits(score);
  card.classList.add('pop');

  next.textContent=index===questions.length-1
    ?'شوفي نتيجتك ✨'
    :'كمّلي التحدي ←';

  next.style.display='block';
}

next.onclick=()=>{
  index++;
  if(index<questions.length)render();
  else finish();
};

function finish(){
  document.getElementById('bar').style.width='100%';
  card.style.display='none';
  document.querySelector('.top').style.display='none';
  document.querySelector('.progress').style.display='none';

  const result=document.getElementById('result');
  result.classList.add('show');

  document.getElementById('score').textContent=
    arabicDigits(score)+' / '+arabicDigits(questions.length);

  const pct=score/questions.length;

  document.getElementById('message').textContent=
    pct===1
    ?'إتقان كامل! بطلة التعجب 🏆'
    :pct>=.8
    ?'ممتازة جدًا 🌟 أتقنتِ القياسي والسماعي والشروط.'
    :pct>=.6
    ?'أداء جميل 👏 راجعي شروط الصياغة وطريقة التصرف عند اختلال الشرط ثم أعيدي التحدي.'
    :'راجعي ملف الدرس، خاصة شروط التعجب والقياسي والسماعي، ثم عودي للتحدي.';

  if(pct>=.8)confetti();
}

function restartQuiz(){
  index=0;
  score=0;
  answered=false;

  card.style.display='flex';
  document.querySelector('.top').style.display='flex';
  document.querySelector('.progress').style.display='block';
  document.getElementById('result').classList.remove('show');

  render();
}

render();
</script>
</body>
</html>
