<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>اختبار الأسلوب اللغوي</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Tahoma, Arial, sans-serif;
      color: #3b245f;
      background: linear-gradient(135deg, #f4ebff, #fff9fe);
    }

    header {
      padding: 28px 15px;
      color: white;
      text-align: center;
      background: linear-gradient(135deg, #6936a8, #a14fc3);
      border-radius: 0 0 28px 28px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 29px;
    }

    header p {
      margin: 0;
      font-size: 17px;
      line-height: 1.8;
    }

    .container {
      width: 100%;
      max-width: 760px;
      margin: 25px auto;
      padding: 15px;
    }

    .card {
      padding: 24px;
      background: white;
      border: 2px solid #ead9f7;
      border-radius: 22px;
      box-shadow: 0 7px 22px rgba(0, 0, 0, 0.12);
    }

    .hidden {
      display: none;
    }

    .name-box,
    .result {
      text-align: center;
    }

    .name-box h2,
    .result h2 {
      margin-top: 0;
      color: #6936a8;
    }

    input[type="text"] {
      width: 100%;
      margin: 15px 0;
      padding: 14px;
      font-size: 18px;
      text-align: center;
      border: 2px solid #d8b8ec;
      border-radius: 14px;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: #6936a8;
    }

    .btn {
      display: inline-block;
      margin-top: 15px;
      padding: 13px 26px;
      color: white;
      font-family: inherit;
      font-size: 18px;
      text-decoration: none;
      background: linear-gradient(135deg, #6936a8, #a14fc3);
      border: none;
      border-radius: 14px;
      cursor: pointer;
    }

    .btn:disabled {
      background: #b9abbf;
      cursor: not-allowed;
    }

    .progress-text {
      margin-bottom: 10px;
      color: #6936a8;
      font-weight: bold;
      text-align: center;
    }

    .progress {
      height: 13px;
      margin-bottom: 22px;
      overflow: hidden;
      background: #f0e7f7;
      border-radius: 20px;
    }

    .progress-bar {
      width: 0;
      height: 100%;
      background: linear-gradient(90deg, #a14fc3, #6936a8);
      transition: width 0.3s;
    }

    .question-category {
      display: inline-block;
      margin-bottom: 12px;
      padding: 7px 13px;
      color: #6936a8;
      font-weight: bold;
      background: #f3e9fa;
      border-radius: 20px;
    }

    .question {
      margin-bottom: 20px;
      color: #3b245f;
      font-size: 21px;
      font-weight: bold;
      line-height: 1.8;
    }

    .choices {
      display: grid;
      gap: 12px;
    }

    .choice {
      width: 100%;
      padding: 15px;
      color: #3b245f;
      font-family: inherit;
      font-size: 18px;
      text-align: right;
      background: #fcf8ff;
      border: 2px solid #e1c9f0;
      border-radius: 15px;
      cursor: pointer;
      transition: 0.2s;
    }

    .choice:hover {
      background: #f5ebfb;
    }

    .choice.selected {
      font-weight: bold;
      background: #ead9f7;
      border-color: #6936a8;
    }

    .actions {
      margin-top: 20px;
      text-align: center;
    }

    .score {
      margin: 18px 0;
      color: #198754;
      font-size: 38px;
      font-weight: bold;
    }

    .message {
      font-size: 19px;
      line-height: 1.8;
    }

    .back-link {
      display: block;
      margin-top: 20px;
      color: #6936a8;
      font-weight: bold;
      text-decoration: none;
      text-align: center;
    }
  </style>
</head>

<body>

  <header>
    <h1>اختبار الأسلوب اللغوي</h1>

    <p>
      أسلوب القسم<br>
      أسلوب الشرط<br>
      أسلوب التفضيل
    </p>
  </header>

  <main class="container">

    <section id="startScreen" class="card name-box">
      <h2>بيانات الطالبة</h2>

      <p>اكتبي اسمكِ ثم ابدئي الاختبار.</p>

      <input
        id="studentName"
        type="text"
        placeholder="اكتبي اسم الطالبة"
      >

      <button class="btn" type="button" onclick="startTest()">
        ابدئي الاختبار
      </button>

      <a class="back-link" href="semester1-tests.html">
        العودة إلى اختبارات الفصل الأول
      </a>
    </section>

    <section id="testScreen" class="card hidden">

      <div id="progressText" class="progress-text"></div>

      <div class="progress">
        <div id="progressBar" class="progress-bar"></div>
      </div>

      <div id="questionCategory" class="question-category"></div>

      <div id="questionText" class="question"></div>

      <div id="choicesBox" class="choices"></div>

      <div class="actions">
        <button
          id="nextButton"
          class="btn"
          type="button"
          onclick="nextQuestion()"
          disabled
        >
          السؤال التالي
        </button>
      </div>

    </section>

    <section id="resultScreen" class="card result hidden">

      <h2>
        أحسنتِ يا <span id="resultName"></span>
      </h2>

      <div class="score">
        <span id="finalScore"></span> من 25
      </div>

      <p id="resultMessage" class="message"></p>

      <a class="btn" href="semester1-tests.html">
        العودة إلى صفحة الاختبارات
      </a>

    </section>

  </main>

  <script>
    const questions = [
      {
        category: "أسلوب القسم",
        question: "أي الجمل الآتية تشتمل على أسلوب قسم؟",
        choices: [
          "اجتهد الطالب في دراسته.",
          "والله لأقولنَّ الصدق.",
          "إن تجتهد تنجح.",
          "العلم أنفع من المال."
        ],
        answer: 1
      },
      {
        category: "أسلوب القسم",
        question: "حددي أداة القسم في الجملة: «والله لأحافظنَّ على وطني».",
        choices: ["الله", "الواو", "اللام", "النون"],
        answer: 1
      },
      {
        category: "أسلوب القسم",
        question: "المقسم به في الجملة «بالله لأساعدنَّ المحتاج» هو:",
        choices: ["الباء", "الله", "لأساعدنَّ", "المحتاج"],
        answer: 1
      },
      {
        category: "أسلوب القسم",
        question: "جواب القسم في الجملة «تالله لأحافظنَّ على الأمانة» هو:",
        choices: ["تالله", "الله", "لأحافظنَّ على الأمانة", "الأمانة"],
        answer: 2
      },
      {
        category: "أسلوب القسم",
        question: "أي الأدوات الآتية تُستعمل للقسم؟",
        choices: ["الواو", "هل", "لن", "إذا"],
        answer: 0
      },
      {
        category: "أسلوب القسم",
        question: "اختاري الجملة الصحيحة في أسلوب القسم:",
        choices: [
          "والله أحترم والدي.",
          "والله لأحترمنَّ والدي.",
          "هل أحترم والدي؟",
          "إن أحترم والدي."
        ],
        answer: 1
      },
      {
        category: "أسلوب القسم",
        question: "في الجملة «والله لينتصرنَّ الحق» دخلت لام جواب القسم على:",
        choices: ["والله", "الحق", "لينتصرنَّ", "الواو"],
        answer: 2
      },
      {
        category: "أسلوب القسم",
        question: "أي الجمل الآتية بدأت بتاء القسم؟",
        choices: [
          "بالله لأصدقنَّ.",
          "والله لأصدقنَّ.",
          "تالله لأصدقنَّ.",
          "لله الأمر."
        ],
        answer: 2
      },

      {
        category: "أسلوب الشرط",
        question: "أي الجمل الآتية تشتمل على أسلوب شرط؟",
        choices: [
          "الصدق منجاة.",
          "إن تصدق تُحترم.",
          "ما أجمل الصدق!",
          "والله لأصدقنَّ."
        ],
        answer: 1
      },
      {
        category: "أسلوب الشرط",
        question: "حددي أداة الشرط في الجملة «من يجتهد ينجح».",
        choices: ["يجتهد", "ينجح", "من", "الطالب"],
        answer: 2
      },
      {
        category: "أسلوب الشرط",
        question: "فعل الشرط في الجملة «إن تحافظي على وقتك تنجحي» هو:",
        choices: ["إن", "تحافظي", "وقتك", "تنجحي"],
        answer: 1
      },
      {
        category: "أسلوب الشرط",
        question: "جواب الشرط في الجملة «متى تسافر أرافقك» هو:",
        choices: ["متى", "تسافر", "أرافقك", "السفر"],
        answer: 2
      },
      {
        category: "أسلوب الشرط",
        question: "اختاري الأداة المناسبة: «... تحسن إلى الناس يحبونك».",
        choices: ["هل", "من", "لن", "قد"],
        answer: 1
      },
      {
        category: "أسلوب الشرط",
        question: "أي الكلمات الآتية اسم شرط؟",
        choices: ["من", "إلى", "على", "لكن"],
        answer: 0
      },
      {
        category: "أسلوب الشرط",
        question: "اختاري الجملة الصحيحة:",
        choices: [
          "إن تجتهدين تنجحين.",
          "إن تجتهدي تنجحي.",
          "إن تجتهدي تنجحين.",
          "إن اجتهدتِ النجاح."
        ],
        answer: 1
      },
      {
        category: "أسلوب الشرط",
        question: "في الجملة «أينما تذهب أذهب معك» أداة الشرط هي:",
        choices: ["أينما", "تذهب", "أذهب", "معك"],
        answer: 0
      },
      {
        category: "أسلوب الشرط",
        question: "أي الجمل الآتية تدل على ارتباط حدوث أمر بحدوث أمر آخر؟",
        choices: [
          "السماء صافية.",
          "إن تزرع تحصد.",
          "والله لأعملنَّ.",
          "العلم أفضل من الجهل."
        ],
        answer: 1
      },

      {
        category: "أسلوب التفضيل",
        question: "أي الجمل الآتية تشتمل على أسلوب تفضيل؟",
        choices: [
          "خالد مجتهد.",
          "خالد أكثر اجتهادًا من سالم.",
          "اجتهد خالد.",
          "هل خالد مجتهد؟"
        ],
        answer: 1
      },
      {
        category: "أسلوب التفضيل",
        question: "اسم التفضيل في الجملة «العلم أنفع من المال» هو:",
        choices: ["العلم", "أنفع", "المال", "من"],
        answer: 1
      },
      {
        category: "أسلوب التفضيل",
        question: "المفضَّل في الجملة «الصدق أفضل من الكذب» هو:",
        choices: ["الصدق", "أفضل", "من", "الكذب"],
        answer: 0
      },
      {
        category: "أسلوب التفضيل",
        question: "المفضَّل عليه في الجملة «القراءة أنفع من اللهو» هو:",
        choices: ["القراءة", "أنفع", "من", "اللهو"],
        answer: 3
      },
      {
        category: "أسلوب التفضيل",
        question: "اختاري اسم التفضيل المناسب: «الطائرة ... من السيارة».",
        choices: ["سريعة", "أسرع", "سرعة", "تسرع"],
        answer: 1
      },
      {
        category: "أسلوب التفضيل",
        question: "أي الكلمات الآتية اسم تفضيل؟",
        choices: ["كبير", "أكبر", "يكبر", "كبيرة"],
        answer: 1
      },
      {
        category: "أسلوب التفضيل",
        question: "اختاري الجملة الصحيحة في أسلوب التفضيل:",
        choices: [
          "الربيع جميل.",
          "الربيع أجمل من الصيف.",
          "جَمُل الربيع.",
          "ما أجمل الربيع!"
        ],
        answer: 1
      },
      {
        category: "أسلوب التفضيل",
        question: "في الجملة «مكة أشرف بقاع الأرض» اسم التفضيل هو:",
        choices: ["مكة", "أشرف", "بقاع", "الأرض"],
        answer: 1
      }
    ];

    let currentQuestion = 0;
    let score = 0;
    let selectedAnswer = null;

    const startScreen = document.getElementById("startScreen");
    const testScreen = document.getElementById("testScreen");
    const resultScreen = document.getElementById("resultScreen");
    const questionCategory = document.getElementById("questionCategory");
    const questionText = document.getElementById("questionText");
    const choicesBox = document.getElementById("choicesBox");
    const nextButton = document.getElementById("nextButton");
    const progressText = document.getElementById("progressText");
    const progressBar = document.getElementById("progressBar");

    window.addEventListener("load", function () {
      const savedName =
        localStorage.getItem("semester1StudentName") || "";

      document.getElementById("studentName").value = savedName;
    });

    function startTest() {
      const name =
        document.getElementById("studentName").value.trim();

      if (name === "") {
        alert("فضلاً اكتبي اسم الطالبة أولًا.");
        return;
      }

      localStorage.setItem("semester1StudentName", name);

      currentQuestion = 0;
      score = 0;
      selectedAnswer = null;

      startScreen.classList.add("hidden");
      resultScreen.classList.add("hidden");
      testScreen.classList.remove("hidden");

      showQuestion();
    }

    function showQuestion() {
      selectedAnswer = null;
      nextButton.disabled = true;

      const current = questions[currentQuestion];

      progressText.textContent =
        "السؤال " +
        (currentQuestion + 1) +
        " من " +
        questions.length;

      progressBar.style.width =
        ((currentQuestion + 1) / questions.length * 100) + "%";

      questionCategory.textContent = current.category;
      questionText.textContent = current.question;
      choicesBox.innerHTML = "";

      current.choices.forEach(function (choice, index) {
        const button = document.createElement("button");

        button.type = "button";
        button.className = "choice";
        button.textContent = choice;

        button.onclick = function () {
          selectAnswer(index, button);
        };

        choicesBox.appendChild(button);
      });

      if (currentQuestion === questions.length - 1) {
        nextButton.textContent = "إنهاء الاختبار";
      } else {
        nextButton.textContent = "السؤال التالي";
      }
    }

    function selectAnswer(index, button) {
      selectedAnswer = index;

      document.querySelectorAll(".choice").forEach(function (choice) {
        choice.classList.remove("selected");
      });

      button.classList.add("selected");
      nextButton.disabled = false;
    }

    function nextQuestion() {
      if (selectedAnswer === null) {
        return;
      }

      if (selectedAnswer === questions[currentQuestion].answer) {
        score++;
      }

      currentQuestion++;

      if (currentQuestion < questions.length) {
        showQuestion();
      } else {
        finishTest();
      }
    }

    function finishTest() {
      const studentName =
        localStorage.getItem("semester1StudentName") || "الطالبة";

      localStorage.setItem("stylesScore", String(score));
      localStorage.setItem("stylesCompleted", "true");

      testScreen.classList.add("hidden");
      resultScreen.classList.remove("hidden");

      document.getElementById("resultName").textContent = studentName;
      document.getElementById("finalScore").textContent = score;

      let message;

      if (score >= 23) {
        message =
          "ممتاز جدًا، لديكِ إتقان رائع للأساليب اللغوية.";
      } else if (score >= 19) {
        message =
          "أحسنتِ، نتيجتكِ جيدة جدًا في الأسلوب اللغوي.";
      } else if (score >= 13) {
        message =
          "نتيجة جيدة، راجعي بعض عناصر القسم والشرط والتفضيل.";
      } else {
        message =
          "تحتاجين إلى مراجعة أسلوب القسم والشرط والتفضيل.";
      }

      document.getElementById("resultMessage").textContent = message;
    }
  </script>

</body>
</html>
