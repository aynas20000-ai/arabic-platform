<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الألف اللينة في الأفعال غير الثلاثية</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Tahoma, Arial, sans-serif;
      color: #000000;
      background: linear-gradient(135deg, #FDF9F4, #F7F0FB);
    }

    .header {
      padding: 38px 18px;
      text-align: center;
      background: linear-gradient(135deg, #CBB4E3, #B69AD6);
      border-bottom: 2px solid #C8A85A;
    }

    .header h1 {
      margin: 0;
      color: #5D4374;
      font-size: 32px;
      line-height: 1.6;
    }

    .header p {
      margin: 12px 0 0;
      color: #000000;
      font-size: 18px;
    }

    .container {
      width: 100%;
      max-width: 850px;
      margin: auto;
      padding: 28px 16px 40px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .card {
      display: flex;
      min-height: 175px;
      padding: 24px 18px;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
      text-decoration: none;
      color: #000000;
      background: linear-gradient(135deg, #FFFDF8, #F8EEF6);
      border: 2px solid #C8A85A;
      border-radius: 20px;
      box-shadow: 0 5px 14px rgba(0, 0, 0, 0.07);
    }

    .icon {
      margin-bottom: 10px;
      font-size: 40px;
    }

    .card-title {
      color: #5D4374;
      font-size: 23px;
      font-weight: bold;
      line-height: 1.5;
    }

    .card-text {
      margin-top: 8px;
      color: #000000;
      font-size: 16px;
      line-height: 1.7;
    }

    @media (max-width: 600px) {
      .header {
        padding: 30px 14px;
      }

      .header h1 {
        font-size: 27px;
      }

      .header p {
        font-size: 16px;
      }

      .cards {
        grid-template-columns: 1fr;
      }

      .card {
        min-height: 150px;
      }
    }
  </style>
</head>

<body>
  <header class="header">
    <h1>✏️ الألف اللينة في الأفعال غير الثلاثية</h1>
    <p>شرح الدرس ومراجعته والتدرب عليه</p>
  </header>

  <main class="container">
    <div class="cards">

      <a class="card" href="#">
        <span class="icon">🎥</span>
        <span class="card-title">شرح فيديو</span>
      </a>

      <a class="card" href="soft-alif-nontriliteral-verbs-file.html">
        <span class="icon">📄</span>
        <span class="card-title">ملف الدرس</span>
      </a>

      <a class="card" href="#">
        <span class="icon">✍️</span>
        <span class="card-title">كتابة بلا أخطاء</span>
        <span class="card-text">مراجعة الألف اللينة في الأفعال الثلاثية وغير الثلاثية</span>
      </a>

      <a class="card" href="soft-alif-nontriliteral-verbs-test.html">
        <span class="icon">✅</span>
        <span class="card-title">اختبار تجريبي</span>
      </a>

    </div>
  </main>
</body>
</html>
