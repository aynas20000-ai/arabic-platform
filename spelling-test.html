<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>اختبار الرسم الإملائي</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Tahoma, Arial, sans-serif;
      color: #17324d;
      background: linear-gradient(135deg, #e3f7ff, #f8fcff);
    }

    header {
      padding: 28px 15px;
      color: white;
      text-align: center;
      background: linear-gradient(135deg, #1261a0, #20a4d8);
      border-radius: 0 0 28px 28px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 29px;
    }

    header p {
      margin: 0;
      font-size: 17px;
      line-height: 1.7;
    }

    .container {
      width: 100%;
      max-width: 760px;
      margin: 25px auto;
      padding: 15px;
    }

    .card {
      padding: 24px;
      background: white;
      border: 2px solid #d8effc;
      border-radius: 22px;
      box-shadow: 0 7px 22px rgba(0, 0, 0, 0.12);
    }

    .hidden {
      display: none;
    }

    .name-box,
    .result {
      text-align: center;
    }

    .name-box h2,
    .result h2 {
      margin-top: 0;
      color: #1261a0;
    }

    input[type="text"] {
      width: 100%;
      margin: 15px 0;
      padding: 14px;
      font-size: 18px;
      text-align: center;
      border: 2px solid #9ed9f5;
      border-radius: 14px;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: #1261a0;
    }

    .btn {
      display: inline-block;
      margin-top: 15px;
      padding: 13px 26px;
      color: white;
      font-size: 18px;
      text-decoration: none;
      background: linear-gradient(135deg, #1261a0, #20a4d8);
      border: none;
      border-radius: 14px;
      cursor: pointer;
    }

    .btn:disabled {
      background: #aab8c4;
      cursor: not-allowed;
    }

    .progress-text {
      margin-bottom: 10px;
      color: #1261a0;
      font-weight: bold;
      text-align: center;
    }

    .progress {
      height: 13px;
      margin-bottom: 22px;
      overflow: hidden;
      background: #e5f4fc;
      border-radius: 20px;
    }

    .progress-bar {
      width: 0;
      height: 100%;
      background: linear-gradient(90deg, #20a4d8, #1261a0);
      transition: width 0.3s;
    }

    .question {
      margin-bottom: 20px;
      color: #17324d;
      font-size: 21px;
      font-weight: bold;
      line-height: 1.8;
    }

    .choices {
      display: grid;
      gap: 12px;
    }

    .choice {
      width: 100%;
      padding: 15px;
      color: #17324d;
      font-family: inherit;
      font-size: 18px;
      text-align: right;
      background: #f3fbff;
      border: 2px solid #bce5f8;
      border-radius: 15px;
      cursor: pointer;
      transition: 0.2s;
    }

    .choice:hover {
      background: #e5f6ff;
    }

    .choice.selected {
      font-weight: bold;
      background: #d9f2ff;
      border-color: #1261a0;
    }

    .actions {
      margin-top: 20px;
      text-align: center;
    }

    .score {
      margin: 18px 0;
      color: #16804b;
      font-size: 38px;
      font-weight: bold;
    }

    .message {
      font-size: 19px;
      line-height: 1.8;
    }

    .back-link {
      display: block;
      margin-top: 20px;
      color: #1261a0;
      font-weight: bold;
      text-decoration: none;
      text-align: center;
    }
  </style>
</head>

<body>

  <header>
    <h1>اختبار الرسم الإملائي</h1>
    <p>
      الألف اللينة في الأفعال الثلاثية وغير الثلاثية<br>
      وكتابة بعض الكلمات الموصولة خطًّا
    </p>
  </header>

  <main class="container">

    <section id="startScreen" class="card name-box">
      <h2>بيانات الطالبة</h2>

      <p>اكتبي اسمكِ ثم ابدئي الاختبار.</p>

      <input
        id="studentName"
        type="text"
        placeholder="اكتبي اسم الطالبة"
      >

      <button class="btn" type="button" onclick="startTest()">
        ابدئي الاختبار
      </button>

      <a class="back-link" href="semester1-tests.html">
        العودة إلى اختبارات الفصل الأول
      </a>
    </section>

    <section id="testScreen" class="card hidden">

      <div id="progressText" class="progress-text"></div>

      <div class="progress">
        <div id="progressBar" class="progress-bar"></div>
      </div>

      <div id="questionText" class="question"></div>

      <div id="choicesBox" class="choices"></div>

      <div class="actions">
        <button
          id="nextButton"
          class="btn"
          type="button"
          onclick="nextQuestion()"
          disabled
        >
          السؤال التالي
        </button>
      </div>

    </section>

    <section id="resultScreen" class="card result hidden">

      <h2>
        أحسنتِ يا <span id="resultName"></span>
      </h2>

      <div class="score">
        <span id="finalScore"></span> من 25
      </div>

      <p id="resultMessage" class="message"></p>

      <a class="btn" href="semester1-tests.html">
        العودة إلى صفحة الاختبارات
      </a>

    </section>

  </main>

  <script>
    const questions = [
      {
        question: "اختاري الكتابة الصحيحة للفعل:",
        choices: ["سعا الطالب إلى النجاح.", "سعى الطالب إلى النجاح.", "سعي الطالب إلى النجاح.", "سعئ الطالب إلى النجاح."],
        answer: 1
      },
      {
        question: "كُتبت الألف اللينة في الفعل «دعا» ألفًا قائمة؛ لأن أصلها:",
        choices: ["واو", "ياء", "همزة", "تاء"],
        answer: 0
      },
      {
        question: "نعرف أصل الألف اللينة في الفعل الثلاثي «رمى» من الفعل المضارع:",
        choices: ["يرمو", "يرمى", "يرمي", "يرمأ"],
        answer: 2
      },
      {
        question: "اختاري الفعل المكتوب كتابة صحيحة:",
        choices: ["قضا القاضي بالعدل.", "قضى القاضي بالعدل.", "قضي القاضي بالعدل.", "قضأ القاضي بالعدل."],
        answer: 1
      },
      {
        question: "أي الأفعال الآتية تنتهي بألف قائمة؟",
        choices: ["سعى", "مشى", "عفا", "رمى"],
        answer: 2
      },
      {
        question: "كُتبت الألف في الفعل «سما» قائمة؛ لأن مضارعه:",
        choices: ["يسمي", "يسمو", "يسمى", "يسمُي"],
        answer: 1
      },
      {
        question: "أي الأفعال الآتية أصل ألفه اللينة ياء؟",
        choices: ["دعا", "عفا", "نجا", "مشى"],
        answer: 3
      },
      {
        question: "اختاري الجملة الصحيحة إملائيًا:",
        choices: ["نجى الطفل من الخطر.", "نجا الطفل من الخطر.", "نجي الطفل من الخطر.", "نجأ الطفل من الخطر."],
        answer: 1
      },
      {
        question: "الألف اللينة في آخر الفعل الثلاثي تُكتب «ى» إذا كان أصلها:",
        choices: ["واوًا", "ياءً", "ألفًا", "همزةً"],
        answer: 1
      },
      {
        question: "الألف اللينة في آخر الفعل الثلاثي تُكتب «ا» إذا كان أصلها:",
        choices: ["ياءً", "واوًا", "تاءً", "نونًا"],
        answer: 1
      },
      {
        question: "اختاري الكتابة الصحيحة للفعل غير الثلاثي:",
        choices: ["اهتدا", "اهتدى", "اهتدي", "اهتدأ"],
        answer: 1
      },
      {
        question: "أي الأفعال الآتية فعل غير ثلاثي كُتبت ألفه اللينة بصورة صحيحة؟",
        choices: ["استدعا", "استدعى", "استدعي", "إستدعى"],
        answer: 1
      },
      {
        question: "اختاري الجملة الصحيحة:",
        choices: ["أعطا المعلم الطالبة جائزة.", "أعطى المعلم الطالبة جائزة.", "أعطي المعلم الطالبة جائزة.", "أعطأ المعلم الطالبة جائزة."],
        answer: 1
      },
      {
        question: "تُكتب الألف اللينة في آخر الفعل غير الثلاثي غالبًا على صورة:",
        choices: ["ا", "ى", "ء", "و"],
        answer: 1
      },
      {
        question: "أي الأفعال الآتية يُستثنى من القاعدة؛ لأن الألف سبقتها ياء؟",
        choices: ["اهتدى", "ارتقى", "استدعى", "أحيا"],
        answer: 3
      },
      {
        question: "اختاري الكتابة الصحيحة:",
        choices: ["أحيى المطر الأرض.", "أحيا المطر الأرض.", "أحي المطر الأرض.", "أحيأ المطر الأرض."],
        answer: 1
      },
      {
        question: "أي الكلمات الآتية كُتبت موصولة كتابة صحيحة؟",
        choices: ["حب ذا", "حبذا", "حبّ ذا", "ح ب ذا"],
        answer: 1
      },
      {
        question: "اختاري الصورة الصحيحة للكلمتين «حين + إذ»:",
        choices: ["حين إذ", "حينإذ", "حينئذ", "حين أذ"],
        answer: 2
      },
      {
        question: "اختاري الكتابة الصحيحة للكلمتين «يوم + إذ»:",
        choices: ["يوم إذ", "يومئذ", "يومأذ", "يوم أذ"],
        answer: 1
      },
      {
        question: "الكلمة الصحيحة الناتجة من وصل «عن + ما» هي:",
        choices: ["عنما", "عما", "عمّا", "عن ما"],
        answer: 2
      },
      {
        question: "الكلمة الصحيحة الناتجة من وصل «من + ما» هي:",
        choices: ["منما", "ممّا", "ماما", "من ما"],
        answer: 1
      },
      {
        question: "اختاري الكتابة الصحيحة للكلمتين «كي + لا»:",
        choices: ["كي لا", "كيلا", "كلا", "كيلى"],
        answer: 1
      },
      {
        question: "أي الكلمات الآتية مكتوبة بصورة صحيحة؟",
        choices: ["لأن", "ل أن", "لان", "لئنّ"],
        answer: 0
      },
      {
        question: "اختاري الكلمة الصحيحة في الجملة: «اجتهدي ... تنجحي».",
        choices: ["لئلا", "كيلا", "حينئذ", "حبذا"],
        answer: 1
      },
      {
        question: "اختاري الجملة الصحيحة إملائيًا:",
        choices: [
          "كل ما اجتهدتِ تفوقتِ.",
          "كلما اجتهدتِ تفوقتِ.",
          "كلّ ما اجتهدتِ تفوقتِ.",
          "كل ماء اجتهدتِ تفوقتِ."
        ],
        answer: 1
      }
    ];

    let currentQuestion = 0;
    let score = 0;
    let selectedAnswer = null;

    const startScreen = document.getElementById("startScreen");
    const testScreen = document.getElementById("testScreen");
    const resultScreen = document.getElementById("resultScreen");
    const questionText = document.getElementById("questionText");
    const choicesBox = document.getElementById("choicesBox");
    const nextButton = document.getElementById("nextButton");
    const progressText = document.getElementById("progressText");
    const progressBar = document.getElementById("progressBar");

    window.addEventListener("load", function () {
      const savedName =
        localStorage.getItem("semester1StudentName") || "";

      document.getElementById("studentName").value = savedName;
    });

    function startTest() {
      const name =
        document.getElementById("studentName").value.trim();

      if (name === "") {
        alert("فضلاً اكتبي اسم الطالبة أولًا.");
        return;
      }

      localStorage.setItem("semester1StudentName", name);

      currentQuestion = 0;
      score = 0;
      selectedAnswer = null;

      startScreen.classList.add("hidden");
      resultScreen.classList.add("hidden");
      testScreen.classList.remove("hidden");

      showQuestion();
    }

    function showQuestion() {
      selectedAnswer = null;
      nextButton.disabled = true;

      const current = questions[currentQuestion];

      progressText.textContent =
        "السؤال " +
        (currentQuestion + 1) +
        " من " +
        questions.length;

      progressBar.style.width =
        ((currentQuestion + 1) / questions.length * 100) + "%";

      questionText.textContent = current.question;
      choicesBox.innerHTML = "";

      current.choices.forEach(function (choice, index) {
        const button = document.createElement("button");

        button.type = "button";
        button.className = "choice";
        button.textContent = choice;

        button.onclick = function () {
          selectAnswer(index, button);
        };

        choicesBox.appendChild(button);
      });

      if (currentQuestion === questions.length - 1) {
        nextButton.textContent = "إنهاء الاختبار";
      } else {
        nextButton.textContent = "السؤال التالي";
      }
    }

    function selectAnswer(index, button) {
      selectedAnswer = index;

      document.querySelectorAll(".choice").forEach(function (choice) {
        choice.classList.remove("selected");
      });

      button.classList.add("selected");
      nextButton.disabled = false;
    }

    function nextQuestion() {
      if (selectedAnswer === null) {
        return;
      }

      if (selectedAnswer === questions[currentQuestion].answer) {
        score++;
      }

      currentQuestion++;

      if (currentQuestion < questions.length) {
        showQuestion();
      } else {
        finishTest();
      }
    }

    function finishTest() {
      const studentName =
        localStorage.getItem("semester1StudentName") || "الطالبة";

      localStorage.setItem("spellingScore", String(score));
      localStorage.setItem("spellingCompleted", "true");

      testScreen.classList.add("hidden");
      resultScreen.classList.remove("hidden");

      document.getElementById("resultName").textContent = studentName;
      document.getElementById("finalScore").textContent = score;

      let message;

      if (score >= 23) {
        message =
          "ممتاز جدًا، لديكِ إتقان رائع لمهارات الرسم الإملائي.";
      } else if (score >= 19) {
        message =
          "أحسنتِ، نتيجتكِ جيدة جدًا.";
      } else if (score >= 13) {
        message =
          "نتيجة جيدة، راجعي بعض القواعد لزيادة الإتقان.";
      } else {
        message =
          "تحتاجين إلى مراجعة الألف اللينة والكلمات الموصولة خطًّا.";
      }

      document.getElementById("resultMessage").textContent = message;
    }
  </script>

</body>
</html>
