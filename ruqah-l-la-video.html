<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    كتابة حرفي اللام ولام ألف بخط الرقعة | منصة آفاق اللغة
  </title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      overflow-x: hidden;
    }

    body {
      font-family: Tahoma, Arial, sans-serif;
      color: #4b3a57;
      text-align: center;
      background: linear-gradient(
        145deg,
        #fffaf2,
        #f8f0fb
      );
    }

    header {
      padding: 36px 16px 42px;
      color: white;
      border-radius: 0 0 34px 34px;
      background: linear-gradient(
        135deg,
        #776094,
        #5b4677
      );
      box-shadow: 0 12px 28px rgba(73, 56, 92, 0.22);
    }

    .header-icon {
      width: 82px;
      height: 82px;
      margin: 0 auto 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 24px;
      font-size: 45px;
      background: rgba(255, 255, 255, 0.15);
      border: 2px solid rgba(255, 255, 255, 0.42);
    }

    header h1 {
      margin: 0;
      color: #fff8df;
      font-size: 32px;
      line-height: 1.7;
    }

    header p {
      max-width: 680px;
      margin: 10px auto 0;
      color: #f7effb;
      font-size: 17px;
      line-height: 1.9;
    }

    main {
      width: 94%;
      max-width: 820px;
      margin: 28px auto 45px;
    }

    .card {
      padding: 26px;
      border-radius: 28px;
      background: #fffdf8;
      border: 1px solid rgba(93, 67, 116, 0.15);
      box-shadow: 0 13px 34px rgba(73, 56, 92, 0.13);
    }

    .intro {
      margin-bottom: 21px;
      padding: 17px;
      border-radius: 18px;
      color: #5d4374;
      background: #f5ecfb;
      border-right: 7px solid #c9a85c;
      font-size: 17px;
      line-height: 1.9;
    }

    .video-box {
      position: relative;
      width: 100%;
      height: 0;
      padding-bottom: 56.25%;
      overflow: hidden;
      border-radius: 20px;
      background: #1d1723;
      border: 4px solid #ead69e;
      box-shadow: 0 10px 25px rgba(73, 56, 92, 0.18);
    }

    .video-box iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .back {
      display: block;
      width: 100%;
      margin-top: 22px;
      padding: 15px;
      border-radius: 17px;
      color: white;
      background: #6f5288;
      text-decoration: none;
      font-size: 17px;
      font-weight: bold;
      transition: opacity 0.2s, transform 0.2s;
    }

    .back:hover {
      opacity: 0.94;
    }

    .back:active {
      transform: scale(0.98);
    }

    footer {
      padding: 22px 12px;
      color: white;
      background: #49385c;
      line-height: 1.8;
    }

    @media (max-width: 600px) {
      header {
        padding: 29px 14px 36px;
      }

      header h1 {
        font-size: 25px;
      }

      header p {
        font-size: 15px;
      }

      main {
        width: 93%;
      }

      .card {
        padding: 18px;
      }

      .intro {
        font-size: 16px;
      }

      .video-box {
        border-width: 3px;
        border-radius: 16px;
      }
    }
  </style>
</head>

<body>

  <header>

    <div class="header-icon">
      🎥
    </div>

    <h1>
      كتابة حرفي اللام ولام ألف بخط الرقعة
    </h1>

    <p>
      شاهدي طريقة كتابة اللام ولام ألف،
      وركّزي على اتجاه الحركة واتصال الحروف.
    </p>

  </header>

  <main>

    <section class="card">

      <div class="intro">
        تابعي الفيديو، وجرّبي تقليد الخطوات على ورقة،
        ثم عودي إلى الدرس لإكمال التدريب.
      </div>

      <div class="video-box">

        <iframe
          src="https://www.youtube.com/embed/bmJb8sCKQhs"
          title="كتابة حرفي اللام ولام ألف بخط الرقعة"
          loading="lazy"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowfullscreen
        ></iframe>

      </div>

      <a
        class="back"
        href="ruqah-l-la.html"
      >
        العودة إلى درس اللام ولام ألف
      </a>

    </section>

  </main>

  <footer>
    جميع الحقوق محفوظة © 2026
  </footer>

</body>

</html>
