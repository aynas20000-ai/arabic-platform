<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>اختبار درس التمييز</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      max-width: 100%;
      margin: 0;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      font-family: Tahoma, Arial, sans-serif;
      color: #4b3a57;
      line-height: 1.8;
      background: linear-gradient(180deg, #fffaf2, #f8f0fb);
    }

    header {
      padding: 34px 18px;
      color: white;
      text-align: center;
      background: linear-gradient(135deg, #776094, #5b4677);
      border-bottom: 4px solid #c9a85c;
    }

    header h1 {
      margin: 0 0 8px;
      color: #fffdf8;
      font-size: 31px;
    }

    header p {
      margin: 0;
      color: #f7effb;
      font-size: 16px;
    }

    .container {
      width: 92%;
      max-width: 760px;
      margin: 25px auto;
    }

    .top-info {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
      color: #5d4374;
      font-weight: bold;
    }

    .progress-wrap {
      width: 100%;
      height: 14px;
      margin-bottom: 22px;
      overflow: hidden;
      background: #eee3f2;
      border: 1px solid #c9a85c;
      border-radius: 20px;
    }

    .progress-bar {
      width: 10%;
      height: 100%;
      background: linear-gradient(90deg, #c9a85c, #8668a0);
      border-radius: 20px;
      transition: width 0.35s ease;
    }

    .question-card,
    .result-card {
      padding: 24px;
      background: #fffdf8;
      border: 2px solid #c9a85c;
      border-radius: 20px;
      box-shadow: 0 7px 18px rgba(91, 63, 111, 0.12);
      animation: appear 0.35s ease;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .question-card h2 {
      margin: 0 0 20px;
      color: #5d4374;
      font-size: 22px;
      line-height: 1.9;
    }

    .choices {
      display: grid;
      gap: 12px;
    }

    .choice {
      width: 100%;
      padding: 15px 16px;
      color: #4b3a57;
      font-family: Tahoma, Arial, sans-serif;
      font-size: 17px;
      line-height: 1.7;
      text-align: right;
      cursor: pointer;
      background: linear-gradient(135deg, #f7effb, #fffaf2);
      border: 2px solid #d8c48a;
      border-radius: 14px;
      transition: 0.2s ease;
    }

    .choice:hover,
    .choice:active {
      transform: translateY(-2px);
      border-color: #8e72a4;
    }

    .choice.correct {
      color: #21683a;
      background: #eaf7ee;
      border-color: #54a66f;
    }

    .choice.wrong {
      color: #9c3344;
      background: #fff0f2;
      border-color: #cf6f7d;
    }

    .choice:disabled {
      cursor: default;
    }

    .feedback {
      display: none;
      margin-top: 18px;
      padding: 14px;
      font-weight: bold;
      line-height: 1.9;
      text-align: center;
      border-radius: 13px;
    }

    .feedback.correct-feedback {
      display: block;
      color: #21683a;
      background: #eef8f1;
      border: 1px solid #8dc59d;
    }

    .feedback.wrong-feedback {
      display: block;
      color: #9c3344;
      background: #fff0f2;
      border: 1px solid #dfa3ad;
    }

    .next-btn,
    .restart-btn {
      display: none;
      width: 100%;
      margin-top: 16px;
      padding: 15px;
      color: white;
      font-family: Tahoma, Arial, sans-serif;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      background: #6f5288;
      border: 2px solid #c9a85c;
      border-radius: 14px;
    }

    .next-btn:hover,
    .restart-btn:hover {
      background: #5b4677;
    }

    .result-card {
      display: none;
      text-align: center;
    }

    .result-icon {
      margin-bottom: 5px;
      font-size: 50px;
    }

    .result-card h2 {
      margin: 5px 0 10px;
      color: #5d4374;
      font-size: 28px;
    }

    .score {
      margin: 18px 0;
      color: #8b6b25;
      font-size: 36px;
      font-weight: bold;
    }

    .message {
      font-size: 19px;
      line-height: 2;
    }

    .result-links {
      display: grid;
      gap: 10px;
      margin-top: 20px;
    }

    .result-link,
    .back {
      display: block;
      padding: 12px 20px;
      color: white;
      font-weight: bold;
      text-align: center;
      text-decoration: none;
      background: #6f5288;
      border: 2px solid #c9a85c;
      border-radius: 18px;
    }

    .back {
      width: fit-content;
      margin: 25px auto;
      border-radius: 22px;
    }

    footer {
      margin-top: 30px;
      padding: 20px;
      color: #fffdf8;
      text-align: center;
      background: #49385c;
      border-top: 3px solid #c9a85c;
    }

    .confetti {
      position: fixed;
      top: -30px;
      z-index: 9999;
      pointer-events: none;
      animation: fall linear forwards;
    }

    @keyframes fall {
      to {
        transform: translateY(110vh) rotate(720deg);
        opacity: 0.9;
      }
    }

    .pop {
      animation: pop 0.3s ease;
    }

    @keyframes pop {
      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.03);
      }

      100% {
        transform: scale(1);
      }
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 26px;
      }

      .question-card,
      .result-card {
        padding: 19px 14px;
      }

      .question-card h2 {
        font-size: 19px;
      }

      .choice {
        font-size: 16px;
      }

      .score {
        font-size: 30px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🎯 تحدي التمييز</h1>
  <p>10 أسئلة... دققي في المعنى قبل أن تختاري الإجابة 🌟</p>
</header>

<main class="container">

  <div id="quizArea">

    <div class="top-info">
      <span id="questionNumber"></span>
      <span id="liveScore">الصحيح: 0</span>
    </div>

    <div class="progress-wrap">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="question-card" id="questionCard">

      <h2 id="questionText"></h2>

      <div class="choices" id="choices"></div>

      <div class="feedback" id="feedback"></div>

      <button class="next-btn" id="nextBtn" type="button">
        السؤال التالي ←
      </button>

    </div>

  </div>

  <div class="result-card" id="resultCard">

    <div class="result-icon" id="resultIcon">🎉</div>

    <h2>انتهى التحدي</h2>

    <div class="score" id="finalScore"></div>

    <div class="message" id="resultMessage"></div>

    <button class="restart-btn" id="restartBtn" type="button">
      🔄 إعادة التحدي
    </button>

    <div class="result-links">

      <a class="result-link" href="tamyiz-file.html">
        📘 مراجعة ملف الدرس
      </a>

      <a class="result-link" href="tamyiz-language-window.html">
        🔬 النافذة اللغوية
      </a>

      <a class="result-link" href="tamyiz.html">
        ↩ العودة إلى درس التمييز
      </a>

    </div>

  </div>

  <a class="back" href="tamyiz.html">
    العودة إلى درس التمييز
  </a>

</main>

<footer>
  جميع الحقوق محفوظة © 2026
</footer>

<script>

  const questions = [

    {
      question:
        "1- في الجملة «اشتريتُ عشرين كتابًا»، ما إعراب «كتابًا»؟",

      choices: [
        "حال منصوب",
        "مفعول به منصوب",
        "تمييز منصوب",
        "نعت منصوب"
      ],

      answer: 2,

      explanation:
        "«كتابًا» أزال الإبهام عن العدد «عشرين»، لذلك فهو تمييز منصوب."
    },

    {
      question:
        "2- ما المميَّز في الجملة «اشتريتُ عشرين كتابًا»؟",

      choices: [
        "اشتريتُ",
        "عشرين",
        "كتابًا",
        "التاء"
      ],

      answer: 1,

      explanation:
        "«عشرين» هو المميَّز؛ لأن «كتابًا» جاء ليوضح المقصود من العدد."
    },

    {
      question:
        "3- أي الجمل الآتية تحتوي على تمييز يوضح مقدارًا؟",

      choices: [
        "عاد المسافرُ مسرورًا",
        "اشتريتُ لترًا حليبًا",
        "رأيتُ الطالبَ المجتهدَ",
        "قرأ الطالبُ القصةَ"
      ],

      answer: 1,

      explanation:
        "«حليبًا» تمييز؛ لأنه أوضح المقصود من مقدار «لترًا»."
    },

    {
      question:
        "4- في الجملة «زرعتُ هكتارًا قمحًا»، ما التمييز؟",

      choices: [
        "زرعتُ",
        "هكتارًا",
        "قمحًا",
        "التاء"
      ],

      answer: 2,

      explanation:
        "«قمحًا» أوضح المقصود من المساحة «هكتارًا»، لذلك فهو التمييز."
    },

    {
      question:
        "5- أي الجمل الآتية تحتوي على تمييز نسبة؟",

      choices: [
        "اشتريت عشرين قلمًا",
        "شربت لترًا ماءً",
        "ازداد الطالبُ علمًا",
        "زرعت هكتارًا قمحًا"
      ],

      answer: 2,

      explanation:
        "«علمًا» يوضح معنى الجملة ويبين جهة الزيادة؛ لذلك هو تمييز نسبة."
    },

    {
      question:
        "6- في الجملة «عاد الطالبُ مسرورًا» و«ازداد الطالبُ سرورًا»، ما إعراب الكلمتين بالترتيب؟",

      choices: [
        "تمييز ثم حال",
        "حال ثم تمييز",
        "مفعول به ثم حال",
        "نعت ثم مفعول به"
      ],

      answer: 1,

      explanation:
        "«مسرورًا» تبيّن هيئة الطالب فهي حال، أما «سرورًا» فتوضح جهة الزيادة فهي تمييز."
    },

    {
      question:
        "7- في قوله تعالى ﴿وَاشْتَعَلَ الرَّأْسُ شَيْبًا﴾، ما نوع «شيبًا»؟",

      choices: [
        "حال",
        "مفعول به",
        "تمييز نسبة محوَّل عن فاعل",
        "نعت"
      ],

      answer: 2,

      explanation:
        "«شيبًا» تمييز نسبة محوَّل عن فاعل؛ والأصل: اشتعل شيبُ الرأس."
    },

    {
      question:
        "8- أي الكلمات الآتية ليست تمييزًا؟",

      choices: [
        "علمًا في «ازداد الطالب علمًا»",
        "ماءً في «امتلأ الإناء ماءً»",
        "مسرعًا في «عاد الطالب مسرعًا»",
        "اجتهادًا في «محمد أكثر الطلاب اجتهادًا»"
      ],

      answer: 2,

      explanation:
        "«مسرعًا» حال؛ لأنها تبيّن هيئة الطالب وقت عودته، وليست تمييزًا."
    },

    {
      question:
        "9- في الجملة «محمدٌ أكثرُ الطلابِ اجتهادًا»، ما وظيفة «اجتهادًا»؟",

      choices: [
        "بيان هيئة محمد",
        "بيان جهة الزيادة في «أكثر»",
        "بيان من وقع عليه الفعل",
        "وصف كلمة الطلاب"
      ],

      answer: 1,

      explanation:
        "«اجتهادًا» تمييز يوضح الجهة التي كان فيها محمد أكثر من غيره."
    },

    {
      question:
        "10- أي العبارات الآتية أدق؟",

      choices: [
        "كل اسم منصوب تمييز",
        "كل اسم يأتي بعد عدد يكون منصوبًا دائمًا",
        "التمييز يزيل إبهامًا في اسم قبله أو في معنى الجملة",
        "التمييز يصف هيئة صاحبه وقت وقوع الفعل"
      ],

      answer: 2,

      explanation:
        "وظيفة التمييز الأساسية إزالة الإبهام، أما بيان الهيئة فهو من وظيفة الحال."
    }

  ];


  let currentQuestion = 0;
  let score = 0;
  let answered = false;

  const questionNumber =
    document.getElementById("questionNumber");

  const liveScore =
    document.getElementById("liveScore");

  const progressBar =
    document.getElementById("progressBar");

  const questionText =
    document.getElementById("questionText");

  const choicesBox =
    document.getElementById("choices");

  const feedback =
    document.getElementById("feedback");

  const nextBtn =
    document.getElementById("nextBtn");

  const questionCard =
    document.getElementById("questionCard");


  function playTone(correct = true) {

    try {

      const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;

      const ctx =
        new AudioContext();

      const oscillator =
        ctx.createOscillator();

      const gain =
        ctx.createGain();

      oscillator.connect(gain);
      gain.connect(ctx.destination);

      oscillator.type =
        correct ? "sine" : "triangle";

      oscillator.frequency.value =
        correct ? 720 : 220;

      gain.gain.setValueAtTime(
        0.12,
        ctx.currentTime
      );

      gain.gain.exponentialRampToValueAtTime(
        0.001,
        ctx.currentTime + 0.22
      );

      oscillator.start();

      oscillator.stop(
        ctx.currentTime + 0.22
      );

    } catch (e) {}

  }


  function renderQuestion() {

    answered = false;

    const q =
      questions[currentQuestion];

    questionNumber.textContent =
      "السؤال " +
      (currentQuestion + 1) +
      " من " +
      questions.length;

    liveScore.textContent =
      "الصحيح: " + score;

    progressBar.style.width =
      (((currentQuestion + 1) /
      questions.length) * 100) + "%";

    questionText.textContent =
      q.question;

    choicesBox.innerHTML = "";

    feedback.textContent = "";
    feedback.className = "feedback";

    nextBtn.style.display = "none";

    questionCard.classList.remove("pop");

    void questionCard.offsetWidth;

    questionCard.classList.add("pop");

    q.choices.forEach(
      (choice, index) => {

        const button =
          document.createElement("button");

        button.type = "button";

        button.className =
          "choice";

        button.textContent =
          choice;

        button.addEventListener(
          "click",
          () => {
            checkAnswer(
              index,
              button
            );
          }
        );

        choicesBox.appendChild(
          button
        );

      }
    );

  }


  function checkAnswer(
    selectedIndex,
    selectedButton
  ) {

    if (answered) return;

    answered = true;

    const q =
      questions[currentQuestion];

    const buttons =
      document.querySelectorAll(
        ".choice"
      );

    buttons.forEach(
      button => {
        button.disabled = true;
      }
    );

    if (
      selectedIndex ===
      q.answer
    ) {

      score++;

      selectedButton.classList.add(
        "correct"
      );

      feedback.textContent =
        "أحسنتِ 🌟 " +
        q.explanation;

      feedback.className =
        "feedback correct-feedback";

      playTone(true);

      miniCelebration();

    } else {

      selectedButton.classList.add(
        "wrong"
      );

      buttons[q.answer].classList.add(
        "correct"
      );

      feedback.textContent =
        "قريبة 🌷 الإجابة الصحيحة موضحة بالأخضر. " +
        q.explanation;

      feedback.className =
        "feedback wrong-feedback";

      playTone(false);

      if (navigator.vibrate) {
        navigator.vibrate(100);
      }

    }

    liveScore.textContent =
      "الصحيح: " + score;

    nextBtn.style.display =
      "block";

    if (
      currentQuestion ===
      questions.length - 1
    ) {

      nextBtn.textContent =
        "عرض النتيجة 🎉";

    } else {

      nextBtn.textContent =
        "السؤال التالي ←";

    }

  }


  nextBtn.addEventListener(
    "click",
    () => {

      if (!answered) return;

      if (
        currentQuestion <
        questions.length - 1
      ) {

        currentQuestion++;

        renderQuestion();

        window.scrollTo({
          top: 0,
          behavior: "smooth"
        });

      } else {

        showResult();

      }

    }
  );


  function showResult() {

    document.getElementById(
      "quizArea"
    ).style.display = "none";

    const resultCard =
      document.getElementById(
        "resultCard"
      );

    resultCard.style.display =
      "block";

    const percentage =
      Math.round(
        (score /
        questions.length) *
        100
      );

    document.getElementById(
      "finalScore"
    ).textContent =
      score +
      " / " +
      questions.length +
      " — " +
      percentage +
      "%";

    let message = "";
    let icon = "";

    if (percentage === 100) {

      icon = "🏆";

      message =
        "مذهلة! أتقنتِ درس التمييز إتقانًا كاملًا 🌟";

      launchConfetti();

    } else if (
      percentage >= 80
    ) {

      icon = "🌟";

      message =
        "رائعة جدًا! تمييزك بين التراكيب قوي، وبقيت لمسات بسيطة للوصول إلى الإتقان.";

      launchConfetti();

    } else if (
      percentage >= 60
    ) {

      icon = "🌷";

      message =
        "أداء جيد. راجعي الأسئلة التي أخطأتِ فيها ثم أعيدي التحدي.";

    } else {

      icon = "💜";

      message =
        "راجعي ملف الدرس والنافذة اللغوية، ثم جربي التحدي مرة أخرى بثقة.";

    }

    document.getElementById(
      "resultIcon"
    ).textContent = icon;

    document.getElementById(
      "resultMessage"
    ).textContent = message;

    document.getElementById(
      "restartBtn"
    ).style.display = "block";

    resultCard.scrollIntoView({
      behavior: "smooth"
    });

  }


  document.getElementById(
    "restartBtn"
  ).addEventListener(
    "click",
    () => {

      currentQuestion = 0;
      score = 0;
      answered = false;

      document.getElementById(
        "resultCard"
      ).style.display = "none";

      document.getElementById(
        "quizArea"
      ).style.display = "block";

      renderQuestion();

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }
  );


  function miniCelebration() {

    const symbols =
      ["✨", "⭐", "💜", "💛"];

    for (
      let i = 0;
      i < 8;
      i++
    ) {

      const piece =
        document.createElement(
          "div"
        );

      piece.className =
        "confetti";

      piece.textContent =
        symbols[
          Math.floor(
            Math.random() *
            symbols.length
          )
        ];

      piece.style.left =
        Math.random() *
        100 +
        "vw";

      piece.style.fontSize =
        15 +
        Math.random() *
        10 +
        "px";

      piece.style.animationDuration =
        1.6 +
        Math.random() *
        1.4 +
        "s";

      document.body.appendChild(
        piece
      );

      setTimeout(
        () => {
          piece.remove();
        },
        3200
      );

    }

  }


  function launchConfetti() {

    const symbols =
      [
        "✨",
        "⭐",
        "🌟",
        "🎉",
        "💜",
        "💛",
        "🎈"
      ];

    for (
      let i = 0;
      i < 40;
      i++
    ) {

      const piece =
        document.createElement(
          "div"
        );

      piece.className =
        "confetti";

      piece.textContent =
        symbols[
          Math.floor(
            Math.random() *
            symbols.length
          )
        ];

      piece.style.left =
        Math.random() *
        100 +
        "vw";

      piece.style.fontSize =
        17 +
        Math.random() *
        18 +
        "px";

      piece.style.animationDuration =
        2.5 +
        Math.random() *
        2 +
        "s";

      document.body.appendChild(
        piece
      );

      setTimeout(
        () => {
          piece.remove();
        },
        5000
      );

    }

  }


  renderQuestion();

</script>

</body>

</html>
