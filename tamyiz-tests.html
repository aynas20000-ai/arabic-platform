<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>اختبار درس التمييز</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      max-width: 100%;
      margin: 0;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      font-family: Tahoma, Arial, sans-serif;
      color: #4b3a57;
      background: linear-gradient(180deg, #fffaf2, #f8f0fb);
    }

    header {
      padding: 38px 20px;
      color: white;
      text-align: center;
      background: linear-gradient(135deg, #776094, #5b4677);
      border-bottom: 4px solid #c9a85c;
    }

    header h1 {
      margin: 0 0 10px;
      color: #fffdf8;
      font-size: 32px;
      line-height: 1.6;
    }

    header p {
      margin: 0;
      color: #f7effb;
      font-size: 18px;
      line-height: 1.8;
    }

    main {
      width: 90%;
      max-width: 750px;
      margin: 25px auto;
    }

    .progress-box {
      margin-bottom: 20px;
      padding: 16px;
      background: #fffdf8;
      border: 2px solid #c9a85c;
      border-radius: 18px;
      box-shadow: 0 6px 16px rgba(91, 63, 111, 0.11);
    }

    .progress-text {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
      color: #5d4374;
      font-weight: bold;
    }

    .progress {
      height: 14px;
      overflow: hidden;
      background: #eadff0;
      border-radius: 20px;
    }

    .progress-bar {
      width: 0;
      height: 100%;
      background: linear-gradient(90deg, #776094, #c9a85c);
      transition: width 0.4s ease;
    }

    .quiz-card,
    .result {
      padding: 24px;
      background: #fffdf8;
      border: 2px solid #c9a85c;
      border-radius: 22px;
      box-shadow: 0 7px 18px rgba(91, 63, 111, 0.12);
    }

    .question-number {
      margin-bottom: 10px;
      color: #8b6b25;
      font-weight: bold;
    }

    .question {
      margin-bottom: 20px;
      color: #5d4374;
      font-size: 22px;
      font-weight: bold;
      line-height: 1.8;
    }

    .answers {
      display: grid;
      gap: 12px;
    }

    .answer {
      width: 100%;
      padding: 15px;
      color: #4b3a57;
      font-family: Tahoma, Arial, sans-serif;
      font-size: 18px;
      line-height: 1.7;
      text-align: right;
      cursor: pointer;
      background: linear-gradient(135deg, #f5ecfb, #fffaf2);
      border: 2px solid #c9a85c;
      border-radius: 15px;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .answer:hover,
    .answer:active {
      background: #f1e5f8;
      transform: translateY(-2px);
    }

    .answer:disabled {
      cursor: default;
    }

    .answer.correct {
      color: #25663c;
      background: #e5f6e9;
      border-color: #4d9b64;
    }

    .answer.wrong {
      color: #9c3547;
      background: #fde8ec;
      border-color: #c95c70;
    }

    .message {
      min-height: 55px;
      margin-top: 18px;
      padding: 12px;
      font-size: 17px;
      font-weight: bold;
      line-height: 1.8;
      text-align: center;
      border-radius: 14px;
    }

    .message.success {
      color: #25663c;
      background: #e5f6e9;
      border: 1px solid #4d9b64;
    }

    .message.error {
      color: #9c3547;
      background: #fde8ec;
      border: 1px solid #c95c70;
    }

    .next-btn,
    .restart-btn,
    .back-btn {
      display: block;
      width: 100%;
      margin-top: 15px;
      padding: 15px;
      color: white;
      font-family: Tahoma, Arial, sans-serif;
      font-size: 19px;
      font-weight: bold;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      background: #6f5288;
      border: 2px solid #c9a85c;
      border-radius: 15px;
    }

    .next-btn {
      display: none;
    }

    .next-btn:hover,
    .restart-btn:hover,
    .back-btn:hover {
      background: #5b4677;
    }

    .result {
      display: none;
      text-align: center;
    }

    .result-icon {
      font-size: 70px;
    }

    .result h2 {
      margin: 10px 0;
      color: #5d4374;
      font-size: 30px;
    }

    .score {
      margin: 20px 0;
      color: #8b6b25;
      font-size: 26px;
      font-weight: bold;
    }

    .result p {
      color: #4b3a57;
      font-size: 18px;
      line-height: 1.8;
    }

    footer {
      margin-top: 30px;
      padding: 20px;
      color: #fffdf8;
      text-align: center;
      background: #49385c;
      border-top: 3px solid #c9a85c;
    }

    .shake {
      animation: shake 0.35s;
    }

    @keyframes shake {
      0% { transform: translateX(0); }
      25% { transform: translateX(8px); }
      50% { transform: translateX(-8px); }
      75% { transform: translateX(6px); }
      100% { transform: translateX(0); }
    }

    .confetti {
      position: fixed;
      top: -20px;
      z-index: 9999;
      pointer-events: none;
      animation: fall linear forwards;
    }

    @keyframes fall {
      to {
        transform: translateY(110vh) rotate(720deg);
        opacity: 0.9;
      }
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 27px;
      }

      header p {
        font-size: 16px;
      }

      main {
        width: 94%;
      }

      .quiz-card,
      .result {
        padding: 20px 14px;
      }

      .question {
        font-size: 19px;
      }

      .answer {
        padding: 14px 12px;
        font-size: 16px;
      }

      .message {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>🧠 اختبار درس التمييز</h1>
    <p>اختبري فهمك واجمعي أكبر عدد من النجوم ⭐</p>
  </header>

  <main>

    <div id="quizArea">

      <div class="progress-box">
        <div class="progress-text">
          <span id="progressText"></span>
          <span id="scoreText">الدرجة: 0</span>
        </div>

        <div class="progress">
          <div class="progress-bar" id="progressBar"></div>
        </div>
      </div>

      <div class="quiz-card" id="quizCard">

        <div class="question-number" id="questionNumber"></div>
        <div class="question" id="question"></div>
        <div class="answers" id="answers"></div>
        <div class="message" id="message"></div>

        <button
          type="button"
          class="next-btn"
          id="nextBtn"
          onclick="nextQuestion()">
          السؤال التالي ←
        </button>

      </div>
    </div>

    <div class="result" id="result">

      <div class="result-icon" id="resultIcon">🏆</div>

      <h2 id="resultTitle"></h2>

      <div class="score" id="finalScore"></div>

      <p id="resultMessage"></p>

      <button
        type="button"
        class="restart-btn"
        onclick="restartQuiz()">
        🔄 إعادة الاختبار
      </button>

      <a class="back-btn" href="tamyiz.html">
        العودة إلى درس التمييز
      </a>

    </div>

  </main>

  <footer>
    جميع الحقوق محفوظة © 2026
  </footer>

  <script>
    const questions = [
      {
        question: "1- ما تعريف التمييز؟",
        answers: [
          "اسم معرفة يصف ما قبله",
          "اسم نكرة يزيل إبهام اسم قبله أو معنى في الجملة",
          "فعل يوضح زمن الجملة",
          "حرف يربط بين كلمتين"
        ],
        correct: 1,
        explanation: "التمييز اسم نكرة يزيل الإبهام ويوضح المقصود."
      },
      {
        question: "2- ما المميَّز في جملة «اشتريتُ عشرين كتابًا»؟",
        answers: [
          "اشتريتُ",
          "عشرين",
          "كتابًا",
          "التاء"
        ],
        correct: 1,
        explanation: "العدد «عشرين» هو المميَّز، و«كتابًا» وضح المقصود منه."
      },
      {
        question: "3- ما التمييز في جملة «اشتريتُ عشرين كتابًا»؟",
        answers: [
          "اشتريتُ",
          "عشرين",
          "كتابًا",
          "التاء"
        ],
        correct: 2,
        explanation: "«كتابًا» تمييز؛ لأنه أزال الإبهام عن العدد عشرين."
      },
      {
        question: "4- ما التمييز في جملة «شربتُ لترًا ماءً»؟",
        answers: [
          "شربتُ",
          "لترًا",
          "ماءً",
          "التاء"
        ],
        correct: 2,
        explanation: "«ماءً» وضح المقصود من مقدار اللتر."
      },
      {
        question: "5- تمييز المفرد يسمى أيضًا:",
        answers: [
          "تمييز النسبة",
          "تمييز الجملة",
          "تمييز الذات أو الملفوظ",
          "الحال"
        ],
        correct: 2,
        explanation: "تمييز المفرد يسمى تمييز الذات أو التمييز الملفوظ."
      },
      {
        question: "6- تمييز الجملة يسمى أيضًا:",
        answers: [
          "تمييز الذات",
          "تمييز النسبة أو الملحوظ",
          "تمييز العدد",
          "المفعول به"
        ],
        correct: 1,
        explanation: "تمييز الجملة يسمى تمييز النسبة أو التمييز الملحوظ."
      },
      {
        question: "7- أي الجمل الآتية تحتوي على تمييز عدد؟",
        answers: [
          "ازداد الطالب علمًا",
          "اشتريتُ عشرين قلمًا",
          "طاب المكان هواءً",
          "امتلأ الإناء ماءً"
        ],
        correct: 1,
        explanation: "«قلمًا» تمييز للعدد «عشرين»."
      },
      {
        question: "8- في جملة «اشتريتُ كيلو تمرًا»، كلمة «تمرًا» تمييز:",
        answers: [
          "عدد",
          "وزن",
          "مساحة",
          "جملة"
        ],
        correct: 1,
        explanation: "الكيلو من ألفاظ الوزن، و«تمرًا» تمييز له."
      },
      {
        question: "9- ما التمييز في جملة «زرعتُ هكتارًا قمحًا»؟",
        answers: [
          "زرعتُ",
          "هكتارًا",
          "قمحًا",
          "التاء"
        ],
        correct: 2,
        explanation: "«قمحًا» وضح المقصود من المساحة «هكتارًا»."
      },
      {
        question: "10- أي الجمل الآتية تحتوي على تمييز جملة؟",
        answers: [
          "قرأتُ عشرين صفحةً",
          "اشتريتُ كيلو تمرًا",
          "ازداد الطالب علمًا",
          "شربتُ لترًا حليبًا"
        ],
        correct: 2,
        explanation: "«علمًا» يوضح معنى الجملة كلها؛ لذلك هو تمييز جملة."
      },
      {
        question: "11- ما إعراب «علمًا» في «ازداد الطالب علمًا»؟",
        answers: [
          "فاعل مرفوع",
          "مفعول به منصوب",
          "تمييز منصوب",
          "حال منصوب"
        ],
        correct: 2,
        explanation: "«علمًا» تمييز منصوب وعلامة نصبه الفتحة الظاهرة."
      },
      {
        question: "12- إذا كان التمييز مفردًا صحيح الآخر ومنصوبًا، فما علامة نصبه؟",
        answers: [
          "الضمة",
          "الكسرة",
          "الفتحة",
          "السكون"
        ],
        correct: 2,
        explanation: "علامة نصبه في هذه الحالة الفتحة الظاهرة."
      },
      {
        question: "13- ما التمييز في «محمد أكثر الطلاب اجتهادًا»؟",
        answers: [
          "محمد",
          "أكثر",
          "الطلاب",
          "اجتهادًا"
        ],
        correct: 3,
        explanation: "«اجتهادًا» تمييز يوضح جهة الزيادة في معنى «أكثر»."
      },
      {
        question: "14- المميَّز الملحوظ يُفهم من:",
        answers: [
          "كلمة واحدة فقط",
          "معنى الجملة كلها",
          "الفعل وحده",
          "الحرف الأخير"
        ],
        correct: 1,
        explanation: "المميَّز الملحوظ لا يكون اسمًا محددًا، بل يُفهم من معنى الجملة."
      },
      {
        question: "15- أي إعراب مما يأتي صحيح؟",
        answers: [
          "ماءً: فاعل مرفوع",
          "كتابًا: تمييز منصوب",
          "علمًا: مبتدأ مرفوع",
          "اجتهادًا: مضاف إليه"
        ],
        correct: 1,
        explanation: "«كتابًا» في «اشتريت عشرين كتابًا» تمييز منصوب."
      }
    ];

    const encouragements = [
      "إجابة لامعة! ⭐",
      "مذهلة يا بطلة! 🎉",
      "أحسنتِ، أنتِ تتقدمين بسرعة 🚀",
      "إجابة ذكية جدًا 🧠",
      "رائعة! واصلي التألق 🌟",
      "يا سلام عليكِ! 👏"
    ];

    let currentQuestion = 0;
    let score = 0;
    let answered = false;

    const questionElement = document.getElementById("question");
    const answersElement = document.getElementById("answers");
    const messageElement = document.getElementById("message");
    const nextBtn = document.getElementById("nextBtn");
    const quizCard = document.getElementById("quizCard");

    function loadQuestion() {
      answered = false;

      const item = questions[currentQuestion];

      document.getElementById("questionNumber").textContent =
        "السؤال رقم " + (currentQuestion + 1);

      document.getElementById("progressText").textContent =
        "السؤال " + (currentQuestion + 1) + " من " + questions.length;

      document.getElementById("scoreText").textContent =
        "الدرجة: " + score;

      document.getElementById("progressBar").style.width =
        (currentQuestion / questions.length) * 100 + "%";

      questionElement.textContent = item.question;

      answersElement.innerHTML = "";
      messageElement.textContent = "";
      messageElement.className = "message";
      nextBtn.style.display = "none";

      item.answers.forEach((answer, index) => {
        const button = document.createElement("button");

        button.type = "button";
        button.className = "answer";
        button.textContent = answer;

        button.onclick = () => selectAnswer(index, button);

        answersElement.appendChild(button);
      });
    }

    function selectAnswer(index, selectedButton) {
      if (answered) return;

      answered = true;

      const item = questions[currentQuestion];
      const buttons = document.querySelectorAll(".answer");

      buttons.forEach(button => {
        button.disabled = true;
      });

      if (index === item.correct) {
        score++;

        selectedButton.classList.add("correct");

        const praise =
          encouragements[
            Math.floor(Math.random() * encouragements.length)
          ];

        messageElement.textContent =
          praise + " " + item.explanation;

        messageElement.className = "message success";

        playSound(true);
      } else {
        selectedButton.classList.add("wrong");
        buttons[item.correct].classList.add("correct");

        messageElement.textContent =
          "محاولة جميلة 🌷 الإجابة الصحيحة موضحة بالأخضر. " +
          item.explanation;

        messageElement.className = "message error";

        quizCard.classList.add("shake");

        setTimeout(() => {
          quizCard.classList.remove("shake");
        }, 400);

        if ("vibrate" in navigator) {
          navigator.vibrate(120);
        }

        playSound(false);
      }

      document.getElementById("scoreText").textContent =
        "الدرجة: " + score;

      nextBtn.style.display = "block";

      if (currentQuestion === questions.length - 1) {
        nextBtn.textContent = "عرض النتيجة 🏆";
      } else {
        nextBtn.textContent = "السؤال التالي ←";
      }
    }

    function playSound(correct) {
      try {
        const AudioContext =
          window.AudioContext || window.webkitAudioContext;

        const audioContext = new AudioContext();
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();

        oscillator.connect(gain);
        gain.connect(audioContext.destination);

        oscillator.frequency.value = correct ? 720 : 220;

        gain.gain.setValueAtTime(0.12, audioContext.currentTime);
        gain.gain.exponentialRampToValueAtTime(
          0.001,
          audioContext.currentTime + 0.25
        );

        oscillator.start();
        oscillator.stop(audioContext.currentTime + 0.25);
      } catch (error) {
        // يستمر الاختبار دون صوت إذا لم يدعمه الجهاز
      }
    }

    function nextQuestion() {
      currentQuestion++;

      if (currentQuestion < questions.length) {
        loadQuestion();

        window.scrollTo({
          top: 0,
          behavior: "smooth"
        });
      } else {
        showResult();
      }
    }

    function showResult() {
      document.getElementById("quizArea").style.display = "none";
      document.getElementById("result").style.display = "block";

      const percentage =
        Math.round((score / questions.length) * 100);

      document.getElementById("finalScore").textContent =
        "درجتك: " +
        score +
        " من " +
        questions.length +
        " — " +
        percentage +
        "%";

      const icon = document.getElementById("resultIcon");
      const title = document.getElementById("resultTitle");
      const resultMessage =
        document.getElementById("resultMessage");

      if (percentage >= 90) {
        icon.textContent = "🏆";
        title.textContent = "بطلة التمييز!";
        resultMessage.textContent =
          "إتقان رائع جدًا، تستحقين وسام التميز الذهبي 🌟";
        launchConfetti();
      } else if (percentage >= 70) {
        icon.textContent = "🌟";
        title.textContent = "أداء رائع!";
        resultMessage.textContent =
          "فهمك ممتاز، راجعي الأخطاء البسيطة وستصلين إلى الإتقان.";
        launchConfetti();
      } else if (percentage >= 50) {
        icon.textContent = "🌱";
        title.textContent = "بداية جميلة";
        resultMessage.textContent =
          "راجعي أنواع التمييز والأمثلة ثم أعيدي المحاولة.";
      } else {
        icon.textContent = "💪";
        title.textContent = "واصلي المحاولة";
        resultMessage.textContent =
          "راجعي ملف الدرس وخريطة المفاهيم، ثم عودي للاختبار بثقة.";
      }

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }

    function restartQuiz() {
      currentQuestion = 0;
      score = 0;
      answered = false;

      document.getElementById("quizArea").style.display = "block";
      document.getElementById("result").style.display = "none";

      loadQuestion();

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }

    function launchConfetti() {
      const symbols = ["✨", "⭐", "🌟", "🎉", "💜", "💛"];

      for (let i = 0; i < 35; i++) {
        const piece = document.createElement("div");

        piece.className = "confetti";
        piece.textContent =
          symbols[Math.floor(Math.random() * symbols.length)];

        piece.style.left = Math.random() * 100 + "vw";
        piece.style.fontSize =
          16 + Math.random() * 18 + "px";

        piece.style.animationDuration =
          2.5 + Math.random() * 2 + "s";

        document.body.appendChild(piece);

        setTimeout(() => {
          piece.remove();
        }, 5000);
      }
    }

    loadQuestion();
  </script>

</body>

</html>
