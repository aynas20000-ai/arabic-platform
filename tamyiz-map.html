<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>خريطة مفاهيم درس التمييز</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      max-width: 100%;
      margin: 0;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      font-family: Tahoma, Arial, sans-serif;
      color: #4b3a57;
      text-align: center;
      background: linear-gradient(180deg, #fffaf2, #f8f0fb);
    }

    header {
      padding: 38px 20px;
      color: white;
      background: linear-gradient(135deg, #776094, #5b4677);
      border-bottom: 4px solid #c9a85c;
    }

    header h1 {
      margin: 0;
      color: #fffdf8;
      font-size: 34px;
      line-height: 1.6;
    }

    main {
      width: 90%;
      max-width: 900px;
      margin: 30px auto;
    }

    .map-box {
      padding: 18px;
      background: #fffdf8;
      border: 2px solid #c9a85c;
      border-radius: 20px;
      box-shadow: 0 7px 18px rgba(91, 63, 111, 0.12);
    }

    img {
      display: block;
      width: 100%;
      height: auto;
      border: 2px solid #c9a85c;
      border-radius: 16px;
      box-shadow: 0 4px 12px rgba(91, 63, 111, 0.08);
    }

    .back {
      display: block;
      width: fit-content;
      margin: 30px auto;
      padding: 12px 25px;
      color: white;
      font-size: 18px;
      font-weight: bold;
      text-decoration: none;
      background: #6f5288;
      border: 2px solid #c9a85c;
      border-radius: 22px;
    }

    footer {
      margin-top: 30px;
      padding: 20px;
      color: #fffdf8;
      background: #49385c;
      border-top: 3px solid #c9a85c;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 27px;
      }

      main {
        width: 94%;
      }

      .map-box {
        padding: 12px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>🧠 خريطة مفاهيم درس التمييز</h1>
  </header>

  <main>

    <div class="map-box">
      <img
        src="401.png"
        alt="خريطة مفاهيم درس التمييز">
    </div>

    <a class="back" href="tamyiz.html">
      العودة إلى درس التمييز
    </a>

  </main>

  <footer>
    جميع الحقوق محفوظة © 2026
  </footer>

</body>

</html>
