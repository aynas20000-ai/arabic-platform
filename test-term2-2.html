const reading=`اللغة العربية هوية ذات قوة وأصالة، وهي من اللغات الأكثر انتشارًا واستخدامًا في العالم، ويقدّر عدد المتكلمين بها بما يزيد على أربعمائة مليون نسمة. وقد تقرر تحديد اليوم الثامن عشر من ديسمبر من كل عام يومًا للاحتفاء بها؛ لأنه اليوم الذي أقرت فيه الجمعية العامة للأمم المتحدة عام 1973م أن تكون اللغة العربية لغة رسمية سادسة في المنظمة.

وتمتاز لغتنا الجميلة بالأصالة التي حفظت لنا تراث العرب الفني والثقافي، وأنتجت المعارف والعلوم ونشرتها بين الثقافات، كما أسهمت في نقل المعارف من ثقافات أخرى عن طريق الترجمة.

إن الاعتزاز بلغتنا العربية يتخذ صورًا متعددة، منها اعتمادها لغة للخطاب والتخاطب، والحرص على تعلمها وتذوقها من خلال دراسة علومها النحوية والبلاغية والتمثل بما فيها من آداب رفيعة. كما أنها لغة القرآن الكريم، ويكفيها فخرًا هذا الانتساب، إضافة إلى أنها لغة العلم والأدب، واليوم تعد اللغة العربية لغة رسمية في نحو خمس وعشرين دولة.

وقد أولت قيادتنا الرشيدة اهتمامًا كبيرًا بالمحافظة على اللغة العربية؛ فأنشأت مجمع الملك سلمان العالمي للغة العربية الذي يعزز دورها إقليميًا وعالميًا، ويطوّر تقنيات الذكاء الاصطناعي في المعالجة الآلية للغة العربية.

إن لغتنا الخالدة لغة للحضارة والتقنية والتطور، فلها في كل مجال علمي مكانة تقدير واعتزاز؛ لأنها لغة حياة في علم وعمل، تجدها مع الطبيب في مختبره، ومع المهندس في مكتبه، وفي كل العلوم ترى لها حضورًا فاعلًا وحداثة وتنمية.`;

 $("passage").innerHTML=q.pass==="read"?`<div class="passage">${reading}</div>`:q.pass==="poem"?`<div class="passage">${poem}</div>`:"";
 $("qtext").textContent=q.q;$("answer").innerHTML="";$("feedback").style.display="none";$("model").style.display="none";$("self").style.display="none";$("prev").disabled=i===0;$("next").textContent=i===qs.length-1?"إنهاء النموذج":"التالي";
 if(q.t==="mcq"||q.t==="tf"){let box=document.createElement("div");box.className="options";let vals=q.t==="tf"?[["صحيح",true],["خطأ",false]]:q.o.map((x,j)=>[x,j]);vals.forEach(([x,v])=>{let b=document.createElement("button");b.className="option";b.textContent=x;b.onclick=()=>choice(v,b,box);box.appendChild(b)});$("answer").appendChild(box)}
 else if(q.t==="text")$("answer").innerHTML=`<input id="txt" placeholder="اكتبي الإجابة"><div class="actions"><button class="primary" onclick="checkText()">تحقق</button></div>`;
 else if(q.t==="match"){let h='<div class="match-grid">';q.items.forEach((x,j)=>h+=`<div class="match-label">${x}</div><select class="matchSel"><option value="">الفقرة</option>${[1,2,3,4,5].map(n=>`<option value="${n}">${ar(n)}</option>`).join("")}</select>`);h+=`</div><div class="actions"><button class="primary" onclick="checkMatch()">تحقق من التوصيل</button></div>`;$("answer").innerHTML=h}
 else if(q.t==="order")$("answer").innerHTML=`<select id="ord1"><option value="">الأول</option>${q.items.map(x=>`<option>${x}</option>`).join("")}</select><br><br><select id="ord2"><option value="">الثاني</option>${q.items.map(x=>`<option>${x}</option>`).join("")}</select><div class="actions"><button class="primary" onclick="checkOrder()">تحقق</button></div>`;
 else $("answer").innerHTML=`<textarea placeholder="اكتبي إجابتك أولًا"></textarea><div class="actions"><button class="gold" onclick="showModel()">عرض الإجابة النموذجية</button></div>`;
}
function award(p){if(done[i])return;done[i]=true;score+=p;$("scoreLive").textContent=`الدرجة: ${ar(score)} / ٤٠`}
function fb(ok,txt){let f=$("feedback");f.className="feedback "+(ok?"ok":"bad");f.innerHTML=txt;f.style.display="block";if(ok)sparkle(8)}
function choice(v,b,box){if(done[i])return;let q=qs[i],ok=v===q.a;[...box.children].forEach((x,j)=>x.disabled=true);let correctIndex=q.t==="tf"?(q.a?0:1):q.a;box.children[correctIndex].classList.add("correct");if(!ok)b.classList.add("wrong");award(ok?q.p:0);fb(ok,`${ok?"✅ أحسنتِ.":"❌ الإجابة غير صحيحة."}<br><strong>التوضيح:</strong> ${q.w}`)}
function norm(s){return s.trim().replace(/[ًٌٍَُِّْـ.،]/g,"").replace(/\s+/g," ")}
function checkText(){if(done[i])return;let q=qs[i],v=norm($("txt").value),ok=q.answers.some(x=>norm(x)===v);$("txt").disabled=true;award(ok?q.p:0);fb(ok,`${ok?"✅ صحيحة.":"❌ راجعيها."}<br><strong>الإجابة:</strong> ${q.m}<br>${q.w}`)}
function checkMatch(){if(done[i])return;let q=qs[i],vals=[...document.querySelectorAll(".matchSel")].map(x=>+x.value),ok=vals.every((x,j)=>x===q.correct[j]);document.querySelectorAll(".matchSel").forEach(x=>x.disabled=true);award(ok?q.p:0);fb(ok,`${ok?"✅ التوصيل كامل وصحيح.":"❌ يوجد توصيل غير صحيح."}<br>${q.w}<br><strong>الترتيب الصحيح:</strong> ${q.correct.map(ar).join("، ")}`)}
function checkOrder(){if(done[i])return;let q=qs[i],ok=$("ord1").value===q.correct[0]&&$("ord2").value===q.correct[1];$("ord1").disabled=$("ord2").disabled=true;award(ok?q.p:0);fb(ok,`${ok?"✅ الترتيب صحيح.":"❌ الترتيب غير صحيح."}<br><strong>الصواب:</strong> ${q.correct.join(" ثم ")}`)}
function showModel(){let q=qs[i];$("model").innerHTML=`<strong>الإجابة النموذجية:</strong><br>${q.m}<br><br><strong>التوضيح:</strong> ${q.w}`;$("model").style.display="block";let s=$("self");s.innerHTML="";s.style.display="flex";let arr=q.t==="hand"?[["أتقنت العبارة",q.p],["أحتاج تدريبًا",0]]:[["إجابتي كاملة",q.p],["إجابتي جزئية",Math.max(1,Math.floor(q.p/2))],["غير صحيحة",0]];arr.forEach(([x,p])=>{let b=document.createElement("button");b.className="muted";b.textContent=x;b.onclick=()=>{if(!done[i]){award(p);s.querySelectorAll("button").forEach(z=>z.disabled=true);fb(p===q.p,`سُجل التقويم الذاتي: ${ar(p)} من ${ar(q.p)}.`)}};s.appendChild(b)})}
$("prev").onclick=()=>{if(i>0){i--;render()}};$("next").onclick=()=>{if(!done[i])return alert("أجيبي عن السؤال أو اعرضي الإجابة النموذجية ثم قيّمي إجابتك.");if(i<qs.length-1){i++;render()}else finish()};
function finish(){$("quiz").style.display="none";$("result").style.display="block";$("final").textContent=`${ar(score)} من ٤٠`;$("message").textContent=score>=36?"أداء متميز جدًا.":score>=30?"أداء جميل، راجعي التعليقات.":"أعيدي النموذج بعد مراجعة المهارات.";sparkle(45)}
function sparkle(n){let c=$("confetti"),a=["🎈","✨","🌸","⭐"];for(let k=0;k<n;k++){let x=document.createElement("span");x.className="piece";x.textContent=a[Math.floor(Math.random()*a.length)];x.style.left=Math.random()*100+"vw";x.style.animationDelay=Math.random()*.5+"s";c.appendChild(x);setTimeout(()=>x.remove(),3400)}}
render();
</script>
</body></html>
