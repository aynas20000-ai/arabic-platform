<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>اختبار المصادر | منصة آفاق</title>

<style>
:root{
  --p:#5b4677;
  --p2:#776094;
  --pd:#453457;
  --g:#b69750;
  --g2:#d8c28a;
  --lav:#eee5f5;
  --paper:#fffdf9;
  --text:#403448;
  --green:#3f805d;
  --red:#a94545;
}

*{box-sizing:border-box}

html,body{
  height:100%;
  margin:0;
}

body{
  font-family:Tahoma,Arial,sans-serif;
  color:var(--text);
  background:linear-gradient(180deg,#f5f0fa,#fbf9fd,#f1ebf7);
  overflow:hidden;
}

.app{
  height:100dvh;
  display:grid;
  grid-template-rows:auto 1fr auto;
}

header{
  text-align:center;
  color:#fff;
  padding:12px 12px 10px;
  background:linear-gradient(145deg,var(--p2),var(--p),var(--pd));
  border-bottom:4px solid var(--g);
}

.tag{
  display:inline-block;
  padding:3px 10px;
  border-radius:999px;
  border:1px solid #d8c28a;
  color:#fff2c6;
  background:rgba(182,151,80,.13);
  font-size:11px;
  font-weight:bold;
}

header h1{
  margin:4px 0 0;
  font-size:clamp(21px,5vw,30px);
}

header p{
  margin:0;
  color:#f2ebf6;
  font-size:12px;
}

main{
  min-height:0;
  width:min(760px,94%);
  margin:0 auto;
  padding:9px 0;
  display:flex;
  flex-direction:column;
}

.top{
  display:flex;
  justify-content:space-between;
  gap:8px;
  font-weight:bold;
  color:var(--p);
  font-size:13px;
  margin-bottom:6px;
}

.progress{
  height:8px;
  background:#e9e0ef;
  border-radius:999px;
  overflow:hidden;
  margin-bottom:8px;
}

.progress>div{
  height:100%;
  width:0;
  background:linear-gradient(90deg,var(--g),#dfca8f);
  transition:.3s;
}

.card,.result{
  flex:1;
  min-height:0;
  background:var(--paper);
  border:1px solid var(--g2);
  border-radius:22px;
  box-shadow:0 14px 30px rgba(73,54,92,.12);
  padding:14px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.qnum{
  color:var(--g);
  font-weight:bold;
  font-size:13px;
  margin-bottom:3px;
}

h2{
  font-size:clamp(17px,4.5vw,22px);
  margin:3px 0 10px;
  color:var(--pd);
  line-height:1.55;
}

.options{
  display:grid;
  gap:7px;
}

.opt{
  width:100%;
  padding:9px 11px;
  border-radius:13px;
  border:2px solid #e4dbe9;
  background:#fff;
  color:var(--text);
  font:inherit;
  font-size:clamp(13px,3.7vw,16px);
  text-align:right;
  cursor:pointer;
  line-height:1.45;
}

.opt.correct{
  background:#e9f6ef;
  border-color:#70a889;
  color:#2c6849;
}

.opt.wrong{
  background:#fff0f0;
  border-color:#d08080;
  color:#873838;
}

.opt:disabled{
  cursor:default;
}

.feedback{
  display:none;
  margin-top:8px;
  padding:9px 11px;
  border-radius:13px;
  font-size:clamp(12px,3.4vw,14px);
  line-height:1.55;
}

.feedback.show{
  display:block;
}

.feedback.good{
  background:#e9f6ef;
  border:1px solid #94bea7;
  color:#2c6849;
}

.feedback.bad{
  background:#fff0f0;
  border:1px solid #dfa2a2;
  color:#873838;
}

.next{
  display:none;
  width:100%;
  margin-top:8px;
  padding:9px;
  border:0;
  border-radius:13px;
  background:linear-gradient(145deg,var(--p2),var(--p));
  color:#fff;
  font:inherit;
  font-weight:bold;
  cursor:pointer;
  font-size:14px;
}

.result{
  display:none;
  text-align:center;
}

.result.show{
  display:flex;
}

.score{
  font-size:40px;
  color:var(--g);
  font-weight:bold;
}

.save-status{
  margin:7px 0 3px;
  padding:8px 10px;
  border-radius:12px;
  font-size:12px;
  font-weight:bold;
  line-height:1.7;
  background:#f5eff9;
  color:var(--p);
}

.save-status.success{
  background:#edf8f1;
  color:#2f7650;
}

.save-status.error{
  background:#fff2f3;
  color:#96394a;
}

.restart,.lesson{
  display:block;
  text-decoration:none;
  width:100%;
  padding:10px;
  margin-top:8px;
  border-radius:13px;
  font-weight:bold;
}

.restart{
  border:0;
  background:linear-gradient(145deg,var(--p2),var(--p));
  color:#fff;
  font:inherit;
  cursor:pointer;
}

.lesson{
  background:var(--lav);
  color:var(--pd);
  border:1px solid #d6c7df;
}

footer{
  text-align:center;
  padding:7px;
  color:#73697a;
  font-size:10px;
}

.burst{
  position:fixed;
  inset:0;
  pointer-events:none;
  overflow:hidden;
  z-index:20;
}

.confetti{
  position:absolute;
  width:8px;
  height:8px;
  border-radius:2px;
  animation:fall 900ms ease-out forwards;
}

@keyframes fall{
  0%{
    transform:translateY(-20px) rotate(0);
    opacity:1
  }

  100%{
    transform:translateY(105vh) rotate(540deg);
    opacity:0
  }
}

.pop{
  animation:pop .25s ease;
}

@keyframes pop{
  50%{transform:scale(1.018)}
}

@media(max-height:650px){
  header{padding:7px 10px 6px}
  header h1{font-size:19px}
  header p{font-size:10px}
  main{padding:5px 0}
  .card{padding:9px}
  .opt{padding:6px 8px}
  .feedback{padding:6px 8px;margin-top:5px}
  .next{padding:7px;margin-top:5px}
}
</style>
</head>

<body>

<div class="app">

<header>
  <span class="tag">منصة آفاق التعليمية</span>
  <h1>تحدي المصادر</h1>
  <p>١٠ أسئلة • تعقيب فوري • تحدٍّ تفاعلي ✨</p>
</header>

<main>

  <div class="top">
    <span id="counter">السؤال ١ من ١٠</span>
    <span id="correctCount">الإجابات الصحيحة: ٠</span>
  </div>

    <div id="bar"></div>
  </div>

  <section class="card" id="card">

    <div class="qnum" id="qnum"></div>

    <h2 id="question"></h2>

    <div class="options" id="options"></div>

    <div class="feedback" id="feedback"></div>

    <button
      class="next"
      id="next"
      type="button"
    >
      السؤال التالي
    </button>

  </section>


  <section class="result" id="result">

    <h2>انتهى التحدي ✨</h2>

    <div class="score" id="score"></div>

    <p id="message"></p>

    <div
      id="saveStatus"
      class="save-status"
    >
      ستُحفظ نتيجتكِ في سجل الفصل الدراسي الثاني.
    </div>

    <button
      class="restart"
      type="button"
      onclick="restartQuiz()"
    >
      أعيدي التحدي
    </button>

    <a
      class="lesson"
      href="verbal-nouns-file.html"
    >
      راجعي ملف الدرس
    </a>

    <a
      class="lesson"
      href="verbal-nouns.html"
    >
      العودة إلى درس المصادر
    </a>

  </section>

</main>

<footer>
  منصة آفاق التعليمية | لغتي الخالدة | الصف الثالث المتوسط
</footer>

</div>

<div
  class="burst"
  id="burst"
></div>

from

const firebaseConfig={

const app=

const auth=

const db=

let currentUser=null;


onAuthStateChanged(

  }
);


const questions=[

  {
    q:"ما التعريف الأدق للمصدر؟",
    o:[
      "اسم يدل على حدث مرتبط بزمن",
      "اسم يدل على حدث مجرد من الزمن",
      "اسم يدل على من قام بالفعل",
      "اسم يدل على مكان وقوع الفعل"
    ],
    a:1,
    ok:"أحسنتِ 🌟 المصدر يدل على الحدث فقط دون زمن.",
    bad:"تذكري القاعدة: الفعل يدل على حدث وزمن، أما المصدر فيدل على الحدث مجردًا من الزمن."
  },

  {
    q:"أيُّ الكلمات الآتية مصدر للفعل «كتب»؟",
    o:[
      "كاتب",
      "مكتوب",
      "كتابة",
      "مكتب"
    ],
    a:2,
    ok:"إجابة صحيحة 👏 «كتابة» مصدر؛ لأنها تدل على الحدث مجردًا من الزمن.",
    bad:"الإجابة الصحيحة «كتابة»؛ لأنها تدل على حدث الكتابة دون زمن."
  },

  {
    q:"ما حكم مصادر الأفعال الثلاثية في الغالب؟",
    o:[
      "قياسية دائمًا",
      "سماعية في الغالب",
      "لا مصدر لها",
      "تأتي دائمًا على وزن فُعول"
    ],
    a:1,
    ok:"أحسنتِ ✨ مصادر الأفعال الثلاثية سماعية في الغالب.",
    bad:"في الفعل الثلاثي لا توجد قاعدة واحدة مطردة، ولذلك تكون مصادره سماعية في الغالب."
  },

  {
    q:"ما وزن مصدر الفعل الرباعي «أكرم»؟",
    o:[
      "تفعيل",
      "إفعال",
      "مفاعلة",
      "فعللة"
    ],
    a:1,
    ok:"أحسنتِ 💜 أكرم ← إكرام، ووزن المصدر «إفعال».",
    bad:"الفعل على وزن «أفعل»، ومصدره القياسي على وزن «إفعال»: أكرم ← إكرام."
  },

  {
    q:"أيُّ زوج صحيح في حالة «أفعل» المعتل العين؟",
    o:[
      "أقام ← إقامة",
      "أقام ← إقوام",
      "أعان ← إعان",
      "أقام ← تقويم"
    ],
    a:0,
    ok:"أحسنتِ جدًا 🎯 «أقام» من «أفعل» المعتل العين، ومصدره «إقامة».",
    bad:"في هذه الحالة نقول: أقام ← إقامة، وأعان ← إعانة."
  },

  {
    q:"أيُّ زوج يمثل «فعّل» المعتل الآخر؟",
    o:[
      "علّم ← تعليم",
      "ربّى ← تربية",
      "شارك ← مشاركة",
      "دحرج ← دحرجة"
    ],
    a:1,
    ok:"إجابة صحيحة 🌿 «ربّى» على وزن «فعّل» وهو معتل الآخر، ومصدره «تربية».",
    bad:"الإجابة الصحيحة: ربّى ← تربية، ومثلها نمّى ← تنمية."
  },

  {
    q:"ما مصدر الفعل الرباعي «دحرج»؟",
    o:[
      "تدحرج",
      "دحرجة",
      "دحراج",
      "انطلاق"
    ],
    a:1,
    ok:"أحسنتِ 🔥 «دحرج» على وزن «فعلل»، ومصدره «دحرجة» على وزن «فعللة».",
    bad:"«دحرج» على وزن «فعلل»، ومصدره الصحيح «دحرجة»."
  },

  {
    q:"أيُّ عبارة صحيحة عن المضعف الرباعي؟",
    o:[
      "مثل دحرج فقط",
      "مثل زلزل ووسوس، وقد يأتي مصدره على فعللة أو فِعلال",
      "مصدره دائمًا تفعيل",
      "لا يُشتق منه مصدر"
    ],
    a:1,
    ok:"إتقان رائع 🏆 مثل: زلزل ← زلزلة أو زلزال، ووسوس ← وسوسة أو وسواس.",
    bad:"المضعف الرباعي مثل «زلزل، وسوس»، وقد يأتي مصدره على «فعللة» أو «فِعلال»."
  },

  {
    q:"إذا بدأ الفعل الخماسي بتاء زائدة، فكيف نصوغ مصدره؟",
    o:[
      "على وزن الماضي مع ضم ما قبل الآخر",
      "على وزن إفعال",
      "على وزن مفاعلة",
      "بكسر الحرف الأول فقط"
    ],
    a:0,
    ok:"أحسنتِ ✨ مثل: تعلّم ← تعلُّم، وتعاون ← تعاوُن.",
    bad:"القاعدة: الفعل الخماسي المبدوء بتاء زائدة يأتي مصدره على وزن الماضي مع ضم ما قبل الآخر."
  },

  {
    q:"ما التحليل الصحيح لكلمة «اجتماع»؟",
    o:[
      "مصدر ثلاثي على وزن فِعال",
      "مصدر رباعي على وزن إفعال",
      "مصدر خماسي من «اجتمع» على وزن افتعال",
      "اسم آلة على وزن مفعال"
    ],
    a:2,
    ok:"أحسنتِ جدًا 🌟 اجتماع ← اجتمع ← فعل خماسي مبدوء بهمزة وصل، ومصدره على وزن «افتعال».",
    bad:"ارجعي إلى الفعل الماضي أولًا: اجتماع ← اجتمع؛ إذن هو مصدر خماسي على وزن «افتعال»."
  }

];


let index=0;
let score=0;
let answered=false;


const arabicDigits=
  n=>
    String(n).replace(
      /\d/g,
      d=>"٠١٢٣٤٥٦٧٨٩"[d]
    );


const questionElement=
  document.getElementById(
    "question"
  );


const options=
  document.getElementById(
    "options"
  );


const feedback=
  document.getElementById(
    "feedback"
  );


const next=
  document.getElementById(
    "next"
  );


const card=
  document.getElementById(
    "card"
  );


function tone(ok){

  try{

    const AC=
      window.AudioContext||
      window.webkitAudioContext;


    const c=new AC();

    const o=
      c.createOscillator();

    const g=
      c.createGain();


    o.connect(g);

    g.connect(
      c.destination
    );


    o.type=
      ok
        ? "sine"
        : "triangle";


    o.frequency.setValueAtTime(
      ok ? 660 : 220,
      c.currentTime
    );


    if(ok){

      o.frequency.exponentialRampToValueAtTime(
        900,
        c.currentTime+.16
      );

    }


    g.gain.setValueAtTime(
      .07,
      c.currentTime
    );


    g.gain.exponentialRampToValueAtTime(
      .001,
      c.currentTime+.23
    );


    o.start();


    o.stop(
      c.currentTime+.24
    );

  }

  catch(e){}

}


function confetti(){

  const burst=
    document.getElementById(
      "burst"
    );


  burst.innerHTML="";


  const colors=[
    "#5b4677",
    "#776094",
    "#b69750",
    "#d8c28a",
    "#d895aa"
  ];


  for(
    let i=0;
    i<24;
    i++
  ){

    const s=
      document.createElement(
        "i"
      );


    s.className=
      "confetti";


    s.style.left=
      Math.random()*100+"vw";


    s.style.top=
      "-10px";


    s.style.background=
      colors[
        i%colors.length
      ];


    s.style.animationDelay=
      Math.random()*180+"ms";


    burst.appendChild(
      s
    );

  }


  setTimeout(
    ()=>burst.innerHTML="",
    1200
  );

}
  function render(){

  answered=false;


  const x=
    questions[index];


  document.getElementById(
    "qnum"
  ).textContent=
    "السؤال "+
    arabicDigits(index+1);


  document.getElementById(
    "counter"
  ).textContent=
    "السؤال "+
    arabicDigits(index+1)+
    " من "+
    arabicDigits(
      questions.length
    );


  document.getElementById(
    "correctCount"
  ).textContent=
    "الإجابات الصحيحة: "+
    arabicDigits(score);


  document.getElementById(
    "bar"
  ).style.width=
    (
      index/
      questions.length*
      100
    )+"%";


  questionElement.textContent=
    x.q;


  options.innerHTML="";


  feedback.className=
    "feedback";


  feedback.innerHTML="";


  next.style.display=
    "none";


  card.classList.remove(
    "pop"
  );


  x.o.forEach(
    (text,choiceIndex)=>{

      const button=
        document.createElement(
          "button"
        );


      button.className=
        "opt";


      button.type=
        "button";


      button.textContent=
        text;


      button.onclick=
        ()=>choose(
          choiceIndex,
          button
        );


      options.appendChild(
        button
      );

    }
  );

}


function choose(
  choice,
  button
){

  if(answered){
    return;
  }


  answered=true;


  const x=
    questions[index];


  const buttons=[
    ...document.querySelectorAll(
      ".opt"
    )
  ];


  buttons.forEach(
    item=>
      item.disabled=true
  );


  buttons[x.a]
    .classList.add(
      "correct"
    );


  if(choice===x.a){

    score++;


    button.classList.add(
      "correct"
    );


    feedback.className=
      "feedback show good";


    feedback.textContent=
      x.ok;


    tone(true);


    confetti();


    if(navigator.vibrate){
      navigator.vibrate(45);
    }

  }

  else{

    button.classList.add(
      "wrong"
    );


    feedback.className=
      "feedback show bad";


    feedback.innerHTML=
      "<b>راجعي نوع الفعل أولًا 👀</b><br>"+
      x.bad;


    tone(false);


    if(navigator.vibrate){

      navigator.vibrate(
        [70,40,70]
      );

    }

  }


  document.getElementById(
    "correctCount"
  ).textContent=
    "الإجابات الصحيحة: "+
    arabicDigits(score);


  card.classList.add(
    "pop"
  );


  next.textContent=
    index===
      questions.length-1

      ? "شاهدي نتيجتكِ ✨"

      : "أكملي التحدي ←";


  next.style.display=
    "block";

}


next.onclick=()=>{

  index++;


  if(
    index<
    questions.length
  ){

    render();

  }

  else{

    finish();

  }

};


async function saveResult(){

  const saveStatus=
    document.getElementById(
      "saveStatus"
    );


  if(!currentUser){

    saveStatus.className=
      "save-status error";


    saveStatus.textContent=
      "لم تُحفظ النتيجة؛ يلزم تسجيل الدخول إلى المنصة أولًا.";


    return;

  }


  try{

    saveStatus.className=
      "save-status";


    saveStatus.textContent=
      "جارٍ حفظ نتيجتكِ في الفصل الدراسي الثاني...";


    const studentRef=
      doc(
        db,
        "students",
        currentUser.uid
      );


    const snapshot=
      await getDoc(
        studentRef
      );


    let previousBest=0;


    if(snapshot.exists()){

      const data=
        snapshot.data();


      previousBest=
        Number(
          data?.[
            "اختبارات_الفصل_الثاني"
          ]?.[
            "المصادر"
          ]?.[
            "أفضل_نسبة"
          ] || 0
        );

    }


    const percentage=
      Math.round(
        score/
        questions.length*
        100
      );


    const bestPercentage=
      Math.max(
        previousBest,
        percentage
      );


    await updateDoc(
      studentRef,
      {

        "اختبارات_الفصل_الثاني.المصادر":
        {

          "اسم_الاختبار":
            "اختبار المصادر",

          "الدرجة":
            score,

          "المجموع":
            questions.length,

          "النسبة":
            percentage,

          "أفضل_نسبة":
            bestPercentage,

          "مكتمل":
            true,

          "عدد_الأسئلة":
            questions.length,

          "استحقت_الإتقان":
            percentage>=80,

          "آخر_محاولة":
            serverTimestamp()

        }

      }
    );


    saveStatus.className=
      "save-status success";


    saveStatus.textContent=
      "✅ حُفظت نتيجتكِ بنجاح في سجل الفصل الدراسي الثاني.";

  }

  catch(error){

    console.error(
      "خطأ في حفظ اختبار المصادر:",
      error
    );


    saveStatus.className=
      "save-status error";


    saveStatus.textContent=
      "تعذّر حفظ النتيجة الآن. أعيدي المحاولة بعد التأكد من تسجيل الدخول.";

  }

}


async function finish(){

  document.getElementById(
    "bar"
  ).style.width=
    "100%";


  card.style.display=
    "none";


  document.querySelector(
    ".top"
  ).style.display=
    "none";


  document.querySelector(
    ".progress"
  ).style.display=
    "none";


  const result=
    document.getElementById(
      "result"
    );


  result.classList.add(
    "show"
  );


  document.getElementById(
    "score"
  ).textContent=
    arabicDigits(score)+
    " / "+
    arabicDigits(
      questions.length
    );


  const pct=
    score/
    questions.length;


  document.getElementById(
    "message"
  ).textContent=

    pct===1

      ? "إتقان كامل للمصادر 🏆"

      : pct>=.8

        ? "أداء ممتاز جدًا 🌟 أتقنتِ مصادر الأفعال الثلاثية والرباعية والخماسية."

        : pct>=.6

          ? "أداء جيد 👏 راجعي حالات مصادر الأفعال الرباعية والخماسية، ثم أعيدي التحدي."

          : "راجعي ملف الدرس، وبخاصة مصادر الأفعال الرباعية وحالاتها، ثم عودي إلى التحدي.";


  if(pct>=.8){
    confetti();
  }


  await saveResult();

}


window.restartQuiz=
  function(){

    index=0;


    score=0;


    answered=false;


    card.style.display=
      "flex";


    document.querySelector(
      ".top"
    ).style.display=
      "flex";


    document.querySelector(
      ".progress"
    ).style.display=
      "block";


    document.getElementById(
      "result"
    ).classList.remove(
      "show"
    );


    const saveStatus=
      document.getElementById(
        "saveStatus"
      );


    saveStatus.className=
      "save-status";


    saveStatus.textContent=
      "ستُحفظ نتيجتكِ في سجل الفصل الدراسي الثاني.";


    render();

  };


render();

</script>
