<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>اختبار الرسم الكتابي</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      max-width: 100%;
      margin: 0;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      font-family: Tahoma, Arial, sans-serif;
      color: #4b3a57;
      background: linear-gradient(180deg, #fffaf2, #f8f0fb);
    }

    header {
      padding: 38px 20px;
      color: white;
      text-align: center;
      background: linear-gradient(135deg, #776094, #5b4677);
      border-bottom: 4px solid #c9a85c;
    }

    header h1 {
      margin: 0 0 10px;
      color: #fffdf8;
      font-size: 34px;
      line-height: 1.6;
    }

    header p {
      margin: 0;
      color: #f7effb;
      font-size: 17px;
      line-height: 1.8;
    }

    .container {
      width: 92%;
      max-width: 760px;
      margin: 30px auto;
    }

    .card {
      margin-bottom: 20px;
      padding: 25px;
      background: #fffdf8;
      border: 2px solid #c9a85c;
      border-radius: 20px;
      box-shadow: 0 7px 18px rgba(91, 63, 111, 0.12);
    }

    .hidden {
      display: none !important;
    }

    .center,
    .result {
      text-align: center;
    }

    .icon,
    .result-icon {
      margin-bottom: 12px;
      font-size: 52px;
    }

    h2 {
      color: #5d4374;
      line-height: 1.8;
    }

    p {
      line-height: 1.9;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      color: #5d4374;
      font-weight: bold;
    }

    .progress {
      height: 14px;
      margin: 15px 0 22px;
      overflow: hidden;
      background: #ece5f1;
      border-radius: 999px;
    }

    .progress-bar {
      width: 0;
      height: 100%;
      background: linear-gradient(90deg, #c9a85c, #ead28b);
      transition: width 0.3s ease;
    }

    .question-category {
      display: inline-block;
      margin-bottom: 16px;
      padding: 8px 14px;
      color: #5d4374;
      font-weight: bold;
      background: #f5ecfb;
      border: 1px solid #c9a85c;
      border-radius: 22px;
    }

    .question {
      margin-bottom: 22px;
      color: #4b3a57;
      font-size: 22px;
      font-weight: bold;
      line-height: 1.9;
    }

    .choices {
      display: grid;
      gap: 12px;
    }

    .choice {
      width: 100%;
      padding: 15px;
      color: #4b3a57;
      font-family: inherit;
      font-size: 17px;
      line-height: 1.8;
      text-align: right;
      cursor: pointer;
      background: #fff;
      border: 2px solid #ddd2e5;
      border-radius: 15px;
    }

    .choice:hover,
    .choice:active {
      background: #f5ecfb;
    }

    .choice.correct {
      color: #0d5b37;
      font-weight: bold;
      background: #e8f7ef;
      border-color: #198754;
    }

    .choice.wrong {
      color: #8f1f1f;
      font-weight: bold;
      background: #fdecec;
      border-color: #c62828;
    }

    .choice:disabled {
      cursor: default;
    }

    .feedback {
      margin-top: 17px;
      padding: 15px;
      font-weight: bold;
      line-height: 1.9;
      border-radius: 15px;
    }

    .correct-feedback {
      color: #0d5b37;
      background: #e8f7ef;
      border: 1px solid #acd9c2;
    }

    .wrong-feedback {
      color: #8f1f1f;
      background: #fdecec;
      border: 1px solid #efb5b5;
    }

    .feedback-title,
    .correct-answer {
      display: block;
      margin-bottom: 6px;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .next-wrap {
      margin-top: 18px;
      text-align: left;
    }

    button,
    .btn {
      display: inline-block;
      padding: 13px 24px;
      color: white;
      font-family: inherit;
      font-size: 17px;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
      background: #6f5288;
      border: 2px solid #c9a85c;
      border-radius: 22px;
    }

    button:hover,
    button:active,
    .btn:hover,
    .btn:active {
      background: #5b4677;
    }

    button:disabled {
      background: #b8acbf;
      border-color: #d5cadb;
      cursor: not-allowed;
    }

    .score {
      width: 150px;
      height: 150px;
      margin: 20px auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      background: linear-gradient(145deg, #6f5288, #5b4677);
      border: 7px solid #c9a85c;
      border-radius: 50%;
    }

    .score strong {
      font-size: 43px;
    }

    .stars-layer {
      position: fixed;
      inset: 0;
      z-index: 9999;
      overflow: hidden;
      pointer-events: none;
    }

    .star {
      position: absolute;
      top: 45%;
      font-size: 28px;
      animation: flyStar 1.2s ease-out forwards;
    }

    footer {
      margin-top: 30px;
      padding: 20px;
      color: #fffdf8;
      text-align: center;
      background: #49385c;
      border-top: 3px solid #c9a85c;
    }

    @keyframes flyStar {
      from {
        opacity: 1;
        transform: translate(0, 0) scale(0.7);
      }

      to {
        opacity: 0;
        transform:
          translate(var(--move-x), var(--move-y))
          scale(1.5)
          rotate(250deg);
      }
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 27px;
      }

      .card {
        padding: 19px 14px;
      }

      .question {
        font-size: 20px;
      }

      .choice {
        padding: 13px;
        font-size: 16px;
      }

      .next-wrap button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div id="starsLayer" class="stars-layer"></div>

  <header>
    <h1>✍️ اختبار الرسم الكتابي</h1>
    <p>خط الرقعة وقواعد الكتابة الصحيحة</p>
  </header>

  <main class="container">

    <section id="startScreen" class="card center">
      <div class="icon">🌟</div>

      <h2>مرحبًا بكِ يا مبدعة</h2>

      <p>
        يتكوّن الاختبار من عشرة أسئلة،
        ولكل سؤال درجة واحدة.
      </p>

      <div class="actions">
        <button id="startButton" type="button">
          ابدئي الاختبار
        </button>

        <a class="btn" href="semester1-tests.html">
          العودة إلى الاختبارات
        </a>
      </div>
    </section>

    <section id="testScreen" class="card hidden">

      <div class="progress-info">
        <span id="progressText"></span>

        <span>
          الدرجة الحالية:
          <strong id="liveScore">٠</strong>
          / ١٠
        </span>
      </div>

      <div class="progress">
        <div id="progressBar" class="progress-bar"></div>
      </div>

      <div class="question-category">
        الرسم الكتابي – خط الرقعة
      </div>

      <div id="questionText" class="question"></div>

      <div id="choicesBox" class="choices"></div>

      <div id="feedbackBox" class="feedback hidden"></div>

      <div class="next-wrap">
        <button id="nextButton" type="button" disabled>
          السؤال التالي
        </button>
      </div>

    </section>

    <section id="resultScreen" class="card result hidden">

      <div id="resultIcon" class="result-icon">🏆</div>

      <h2 id="resultTitle"></h2>

      <div class="score">
        <strong id="finalScore">٠</strong>
        <span>من ١٠</span>
      </div>

      <p id="resultMessage"></p>

      <div class="actions">
        <button id="retryButton" type="button">
          إعادة الاختبار
        </button>

        <a class="btn" href="semester1-tests.html">
          العودة إلى الاختبارات
        </a>
      </div>

    </section>

  </main>

  <footer>
    جميع الحقوق محفوظة © 2026
  </footer>

  <script>
    const questions = [
      {
        question: "من مميزات خط الرقعة:",
        choices: [
          "كثرة الزخرفة",
          "السرعة وسهولة الكتابة",
          "كثرة التشكيل",
          "تباعد الحروف"
        ],
        answer: 1,
        explanation:
          "يتميز خط الرقعة بالسرعة والسهولة والوضوح في الكتابة."
      },
      {
        question: "جميع حروف خط الرقعة تستقر:",
        choices: [
          "بين السطر",
          "تحت السطر",
          "على السطر",
          "خارج السطر"
        ],
        answer: 2,
        explanation:
          "الأصل أن تستقر حروف خط الرقعة على السطر، ما عدا حروف محددة ينزل جزء منها."
      },
      {
        question: "أي الحروف الآتية ينزل جزء منها أسفل السطر؟",
        choices: [
          "أ",
          "د",
          "م",
          "و"
        ],
        answer: 2,
        explanation:
          "ينزل جزء من حرف الميم عن السطر في بعض مواضعه في خط الرقعة."
      },
      {
        question: "يُكتب حرف الكاف في آخر الكلمة في خط الرقعة:",
        choices: [
          "فوق السطر",
          "تحت السطر",
          "مستقرًا على السطر",
          "منفصلًا دائمًا"
        ],
        answer: 2,
        explanation:
          "يستقر حرف الكاف في آخر الكلمة على السطر ولا ينزل تحته."
      },
      {
        question: "ينزل حرف الهاء تحت السطر إذا كُتب:",
        choices: [
          "في أول الكلمة",
          "في وسط الكلمة",
          "منفصلًا",
          "في أول السطر"
        ],
        answer: 1,
        explanation:
          "ينزل جزء من حرف الهاء تحت السطر عندما يُكتب في وسط الكلمة."
      },
      {
        question: "من الحروف التي تُطمس في خط الرقعة حرف:",
        choices: [
          "الألف",
          "الميم",
          "الدال",
          "الراء"
        ],
        answer: 1,
        explanation:
          "من قواعد خط الرقعة طمس حرف الميم، أي إغلاق عينه."
      },
      {
        question: "الجلسة الصحيحة أثناء الكتابة تكون:",
        choices: [
          "منحنية",
          "معتدلة والظهر مستقيم",
          "بالنوم على الطاولة",
          "بالميل الشديد"
        ],
        answer: 1,
        explanation:
          "الجلسة المعتدلة واستقامة الظهر تساعدان على الكتابة براحة ووضوح."
      },
      {
        question: "تكون طريقة مسك القلم:",
        choices: [
          "قوية جدًا",
          "مريحة ومتزنة",
          "من آخره",
          "بكل الأصابع"
        ],
        answer: 1,
        explanation:
          "يُمسك القلم بطريقة مريحة ومتزنة دون ضغط شديد."
      },
      {
        question: "من آداب الكتابة الصحيحة:",
        choices: [
          "الاقتراب الشديد من الورقة",
          "وضع الورقة بطريقة مناسبة أمام الكاتب",
          "الضغط القوي على القلم",
          "إمالة الظهر بشدة"
        ],
        answer: 1,
        explanation:
          "يساعد وضع الورقة بطريقة مناسبة على راحة اليد ووضوح الكتابة."
      },
      {
        question: "الحروف التي ينزل جزء منها عن السطر تُجمع في كلمة:",
        choices: [
          "سألوني",
          "جمعة",
          "اليوم",
          "كتبت"
        ],
        answer: 1,
        explanation:
          "تُجمع الحروف التي ينزل جزء منها عن السطر في كلمة «جمعة»."
      }
    ];

    const startScreen =
      document.getElementById("startScreen");

    const testScreen =
      document.getElementById("testScreen");

    const resultScreen =
      document.getElementById("resultScreen");

    const startButton =
      document.getElementById("startButton");

    const nextButton =
      document.getElementById("nextButton");

    const retryButton =
      document.getElementById("retryButton");

    const progressText =
      document.getElementById("progressText");

    const progressBar =
      document.getElementById("progressBar");

    const liveScore =
      document.getElementById("liveScore");

    const questionText =
      document.getElementById("questionText");

    const choicesBox =
      document.getElementById("choicesBox");

    const feedbackBox =
      document.getElementById("feedbackBox");

    let currentQuestion = 0;
    let score = 0;
    let answerChecked = false;

    function toArabicNumber(number) {
      return String(number).replace(
        /\d/g,
        digit => "٠١٢٣٤٥٦٧٨٩"[digit]
      );
    }

    function startTest() {
      currentQuestion = 0;
      score = 0;
      answerChecked = false;

      startScreen.classList.add("hidden");
      resultScreen.classList.add("hidden");
      testScreen.classList.remove("hidden");

      liveScore.textContent = "٠";

      showQuestion();
    }

    function showQuestion() {
      answerChecked = false;
      nextButton.disabled = true;

      feedbackBox.className = "feedback hidden";
      feedbackBox.innerHTML = "";

      const current = questions[currentQuestion];

      progressText.textContent =
        `السؤال ${toArabicNumber(currentQuestion + 1)} من ${toArabicNumber(questions.length)}`;

      progressBar.style.width =
        `${(currentQuestion / questions.length) * 100}%`;

      questionText.textContent = current.question;
      choicesBox.innerHTML = "";

      current.choices.forEach((choice, index) => {
        const button = document.createElement("button");

        button.type = "button";
        button.className = "choice";
        button.textContent =
          `${["أ", "ب", "ج", "د"][index]}) ${choice}`;

        button.addEventListener("click", () => {
          checkAnswer(index, button);
        });

        choicesBox.appendChild(button);
      });

      nextButton.textContent =
        currentQuestion === questions.length - 1
          ? "عرض النتيجة"
          : "السؤال التالي";
    }

    function checkAnswer(selectedIndex, selectedButton) {
      if (answerChecked) {
        return;
      }

      answerChecked = true;

      const current = questions[currentQuestion];
      const buttons =
        choicesBox.querySelectorAll(".choice");

      buttons.forEach(button => {
        button.disabled = true;
      });

      buttons[current.answer].classList.add("correct");

      if (selectedIndex === current.answer) {
        score++;

        selectedButton.classList.add("correct");

        feedbackBox.className =
          "feedback correct-feedback";

        feedbackBox.innerHTML =
          `<span class="feedback-title">
            ✅ أحسنتِ! إجابة صحيحة
          </span>
          ${current.explanation}`;

        playSuccessSound();
        createStars();
      } else {
        selectedButton.classList.add("wrong");

        feedbackBox.className =
          "feedback wrong-feedback";

        feedbackBox.innerHTML =
          `<span class="feedback-title">
            ❌ ليست الإجابة الصحيحة
          </span>
          <span class="correct-answer">
            الإجابة الصحيحة:
            ${current.choices[current.answer]}
          </span>
          ${current.explanation}`;

        playWrongSound();
      }

      liveScore.textContent = toArabicNumber(score);

      progressBar.style.width =
        `${((currentQuestion + 1) / questions.length) * 100}%`;

      nextButton.disabled = false;
    }

    function nextQuestion() {
      if (!answerChecked) {
        return;
      }

      if (currentQuestion < questions.length - 1) {
        currentQuestion++;
        showQuestion();

        window.scrollTo({
          top: 0,
          behavior: "smooth"
        });
      } else {
        finishTest();
      }
    }

    function finishTest() {
      localStorage.setItem("ruqahScore", String(score));
      localStorage.setItem("ruqahCompleted", "true");
      localStorage.setItem("writingScore", String(score));
      localStorage.setItem(
        "semester1_writing_score",
        String(score)
      );
      localStorage.setItem(
        "semester1_writing_total",
        "10"
      );
      localStorage.setItem(
        "semester1_writing_completed",
        "true"
      );

      testScreen.classList.add("hidden");
      resultScreen.classList.remove("hidden");

      document.getElementById("finalScore").textContent =
        toArabicNumber(score);

      const resultIcon =
        document.getElementById("resultIcon");

      const resultTitle =
        document.getElementById("resultTitle");

      const resultMessage =
        document.getElementById("resultMessage");

      if (score === 10) {
        resultIcon.textContent = "🏆";
        resultTitle.textContent = "تفوق رائع!";
        resultMessage.textContent =
          "أتقنتِ قواعد الرسم الكتابي وخط الرقعة.";
        createStars();
        playSuccessSound();
      } else if (score >= 8) {
        resultIcon.textContent = "🌟";
        resultTitle.textContent = "أحسنتِ جدًا";
        resultMessage.textContent =
          "لديكِ فهم ممتاز لقواعد خط الرقعة.";
      } else if (score >= 5) {
        resultIcon.textContent = "👏";
        resultTitle.textContent = "نتيجة جيدة";
        resultMessage.textContent =
          "راجعي الحروف التي تنزل عن السطر والحروف المطموسة.";
      } else {
        resultIcon.textContent = "📚";
        resultTitle.textContent = "تحتاجين إلى مراجعة";
        resultMessage.textContent =
          "راجعي قواعد خط الرقعة ثم أعيدي الاختبار.";
      }

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }

    function createStars() {
      const layer =
        document.getElementById("starsLayer");

      const icons = ["⭐", "✨", "🌟", "💫"];

      for (let i = 0; i < 18; i++) {
        const star =
          document.createElement("span");

        star.className = "star";

        star.textContent =
          icons[Math.floor(Math.random() * icons.length)];

        star.style.left =
          `${15 + Math.random() * 70}%`;

        star.style.setProperty(
          "--move-x",
          `${(Math.random() - 0.5) * 320}px`
        );

        star.style.setProperty(
          "--move-y",
          `${-150 - Math.random() * 350}px`
        );

        star.style.animationDelay =
          `${Math.random() * 0.15}s`;

        layer.appendChild(star);

        setTimeout(() => {
          star.remove();
        }, 1500);
      }
    }

    function playTone(
      frequency,
      duration,
      delay = 0,
      type = "sine"
    ) {
      try {
        const AudioContextClass =
          window.AudioContext ||
          window.webkitAudioContext;

        const audioContext =
          new AudioContextClass();

        const oscillator =
          audioContext.createOscillator();

        const gain =
          audioContext.createGain();

        oscillator.type = type;
        oscillator.frequency.value = frequency;

        gain.gain.setValueAtTime(
          0.0001,
          audioContext.currentTime + delay
        );

        gain.gain.exponentialRampToValueAtTime(
          0.18,
          audioContext.currentTime + delay + 0.01
        );

        gain.gain.exponentialRampToValueAtTime(
          0.0001,
          audioContext.currentTime + delay + duration
        );

        oscillator.connect(gain);
        gain.connect(audioContext.destination);

        oscillator.start(
          audioContext.currentTime + delay
        );

        oscillator.stop(
          audioContext.currentTime + delay + duration
        );
      } catch (error) {
        console.log("تعذر تشغيل الصوت.");
      }
    }

    function playSuccessSound() {
      playTone(520, 0.14, 0);
      playTone(660, 0.16, 0.13);
      playTone(790, 0.2, 0.28);
    }

    function playWrongSound() {
      playTone(260, 0.18, 0, "triangle");
      playTone(190, 0.24, 0.17, "triangle");
    }

    startButton.addEventListener("click", startTest);
    nextButton.addEventListener("click", nextQuestion);
    retryButton.addEventListener("click", startTest);
  </script>

</body>

</html>
