<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>تسجيل الدخول | منصة آفاق اللغة</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Tahoma, Arial, sans-serif;
      background: linear-gradient(180deg, #fffaf2, #f8f0fb);
      color: #4b3a57;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 430px;
      padding: 30px 22px;
      text-align: center;
      background: #fffdf8;
      border: 2px solid #c9a85c;
      border-radius: 24px;
      box-shadow: 0 10px 28px rgba(91, 70, 119, 0.15);
    }

    .logo {
      font-size: 46px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0 0 10px;
      color: #5b4677;
      font-size: 28px;
    }

    p {
      margin: 0 0 24px;
      line-height: 1.9;
      font-size: 16px;
    }

    .google-btn {
      width: 100%;
      padding: 15px 18px;
      font-family: inherit;
      font-size: 17px;
      font-weight: bold;
      color: white;
      background: #6f5288;
      border: 2px solid #c9a85c;
      border-radius: 30px;
      cursor: pointer;
    }

    .google-btn:active {
      transform: scale(.98);
    }

    .status {
      margin-top: 18px;
      min-height: 28px;
      font-size: 15px;
      line-height: 1.8;
    }

    .success {
      color: #2e7d32;
    }

    .error {
      color: #b3261e;
    }

    .note {
      margin-top: 22px;
      padding: 13px;
      font-size: 13px;
      line-height: 1.8;
      background: #f5ecfb;
      border-radius: 14px;
    }
  </style>
</head>

<body>

  <div class="login-card">

    <div class="logo">🌷</div>

    <h1>منصة آفاق اللغة</h1>

    <p>
      سجّلي الدخول بحساب Google
      للانتقال إلى المنصة.
    </p>

    <button id="googleLogin" class="google-btn">
      تسجيل الدخول بحساب Google
    </button>

    <div id="status" class="status"></div>

    <div class="note">
      سيتم استخدام حسابك فقط لتسجيل الدخول إلى المنصة.
    </div>

  </div>

  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      onAuthStateChanged
    }
      from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB48av9gx4jzFyYoUQtcLwaR52qETevKGs",
      authDomain: "afaq-language-platform.firebaseapp.com",
      projectId: "afaq-language-platform",
      storageBucket: "afaq-language-platform.firebasestorage.app",
      messagingSenderId: "362601061474",
      appId: "1:362601061474:web:bc405291332b9e4ef9453b"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const provider = new GoogleAuthProvider();

    const loginBtn = document.getElementById("googleLogin");
    const status = document.getElementById("status");

    loginBtn.addEventListener("click", async () => {

      status.textContent = "جاري تسجيل الدخول...";
      status.className = "status";

      try {

        await signInWithPopup(auth, provider);

      } catch (error) {

        console.error(error);

        status.textContent =
          "تعذر تسجيل الدخول. حاولي مرة أخرى.";

        status.className = "status error";

      }

    });

    onAuthStateChanged(auth, (user) => {

      if (user) {

        status.textContent =
          "تم تسجيل الدخول بنجاح، جاري فتح المنصة...";

        status.className = "status success";

        setTimeout(() => {
          window.location.href = "index.html";
        }, 900);

      }

    });

  </script>

</body>

</html>
