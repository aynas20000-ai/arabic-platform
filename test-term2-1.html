<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>النموذج التدريبي الأول | منصة آفاق</title>

  <style>
    :root{
      --p:#75558d;
      --pd:#4b385b;
      --g:#c9a85c;
      --bg:#fffaf1;
      --paper:#fffdf8;
      --text:#403347;
      --ok:#2f855a;
      --bad:#b84444;
      --soft:#f1e9f5;
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      font-family:Tahoma,Arial,sans-serif;
      color:var(--text);
      line-height:1.85;
      background:
        radial-gradient(
          circle at 12% 8%,
          rgba(255,214,120,.20),
          transparent 25%
        ),
        radial-gradient(
          circle at 88% 18%,
          rgba(154,112,181,.20),
          transparent 28%
        ),
        linear-gradient(180deg,#fff9ed,#f7ebfa);
    }

    header{
      padding:28px 16px;
      text-align:center;
      color:#fff;
      background:linear-gradient(135deg,#786094,#594474);
      border-bottom:5px solid var(--g);
    }

    header h1{
      margin:0 0 6px;
      font-size:30px;
    }

    header p{
      margin:0;
      opacity:.95;
    }

    main{
      max-width:900px;
      margin:24px auto;
      padding:0 14px 50px;
    }

    .notice,
    .card,
    .result{
      padding:20px;
      margin-bottom:18px;
      background:var(--paper);
      border:2px solid rgba(185,154,91,.28);
      border-radius:20px;
      box-shadow:0 12px 30px rgba(83,57,95,.10);
    }

    .notice{
      border-right:6px solid var(--g);
    }

    .topbar{
      display:flex;
      gap:10px;
      align-items:center;
      justify-content:space-between;
      flex-wrap:wrap;
    }

    .badge{
      padding:7px 12px;
      color:var(--pd);
      background:var(--soft);
      border-radius:999px;
      font-weight:bold;
    }

    .progress{
      height:12px;
      margin:14px 0 4px;
      overflow:hidden;
      background:#eee4f1;
      border-radius:999px;
    }

    .progress > div{
      width:0;
      height:100%;
      background:linear-gradient(90deg,var(--g),var(--p));
      transition:.35s;
    }

    .section-title{
      margin:0 0 8px;
      color:var(--p);
      font-size:22px;
    }

    .question{
      margin:12px 0;
      font-size:19px;
      font-weight:bold;
    }

    .source-text{
      max-height:320px;
      padding:16px;
      overflow:auto;
      white-space:pre-line;
      background:#fff;
      border:1px dashed #ceb9d7;
      border-radius:16px;
    }

    .options{
      display:grid;
      gap:10px;
    }

    button,
    .option{
      padding:13px 15px;
      border:none;
      border-radius:14px;
      font:inherit;
      cursor:pointer;
      transition:.2s;
    }

    .option{
      text-align:right;
      color:var(--text);
      background:#fff;
      border:1px solid #dbcde1;
      box-shadow:0 5px 12px rgba(91,63,104,.07);
    }

    .option:hover{
      transform:translateY(-1px);
      border-color:var(--p);
    }

    .option.correct{
      color:#17613b;
      background:linear-gradient(135deg,#dff8e8,#f5fff8);
      border:2px solid #35a56c;
      transform:scale(1.02);
      box-shadow:
        0 0 0 5px rgba(53,165,108,.12),
        0 12px 24px rgba(53,165,108,.20);
    }

    .option.wrong{
      color:#8d2525;
      background:linear-gradient(135deg,#ffe7e7,#fff7f7);
      border:2px solid #d64b4b;
    }

    .primary{
      color:#fff;
      background:var(--p);
    }

    .muted{
      color:var(--pd);
      background:#eee7f1;
    }

    .feedback{
      display:none;
      margin-top:15px;
      padding:14px;
      background:#f8f3fa;
      border-radius:14px;
      border-right:5px solid var(--p);
    }

    .feedback.ok{
      font-size:17px;
      background:#eaf8ef;
      border:2px solid #86d6a8;
      border-right:5px solid var(--ok);
      box-shadow:0 8px 20px rgba(47,133,90,.12);
    }

    .feedback.bad{
      font-size:17px;
      background:#fff1f1;
      border:2px solid #efadad;
      border-right:5px solid var(--bad);
      box-shadow:0 8px 20px rgba(184,68,68,.10);
    }

    .nav{
      display:flex;
      justify-content:space-between;
      gap:10px;
      margin-top:18px;
    }

    .nav button{
      min-width:130px;
    }

    .result{
      display:none;
      text-align:center;
    }

    .score{
      color:var(--p);
      font-size:42px;
      font-weight:bold;
    }

    .small{
      color:#766b7b;
      font-size:14px;
    }

    .confetti{
      position:fixed;
      inset:0;
      z-index:999;
      overflow:hidden;
      pointer-events:none;
    }

    .piece{
      position:absolute;
      top:-20px;
      font-size:24px;
      animation:fall 2.8s linear forwards;
    }

    .answer-celebration{
      position:fixed;
      inset:0;
      z-index:2000;
      display:none;
      align-items:center;
      justify-content:center;
      pointer-events:none;
      background:rgba(52,34,63,.12);
      backdrop-filter:blur(1px);
    }

    .answer-celebration.show{
      display:flex;
      animation:fadeOut 1.35s ease forwards;
    }

    .answer-bubble{
      min-width:230px;
      max-width:82vw;
      padding:22px 25px;
      text-align:center;
      background:linear-gradient(145deg,#fffdf6,#ecfff3);
      border:4px solid #3cad72;
      border-radius:28px;
      box-shadow:0 22px 55px rgba(42,111,72,.30);
      animation:popIn .42s cubic-bezier(.2,1.45,.45,1);
    }

    .answer-hand{
      display:block;
      font-size:72px;
      animation:pointBounce .55s ease infinite alternate;
    }

    .answer-title{
      color:#23764a;
      font-size:25px;
      font-weight:900;
    }

    .answer-sub{
      margin-top:3px;
      color:#5a4861;
      font-weight:bold;
    }

    .quiz-shake{
      animation:shake .38s ease;
    }

    @keyframes fall{
      to{
        transform:translateY(110vh) rotate(720deg);
        opacity:.9;
      }
    }

    @keyframes popIn{
      0%{
        transform:scale(.25) rotate(-9deg);
        opacity:0;
      }
      75%{
        transform:scale(1.08) rotate(2deg);
      }
      100%{
        transform:scale(1);
        opacity:1;
      }
    }

    @keyframes pointBounce{
      from{
        transform:translateY(0) rotate(-8deg);
      }
      to{
        transform:translateY(-12px) rotate(6deg);
      }
    }

    @keyframes fadeOut{
      0%,72%{
        opacity:1;
      }
      100%{
        opacity:0;
      }
    }

    @keyframes shake{
      0%,100%{transform:translateX(0)}
      20%{transform:translateX(-9px)}
      40%{transform:translateX(8px)}
      60%{transform:translateX(-6px)}
      80%{transform:translateX(4px)}
    }

    @media(max-width:600px){
      header h1{
        font-size:24px;
      }

      .question{
        font-size:17px;
      }

      .card{
        padding:16px;
      }
    }
  </style>
</head>

<script>

  let audioContext;

  function playTone(
    frequency,
    duration,
    type = "sine",
    volume = 0.07,
    delay = 0
  ){

    try{

      audioContext =
        audioContext ||
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

      const oscillator =
        audioContext.createOscillator();

      const gain =
        audioContext.createGain();

      oscillator.type = type;

      oscillator.frequency.value =
        frequency;

      gain.gain.value =
        volume;

      oscillator.connect(gain);

      gain.connect(
        audioContext.destination
      );

      const startTime =
        audioContext.currentTime + delay;

      oscillator.start(startTime);

      gain.gain.setValueAtTime(
        volume,
        startTime
      );

      gain.gain.exponentialRampToValueAtTime(
        0.001,
        startTime + duration
      );

      oscillator.stop(
        startTime + duration
      );

    }catch(error){

      console.log(
        "تعذر تشغيل الصوت"
      );

    }

  }

  function playSuccessSound(){

    playTone(
      523,
      0.14,
      "sine",
      0.08
    );

    playTone(
      659,
      0.16,
      "sine",
      0.08,
      0.12
    );

    playTone(
      784,
      0.25,
      "triangle",
      0.09,
      0.25
    );

  }

  function playWrongSound(){

    playTone(
      190,
      0.17,
      "sawtooth",
      0.045
    );

    playTone(
      145,
      0.20,
      "sawtooth",
      0.035,
      0.12
    );

  }

  function celebrateCorrect(){

    playSuccessSound();

    if(
      navigator.vibrate
    ){

      navigator.vibrate(
        [35,45,70]
      );

    }

    const celebration =
      document.getElementById(
        "answerCelebration"
      );

    celebration.classList.remove(
      "show"
    );

    void celebration.offsetWidth;

    celebration.classList.add(
      "show"
    );

    setTimeout(
      function(){

        celebration.classList.remove(
          "show"
        );

      },
      1450
    );

  }

  function reactToWrongAnswer(){

    playWrongSound();

    if(
      navigator.vibrate
    ){

      navigator.vibrate(
        [90,55,90]
      );

    }

    const quizCard =
      document.getElementById(
        "quizCard"
      );

    quizCard.classList.remove(
      "quiz-shake"
    );

    void quizCard.offsetWidth;

    quizCard.classList.add(
      "quiz-shake"
    );

    setTimeout(
      function(){

        quizCard.classList.remove(
          "quiz-shake"
        );

      },
      450
    );

  }

      question:"إعراب «أمينًا» في «عرفت تاجرًا أمينًا»:",

        "مفعول به",
        "نعت منصوب",
        "بدل منصوب"

  ];

  const totalQuestions =
    questions.length;

  const totalScore = 30;

  let currentQuestion = 0;

  let correctAnswers = 0;

  let answeredQuestions =
    new Array(
      totalQuestions
    ).fill(false);

  const element = function(id){

    return document.getElementById(id);

  };

  function toArabicNumber(number){

    return String(number).replace(
      /\d/g,
      function(digit){

        return "٠١٢٣٤٥٦٧٨٩"[digit];

      }
    );

  }

  function calculateScore(){

    return Math.round(
      (
        correctAnswers /
        totalQuestions
      ) *
      totalScore
    );

      }
    function renderQuestion(){

    const question =
      questions[currentQuestion];

    element("sectionBadge").textContent =
      question.section;

    element("sectionTitle").textContent =
      question.section;

    element("counter").textContent =
      "السؤال " +
      toArabicNumber(
        currentQuestion + 1
      ) +
      " من " +
      toArabicNumber(
        totalQuestions
      );

    element("liveScore").textContent =
      "الدرجة: " +
      toArabicNumber(
        calculateScore()
      ) +
      " / ٣٠";

    element("progressBar").style.width =
      (
        (
          currentQuestion + 1
        ) /
        totalQuestions
      ) *
      100 +
      "%";

    if(
      question.section ===
      "الفهم القرائي"
    ){

      element("passage").innerHTML =
        '<div class="source-text">' +
        readingPassage +
        "</div>";

    }else{

      element("passage").innerHTML =
        "";

    }

    element("questionText").textContent =
      question.question;

    element("answerArea").innerHTML =
      "";

    element("feedback").style.display =
      "none";

    element("feedback").className =
      "feedback";

    const optionsBox =
      document.createElement("div");

    optionsBox.className =
      "options";

    question.options.forEach(
      function(optionText,index){

        const optionButton =
          document.createElement(
            "button"
          );

        optionButton.className =
          "option";

        optionButton.textContent =
          optionText;

        optionButton.onclick =
          function(){

            selectAnswer(
              index,
              optionButton,
              optionsBox
            );

          };

        optionsBox.appendChild(
          optionButton
        );

      }
    );

    element("answerArea").appendChild(
      optionsBox
    );

    element("prevBtn").disabled =
      currentQuestion === 0;

    if(
      currentQuestion ===
      totalQuestions - 1
    ){

      element("nextBtn").textContent =
        "إنهاء النموذج";

    }else{

      element("nextBtn").textContent =
        "التالي";

    }

  }

  function selectAnswer(
    selectedIndex,
    selectedButton,
    optionsBox
  ){

    if(
      answeredQuestions[
        currentQuestion
      ]
    ){

      return;

    }

    const question =
      questions[currentQuestion];

    const isCorrect =
      selectedIndex ===
      question.answer;

    answeredQuestions[
      currentQuestion
    ] = true;

    const optionButtons =
      optionsBox.querySelectorAll(
        ".option"
      );

    optionButtons.forEach(
      function(button){

        button.disabled = true;

      }
    );

    optionButtons[
      question.answer
    ].classList.add(
      "correct"
    );

    if(
      !isCorrect
    ){

      selectedButton.classList.add(
        "wrong"
      );

    }

    if(
      isCorrect
    ){

      correctAnswers++;

    }

    element("liveScore").textContent =
      "الدرجة: " +
      toArabicNumber(
        calculateScore()
      ) +
      " / ٣٠";

    showFeedback(
      isCorrect,
      question.explanation
    );

  }

  function showFeedback(
    isCorrect,
    explanation
  ){

    const feedbackBox =
      element("feedback");

    if(
      isCorrect
    ){

      feedbackBox.className =
        "feedback ok";

      feedbackBox.innerHTML =
        "✅ <strong>إجابة صحيحة!</strong>" +
        "<br>" +
        "<strong>السبب:</strong> " +
        explanation;

      feedbackBox.style.display =
        "block";

      createConfetti(16);

      celebrateCorrect();

    }else{

      feedbackBox.className =
        "feedback bad";

      feedbackBox.innerHTML =
        "❌ <strong>الإجابة غير صحيحة.</strong>" +
        "<br>" +
        "<strong>التوضيح:</strong> " +
        explanation;

      feedbackBox.style.display =
        "block";

      reactToWrongAnswer();

    }

  }

  element("prevBtn").onclick =
    function(){

      if(
        currentQuestion > 0
      ){

        currentQuestion--;

        renderQuestion();

      }

    };

  element("nextBtn").onclick =
    function(){

      if(
        !answeredQuestions[
          currentQuestion
        ]
      ){

        alert(
          "اختاري إجابة أولًا."
        );

        return;

      }

      if(
        currentQuestion <
        totalQuestions - 1
      ){

        currentQuestion++;

        renderQuestion();

      }else{

        finishQuiz();

      }

    };

  function finishQuiz(){

    element("quizCard").style.display =
      "none";

    element("result").style.display =
      "block";

    const finalScore =
      calculateScore();

    element("finalScore").textContent =
      toArabicNumber(
        finalScore
      ) +
      " من ٣٠";

    if(
      finalScore >= 27
    ){

      element("finalMessage").textContent =
        "👑 أداء متميز جدًا! أنتِ من نجمات آفاق.";

      createConfetti(55);

      playSuccessSound();

    }else if(
      finalScore >= 22
    ){

      element("finalMessage").textContent =
        "🌸 أداء جميل، راجعي تعليقات الأسئلة التي أخطأتِ فيها.";

      createConfetti(30);

    }else{

      element("finalMessage").textContent =
        "💜 أحسنتِ المحاولة، أعيدي النموذج بعد مراجعة المهارات.";

    }

  }

  function createConfetti(
    numberOfPieces
  ){

    const confettiBox =
      element("confetti");

    const icons = [
      "🎈",
      "✨",
      "🌸",
      "⭐"
    ];

    for(
      let index = 0;
      index < numberOfPieces;
      index++
    ){

      const piece =
        document.createElement(
          "span"
        );

      piece.className =
        "piece";

      piece.textContent =
        icons[
          Math.floor(
            Math.random() *
            icons.length
          )
        ];

      piece.style.left =
        Math.random() *
        100 +
        "vw";

      piece.style.animationDelay =
        Math.random() *
        0.6 +
        "s";

      confettiBox.appendChild(
        piece
      );

      setTimeout(
        function(){

          piece.remove();

        },
        3500
      );

    }

  }

  renderQuestion();

</script>
