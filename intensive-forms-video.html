<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>شرح درس صيغ المبالغة بالفيديو</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      max-width: 100%;
      margin: 0;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      font-family: Tahoma, Arial, sans-serif;
      color: #4b3a57;
      text-align: center;
      background: linear-gradient(180deg, #fffaf2, #f8f0fb);
    }

    header {
      padding: 38px 20px;
      color: white;
      background: linear-gradient(135deg, #776094, #5b4677);
      border-bottom: 4px solid #c9a85c;
    }

    header h1 {
      margin: 0;
      color: #fffdf8;
      font-size: 34px;
      line-height: 1.6;
    }

    section {
      width: 85%;
      max-width: 700px;
      margin: 30px auto;
      padding: 25px;
      background: #fffdf8;
      border: 2px solid #c9a85c;
      border-radius: 20px;
      box-shadow: 0 7px 18px rgba(91, 63, 111, 0.12);
    }

    .video-box {
      padding: 14px;
      background: linear-gradient(135deg, #f5ecfb, #fffaf2);
      border: 2px solid #c9a85c;
      border-radius: 16px;
      box-shadow: 0 4px 12px rgba(91, 63, 111, 0.08);
    }

    .video {
      width: 100%;
      overflow: hidden;
      border-radius: 12px;
    }

    .video iframe {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 0;
    }

    .back {
      display: inline-block;
      margin-top: 25px;
      padding: 12px 22px;
      color: white;
      font-weight: bold;
      text-decoration: none;
      background: #6f5288;
      border: 2px solid #c9a85c;
      border-radius: 22px;
    }

    .back:hover,
    .back:active {
      background: #5b4677;
    }

    footer {
      margin-top: 30px;
      padding: 20px;
      color: #fffdf8;
      background: #49385c;
      border-top: 3px solid #c9a85c;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 27px;
      }

      section {
        width: 92%;
        padding: 20px 14px;
      }

      .video-box {
        padding: 10px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>🎥 شرح درس صيغ المبالغة</h1>
  </header>

  <section>

    <div class="video-box">
      <div class="video">
        <iframe
          src="https://www.youtube.com/embed/Ry89GCsx7Eo"
          title="شرح درس صيغ المبالغة"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowfullscreen>
        </iframe>
      </div>
    </div>

    <a class="back" href="intensive-forms.html">
      العودة إلى درس صيغ المبالغة
    </a>

  </section>

  <footer>
    جميع الحقوق محفوظة © 2026
  </footer>

</body>

</html>
