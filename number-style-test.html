<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>اختبار العدد | منصة آفاق</title>
<style>
:root{
  --p:#5b4677;--p2:#776094;--pd:#453457;--g:#b69750;--g2:#d8c28a;
  --lav:#eee5f5;--paper:#fffdf9;--text:#403448;--green:#3f805d;--red:#a94545;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:Tahoma,Arial,sans-serif;color:var(--text);
  background:linear-gradient(180deg,#f5f0fa,#fbf9fd,#f1ebf7);
  overflow:hidden;
}
.app{height:100dvh;display:grid;grid-template-rows:auto 1fr auto}
header{
  text-align:center;color:#fff;padding:11px 12px 9px;
  background:linear-gradient(145deg,var(--p2),var(--p),var(--pd));
  border-bottom:4px solid var(--g)
}
.tag{
  display:inline-block;padding:3px 10px;border-radius:999px;border:1px solid #d8c28a;
  color:#fff2c6;background:rgba(182,151,80,.13);font-size:11px;font-weight:bold
}
header h1{margin:4px 0 0;font-size:clamp(21px,5vw,30px)}
header p{margin:0;color:#f2ebf6;font-size:12px}
main{
  min-height:0;width:min(760px,94%);margin:0 auto;padding:8px 0;
  display:flex;flex-direction:column
}
.top{
  display:flex;justify-content:space-between;gap:8px;font-weight:bold;
  color:var(--p);font-size:13px;margin-bottom:5px
}
.progress{height:8px;background:#e9e0ef;border-radius:999px;overflow:hidden;margin-bottom:7px}
.progress>div{height:100%;width:0;background:linear-gradient(90deg,var(--g),#dfca8f);transition:.3s}
.card,.result{
  flex:1;min-height:0;background:var(--paper);border:1px solid var(--g2);border-radius:22px;
  box-shadow:0 14px 30px rgba(73,54,92,.12);padding:13px;
  display:flex;flex-direction:column;justify-content:center
}
.qnum{color:var(--g);font-weight:bold;font-size:13px;margin-bottom:2px}
h2{font-size:clamp(17px,4.5vw,22px);margin:2px 0 9px;color:var(--pd);line-height:1.5}
.options{display:grid;gap:6px}
.opt{
  width:100%;padding:8px 10px;border-radius:13px;border:2px solid #e4dbe9;
  background:#fff;color:var(--text);font:inherit;font-size:clamp(13px,3.6vw,16px);
  text-align:right;cursor:pointer;line-height:1.4
}
.opt.correct{background:#e9f6ef;border-color:#70a889;color:#2c6849}
.opt.wrong{background:#fff0f0;border-color:#d08080;color:#873838}
.opt:disabled{cursor:default}
.feedback{
  display:none;margin-top:7px;padding:8px 10px;border-radius:13px;
  font-size:clamp(12px,3.3vw,14px);line-height:1.5
}
.feedback.show{display:block}
.feedback.good{background:#e9f6ef;border:1px solid #94bea7;color:#2c6849}
.feedback.bad{background:#fff0f0;border:1px solid #dfa2a2;color:#873838}
.next{
  display:none;width:100%;margin-top:7px;padding:8px;border:0;border-radius:13px;
  background:linear-gradient(145deg,var(--p2),var(--p));color:#fff;font:inherit;
  font-weight:bold;cursor:pointer;font-size:14px
}
.result{display:none;text-align:center}
.result.show{display:flex}
.score{font-size:40px;color:var(--g);font-weight:bold}
.restart,.lesson{
  display:block;text-decoration:none;width:100%;padding:10px;margin-top:8px;border-radius:13px;font-weight:bold
}
.restart{border:0;background:linear-gradient(145deg,var(--p2),var(--p));color:#fff;font:inherit;cursor:pointer}
.lesson{background:var(--lav);color:var(--pd);border:1px solid #d6c7df}
footer{text-align:center;padding:6px;color:#73697a;font-size:10px}
.burst{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:20}
.confetti{position:absolute;width:8px;height:8px;border-radius:2px;animation:fall 900ms ease-out forwards}
@keyframes fall{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(105vh) rotate(540deg);opacity:0}}
.pop{animation:pop .25s ease}
@keyframes pop{50%{transform:scale(1.018)}}
@media(max-height:650px){
  header{padding:6px 10px 5px}header h1{font-size:19px}header p{font-size:10px}
  main{padding:4px 0}.card{padding:8px}
  .opt{padding:5px 8px}.feedback{padding:5px 8px;margin-top:4px}
  .next{padding:6px;margin-top:4px}
}
</style>
</head>
<body>
<div class="app">

<header>
  <span class="tag">منصة آفاق التعليمية</span>
  <h1>تحدي العدد</h1>
  <p>١٠ أسئلة • تعقيب فوري • صوت وحماس ✨</p>
</header>

<main>
  <div class="top">
    <span id="counter">السؤال ١ من ١٠</span>
    <span id="correctCount">الصحيح: ٠</span>
  </div>

  <div class="progress"><div id="bar"></div></div>

  <section class="card" id="card">
    <div class="qnum" id="qnum"></div>
    <h2 id="question"></h2>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback"></div>
    <button class="next" id="next">السؤال التالي</button>
  </section>

  <section class="result" id="result">
    <h2>انتهى التحدي ✨</h2>
    <div class="score" id="score"></div>
    <p id="message"></p>
    <button class="restart" onclick="restartQuiz()">أعيدي التحدي</button>
    <a class="lesson" href="number-file.html">راجعي ملف الدرس</a>
    <a class="lesson" href="number.html">العودة إلى درس العدد</a>
  </section>
</main>

<footer>منصة آفاق التعليمية | لغتي الخالدة | الصف الثالث المتوسط</footer>
</div>

<div class="burst" id="burst"></div>

<script>
const questions = [{"q": "أيُّ تركيب يمثل جملة عدد صحيحة من حيث المكوّنات؟", "o": ["عدد فقط", "معدود فقط", "عدد + معدود", "فعل + عدد"], "a": 2, "ok": "أحسنتِ 🌟 جملة العدد تتكوّن من عدد ومعدود.", "bad": "القاعدة الأولى: جملة العدد = عدد + معدود."}, {"q": "أيُّ جملة صحيحة مع العدد «واحد»؟", "o": ["طالبٌ واحدةٌ", "طالبةٌ واحدٌ", "طالبٌ واحدٌ", "واحدُ طلابٍ"], "a": 2, "ok": "ممتاز 👏 «واحد» يوافق المعدود في التذكير والتأنيث.", "bad": "العددان ١ و٢ يوافقان المعدود؛ لذلك: طالبٌ واحدٌ."}, {"q": "أيُّ جملة صحيحة مع عدد من ٣ إلى ٩؟", "o": ["ثلاثُ طلابٍ", "ثلاثةُ طلابٍ", "ثلاثةُ طالبٍ", "ثلاثُ طالباتٍ"], "a": 1, "ok": "رائعة ✨ العدد من ٣ إلى ٩ يخالف المعدود، وتمييزه جمع مجرور.", "bad": "«طلاب» مذكر، لذلك العدد يخالفه: ثلاثةُ طلابٍ."}, {"q": "أيُّ جملة صحيحة مع العدد عشرة إذا جاء منفردًا؟", "o": ["عشرةُ طالباتٍ", "عشرُ طالباتٍ", "عشرَ طالبةً", "عشرةُ طالبٍ"], "a": 1, "ok": "صحيح جدًا 🎯 «عشرُ طالباتٍ»؛ لأن ١٠ المفردة تخالف المعدود وتمييزها جمع مجرور.", "bad": "العدد ١٠ إذا جاء منفردًا يخالف المعدود: عشرُ طالباتٍ."}, {"q": "ما القاعدة الصحيحة للعددين ١١ و١٢؟", "o": ["الجزآن يخالفان المعدود", "الجزء الأول يخالف والثاني يوافق", "الجزآن يوافقان المعدود", "لا علاقة لهما بجنس المعدود"], "a": 2, "ok": "أحسنتِ 💜 في ١١ و١٢ يوافق الجزآن المعدود.", "bad": "تذكري: ١١ و١٢ حالة مميزة؛ الجزآن يوافقان المعدود."}, {"q": "أيُّ جملة صحيحة مع العدد ١٣؟", "o": ["ثلاثَ عشرَ طالبةً", "ثلاثةَ عشرةَ طالبًا", "ثلاثةَ عشرَ طالبًا", "ثلاثَ عشرةَ طالباتٍ"], "a": 2, "ok": "ممتازة 🔥 في ١٣–١٩: الجزء الأول يخالف، والجزء الثاني يوافق، والتمييز مفرد منصوب.", "bad": "مع «طالب» المذكر نقول: ثلاثةَ عشرَ طالبًا."}, {"q": "أيُّ عبارة صحيحة عن ألفاظ العقود مثل «عشرون، ثلاثون»؟", "o": ["تتغير مع المذكر والمؤنث", "تخالف المعدود دائمًا", "لا تتغير مع المذكر والمؤنث وتمييزها مفرد منصوب", "تمييزها جمع مجرور"], "a": 2, "ok": "صحيح 🌿 ألفاظ العقود ثابتة، وتمييزها مفرد منصوب.", "bad": "العقود لا تتغير مع جنس المعدود، مثل: عشرون طالبًا، عشرون طالبةً."}, {"q": "أيُّ جملة صحيحة مع العدد ٢١ للمؤنث؟", "o": ["واحد وعشرون طالبةً", "إحدى وعشرون طالبةً", "إحدى وعشرين طالباتٍ", "واحدة وعشرون طالبًا"], "a": 1, "ok": "رائعة جدًا 🌟 في ٢١ يوافق الجزء الأول المعدود: إحدى وعشرون طالبةً.", "bad": "مع المؤنث في ٢١ نقول: «إحدى وعشرون طالبةً»."}, {"q": "في الأعداد المتعاطفة من ٢٣ إلى ٩٩، ما حكم الجزء الأول إذا كان من ٣ إلى ٩؟", "o": ["يوافق المعدود", "يخالف المعدود", "يبقى ثابتًا دائمًا", "يُحذف"], "a": 1, "ok": "إتقان جميل 🏆 الجزء الأول من ٣ إلى ٩ يخالف المعدود، ولفظ العقد ثابت.", "bad": "القاعدة: في ٢٣–٩٩، الجزء الأول إذا كان من ٣–٩ يخالف المعدود."}, {"q": "أيُّ مجموعة تعطي حكم تمييز العدد بدقة؟", "o": ["٣–١٠ مفرد منصوب، ١١–٩٩ جمع مجرور", "٣–١٠ جمع مجرور، ١١–٩٩ مفرد منصوب، ١٠٠ وما فوق مفرد مجرور", "كل الأعداد تمييزها مفرد منصوب", "المئة والألف والمليون تمييزها جمع مجرور"], "a": 1, "ok": "ممتازة جدًا ✨ هذه قاعدة الحسم الأهم في الدرس.", "bad": "ثبتيها: ٣–١٠ جمع مجرور، ١١–٩٩ مفرد منصوب، والمئة والألف والمليون ومضاعفاتها مفرد مجرور."}];
let index=0,score=0,answered=false;

const arabicDigits=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const q=document.getElementById('question');
const options=document.getElementById('options');
const feedback=document.getElementById('feedback');
const next=document.getElementById('next');
const card=document.getElementById('card');

function tone(ok){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    const c=new AC(),o=c.createOscillator(),g=c.createGain();
    o.connect(g);g.connect(c.destination);
    o.type=ok?'sine':'triangle';
    o.frequency.setValueAtTime(ok?660:220,c.currentTime);
    if(ok)o.frequency.exponentialRampToValueAtTime(920,c.currentTime+.16);
    g.gain.setValueAtTime(.07,c.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.23);
    o.start();o.stop(c.currentTime+.24);
  }catch(e){}
}

function confetti(){
  const burst=document.getElementById('burst');
  burst.innerHTML='';
  const colors=['#5b4677','#776094','#b69750','#d8c28a','#d895aa'];
  for(let i=0;i<24;i++){
    const s=document.createElement('i');
    s.className='confetti';
    s.style.left=(Math.random()*100)+'vw';
    s.style.top='-10px';
    s.style.background=colors[i%colors.length];
    s.style.animationDelay=(Math.random()*180)+'ms';
    burst.appendChild(s);
  }
  setTimeout(()=>burst.innerHTML='',1200);
}

function render(){
  answered=false;
  const x=questions[index];

  document.getElementById('qnum').textContent='السؤال '+arabicDigits(index+1);
  document.getElementById('counter').textContent='السؤال '+arabicDigits(index+1)+' من '+arabicDigits(questions.length);
  document.getElementById('correctCount').textContent='الصحيح: '+arabicDigits(score);
  document.getElementById('bar').style.width=(index/questions.length*100)+'%';

  q.textContent=x.q;
  options.innerHTML='';
  feedback.className='feedback';
  feedback.innerHTML='';
  next.style.display='none';
  card.classList.remove('pop');

  x.o.forEach((t,j)=>{
    const b=document.createElement('button');
    b.className='opt';
    b.textContent=t;
    b.onclick=()=>choose(j,b);
    options.appendChild(b);
  });
}

function choose(choice,button){
  if(answered)return;
  answered=true;

  const x=questions[index];
  const btns=[...document.querySelectorAll('.opt')];
  btns.forEach(b=>b.disabled=true);
  btns[x.a].classList.add('correct');

  if(choice===x.a){
    score++;
    button.classList.add('correct');
    feedback.className='feedback show good';
    feedback.textContent=x.ok;
    tone(true);confetti();
    if(navigator.vibrate)navigator.vibrate(45);
  }else{
    button.classList.add('wrong');
    feedback.className='feedback show bad';
    feedback.innerHTML='<b>ركزي على نوع العدد وتمييزه 👀</b><br>'+x.bad;
    tone(false);
    if(navigator.vibrate)navigator.vibrate([70,40,70]);
  }

  document.getElementById('correctCount').textContent='الصحيح: '+arabicDigits(score);
  card.classList.add('pop');
  next.textContent=index===questions.length-1?'شوفي نتيجتك ✨':'كمّلي التحدي ←';
  next.style.display='block';
}

next.onclick=()=>{
  index++;
  if(index<questions.length)render();
  else finish();
};

function finish(){
  document.getElementById('bar').style.width='100%';
  card.style.display='none';
  document.querySelector('.top').style.display='none';
  document.querySelector('.progress').style.display='none';

  const result=document.getElementById('result');
  result.classList.add('show');

  document.getElementById('score').textContent=arabicDigits(score)+' / '+arabicDigits(questions.length);

  const pct=score/questions.length;
  document.getElementById('message').textContent=
    pct===1?'إتقان كامل! بطلة العدد 🏆':
    pct>=.8?'ممتازة جدًا 🌟 أتقنتِ الموافقة والمخالفة وتمييز العدد.':
    pct>=.6?'أداء جميل 👏 راجعي المركبة والمتعاطفة وجدول التمييز ثم أعيدي التحدي.':
    'راجعي ملف الدرس، خاصة ٣–١٠ و١١–٩٩ والمئة والألف والمليون، ثم عودي للتحدي.';

  if(pct>=.8)confetti();
}

function restartQuiz(){
  index=0;score=0;answered=false;
  card.style.display='flex';
  document.querySelector('.top').style.display='flex';
  document.querySelector('.progress').style.display='block';
  document.getElementById('result').classList.remove('show');
  render();
}

render();
</script>
</body>
</html>
