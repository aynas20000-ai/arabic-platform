<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>مهمة الوحدة الأولى | منصة آفاق</title>

  <style>
    :root {
      --purple: #74558c;
      --purple-dark: #4d385d;
      --gold: #c9a85c;
      --bg: #fffaf1;
      --text: #4b3857;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: linear-gradient(180deg, var(--bg), #f7eff8);
      color: var(--text);
      line-height: 1.8;
    }

    header {
      text-align: center;
      padding: 42px 18px;
      color: white;
      background: linear-gradient(135deg, var(--purple), var(--purple-dark));
      border-bottom: 6px solid var(--gold);
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 36px;
    }

    header p {
      margin: 0;
      font-size: 19px;
    }

    main {
      width: min(92%, 760px);
      margin: 40px auto;
    }

    .box {
      background: rgba(255, 255, 255, 0.88);
      border: 4px solid var(--gold);
      border-radius: 32px;
      padding: 30px 22px;
      box-shadow: 0 12px 28px rgba(75, 56, 87, 0.12);
    }

    .box h2 {
      margin-top: 0;
      text-align: center;
      font-size: 30px;
    }

    .instructions {
      text-align: center;
      font-size: 19px;
      margin-bottom: 28px;
    }

    .upload-button {
      display: block;
      margin: 18px 0;
      padding: 18px;
      text-align: center;
      text-decoration: none;
      color: white;
      font-size: 21px;
      font-weight: bold;
      background: linear-gradient(135deg, var(--purple), var(--purple-dark));
      border: 3px solid var(--gold);
      border-radius: 24px;
    }

    .upload-button:hover,
    .upload-button:active {
      transform: translateY(-2px);
    }

    .back-button {
      display: block;
      width: fit-content;
      margin: 30px auto 0;
      padding: 13px 28px;
      text-decoration: none;
      color: var(--text);
      font-size: 18px;
      font-weight: bold;
      background: white;
      border: 3px solid var(--gold);
      border-radius: 24px;
    }

    footer {
      margin-top: 45px;
      padding: 22px 15px;
      text-align: center;
      color: white;
      background: var(--purple-dark);
      border-top: 5px solid var(--gold);
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 30px;
      }

      .box h2 {
        font-size: 26px;
      }

      .upload-button {
        font-size: 19px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>🌸 مهمة الوحدة الأولى</h1>
    <p>اختاري فصلكِ، ثم ارفعي صورة أو ملف المهمة.</p>
  </header>

  <main>

    <section class="box">

      <h2>رفع المهمة</h2>

      <p class="instructions">
        تأكدي من وضوح الملف أو الصورة قبل الإرسال.
      </p>

      <a

        target="_blank"
        rel="noopener noreferrer">

      <a

        target="_blank"
        rel="noopener noreferrer">

      <a
        class="upload-button"
        href="https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=63amB9ouB0OwpxhE7cWhWKdNi2jjBM9DtjdEoIqHPjhUN0sxREIxVExGVkZSUExXTFNXUVVCSllCTiQlQCNjPTEu"

      <a class="back-button" href="unit-tasks.html">

      </a>

    </section>

  </main>

  <footer>
    منصة آفاق التعليمية © 2026
  </footer>

</body>
</html>
