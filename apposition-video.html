<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>شرح درس البدل بالفيديو</title>

  <style>
    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      font-family:Tahoma,Arial,sans-serif;
      background:
        radial-gradient(circle at top right, #eee5f5 0, transparent 35%),
        linear-gradient(180deg, #fffdfb 0%, #f5f0fa 100%);
      color:#453457;
      text-align:center;
      min-height:100vh;
    }

    header{
      background:linear-gradient(135deg, #776094, #5b4677, #453457);
      color:white;
      padding:35px 20px;
      border-bottom:5px solid #b89a55;
      box-shadow:0 5px 18px rgba(69,52,87,0.25);
    }

    header h1{
      margin:0;
      line-height:1.6;
    }

    section{
      background:rgba(255,255,255,0.96);
      margin:30px auto;
      padding:25px;
      width:85%;
      max-width:700px;
      border-radius:18px;
      border:2px solid #e4d4a3;
      box-shadow:0 8px 24px rgba(69,52,87,0.14);
    }

    .box{
      background:linear-gradient(135deg, #f5f0fa, #eee5f5);
      color:#5b4677;
      margin:18px 0;
      padding:24px;
      border-radius:14px;
      border:1px solid #d8c3e6;
      font-size:21px;
      line-height:1.8;
      box-shadow:inset 0 0 0 3px rgba(255,255,255,0.55);
    }

    .back{
      display:inline-block;
      background:linear-gradient(135deg, #776094, #5b4677);
      color:white;
      font-weight:bold;
      text-decoration:none;
      padding:12px 24px;
      border-radius:30px;
      border:2px solid #e4d4a3;
      box-shadow:0 5px 13px rgba(69,52,87,0.22);
      transition:0.25s;
    }

    .back:hover{
      transform:translateY(-2px);
      background:linear-gradient(135deg, #5b4677, #453457);
    }

    footer{
      background:linear-gradient(135deg, #453457, #5b4677);
      color:white;
      padding:20px;
      margin-top:30px;
      border-top:4px solid #b89a55;
    }

    @media (max-width:600px){
      header{
        padding:30px 15px;
      }

      header h1{
        font-size:24px;
      }

      section{
        width:92%;
        padding:20px 15px;
      }

      .box{
        font-size:18px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🎥 شرح درس البدل بالفيديو</h1>
</header>

<section>

  <div class="box">
    سيتم إضافة فيديو شرح درس البدل هنا
  </div>

  <p>
    <a class="back" href="apposition.html">العودة إلى درس البدل</a>
  </p>

</section>

<footer>
  جميع الحقوق محفوظة © 2026
</footer>

</body>
</html>
