<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ورقة عمل حرف الهاء</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Tahoma, Arial, sans-serif;
            background: #f4f7fb;
            color: #263238;
        }

        .hero {
            background: linear-gradient(
                135deg,
                #6f4ca5,
                #9871c5
            );
            color: white;
            text-align: center;
            padding: 25px 15px;
            border-radius: 0 0 30px 30px;
        }

        .hero h1 {
            margin: 0;
            font-size: 27px;
        }

        .worksheet-box {
            width: 94%;
            max-width: 850px;
            margin: 25px auto;
            padding: 14px;
            background: white;
            border-radius: 22px;
            box-shadow: 0 6px 16px
                rgba(0, 0, 0, 0.12);
        }

        .worksheet-image {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 15px;
        }

        .back-button {
            display: block;
            width: 94%;
            max-width: 850px;
            margin: 20px auto 35px;
            padding: 15px;
            border-radius: 18px;
            background: #654791;
            color: white;
            text-align: center;
            text-decoration: none;
            font-size: 19px;
        }
    </style>
</head>

<body>

<header class="hero">
    <h1>📝 ورقة عمل حرف الهاء</h1>
</header>

<main class="worksheet-box">

    <img src="6.png"
         class="worksheet-image"
         alt="ورقة عمل حرف الهاء">

</main>

<a class="back-button"
   href="ruqah-h.html">
    ↩️ العودة إلى درس حرف الهاء
</a>

</body>
</html>
