<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ملف درس العطف</title>
  <style>
    *{box-sizing:border-box;}
    body{
      margin:0;
      font-family:Tahoma,Arial,sans-serif;
      background:
        radial-gradient(circle at top right, #eee5f5 0, transparent 35%),
        linear-gradient(180deg, #fffdfb 0%, #f5f0fa 100%);
      color:#453457;
      text-align:center;
      line-height:1.8;
      min-height:100vh;
    }
    header{
      background:linear-gradient(135deg, #776094, #5b4677, #453457);
      color:white;
      padding:35px 20px;
      border-bottom:5px solid #b89a55;
      box-shadow:0 5px 18px rgba(69,52,87,0.25);
    }
    header h1{margin:0;font-size:34px;}
    section{
      background:rgba(255,255,255,0.96);
      margin:30px auto;
      padding:25px;
      width:85%;
      max-width:700px;
      border:2px solid #e4d4a3;
      border-radius:22px;
      box-shadow:0 8px 24px rgba(69,52,87,0.14);
    }
    .box{
      background:linear-gradient(135deg, #f5f0fa, #eee5f5);
      color:#5b4677;
      margin:18px 0;
      padding:24px;
      border:1px solid #d8c3e6;
      border-radius:18px;
      box-shadow:inset 0 0 0 3px rgba(255,255,255,0.55);
      font-size:21px;
      font-weight:bold;
    }
    .back{
      display:inline-block;
      color:white;
      font-weight:bold;
      text-decoration:none;
      background:linear-gradient(135deg, #776094, #5b4677);
      border:2px solid #e4d4a3;
      border-radius:30px;
      padding:10px 22px;
      box-shadow:0 5px 13px rgba(69,52,87,0.22);
      transition:0.25s;
    }
    .back:hover{
      transform:translateY(-2px);
      background:linear-gradient(135deg, #5b4677, #453457);
    }
    .back:active{transform:scale(0.98);}
    footer{
      background:linear-gradient(135deg, #453457, #5b4677);
      color:white;
      padding:20px;
      margin-top:30px;
      border-top:4px solid #b89a55;
    }
    @media (max-width:600px){
      header h1{font-size:26px;}
      section{width:92%;padding:20px 15px;}
      .box{font-size:18px;}
    }
  </style>
</head>
<body>
<header>
  <h1>📄 ملف درس العطف</h1>
</header>
<section>
  <div class="box">سيتم إضافة ملف درس العطف هنا</div>
  <p><a class="back" href="conjunction.html">العودة إلى درس العطف</a></p>
</section>
<footer>جميع الحقوق محفوظة © 2026</footer>
</body>
</html>
